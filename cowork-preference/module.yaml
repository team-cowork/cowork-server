product: jvm/app
layout: maven-like
dependencies:
  - bom: io.vertx:vertx-stack-depchain:5.1.8
  - io.vertx:vertx-core
  - io.vertx:vertx-web
  # Amper does not currently package vertx-web's required auth-common transitive dependency.
  - io.vertx:vertx-auth-common
  - io.vertx:vertx-lang-kotlin
  - io.vertx:vertx-lang-kotlin-coroutines
  - io.vertx:vertx-config
  - io.vertx:vertx-pg-client
  - io.vertx:vertx-redis-client
  - io.vertx:vertx-kafka-client
  - io.vertx:vertx-service-discovery
  - io.vertx:vertx-micrometer-metrics
  - io.micrometer:micrometer-registry-prometheus:1.17.1
  - com.netflix.eureka:eureka-client:2.0.6
  - org.flywaydb:flyway-core:13.7.0
  - org.flywaydb:flyway-database-postgresql:13.7.0
  - org.postgresql:postgresql:42.7.13
  - org.apache.logging.log4j:log4j-core:2.26.1
  - org.apache.logging.log4j:log4j-layout-template-json:2.26.1
  - org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1
  - $kotlin.reflect
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0

test-dependencies:
  - io.vertx:vertx-junit5:5.1.8
  - io.mockk:mockk:1.14.11

settings:
  jvm:
    mainClass: com.cowork.preference.CoworkPreferenceMainKt
    release: 26
    jdk:
      version: 26
  kotlin:
    version: 2.4.20
    freeCompilerArgs: [-Xjsr305=strict]
