product: jvm/app
layout: maven-like

plugins:
  ktlint: enabled

dependencies:
  - bom: io.vertx:vertx-stack-depchain:5.2.3
  - io.vertx:vertx-core
  - io.vertx:vertx-web
  # Kotlin Toolchain does not currently package vertx-web's required auth-common transitive dependency.
  - io.vertx:vertx-auth-common
  - io.vertx:vertx-lang-kotlin-coroutines
  - io.vertx:vertx-pg-client
  - io.vertx:vertx-redis-client
  - io.vertx:vertx-kafka-client
  - io.vertx:vertx-micrometer-metrics
  - $libs.micrometer.registry.prometheus
  - org.flywaydb:flyway-core:13.12.2
  - org.flywaydb:flyway-database-postgresql:13.12.2
  - org.postgresql:postgresql:42.7.14
  - org.apache.logging.log4j:log4j-core:2.26.1
  - org.apache.logging.log4j:log4j-layout-template-json:2.26.1
  - org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1
  - org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0

test-dependencies:
  - io.mockk:mockk:1.14.12
  - io.kotest:kotest-runner-junit5-jvm:6.2.7
  - io.kotest:kotest-assertions-core-jvm:6.2.7

settings:
  jvm:
    mainClass: com.cowork.preference.CoworkPreferenceMainKt
    release: 26
    jdk:
      version: 26
    test:
      freeJvmArgs:
        - -XX:+EnableDynamicAgentLoading
        - -Xshare:off
      systemProperties:
        net.bytebuddy.safe: "true"
  kotlin:
    version: 2.4.21
    freeCompilerArgs: [-Xjsr305=strict]
