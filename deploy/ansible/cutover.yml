---
- name: Retire legacy deployments during the explicit cutover
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require the explicit whole-system cutover and release source
      ansible.builtin.assert:
        that:
          - cowork_cutover | default(false) | bool
          - cowork_release_sha | default('') is match('^[0-9a-f]{40}$')
        fail_msg: Run the main release workflow before enabling the one-time cutover.
    - name: Check whether this host already completed the cutover
      ansible.builtin.stat:
        path: /var/lib/cowork/cutover-complete
      register: platform_cutover_marker
  tasks:
    - name: Stop the legacy workload and firewall units once
      when: not platform_cutover_marker.stat.exists
      block:
        - name: Read installed units
          ansible.builtin.service_facts:
        - name: Disable only the legacy Cowork firewall services
          ansible.builtin.systemd_service:
            name: "{{ item }}"
            enabled: false
            state: stopped
          loop: "{{ platform_legacy_units }}"
          when: item in ansible_facts.services
        - name: Find legacy Cowork containers, excluding Vault and Nomad allocations
          ansible.builtin.command:
            argv: [docker, ps, -a, --format, "{{ '{{' }}.Names{{ '}}' }}", --filter, 'name=^cowork-']
          register: platform_legacy_containers
          changed_when: false
          when: inventory_hostname not in groups['control_plane']
        - name: Disable automatic restarts for the retired containers
          ansible.builtin.command:
            argv: [docker, update, --restart=no, "{{ item }}"]
          loop: "{{ platform_legacy_containers.stdout_lines | default([]) | reject('match', '^cowork-vault(?:-|$)') | reject('match', '^cowork-platform-') | list }}"
          changed_when: true
        - name: Stop only the retired Cowork containers
          ansible.builtin.command:
            argv: [docker, stop, --time, '30', "{{ item }}"]
          loop: "{{ platform_legacy_containers.stdout_lines | default([]) | reject('match', '^cowork-vault(?:-|$)') | reject('match', '^cowork-platform-') | list }}"
          changed_when: true
        - name: Activate the replacement platform ingress
          ansible.builtin.include_tasks: tasks/firewall.yml
        - name: Read IPv4 legacy firewall chains
          ansible.builtin.command: iptables -S
          register: platform_ipv4_rules
          changed_when: false
        - name: Read IPv6 legacy firewall chains
          ansible.builtin.command: ip6tables -S
          register: platform_ipv6_rules
          changed_when: false
        - name: Empty only the retired IPv4 Cowork chains
          ansible.builtin.command:
            argv: [iptables, -w, '10', -F, "{{ item }}"]
          loop: "{{ platform_ipv4_rules.stdout | regex_findall('(?m)^-N (COWORK_(?:CONFIG|BACKEND|STORAGE|MODULE_DB_[0-9]+|SHARED_[a-z0-9_]+))$') }}"
          changed_when: true
        - name: Empty only the retired IPv6 Cowork chains
          ansible.builtin.command:
            argv: [ip6tables, -w, '10', -F, "{{ item }}"]
          loop: "{{ platform_ipv6_rules.stdout | regex_findall('(?m)^-N (COWORK_(?:CONFIG|BACKEND|STORAGE|MODULE_DB_[0-9]+|SHARED_[a-z0-9_]+))$') }}"
          changed_when: true
        - name: Create the cutover marker directory
          ansible.builtin.file:
            path: /var/lib/cowork
            state: directory
            mode: '0755'
        - name: Start the staged native host observability
          ansible.builtin.include_tasks: tasks/observability.yml
        - name: Record the irreversible legacy retirement boundary
          ansible.builtin.copy:
            content: "{{ cowork_release_sha }}\n"
            dest: /var/lib/cowork/cutover-complete
            mode: '0644'
