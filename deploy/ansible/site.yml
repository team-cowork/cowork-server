---
- name: Prepare persistent bootstrap identities and certificates
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/certificates/bootstrap-state.yml"

- name: Reconcile pinned runtimes and active VM hosts
  hosts: control_plane:nomad_clients:vault_hosts
  become: true
  gather_facts: true
  serial: 4
  any_errors_fatal: true
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/host/base.yml"

- name: Bootstrap the single management VM
  hosts: control_plane
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/agents/agents.yml"
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/agents/platform-acl.yml"
    - name: Reload server agents with their scoped integration identities
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/agents/agents.yml"

- name: Reconcile the existing Vault host with platform TLS
  hosts: vault_hosts
  become: true
  gather_facts: true
  handlers:
    - ansible.builtin.import_tasks: ../runtime/vault/handlers.yml
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/services/vault.yml"

- name: Join the existing workload VMs
  hosts: nomad_clients
  become: true
  gather_facts: true
  serial: 4
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/agents/agents.yml"

- name: Prepare the Gateway host proxy
  hosts: gateway
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/services/gateway-proxy.yml"

- name: Prepare the main-branch deployment runner
  hosts: deployment_runner
  become: true
  gather_facts: true
  tasks:
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/services/runner.yml"
    - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/certificates/certificate-renewal.yml"
