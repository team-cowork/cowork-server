---
- name: Download verified {{ platform_binary }}
  ansible.builtin.get_url:
    url: "{{ 'https://github.com/opentofu/opentofu/releases/download/v' ~ platform_versions.tofu.version ~ '/tofu_' ~ platform_versions.tofu.version ~ '_linux_amd64.zip' if platform_binary == 'tofu' else 'https://releases.hashicorp.com/' ~ platform_binary ~ '/' ~ platform_versions[platform_binary].version ~ '/' ~ platform_binary ~ '_' ~ platform_versions[platform_binary].version ~ '_linux_amd64.zip' }}"
    checksum: "sha256:{{ platform_versions[platform_binary].sha256.linux_amd64 }}"
    dest: "/var/cache/cowork/{{ platform_binary }}-{{ platform_versions[platform_binary].version }}.zip"
    mode: '0644'
- name: Install {{ platform_binary }}
  ansible.builtin.unarchive:
    src: "/var/cache/cowork/{{ platform_binary }}-{{ platform_versions[platform_binary].version }}.zip"
    dest: /usr/local/bin
    remote_src: true
    include: ["{{ platform_binary }}"]
    owner: root
    group: root
    mode: '0755'
  register: platform_binary_install
