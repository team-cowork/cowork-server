---
- name: Install logrotate for the affected application hosts
  ansible.builtin.apt:
    name: logrotate
    state: present
- name: Create the logrotate state directory
  ansible.builtin.file:
    path: /var/lib/logrotate
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Install the emergency application log rotation command
  ansible.builtin.template:
    src: cowork-emergency-logrotate.sh.j2
    dest: /usr/local/sbin/cowork-emergency-logrotate
    owner: root
    group: root
    mode: '0750'
    validate: /bin/sh -n %s
- name: Install the emergency application log rotation units
  ansible.builtin.template:
    src: "cowork-emergency-logrotate.{{ item }}.j2"
    dest: "/etc/systemd/system/cowork-emergency-logrotate.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: [service, timer]
  register: platform_emergency_logrotate_units
- name: Enable the emergency application log rotation timer
  ansible.builtin.systemd_service:
    name: cowork-emergency-logrotate.timer
    enabled: true
    state: "{{ 'restarted' if platform_emergency_logrotate_units.changed else 'started' }}"
    daemon_reload: "{{ platform_emergency_logrotate_units.changed }}"
