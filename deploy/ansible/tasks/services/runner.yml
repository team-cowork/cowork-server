---
- name: Install the pinned infrastructure CLI
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/host/install-binary.yml"
  vars:
    platform_binary: tofu
- name: Install runner host dependencies
  ansible.builtin.apt:
    name: [git, gh, jq, zlib1g]
    state: present
- name: Create the dedicated deployment runner account
  ansible.builtin.user:
    name: cowork-runner
    system: true
    home: /home/cowork-runner
    shell: /bin/bash
    create_home: true
- name: Create private runner directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: cowork-runner
    group: cowork-runner
    mode: '0700'
  loop: [/opt/cowork-runner, /home/cowork-runner/.ssh, /var/lib/cowork/platform-state]
- name: Copy only PKI and scoped token directories to the protected runner
  ansible.builtin.copy:
    src: "{{ platform_state_dir }}/{{ item }}/"
    dest: "/var/lib/cowork/platform-state/{{ item }}/"
    owner: cowork-runner
    group: cowork-runner
    mode: '0600'
    directory_mode: '0700'
  loop: [pki, tokens]
  no_log: true
- name: Inspect the explicit runner recovery files on the controller
  ansible.builtin.stat:
    path: "{{ platform_state_dir }}/{{ item }}"
  loop:
    - deploy_ed25519
    - deploy_ed25519.pub
    - consul-bootstrap.token
    - nomad-bootstrap.token
    - consul-gossip.key
    - nomad-gossip.key
    - tofu-state.passphrase
    - vault-recovery.json
  delegate_to: localhost
  become: false
  register: platform_runner_recovery_files
  no_log: true
- name: Copy only declared recovery files that have been initialized
  ansible.builtin.copy:
    src: "{{ platform_state_dir }}/{{ item.item }}"
    dest: "/var/lib/cowork/platform-state/{{ item.item }}"
    owner: cowork-runner
    group: cowork-runner
    mode: '0600'
  loop: "{{ platform_runner_recovery_files.results }}"
  when: item.stat.exists
  no_log: true
- name: Install the deployment SSH key on the runner
  ansible.builtin.copy:
    src: "{{ platform_state_dir }}/deploy_ed25519"
    dest: /home/cowork-runner/.ssh/id_ed25519
    owner: cowork-runner
    group: cowork-runner
    mode: '0600'
  no_log: true
- name: Install the verified SSH host keys on the runner
  ansible.builtin.copy:
    src: "{{ inventory_dir }}/known_hosts"
    dest: /home/cowork-runner/.ssh/known_hosts
    owner: cowork-runner
    group: cowork-runner
    mode: '0600'
- name: Download the verified GitHub Actions runner
  ansible.builtin.get_url:
    url: "https://github.com/actions/runner/releases/download/v{{ platform_versions.github_runner.version }}/actions-runner-linux-x64-{{ platform_versions.github_runner.version }}.tar.gz"
    checksum: "sha256:{{ platform_versions.github_runner.sha256.linux_amd64 }}"
    dest: "/var/cache/cowork/github-runner-{{ platform_versions.github_runner.version }}.tar.gz"
    mode: '0644'
- name: Inspect existing runner registration
  ansible.builtin.stat:
    path: /opt/cowork-runner/.runner
  register: platform_runner_registered
- name: Read the installed runner release marker
  ansible.builtin.slurp:
    src: /opt/cowork-runner/.cowork-runner-version
  register: platform_runner_version
  failed_when: false
- name: Read installed services before a runner upgrade
  ansible.builtin.service_facts:
- name: Stop the runner before replacing its release
  ansible.builtin.systemd_service:
    name: cowork-github-runner
    state: stopped
  when:
    - "'cowork-github-runner.service' in ansible_facts.services"
    - (platform_runner_version.content | default('') | b64decode | trim) != platform_versions.github_runner.version
    - lookup('ansible.builtin.env', 'GITHUB_ACTIONS') != 'true'
- name: Extract the pinned runner release
  ansible.builtin.unarchive:
    src: "/var/cache/cowork/github-runner-{{ platform_versions.github_runner.version }}.tar.gz"
    dest: /opt/cowork-runner
    remote_src: true
    owner: cowork-runner
    group: cowork-runner
  when: (platform_runner_version.content | default('') | b64decode | trim) != platform_versions.github_runner.version
  register: platform_runner_release
- name: Install the pinned runner release's supported native dependencies
  ansible.builtin.command:
    argv: [/opt/cowork-runner/bin/installdependencies.sh]
  when: platform_runner_release.changed
  changed_when: true
- name: Record the installed runner release
  ansible.builtin.copy:
    content: "{{ platform_versions.github_runner.version }}\n"
    dest: /opt/cowork-runner/.cowork-runner-version
    owner: cowork-runner
    group: cowork-runner
    mode: '0600'
- name: Register the dedicated deployment runner when a registration token is provided
  ansible.builtin.command:
    argv:
      - /opt/cowork-runner/config.sh
      - --unattended
      - --url
      - "{{ platform_runner_repository }}"
      - --token
      - "{{ platform_runner_token }}"
      - --name
      - cowork-control
      - --labels
      - cowork-deploy
      - --work
      - _work
      - --disableupdate
    chdir: /opt/cowork-runner
  become_user: cowork-runner
  no_log: true
  when: not platform_runner_registered.stat.exists and platform_runner_token | length > 0
- name: Install the GitHub runner service entry point
  ansible.builtin.copy:
    src: /opt/cowork-runner/bin/runsvc.sh
    dest: /opt/cowork-runner/runsvc.sh
    remote_src: true
    owner: cowork-runner
    group: cowork-runner
    mode: '0755'
  register: platform_runner_entrypoint
- name: Inspect final runner registration
  ansible.builtin.stat:
    path: /opt/cowork-runner/.runner
  register: platform_runner_registered
- name: Install the runner service environment
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Cowork production GitHub Actions runner
      Wants=network-online.target
      After=network-online.target
      [Service]
      User=cowork-runner
      WorkingDirectory=/opt/cowork-runner
      Environment=COWORK_PLATFORM_STATE_DIR=/var/lib/cowork/platform-state
      Environment=PATH=/usr/local/bin:/usr/bin:/bin
      ExecStart=/opt/cowork-runner/runsvc.sh
      KillMode=process
      KillSignal=SIGTERM
      TimeoutStopSec=5min
      Restart=on-failure
      RestartSec=10
      [Install]
      WantedBy=multi-user.target
    dest: /etc/systemd/system/cowork-github-runner.service
    mode: '0644'
  register: platform_runner_unit
- name: Start the registered deployment runner
  ansible.builtin.systemd_service:
    name: cowork-github-runner
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if (platform_runner_unit.changed or platform_runner_entrypoint.changed or (platform_runner_release.changed | default(false))) and lookup('ansible.builtin.env', 'GITHUB_ACTIONS') != 'true' else 'started' }}"
  when: platform_runner_registered.stat.exists
- name: Report deferred runner registration
  ansible.builtin.debug:
    msg: Set GITHUB_RUNNER_REGISTRATION_TOKEN and rerun site.yml to register the prepared runner.
  when: not platform_runner_registered.stat.exists
