---
- name: Return the first Gateway cutover to direct Nomad ingress
  hosts: gateway
  become: true
  gather_facts: false
  tasks:
    - name: Stop the host proxy before restoring the original fixed port
      ansible.builtin.systemd_service:
        name: nginx
        enabled: false
        state: stopped
    - name: Remove the active proxy marker
      ansible.builtin.file:
        path: /var/lib/cowork/gateway-proxy-active
        state: absent
