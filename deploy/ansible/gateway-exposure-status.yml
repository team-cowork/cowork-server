---
- name: Inspect whether the first Gateway proxy switch exposed external traffic
  hosts: gateway
  become: true
  gather_facts: false
  tasks:
    - name: Read the first external traffic marker
      ansible.builtin.stat:
        path: /var/lib/cowork/gateway-proxy-active
      register: gateway_proxy_marker
    - name: Save the exposure result for the deployment runner
      ansible.builtin.copy:
        content: "{{ {'exposed': gateway_proxy_marker.stat.exists} | to_json }}\n"
        dest: "{{ gateway_exposure_file }}"
        mode: '0600'
      delegate_to: localhost
      become: false
