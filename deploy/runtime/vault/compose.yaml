name: vault-rebuild-20261013
services:
  vault:
    image: hashicorp/vault:2.1.0@sha256:5520cc26271c024e6ffa45cdf95255bd26b70d71ba4b7e0bc18925bef4128adb
    container_name: cowork-vault-prod
    restart: unless-stopped
    command: [server]
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: https://cowork-vault.https.gsmsv.site
    ports:
      - 10.0.0.91:8200:8200
      - 10.0.0.91:8210:8210
    volumes:
      - /etc/cowork/vault/server.hcl:/vault/config/server.hcl:ro
      - vault-data:/vault/data
      - vault-tls:/vault/tls:ro
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    healthcheck:
      test: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
networks:
  default:
    name: vault-rebuild-20261013-mtu1400
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: '1400'
volumes:
  vault-data:
    external: true
    name: cowork-vault-platform
  vault-tls:
    external: true
    name: cowork-vault-tls
