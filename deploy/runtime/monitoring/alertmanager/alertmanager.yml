global:
  resolve_timeout: 5m

templates:
  - discord.tmpl

route:
  receiver: discord
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = critical
      repeat_interval: 1h

# 수집 대상이 통째로 사라지면 서비스별 누락 알림 대신 discovery 전체 알림 하나만 보낸다.
inhibit_rules:
  - source_matchers:
      - alertname = coworkServiceDiscoveryEmpty
    target_matchers:
      - alertname = coworkServiceMissing
    equal: [job]
  # 외부 공개 게이트웨이 자체가 실패하면 그 뒤의 업무 API와 CORS probe 알림은 하나로 묶는다.
  - source_matchers:
      - alertname = coworkPublicGatewayUnavailable
    target_matchers:
      - alertname =~ "coworkGatewayApiProbeFailed|coworkGatewayCorsPreflightFailed"
  # 서비스 프로세스가 내려가면 같은 서비스의 Gateway 경유 점검 알림은 보내지 않는다.
  - source_matchers:
      - alertname = coworkServiceDown
    target_matchers:
      - alertname = coworkGatewayApiProbeFailed
    equal: [service]

receivers:
  - name: discord
    webhook_configs:
      - url_file: /secrets/discord-monitoring-alert-webhook-url
        send_resolved: true
        payload:
          allowed_mentions:
            parse: []
          embeds:
            - >-
              {{ template "cowork.discord.embed" (dict "data" . "grafana"
              [[[ with secret "COWORK_MONITORING_SECRET_PATH" ]]][[[ .Data.data.GRAFANA_ROOT_URL | trimSuffix "/" | toJSON ]]][[[ end ]]]) }}
