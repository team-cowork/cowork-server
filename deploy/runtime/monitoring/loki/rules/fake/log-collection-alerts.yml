groups:
- name: cowork-log-collection
  rules:
  - alert: coworkLogParseFailure
    expr: 'sum by (env, service) (count_over_time({parse_error="true"}[10m])) > 0

      '
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: 애플리케이션 로그 형식 위반 지속
      description: 서비스 {{ $labels.service }}({{ $labels.env }})에서 @timestamp 또는 level을 읽지 못한 로그가 15분 넘게 계속 들어오고 있습니다. cowork
        / Logs 대시보드의 형식 위반 로그에서 plain text, 잘못된 JSON, 필드 누락 여부를 확인해 주세요.
      log_dashboard: cowork-logs
      # 형식이 깨진 원문에는 마스킹되지 않은 값이 있을 수 있어 최근 한 줄의 식별 정보만 발췌한다.
      log_excerpt: |-
        {{- $q := `topk(1, max_over_time({env=%q, service=%q, parse_error="true"}
          | json component="module" | drop __error__, __error_details__
          | component=~"[A-Za-z0-9_.$-]{0,80}"
          | label_format ts="{{ __timestamp__ | unixEpoch }}" | unwrap ts | __error__="" [10m])
          by (host, task, level, component))` -}}
        {{- range query (printf $q $labels.env $labels.service) -}}
        <t:{{ printf "%.0f" .Value }}:f>
        parse_error=true{{ with .Labels.host }} host={{ . }}{{ end }}{{ with .Labels.task }} task={{ . }}{{ end }}{{ with .Labels.level }} level={{ . }}{{ end }}{{ with .Labels.component }} module={{ . }}{{ end }}
        {{- end }}
