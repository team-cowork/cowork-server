auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3101
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 240h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Nomad renders the rule bundle into the single-tenant ("fake") directory.
ruler:
  alertmanager_url: http://127.0.0.1:9093
  # The ruler writes its evaluated copy here; the storage directory is the read-only source.
  rule_path: /loki/ruler
  enable_api: true
  storage:
    type: local
    local:
      directory: /local/config/loki/rules
