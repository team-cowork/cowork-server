pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}



upstream grafana_ui {
    zone grafana_ui 64k;
    server 127.0.0.1:3000;
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # GSM terminates TLS. Authorize its socket address, not forwarded headers.
    allow 10.0.0.117/32;
    # The container readiness probe also verifies the Grafana upstream.
    allow 127.0.0.1/32;
    deny all;

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://grafana_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 300s;
    }
}


server {
    listen 3100 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/cowork/ingress-tls/server.crt;
    ssl_certificate_key /etc/cowork/ingress-tls/server.key;
    ssl_client_certificate /etc/cowork/ca/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;

    location = /loki/api/v1/push {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3101;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}
}
