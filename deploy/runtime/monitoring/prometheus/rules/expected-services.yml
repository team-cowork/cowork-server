groups:
- name: cowork-expected-services
  rules:
  - alert: coworkServiceMissing
    expr: absent(up{job="cowork-services",service="authorization"})
    for: 3m
    labels:
      severity: critical
      service: authorization
      job: cowork-services
    annotations:
      summary: authorization 서비스 검색 결과 누락
      description: Nomad 배포 상태와 Consul 서비스 등록을 확인해 주세요.
