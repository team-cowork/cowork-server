groups:
  - name: cowork-availability
    rules:
      - alert: coworkPublicGatewayUnavailable
        expr: probe_success{job="public-gateway"} == 0 or up{job="public-gateway"} == 0 or absent(probe_success{job="public-gateway"})
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "외부 공개 게이트웨이 API 응답 이상"
          description: "외부 공개 HTTPS /api/health 경로나 상태 점검이 2분 동안 실패했습니다. DNS, TLS, 프록시 라우팅과 게이트웨이 응답을 확인해 주세요."

      # 공개 API가 downstream JSON 응답을 돌려주는지 본다(blackbox.yml의 http_gateway_* 모듈).
      - alert: coworkGatewayApiProbeFailed
        expr: probe_success{job="gateway-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "게이트웨이 경유 업무 API 응답 이상"
          description: "게이트웨이를 거친 {{ $labels.service }} 업무 API({{ $labels.instance }})의 무인증 요청이 2분 동안 예상 상태를 받지 못했습니다. 게이트웨이 라우트와 downstream 연결을 확인해 주세요."

      - alert: coworkGatewayCorsPreflightFailed
        expr: probe_success{job="gateway-cors"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "게이트웨이 CORS preflight 실패"
          description: "게이트웨이 CORS preflight({{ $labels.instance }})가 2분 동안 허용 origin 응답을 돌려주지 않았습니다. 전역 CORS 설정과 PUBLIC_WEB_ORIGINS를 확인해 주세요."

      - alert: coworkReadinessFailed
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "서비스 준비 상태 확인 실패"
          description: "서비스 {{ $labels.service }}{{ if $labels.module }} (모듈: {{ $labels.module }}){{ end }}의 준비 상태 확인이 2분 동안 실패했습니다."

      - alert: coworkInfrastructureScrapeFailed
        expr: up{job=~"infrastructure|infrastructure-discovery|monitoring|hosts|alloy|nomad|consul"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "인프라 메트릭 수집 실패"
          description: "{{ $labels.service }}{{ if $labels.module }} (모듈: {{ $labels.module }}){{ end }}{{ if $labels.host }} (호스트: {{ $labels.host }}){{ end }}의 메트릭을 2분 동안 수집하지 못했습니다."

      - alert: coworkDatastoreUnavailable
        expr: mysql_up == 0 or pg_up == 0 or mongodb_up == 0 or redis_up == 0 or kafka_brokers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "데이터 저장소 연결 실패"
          description: "메트릭 수집기 {{ $labels.service }}{{ if $labels.module }} (모듈: {{ $labels.module }}){{ end }}가 데이터 저장소에 연결하거나 인증하지 못했습니다."

      - alert: coworkServiceDown
        expr: up{job=~"cowork-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "서비스 응답 없음"
          description: "서비스 {{ $labels.service }}에 2분 넘게 연결하지 못했습니다."

  - name: cowork-discovery
    rules:
      # Consul discovery is independent from application health; unhealthy services remain scrape targets.
      - alert: coworkServiceDiscoveryEmpty
        expr: absent(up{job="cowork-services"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "서비스 검색 결과 없음"
          description: "Prometheus에 cowork-services 수집 대상이 3분 동안 없습니다. Consul 등록 상태, ACL 토큰, 사설 TLS 연결을 확인해 주세요."

  - name: cowork-host
    rules:
      # node_exporter는 --path.rootfs 접두어를 떼고 마운트 경로를 보고하므로 경로를 고정하지 않고,
      # 수집 단계에서 걸러진 실제 파일시스템을 모두 본다. 어디가 찼는지는 mountpoint 라벨로 구분한다.
      - alert: coworkHostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 디스크 여유 공간 부족"
          description: "호스트 {{ $labels.host }}의 {{ $labels.mountpoint }} 여유 공간이 10분 동안 15% 미만입니다."

      - alert: coworkHostDiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.07
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "호스트 디스크 여유 공간 매우 부족"
          description: "호스트 {{ $labels.host }}의 {{ $labels.mountpoint }} 여유 공간이 5분 동안 7% 미만입니다."

      # 비율이 아직 여유로워도 차오르는 중이면 미리 알린다. 두 조건을 함께 걸어 일시적 변동을 거른다.
      - alert: coworkHostDiskWillFill
        expr: |
          predict_linear(node_filesystem_avail_bytes[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "24시간 이내 디스크 공간 소진 예상"
          description: "호스트 {{ $labels.host }}의 {{ $labels.mountpoint }} 여유 공간이 현재 추세대로면 24시간 안에 소진될 것으로 예상됩니다."

      # absent() only sees "every host's exporter is gone", not one. A single dead node_exporter
      # is caught per-instance by coworkInfrastructureScrapeFailed (job="hosts") instead.
      - alert: coworkHostMetricsMissing
        expr: absent(node_filesystem_avail_bytes)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "전체 호스트의 디스크 메트릭 누락"
          description: "모든 VM에서 파일시스템 메트릭이 10분 동안 수집되지 않았습니다. node_exporter가 실행 중인지, Consul 등록이 정상인지 확인해 주세요."

  - name: cowork-jvm
    rules:
      - alert: coworkHighJvmHeapUsage
        expr: |
          (
            jvm_memory_used_bytes{area="heap"} /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 힙 메모리 사용률 높음"
          description: "서비스 {{ $labels.service }}의 JVM 힙 메모리 사용률이 5분 동안 85%를 초과했습니다."

  - name: cowork-http
    rules:
      - alert: coworkHttp5xxSpike
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 오류 응답 증가"
          description: "서비스 {{ $labels.service }}의 HTTP 5xx 응답이 5분 동안 초당 1건을 초과했습니다."

      - alert: coworkHttp4xxSpike
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{status=~"4.."}[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 4xx 오류 응답 증가"
          description: "서비스 {{ $labels.service }}의 HTTP 4xx 응답이 5분 동안 초당 5건을 초과했습니다."

      - alert: coworkHighResponseTime
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 응답 지연"
          description: "서비스 {{ $labels.service }}의 HTTP P99 응답 시간이 5분 동안 2초를 초과했습니다."

  - name: cowork-gateway-ratelimit
    rules:
      # Gateway 요청 제한기는 Redis 오류 시 요청을 허용하므로 제한이 꺼진 상태를 따로 알린다.
      - alert: coworkGatewayRateLimiterRedisError
        expr: |
          sum by (service, route) (
            increase(gateway_ratelimit_events_total{outcome="redis_error"}[5m])
          ) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 요청 제한기 Redis 오류"
          description: "{{ $labels.route }} 라우트의 요청 제한기가 Redis 호출에 실패해 요청을 제한 없이 허용하고 있습니다. Redis 연결 상태를 확인해 주세요."

      - alert: coworkGatewayRateLimitRejectSpike
        expr: |
          sum by (service, route) (
            rate(gateway_ratelimit_events_total{outcome="rejected"}[5m])
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 요청 제한 초과 증가"
          description: "{{ $labels.route }} 라우트에서 요청 제한으로 거부한 요청이 10분 동안 초당 1건을 초과했습니다."

      # 서명 키가 없거나 잘못되면 모든 웹훅 수신이 503으로 거부된다. 잘못된 서명(403)은 외부 입력이라 알리지 않는다.
      - alert: coworkGatewayWebhookSigningKeyUnavailable
        expr: |
          sum by (service) (
            increase(gateway_webhook_signature_rejections_total{reason="unavailable"}[5m])
          ) > 0
        labels:
          severity: critical
        annotations:
          summary: "웹훅 URL 서명 키 설정 오류"
          description: "Gateway의 웹훅 URL 서명 키가 없거나 유효하지 않아 웹훅 수신 요청을 503으로 거부하고 있습니다. webhook.url-signing-key 설정을 확인해 주세요."

      - alert: coworkAuthorizationWebhookStreamInvalid
        expr: increase(cowork_authorization_webhook_stream_failures_total{reason="invalid"}[5m]) > 0
        labels:
          severity: critical
          service: authorization
        annotations:
          summary: "DataGSM 웹훅 재처리 불가 항목 발생"
          description: "서명된 웹훅이 Authorization 검증에서 거부되어 Redis 대기열에 남았습니다. 원본을 로그에 남기지 말고 실패 원인과 이벤트 ID를 확인해 주세요."

      - alert: coworkAuthorizationWebhookStreamDisconnected
        expr: cowork_authorization_webhook_stream_connected == 0 or absent(cowork_authorization_webhook_stream_connected)
        for: 2m
        labels:
          severity: critical
          service: authorization
        annotations:
          summary: "Authorization 웹훅 대기열 소비 중단"
          description: "Authorization이 Redis Stream을 읽지 못하고 있습니다. Redis 연결과 소비자 로그를 확인하고 대기열이 256 MiB 한도에 도달하기 전에 복구해 주세요."

      - alert: coworkDatagsmIngressUnavailable
        expr: sum(increase(gateway_datagsm_ingress_total{outcome=~"temporarily_unavailable|webhook_not_configured"}[5m])) > 0
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "DataGSM 웹훅 영속 접수 실패"
          description: "Gateway가 DataGSM 웹훅에 503을 반환했습니다. Redis AOF, Authorization 직접 접수와 대기열 여유를 확인해 주세요. 발신자의 재시도는 유한합니다."

      - alert: coworkDatagsmIngressDirectFallback
        expr: sum(increase(gateway_datagsm_ingress_total{outcome="direct_fallback"}[5m])) > 0
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "DataGSM 웹훅이 Authorization 직접 접수로 전환됨"
          description: "Redis Stream 접수에 실패해 Authorization의 기존 MySQL 영속 접수를 사용했습니다. Redis와 AOF 상태를 확인해 주세요."

      - alert: coworkGatewayDeploymentStateRefreshFailed
        expr: sum(increase(gateway_deployment_state_refresh_failures_total[5m])) > 0
        labels:
          severity: warning
          service: gateway
        annotations:
          summary: "Gateway의 배포 상태 Redis 동기화 실패"
          description: "Gateway가 마지막으로 확인된 배포 상태를 유지하고 있습니다. Redis 연결을 복구하고 서비스별 상태가 다시 갱신되는지 확인해 주세요."

      - alert: coworkAuthorizationWebhookStreamBacklogOld
        expr: cowork_authorization_webhook_stream_oldest_seconds > 120
        for: 2m
        labels:
          severity: warning
          service: authorization
        annotations:
          summary: "DataGSM 웹훅 대기열 처리 지연"
          description: "가장 오래된 미처리 웹훅이 2분 넘게 남았습니다. Authorization 소비자, Redis 연결과 배포 상태를 확인해 주세요."

      - alert: coworkRedisMemoryForWebhookQueueLow
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.75
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis 웹훅 대기열 여유 부족"
          description: "공유 Redis 사용량이 고정 256 MiB 한도의 75%를 넘었습니다. DataGSM 대기열과 기존 캐시를 확인하고 진행 중인 Authorization 배포를 복구해 주세요."

  - name: cowork-go
    rules:
      - alert: coworkGoHighMemory
        expr: |
          go_memstats_heap_inuse_bytes{job=~"cowork-.*"} /
          go_memstats_heap_sys_bytes{job=~"cowork-.*"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Go 힙 메모리 사용률 높음"
          description: "Go 서비스 {{ $labels.service }}의 힙 메모리 사용률이 5분 동안 85%를 초과했습니다."

  - name: cowork-nodejs
    rules:
      - alert: coworkNodeJsHighHeap
        expr: |
          nodejs_heap_size_used_bytes / cowork_nodejs_heap_size_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js 힙 메모리 사용률 높음"
          description: "Node.js 서비스 {{ $labels.service }}의 힙 메모리 사용률이 5분 동안 85%를 초과했습니다."

  - name: cowork-chat-socketio
    rules:
      # 준비 상태가 실패해도 Consul 등록과 메트릭 수집은 유지된다.
      - alert: coworkSocketIoAdapterDegraded
        expr: cowork_chat_socketio_adapter_state{state="DEGRADED"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO Redis 어댑터 연결 이상"
          description: "서비스 {{ $labels.service }}의 Socket.IO Redis 어댑터가 1분 넘게 정상적으로 동작하지 못했습니다."

      - alert: coworkSocketIoAdapterDegradedCritical
        expr: cowork_chat_socketio_adapter_state{state="DEGRADED"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Socket.IO Redis 어댑터 연결 이상 지속"
          description: "서비스 {{ $labels.service }}의 Socket.IO Redis 어댑터가 5분 넘게 정상적으로 동작하지 못했습니다."

      # 1분 안에 복구되는 짧은 단절이 반복되면 DEGRADED 알림은 울리지 않으므로 재연결 횟수로 잡는다.
      - alert: coworkSocketIoRedisReconnectSpike
        expr: increase(cowork_chat_socketio_redis_reconnects_total[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO Redis 재연결 반복"
          description: "서비스 {{ $labels.service }}의 Socket.IO Redis {{ $labels.client }} 클라이언트가 10분 동안 5회를 초과하여 재연결했습니다."

  - name: cowork-kafka
    rules:
      - alert: coworkKafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka 메시지 처리 지연"
          description: "컨슈머 그룹 {{ $labels.consumergroup }}의 소비 지연이 5분 동안 1,000 오프셋을 초과했습니다."

      # offset은 gauge이며, 파티션별로 비교해야 다른 파티션의 진행이 정체를 가리지 않는다.
      - alert: coworkChatKafkaConsumerStalled
        expr: |
          kafka_consumergroup_lag{service="kafka",consumergroup=~"cowork-chat(|-.*)"} > 0
          and changes(kafka_consumergroup_current_offset{service="kafka",consumergroup=~"cowork-chat(|-.*)"}[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat Kafka 소비 오프셋 정체"
          description: "컨슈머 그룹 {{ $labels.consumergroup }}의 {{ $labels.topic }} 파티션 {{ $labels.partition }}에 지연이 남아 있고 최근 5분간 커밋 오프셋 변화가 없는 상태가 5분 더 지속됐습니다. 현재 지연은 {{ $value }}입니다."

      - alert: coworkChatKafkaConsumerEmpty
        expr: kafka_consumergroup_members{service="kafka",consumergroup=~"cowork-chat(|-.*)"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat Kafka 컨슈머 부재"
          description: "컨슈머 그룹 {{ $labels.consumergroup }}에 5분 동안 활성 멤버가 없습니다. Chat 배포 버전과 컨슈머 시작 로그를 확인해 주세요."

  - name: cowork-datasource
    rules:
      # connection을 기다리는 스레드가 쌓이는 것은 pool 고갈의 선행 신호다.
      # 기존 5xx 알림은 요청이 이미 실패한 뒤에야 울리므로 이 규칙으로 앞당겨 탐지한다.
      - alert: coworkDbConnectionPoolPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB 커넥션 대기 지속"
          description: "서비스 {{ $labels.service }}에서 DB 커넥션을 기다리는 스레드가 2분 넘게 존재합니다."

      - alert: coworkDbConnectionPoolSaturated
        expr: |
          (
            hikaricp_connections_active /
            hikaricp_connections_max
          ) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DB 커넥션 풀 고갈 임박"
          description: "서비스 {{ $labels.service }}의 DB 커넥션 풀 사용률이 5분 동안 90%를 초과했습니다."

      - alert: coworkDbConnectionAcquireSlow
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(hikaricp_connections_acquire_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB 커넥션 획득 지연"
          description: "서비스 {{ $labels.service }}의 DB 커넥션 획득 시간 P99가 5분 동안 1초를 초과했습니다."
