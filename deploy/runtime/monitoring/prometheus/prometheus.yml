[[[ with secret "COWORK_MONITORING_SECRET_PATH" ]]]
[[[ $publicAPI := .Data.data.PUBLIC_API_BASE_URL | trimSuffix "/" ]]]
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: cowork
rule_files:
- /local/config/prometheus/rules/*.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 127.0.0.1:9093
scrape_configs:
- job_name: cowork-services
  consul_sd_configs:
  - server: COWORK_CONSUL_SERVER
    scheme: https
    authorization:
      credentials_file: /secrets/consul-token
    follow_redirects: false
    tls_config:
      ca_file: /etc/cowork/ca/ca.crt
    filter: '"application" in ServiceTags'
  relabel_configs:
  # Sidecar registrations inherit application tags and metadata, including the app metrics endpoint.
  - source_labels: [__meta_consul_service]
    regex: .+-sidecar-proxy
    action: drop
  - source_labels:
    - __meta_consul_service_metadata_metrics_port
    regex: .+
    action: keep
  - source_labels:
    - __meta_consul_service_metadata_metrics_address
    - __meta_consul_service_metadata_metrics_port
    separator: ':'
    target_label: __address__
  - source_labels:
    - __meta_consul_service_metadata_metrics_path
    target_label: __metrics_path__
  - source_labels:
    - __meta_consul_service
    regex: cowork-(.+)
    target_label: service
  - source_labels:
    - __meta_consul_node
    target_label: host
- job_name: infrastructure-discovery
  consul_sd_configs:
  - server: COWORK_CONSUL_SERVER
    scheme: https
    authorization:
      credentials_file: /secrets/consul-token
    follow_redirects: false
    tls_config:
      ca_file: /etc/cowork/ca/ca.crt
    filter: '"application" not in ServiceTags'
  relabel_configs:
  - source_labels: [__meta_consul_service]
    regex: .+-sidecar-proxy
    action: drop
  - source_labels:
    - __meta_consul_service_metadata_metrics_port
    regex: .+
    action: keep
  - source_labels:
    - __meta_consul_service_metadata_metrics_address
    - __meta_consul_service_metadata_metrics_port
    separator: ':'
    target_label: __address__
  - source_labels:
    - __meta_consul_service_metadata_metrics_path
    target_label: __metrics_path__
  - source_labels:
    - __meta_consul_service
    regex: (?:cowork-)?(.+)
    target_label: service
  - source_labels:
    - __meta_consul_service_metadata_metrics_service
    regex: (.+)
    target_label: service
  - source_labels:
    - __meta_consul_service_metadata_module
    regex: (.+)
    target_label: module
  - source_labels:
    - __meta_consul_node
    target_label: host
- job_name: infrastructure
  static_configs:
  - targets:
    - 127.0.0.1:9121
    labels:
      service: redis
  - targets:
    - 127.0.0.1:9308
    labels:
      service: kafka
- job_name: monitoring
  static_configs:
  - targets:
    - 127.0.0.1:9090
    labels:
      service: prometheus
  - targets:
    - 127.0.0.1:9093
    labels:
      service: alertmanager
  - targets:
    - 127.0.0.1:3000
    labels:
      service: grafana
  - targets:
    - 127.0.0.1:3101
    labels:
      service: loki
  - targets:
    - 127.0.0.1:9115
    labels:
      service: blackbox
- job_name: monitoring-health
  metrics_path: /probe
  params:
    module: [http_2xx]
  static_configs:
  - targets: [http://127.0.0.1:8080/api/health]
    labels:
      service: monitoring
  relabel_configs:
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: blackbox
  metrics_path: /probe
  params:
    module:
    - http_2xx
  consul_sd_configs:
  - server: COWORK_CONSUL_SERVER
    scheme: https
    authorization:
      credentials_file: /secrets/consul-token
    follow_redirects: false
    tls_config:
      ca_file: /etc/cowork/ca/ca.crt
    filter: '"application" in ServiceTags'
  relabel_configs:
  - source_labels: [__meta_consul_service]
    regex: .+-sidecar-proxy
    action: drop
  - source_labels:
    - __meta_consul_service_metadata_health_port
    regex: .+
    action: keep
  - source_labels:
    - __meta_consul_service_metadata_health_address
    - __meta_consul_service_metadata_health_port
    - __meta_consul_service_metadata_health_path
    regex: (.+);(.+);(.+)
    replacement: http://${1}:${2}${3}
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - source_labels:
    - __meta_consul_service
    regex: cowork-(.+)
    target_label: service
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: envoy-proxy
  metrics_path: /probe
  params:
    module: [tcp_connect]
  consul_sd_configs:
  - server: COWORK_CONSUL_SERVER
    scheme: https
    authorization:
      credentials_file: /secrets/consul-token
    follow_redirects: false
    tls_config:
      ca_file: /etc/cowork/ca/ca.crt
  relabel_configs:
  - source_labels: [__meta_consul_service]
    regex: cowork-(authorization|channel|chat|gateway|github|monitoring|notification|preference|project|roadmap|team|user|voice)-sidecar-proxy
    action: keep
  - source_labels: [__meta_consul_service]
    regex: cowork-(.+)-sidecar-proxy
    target_label: service
  - source_labels: [__address__]
    target_label: __param_target
  - source_labels: [__param_target]
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: public-gateway
  metrics_path: /probe
  params:
    module:
    - http_public_gateway
  static_configs:
  - targets:
    - [[[ printf "%s/api/health" $publicAPI | toJSON ]]]
    labels:
      service: gateway
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: gateway-api
  metrics_path: /probe
  static_configs:
  - targets:
    - [[[ printf "%s/api/authorization/auth/refresh" $publicAPI | toJSON ]]]
    labels:
      service: authorization
      __param_module: http_gateway_downstream_post
  - targets:
    - [[[ printf "%s/api/chat/health" $publicAPI | toJSON ]]]
    labels:
      service: chat
      __param_module: http_gateway_downstream_get
  - targets:
    - [[[ printf "%s/api/voice/voice/webhook" $publicAPI | toJSON ]]]
    labels:
      service: voice
      __param_module: http_gateway_downstream_post
  - targets:
    - [[[ printf "%s/api/github/github/webhooks" $publicAPI | toJSON ]]]
    labels:
      service: github
      __param_module: http_gateway_downstream_post
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: gateway-cors
  metrics_path: /probe
  params:
    module:
    - http_gateway_cors_preflight
  static_configs:
  - targets:
    - [[[ printf "%s/api/user/users/me" $publicAPI | toJSON ]]]
    labels:
      service: gateway
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: vault-tls
  metrics_path: /probe
  params:
    module:
    - tls_vault_private
  static_configs:
  - targets:
    - COWORK_VAULT_ADDR/v1/sys/health
    labels:
      service: vault
  relabel_configs:
  - source_labels:
    - __address__
    target_label: __param_target
  - source_labels:
    - __param_target
    target_label: instance
  - target_label: __address__
    replacement: 127.0.0.1:9115
- job_name: hosts
  static_configs: &host_targets
  - targets:
    - 10.0.0.74:9100
    labels:
      service: host
      host: channel
