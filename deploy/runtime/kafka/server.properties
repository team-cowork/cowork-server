process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
controller.listener.names=CONTROLLER
listeners=INTERNAL://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093,EXTERNAL://0.0.0.0:9094
advertised.listeners=INTERNAL://127.0.0.1:9092,EXTERNAL://10.0.0.167:9094
listener.security.protocol.map=INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:SASL_SSL
inter.broker.listener.name=INTERNAL
# Only the broker and initialization task share these loopback listeners.
# The exposed listener always authenticates a named SCRAM user over TLS.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:ANONYMOUS
allow.everyone.if.no.acl.found=false
sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
ssl.keystore.type=PEM
ssl.keystore.location=/etc/cowork/kafka-tls/server.pem
ssl.truststore.type=PEM
ssl.truststore.location=/etc/cowork/kafka-tls/ca.crt
ssl.client.auth=none
ssl.enabled.protocols=TLSv1.2,TLSv1.3
log.dirs=/var/lib/kafka/data
num.partitions=1
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
auto.create.topics.enable=false
# Projection checkpoints retain numeric offsets; topic identity must remain stable.
delete.topic.enable=false
log.retention.hours=168
