groups:
  - name: cowork-log-collection
    rules:
      # Alloy는 애플리케이션 로그 중 @timestamp나 level을 읽지 못한 줄에 parse_error="true"를 붙인다.
      # 배포 직후 배너·JVM 경고 같은 일회성 plain text는 10분 창을 벗어나면 풀리므로, 위반이 이어질 때만 알린다.
      - alert: coworkLogParseFailure
        expr: |
          sum by (env, service) (count_over_time({parse_error="true"}[10m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "애플리케이션 로그 형식 위반 지속"
          description: "서비스 {{ $labels.service }}({{ $labels.env }})에서 @timestamp 또는 level을 읽지 못한 로그가 15분 넘게 계속 들어오고 있습니다. cowork / Logs 대시보드의 형식 위반 로그에서 plain text, 잘못된 JSON, 필드 누락 여부를 확인해 주세요."

      # log-agent의 heartbeat가 VM마다 1분에 한 줄씩 남긴다. 최근 하루 안에 신호를 보냈던 호스트가 10분 동안 조용하면
      # 그 VM의 수집 경로(Docker 로그 → Alloy → Loki)가 끊긴 것이다. 신호가 살아 있는데 서비스 로그만 없으면
      # 수집은 정상이고 서비스가 조용한 것이다. 호스트를 없애거나 이름을 바꾸면 하루 동안 이 알림이 남는다.
      - alert: coworkLogCollectionStopped
        expr: |
          sum by (env, host) (count_over_time({service="log-agent"}[1d]))
          unless
          sum by (env, host) (count_over_time({service="log-agent"}[10m]))
        for: 5m
        labels:
          severity: warning
          service: log-agent
        annotations:
          summary: "로그 수집 중단"
          description: "{{ if $labels.host }}호스트 {{ $labels.host }}{{ else }}{{ $labels.env }} 환경{{ end }}의 로그 수집 생존 신호가 15분 동안 Loki에 들어오지 않았습니다. 그 VM의 log-agent(Alloy, heartbeat) 컨테이너 상태와 Loki 연결을 확인해 주세요. 이 동안 해당 VM의 서비스 로그도 수집되지 않습니다."
