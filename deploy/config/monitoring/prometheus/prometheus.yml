global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: cowork

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # ── 애플리케이션 서비스 (Eureka 자동 감지) ──
  # eureka.instance.metadata-map에 prometheus.scrape=true가 있는 인스턴스만 스크랩
  - job_name: cowork-services
    eureka_sd_configs:
      - server: http://cowork-config:8761/eureka
        refresh_interval: 30s
        follow_redirects: false
        basic_auth:
          username_file: /run/secrets/config-monitoring-username
          password_file: /run/secrets/config-monitoring-password
    relabel_configs:
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_eureka_app_instance_metadata_prometheus_path]
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__meta_eureka_app_name]
        target_label: service
        regex: 'COWORK-(.*)'
        replacement: '${1}'
        action: replace
      - source_labels: [service]
        target_label: service
        action: lowercase

  # ── Eureka에 등록되지 않는 고정 대상 ──
  # 대상 파일: deploy/config/monitoring/prometheus/sd/external-services.json
  - job_name: cowork-external-services
    follow_redirects: false
    basic_auth:
      username_file: /run/secrets/config-monitoring-username
      password_file: /run/secrets/config-monitoring-password
    file_sd_configs:
      - files:
          - /etc/prometheus/sd/*.json
        refresh_interval: 30s

  # ── Blackbox Exporter (HTTP 엔드포인트 가용성 probe) ──
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://cowork-gateway:8080/actuator/health
          - http://cowork-authorization:8081/health
          - http://cowork-user:8082/actuator/health
          - http://cowork-channel:8083/actuator/health
          - http://cowork-project:8084/actuator/health
          - http://cowork-team:8085/actuator/health
          - http://cowork-notification:8086/health
          - http://cowork-chat:8087/health
          - http://cowork-roadmap:8088/actuator/health
          - http://cowork-voice:8089/health
          - http://cowork-preference:9001/health
          - http://cowork-github:8090/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: 'http://cowork-([^:]+):.*'
        target_label: service
        replacement: '${1}'
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ── Gateway 경유 업무 API (무인증 probe, 대상별 blackbox 모듈) ──
  # prod 대상은 deploy/prod/monitoring/render-prometheus.py의 gateway_api_probes와 같게 유지한다.
  - job_name: gateway-api
    metrics_path: /probe
    static_configs:
      - targets: [http://cowork-gateway:8080/api/authorization/auth/refresh]
        labels: {service: authorization, __param_module: http_gateway_downstream_post}
      - targets: [http://cowork-gateway:8080/api/chat/health]
        labels: {service: chat, __param_module: http_gateway_downstream_get}
      - targets: [http://cowork-gateway:8080/api/voice/voice/webhook]
        labels: {service: voice, __param_module: http_gateway_downstream_post}
      - targets: [http://cowork-gateway:8080/api/github/github/webhooks]
        labels: {service: github, __param_module: http_gateway_downstream_post}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ── Gateway CORS preflight ──
  - job_name: gateway-cors
    metrics_path: /probe
    params:
      module: [http_gateway_cors_preflight]
    static_configs:
      - targets: [http://cowork-gateway:8080/api/user/users/me]
        labels:
          service: gateway
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ── 인프라 Exporter (Docker 내부 고정 서비스) ──
  - job_name: infrastructure
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: host
      - targets: ['mysqld_exporter:9104']
        labels:
          service: mysql
      - targets: ['redis_exporter:9121']
        labels:
          service: redis
      - targets: ['kafka_exporter:9308']
        labels:
          service: kafka
      - targets: ['postgres_exporter:9187']
        labels:
          service: postgres
      - targets: ['mongodb_exporter:9216']
        labels:
          service: mongodb
