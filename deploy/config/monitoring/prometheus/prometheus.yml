global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: cowork

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # 로컬 Compose 서비스는 고정 DNS 이름을 사용한다. 운영 discovery는 Consul이 담당한다.
  - job_name: cowork-services
    static_configs:
      - targets: [cowork-gateway:8080]
        labels:
          service: gateway
          __metrics_path__: /actuator/prometheus
      - targets: [cowork-authorization:8081]
        labels:
          service: authorization
          __metrics_path__: /metrics
      - targets: [cowork-user:8082]
        labels:
          service: user
          __metrics_path__: /actuator/prometheus
      - targets: [cowork-channel:8083]
        labels:
          service: channel
          __metrics_path__: /actuator/prometheus
      - targets: [cowork-project:8084]
        labels:
          service: project
          __metrics_path__: /actuator/prometheus
      - targets: [cowork-team:8085]
        labels:
          service: team
          __metrics_path__: /actuator/prometheus
      - targets: [cowork-notification:8086]
        labels:
          service: notification
          __metrics_path__: /metrics
      - targets: [cowork-chat:8087]
        labels:
          service: chat
          __metrics_path__: /metrics
      - targets: [cowork-roadmap:8088]
        labels:
          service: roadmap
          __metrics_path__: /actuator/prometheus
      - targets: [cowork-voice:8089]
        labels:
          service: voice
          __metrics_path__: /metrics
      - targets: [cowork-preference:9001]
        labels:
          service: preference
          __metrics_path__: /metrics
      - targets: [cowork-github:8090]
        labels:
          service: github
          __metrics_path__: /metrics

  # ── Blackbox Exporter (HTTP 엔드포인트 가용성 probe) ──
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://cowork-gateway:8080/actuator/health
          - http://cowork-authorization:8081/health
          - http://cowork-user:8082/actuator/health
          - http://cowork-channel:8083/actuator/health
          - http://cowork-project:8084/actuator/health
          - http://cowork-team:8085/actuator/health
          - http://cowork-notification:8086/health
          - http://cowork-chat:8087/health
          - http://cowork-roadmap:8088/actuator/health
          - http://cowork-voice:8089/health
          - http://cowork-preference:9001/health
          - http://cowork-github:8090/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - source_labels: [__param_target]
        regex: 'http://cowork-([^:]+):.*'
        target_label: service
        replacement: '${1}'
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ── Gateway 경유 업무 API (무인증 probe, 대상별 blackbox 모듈) ──
  - job_name: gateway-api
    metrics_path: /probe
    static_configs:
      - targets: [http://cowork-gateway:8080/api/authorization/auth/refresh]
        labels: {service: authorization, __param_module: http_gateway_downstream_post}
      - targets: [http://cowork-gateway:8080/api/chat/health]
        labels: {service: chat, __param_module: http_gateway_downstream_get}
      - targets: [http://cowork-gateway:8080/api/voice/voice/webhook]
        labels: {service: voice, __param_module: http_gateway_downstream_post}
      - targets: [http://cowork-gateway:8080/api/github/github/webhooks]
        labels: {service: github, __param_module: http_gateway_downstream_post}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ── Gateway CORS preflight ──
  - job_name: gateway-cors
    metrics_path: /probe
    params:
      module: [http_gateway_cors_preflight]
    static_configs:
      - targets: [http://cowork-gateway:8080/api/user/users/me]
        labels:
          service: gateway
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # ── 인프라 Exporter (Docker 내부 고정 서비스) ──
  - job_name: infrastructure
    static_configs:
      - targets: ['node_exporter:9100']
        labels:
          service: host
      - targets: ['mysqld_exporter:9104']
        labels:
          service: mysql
      - targets: ['redis_exporter:9121']
        labels:
          service: redis
      - targets: ['kafka_exporter:9308']
        labels:
          service: kafka
      - targets: ['postgres_exporter:9187']
        labels:
          service: postgres
      - targets: ['mongodb_exporter:9216']
        labels:
          service: mongodb
