groups:
  - name: cowork-availability
    rules:
      - alert: coworkPublicGatewayUnavailable
        expr: probe_success{job="public-gateway"} == 0 or up{job="public-gateway"} == 0 or absent(probe_success{job="public-gateway"})
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "외부 공개 게이트웨이 API 응답 이상"
          description: "외부 공개 HTTPS /api/health 경로나 상태 점검이 2분 동안 실패했습니다. DNS, TLS, 프록시 라우팅과 게이트웨이 응답을 확인해 주세요."

      - alert: coworkReadinessFailed
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "서비스 준비 상태 확인 실패"
          description: "서비스 {{ $labels.service }}{{ if $labels.module }} (모듈: {{ $labels.module }}){{ end }}의 준비 상태 확인이 2분 동안 실패했습니다."

      - alert: coworkInfrastructureScrapeFailed
        expr: up{job=~"infrastructure|monitoring|hosts"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "인프라 메트릭 수집 실패"
          description: "{{ $labels.service }}{{ if $labels.module }} (모듈: {{ $labels.module }}){{ end }}{{ if $labels.host }} (호스트: {{ $labels.host }}){{ end }}의 메트릭을 2분 동안 수집하지 못했습니다."

      - alert: coworkDatastoreUnavailable
        expr: mysql_up == 0 or pg_up == 0 or mongodb_up == 0 or redis_up == 0 or kafka_brokers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "데이터 저장소 연결 실패"
          description: "메트릭 수집기 {{ $labels.service }}{{ if $labels.module }} (모듈: {{ $labels.module }}){{ end }}가 데이터 저장소에 연결하거나 인증하지 못했습니다."

      - alert: coworkServiceDown
        expr: up{job=~"cowork-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "서비스 응답 없음"
          description: "서비스 {{ $labels.service }}에 2분 넘게 연결하지 못했습니다."

  - name: cowork-discovery
    rules:
      # 서비스 하나가 통째로 discovery에서 빠지는 경우는 deploy/prod/monitoring/render-prometheus.py가
      # application slot 목록으로부터 생성하는 coworkServiceMissing(3m, critical, rules.json)이 이미 감시한다.
      # 그 규칙은 slot 파일을 단일 출처로 삼아 서비스 목록 드리프트가 생기지 않으므로, 여기서는 같은 조건을
      # 하드코딩된 서비스 목록으로 중복 감시하지 않는다.

      # 대상이 하나도 없으면 서비스별 규칙은 아무것도 평가되지 않아 모든 알림이 조용해진다.
      # eureka_sd는 갱신에 실패해도 직전 target group을 유지하므로, Prometheus가 떠 있는 동안
      # Eureka가 죽거나 인증에 실패하는 것만으로는 이 규칙이 울리지 않는다. 실제로 걸리는 경우는
      # Eureka가 정상 응답했는데 등록된 인스턴스가 없을 때, 또는 Eureka가 죽은 상태에서 Prometheus가
      # (재)시작돼 처음부터 target을 하나도 못 받아온 때다. 대상이 0개가 되면 render-prometheus.py가
      # slot마다 생성한 coworkServiceMissing(3m)도 뒤이어 함께 울린다.
      - alert: coworkServiceDiscoveryEmpty
        expr: absent(up{job="cowork-services"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "서비스 검색 결과 없음"
          description: "Prometheus에 cowork-services 수집 대상이 5분 동안 없습니다. Eureka에 등록된 인스턴스가 없거나, Eureka에 연결할 수 없는 상태에서 Prometheus가 시작 또는 재시작되었을 수 있습니다."

  - name: cowork-host
    rules:
      # node_exporter는 --path.rootfs 접두어를 떼고 마운트 경로를 보고하므로 경로를 고정하지 않고,
      # 수집 단계에서 걸러진 실제 파일시스템을 모두 본다. 어디가 찼는지는 mountpoint 라벨로 구분한다.
      - alert: coworkHostDiskSpaceLow
        expr: |
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "호스트 디스크 여유 공간 부족"
          description: "호스트 {{ $labels.host }}의 {{ $labels.mountpoint }} 여유 공간이 10분 동안 15% 미만입니다."

      - alert: coworkHostDiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.07
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "호스트 디스크 여유 공간 매우 부족"
          description: "호스트 {{ $labels.host }}의 {{ $labels.mountpoint }} 여유 공간이 5분 동안 7% 미만입니다."

      # 비율이 아직 여유로워도 차오르는 중이면 미리 알린다. 두 조건을 함께 걸어 일시적 변동을 거른다.
      - alert: coworkHostDiskWillFill
        expr: |
          predict_linear(node_filesystem_avail_bytes[6h], 24 * 3600) < 0
          and node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "24시간 이내 디스크 공간 소진 예상"
          description: "호스트 {{ $labels.host }}의 {{ $labels.mountpoint }} 여유 공간이 현재 추세대로면 24시간 안에 소진될 것으로 예상됩니다."

      # absent() only sees "every host's exporter is gone", not one. A single dead node_exporter
      # is caught per-instance by coworkInfrastructureScrapeFailed (job="hosts") instead.
      - alert: coworkHostMetricsMissing
        expr: absent(node_filesystem_avail_bytes)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "전체 호스트의 디스크 메트릭 누락"
          description: "모든 VM에서 파일시스템 메트릭이 10분 동안 수집되지 않았습니다. node-agent가 배포되었는지, 수집 설정 생성에 실패하지 않았는지 확인해 주세요."

  - name: cowork-jvm
    rules:
      - alert: coworkHighJvmHeapUsage
        expr: |
          (
            jvm_memory_used_bytes{area="heap"} /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 힙 메모리 사용률 높음"
          description: "서비스 {{ $labels.service }}의 JVM 힙 메모리 사용률이 5분 동안 85%를 초과했습니다."

  - name: cowork-http
    rules:
      - alert: coworkHttp5xxSpike
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 오류 응답 증가"
          description: "서비스 {{ $labels.service }}의 HTTP 5xx 응답이 5분 동안 초당 1건을 초과했습니다."

      - alert: coworkHttp4xxSpike
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{status=~"4.."}[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 4xx 오류 응답 증가"
          description: "서비스 {{ $labels.service }}의 HTTP 4xx 응답이 5분 동안 초당 5건을 초과했습니다."

      - alert: coworkHighResponseTime
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 응답 지연"
          description: "서비스 {{ $labels.service }}의 HTTP P99 응답 시간이 5분 동안 2초를 초과했습니다."

  - name: cowork-go
    rules:
      - alert: coworkGoHighMemory
        expr: |
          go_memstats_heap_inuse_bytes{job=~"cowork-.*"} /
          go_memstats_heap_sys_bytes{job=~"cowork-.*"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Go 힙 메모리 사용률 높음"
          description: "Go 서비스 {{ $labels.service }}의 힙 메모리 사용률이 5분 동안 85%를 초과했습니다."

  - name: cowork-nodejs
    rules:
      - alert: coworkNodeJsHighHeap
        expr: |
          nodejs_heap_size_used_bytes / cowork_nodejs_heap_size_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js 힙 메모리 사용률 높음"
          description: "Node.js 서비스 {{ $labels.service }}의 힙 메모리 사용률이 5분 동안 85%를 초과했습니다."

  - name: cowork-chat-socketio
    rules:
      # adapter가 DEGRADED인 동안 Eureka status는 OUT_OF_SERVICE지만 lease는 유지되므로 수집은 계속된다.
      - alert: coworkSocketIoAdapterDegraded
        expr: cowork_chat_socketio_adapter_state{state="DEGRADED"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO Redis 어댑터 연결 이상"
          description: "서비스 {{ $labels.service }}의 Socket.IO Redis 어댑터가 1분 넘게 정상적으로 동작하지 못했습니다."

      - alert: coworkSocketIoAdapterDegradedCritical
        expr: cowork_chat_socketio_adapter_state{state="DEGRADED"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Socket.IO Redis 어댑터 연결 이상 지속"
          description: "서비스 {{ $labels.service }}의 Socket.IO Redis 어댑터가 5분 넘게 정상적으로 동작하지 못했습니다."

      # 1분 안에 복구되는 짧은 단절이 반복되면 DEGRADED 알림은 울리지 않으므로 재연결 횟수로 잡는다.
      - alert: coworkSocketIoRedisReconnectSpike
        expr: increase(cowork_chat_socketio_redis_reconnects_total[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO Redis 재연결 반복"
          description: "서비스 {{ $labels.service }}의 Socket.IO Redis {{ $labels.client }} 클라이언트가 10분 동안 5회를 초과하여 재연결했습니다."

  - name: cowork-kafka
    rules:
      - alert: coworkKafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka 메시지 처리 지연"
          description: "컨슈머 그룹 {{ $labels.consumergroup }}의 소비 지연이 5분 동안 1,000 오프셋을 초과했습니다."

      # offset은 gauge이며, 파티션별로 비교해야 다른 파티션의 진행이 정체를 가리지 않는다.
      - alert: coworkChatKafkaConsumerStalled
        expr: |
          kafka_consumergroup_lag{service="kafka",consumergroup=~"cowork-chat(|-.*)"} > 0
          and changes(kafka_consumergroup_current_offset{service="kafka",consumergroup=~"cowork-chat(|-.*)"}[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat Kafka 소비 오프셋 정체"
          description: "컨슈머 그룹 {{ $labels.consumergroup }}의 {{ $labels.topic }} 파티션 {{ $labels.partition }}에 지연이 남아 있고 최근 5분간 커밋 오프셋 변화가 없는 상태가 5분 더 지속됐습니다. 현재 지연은 {{ $value }}입니다."

      - alert: coworkChatKafkaConsumerEmpty
        expr: kafka_consumergroup_members{service="kafka",consumergroup=~"cowork-chat(|-.*)"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat Kafka 컨슈머 부재"
          description: "컨슈머 그룹 {{ $labels.consumergroup }}에 5분 동안 활성 멤버가 없습니다. Chat 배포 버전과 컨슈머 시작 로그를 확인해 주세요."

  - name: cowork-datasource
    rules:
      # connection을 기다리는 스레드가 쌓이는 것은 pool 고갈의 선행 신호다.
      # 기존 5xx 알림은 요청이 이미 실패한 뒤에야 울리므로 이 규칙으로 앞당겨 탐지한다.
      - alert: coworkDbConnectionPoolPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB 커넥션 대기 지속"
          description: "서비스 {{ $labels.service }}에서 DB 커넥션을 기다리는 스레드가 2분 넘게 존재합니다."

      - alert: coworkDbConnectionPoolSaturated
        expr: |
          (
            hikaricp_connections_active /
            hikaricp_connections_max
          ) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DB 커넥션 풀 고갈 임박"
          description: "서비스 {{ $labels.service }}의 DB 커넥션 풀 사용률이 5분 동안 90%를 초과했습니다."

      - alert: coworkDbConnectionAcquireSlow
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(hikaricp_connections_acquire_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DB 커넥션 획득 지연"
          description: "서비스 {{ $labels.service }}의 DB 커넥션 획득 시간 P99가 5분 동안 1초를 초과했습니다."
