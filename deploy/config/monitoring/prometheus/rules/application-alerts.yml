groups:
  - name: cowork-availability
    rules:
      - alert: coworkPublicGatewayUnavailable
        expr: probe_success{job="public-gateway"} == 0 or up{job="public-gateway"} == 0 or absent(probe_success{job="public-gateway"})
        for: 2m
        labels:
          severity: critical
          service: gateway
        annotations:
          summary: "Public Gateway JSON API is unavailable"
          description: "The public HTTPS /api/health path or its probe has failed for 2 minutes. Check DNS, TLS, proxy routing and the Gateway response."

      - alert: coworkReadinessFailed
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Declared service readiness failed"
          description: "Service {{ $labels.service }} did not pass its declared readiness check for 2 minutes."

      - alert: coworkInfrastructureScrapeFailed
        expr: up{job=~"infrastructure|monitoring"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Infrastructure metrics are unavailable"
          description: "Metrics for {{ $labels.service }} have been unavailable for 2 minutes."

      - alert: coworkDatastoreUnavailable
        expr: mysql_up == 0 or pg_up == 0 or mongodb_up == 0 or redis_up == 0 or kafka_brokers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Datastore is unavailable to its exporter"
          description: "Exporter {{ $labels.service }} cannot reach or authenticate to its datastore."

      - alert: coworkServiceDown
        expr: up{job=~"cowork-.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "cowork service down"
          description: "Service {{ $labels.service }} is unreachable for more than 2 minutes."

  - name: cowork-discovery
    rules:
      # 있어야 할 서비스 집합. 관측 이력으로 대신하면 소실 상태가 창 길이만큼만 유지되고,
      # 서비스가 계속 중단돼 있어도 알림이 스스로 해제된다. 서비스를 늘리거나 줄일 때 이 목록을 함께 고친다.
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: gateway
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: authorization
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: user
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: channel
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: project
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: team
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: roadmap
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: voice
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: preference
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: notification
      - record: cowork:service:expected
        expr: vector(1)
        labels:
          service: chat

      # up은 수집 대상이 남아 있을 때만 평가된다. Eureka에서 인스턴스가 빠지면 시계열 자체가 사라져
      # coworkServiceDown(up == 0)에는 걸리지 않으므로, 기대 집합과 현재 수집 대상의 차이를 감시한다.
      # 재등록되거나 위 목록에서 지우기 전까지 알림이 유지된다.
      - alert: coworkServiceMissingFromDiscovery
        expr: |
          cowork:service:expected
          unless
          max by (service) (up{job="cowork-services"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "cowork service missing from discovery"
          description: "Service {{ $labels.service }} is expected but is no longer a discovery target."

      # 대상이 하나도 없으면 서비스별 규칙은 아무것도 평가되지 않아 모든 알림이 조용해진다.
      # discovery나 Config 인증이 통째로 실패한 상태를 이 규칙으로 잡는다.
      - alert: coworkServiceDiscoveryEmpty
        expr: absent(up{job="cowork-services"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No cowork service discovery targets"
          description: "Prometheus has no cowork-services target for 5 minutes; Eureka discovery or its Config Server authentication is failing."

      # Config Server는 Eureka에 등록되지 않아 고정 대상으로만 수집된다.
      - alert: coworkConfigMetricsMissing
        expr: absent(up{job="cowork-external-services"})
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Config Server metrics target missing"
          description: "The cowork-external-services target is absent for 5 minutes; Config Server metrics are not being collected."

  - name: cowork-jvm
    rules:
      - alert: coworkHighJvmHeapUsage
        expr: |
          (
            jvm_memory_used_bytes{area="heap"} /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage"
          description: "Service {{ $labels.service }} heap usage is above 85% for 5 minutes."

  - name: cowork-http
    rules:
      - alert: coworkHttp5xxSpike
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{status=~"5.."}[5m])
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx spike detected"
          description: "Service {{ $labels.service }} is returning more than 1 5xx response/sec for 5 minutes."

      - alert: coworkHttp4xxSpike
        expr: |
          sum by (service) (
            rate(http_server_requests_seconds_count{status=~"4.."}[5m])
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 4xx spike detected"
          description: "Service {{ $labels.service }} is returning more than 5 4xx response/sec for 5 minutes."

      - alert: coworkHighResponseTime
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (
              rate(http_server_requests_seconds_bucket[5m])
            )
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP P99 response time"
          description: "Service {{ $labels.service }} P99 response time is above 2s for 5 minutes."

  - name: cowork-go
    rules:
      - alert: coworkGoHighMemory
        expr: |
          go_memstats_heap_inuse_bytes{job=~"cowork-.*"} /
          go_memstats_heap_sys_bytes{job=~"cowork-.*"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Go heap usage"
          description: "Go service {{ $labels.service }} heap usage is above 85% for 5 minutes."

  - name: cowork-nodejs
    rules:
      - alert: coworkNodeJsHighHeap
        expr: |
          nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Node.js heap usage"
          description: "Node.js service {{ $labels.service }} heap usage is above 85% for 5 minutes."

  - name: cowork-chat-socketio
    rules:
      # adapter가 DEGRADED인 동안 Eureka status는 OUT_OF_SERVICE지만 lease는 유지되므로 수집은 계속된다.
      - alert: coworkSocketIoAdapterDegraded
        expr: cowork_chat_socketio_adapter_state{state="DEGRADED"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO Redis adapter degraded"
          description: "Service {{ $labels.service }} Socket.IO Redis adapter is degraded for more than 1 minute."

      - alert: coworkSocketIoAdapterDegradedCritical
        expr: cowork_chat_socketio_adapter_state{state="DEGRADED"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Socket.IO Redis adapter degraded for 5 minutes"
          description: "Service {{ $labels.service }} Socket.IO Redis adapter is degraded for more than 5 minutes."

      # 1분 안에 복구되는 짧은 단절이 반복되면 DEGRADED 알림은 울리지 않으므로 재연결 횟수로 잡는다.
      - alert: coworkSocketIoRedisReconnectSpike
        expr: increase(cowork_chat_socketio_redis_reconnects_total[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Socket.IO Redis reconnect spike"
          description: "Service {{ $labels.service }} Socket.IO Redis {{ $labels.client }} client reconnected more than 5 times in 10 minutes."

  - name: cowork-kafka
    rules:
      - alert: coworkKafkaConsumerLag
        expr: kafka_consumergroup_lag_sum > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka consumer lag"
          description: "Consumer group {{ $labels.consumergroup }} lag is above 1000 for 5 minutes."

  - name: cowork-datasource
    rules:
      # connection을 기다리는 스레드가 쌓이는 것은 pool 고갈의 선행 신호다.
      # 기존 5xx 알림은 요청이 이미 실패한 뒤에야 울리므로 이 규칙으로 앞당겨 탐지한다.
      - alert: coworkDbConnectionPoolPending
        expr: hikaricp_connections_pending > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool has waiting threads"
          description: "Service {{ $labels.service }} has threads waiting for a DB connection for more than 2 minutes."

      - alert: coworkDbConnectionPoolSaturated
        expr: |
          (
            hikaricp_connections_active /
            hikaricp_connections_max
          ) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DB connection pool near saturation"
          description: "Service {{ $labels.service }} is using more than 90% of its DB connection pool for 5 minutes."

      - alert: coworkDbConnectionAcquireSlow
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(hikaricp_connections_acquire_seconds_bucket[5m])) by (le, service)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow DB connection acquisition"
          description: "Service {{ $labels.service }} P99 connection acquire time is above 1s for 5 minutes."
