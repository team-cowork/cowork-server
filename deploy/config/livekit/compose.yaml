name: cowork-livekit

services:
  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: cowork-livekit
    restart: unless-stopped
    env_file:
      - path: ./runtime.env
        format: raw
    command: [--config, /etc/livekit.yaml]
    ports:
      - "7880:7880"
      - "7881:32154/tcp"
      - "7882:37932/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks: [existing]
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: "5"}
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:7880 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  existing:
    external: true
    name: cowork-server_default
