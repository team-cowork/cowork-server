# Include from nginx's http context. This file contains no application secrets.
log_format cowork_github_webhook '$remote_addr $request_method $uri $status '
                               '$body_bytes_sent $request_time';

server {
    listen 10.0.0.150:8080 default_server;
    server_name _;
    server_tokens off;

    # Match the socket peer, not an untrusted forwarded header.
    allow 10.0.0.117/32;
    deny all;

    client_max_body_size 25m;
    client_body_timeout 15s;
    access_log /var/log/nginx/cowork-github-webhook.access.log cowork_github_webhook;
    error_log /var/log/nginx/cowork-github-webhook.error.log warn;

    location = /github/webhooks {
        # Reject query strings and alternate encodings of this path as well.
        if ($request_uri != "/github/webhooks") {
            return 404;
        }
        if ($request_method != POST) {
            return 405;
        }

        proxy_pass http://10.0.0.150:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
    }

    # Includes /api/*, /github/setup, /health, and the site root.
    location / {
        return 404;
    }
}
