all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: /absolute/private/deployment-key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/absolute/private/known_hosts'
    cowork_release_sha: REQUIRED_40_CHARACTER_GIT_SHA
    cowork_source_archive: /absolute/private/source.tar.gz
    cowork_image_owner: team-cowork
  hosts:
    monitoring:
      ansible_host: ssh.gsmsv.site
      ansible_port: 27123
      cowork_firewall_target: monitoring
      cowork_disabled_services: [caddy]
      cowork_units:
        - {service: monitoring, target: monitoring, settings_file: /absolute/private/monitoring.json}
        - {service: log-agent, target: log-agent-monitoring, settings_file: /absolute/private/log-agent-monitoring.json}
