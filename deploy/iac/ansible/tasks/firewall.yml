---
- name: Derive the ingress contract from the Git slot
  ansible.builtin.command:
    argv: "{{ ['python3', cowork_repository ~ '/deploy/iac/monitoring-ingress.py'] if cowork_firewall_target == 'monitoring' else ['python3', cowork_repository ~ '/deploy/prod/slots.py', 'firewall', cowork_firewall_target] }}"
  delegate_to: localhost
  become: false
  register: cowork_slot_policy
  changed_when: false
  when: cowork_firewall_target is defined
- name: Select policy type
  ansible.builtin.set_fact:
    cowork_policy_type: "{{ 'config' if cowork_firewall_target | default('') == 'config' else 'backend' }}"
    cowork_policy_json: "{{ cowork_slot_policy.stdout if cowork_firewall_target is defined else cowork_firewall_policy | to_json }}"
- name: Install reviewed policy with the administrator bootstrap
  become: true
  block:
    - name: Create root-owned staging directory
      ansible.builtin.file:
        path: "/root/cowork-iac/{{ cowork_policy_type }}"
        state: directory
        mode: '0700'
        owner: root
        group: root
    - name: Copy the reviewed bootstrap implementation
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/prod/{{ item }}"
        dest: "/root/cowork-iac/{{ cowork_policy_type }}/{{ item }}"
        mode: '0600'
        owner: root
        group: root
      loop:
        - "bootstrap-{{ cowork_policy_type }}-firewall.sh"
        - "{{ cowork_policy_type }}-firewall.py"
        - "{{ cowork_policy_type }}-firewall.service"
    - name: Stage only the declared backend ingress peers and binding
      ansible.builtin.copy:
        content: "{{ cowork_policy_json }}\n"
        dest: "/root/cowork-iac/{{ cowork_policy_type }}/policy.json"
        mode: '0600'
        owner: root
        group: root
      when: cowork_policy_type == 'backend'
    # Config activation remains atomic with its own container deployment. Its
    # bootstrap installs the trusted helper without changing the active policy.
    - name: Install the trusted helper and stage the reviewed policy
      ansible.builtin.command:
        argv: [/bin/bash, "/root/cowork-iac/{{ cowork_policy_type }}/bootstrap-{{ cowork_policy_type }}-firewall.sh"]
      environment:
        COWORK_BACKEND_POLICY_MODE: "{{ 'apply' if cowork_firewall_target | default('') == 'monitoring' else 'stage' }}"
        COWORK_BACKEND_SERVICE: "{{ cowork_firewall_target | default('') }}"
      changed_when: true
    - name: Validate the deployment account for the policy check
      ansible.builtin.assert:
        that:
          - ansible_user is match('^[a-z_][a-z0-9_-]*$')
      when: cowork_policy_type == 'backend'
    - name: Permit only the installed policy comparison and staged cutover operations
      ansible.builtin.copy:
        content: |
          {{ ansible_user }} ALL=(root) NOPASSWD: /usr/bin/python3 -I /usr/local/libexec/cowork-backend-firewall.py check-policy
          {% if cowork_firewall_target | default('') != 'monitoring' %}
          {{ ansible_user }} ALL=(root) NOPASSWD: /usr/bin/python3 -I /usr/local/libexec/cowork-backend-firewall.py prepare *, /usr/bin/python3 -I /usr/local/libexec/cowork-backend-firewall.py activate *, /usr/bin/python3 -I /usr/local/libexec/cowork-backend-firewall.py rollback *, /usr/bin/python3 -I /usr/local/libexec/cowork-backend-firewall.py finalize *
          {% endif %}
        dest: /etc/sudoers.d/cowork-backend-policy-check
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      when: cowork_policy_type == 'backend'
