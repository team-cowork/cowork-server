---
- name: Manage Module Object Storage Independently Of The Application
  become: true
  vars:
    storage_source: /root/cowork-iac/storage-source
  block:
    - name: Create The Administrator Storage Source Directories
      ansible.builtin.file:
        path: "{{ storage_source }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - deploy/iac/storage
        - deploy/prod/storage
        - deploy/prod/slots
        - deploy/prod/network
        - deploy/config/seaweedfs
    - name: Install The Reviewed Storage Sources
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/{{ item }}/"
        dest: "{{ storage_source }}/{{ item }}/"
        owner: root
        group: root
        mode: '0600'
        directory_mode: '0700'
      loop:
        - deploy/iac/storage
        - deploy/prod/storage
        - deploy/config/seaweedfs
    - name: Install Storage Network And Slot Inputs
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/prod/{{ item }}"
        dest: "{{ storage_source }}/deploy/prod/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - slots.py
        - "slots/{{ cowork_storage_module }}.json"
        - slots/gateway.json
        - slots/config.json
        - slots/monitoring.json
        - network/host-network.json
    - name: Apply Storage IAM And Lifecycle Policies Without Resetting Data
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ storage_source }}/deploy/iac/storage/runtime.py"
          - apply
          - "{{ cowork_storage_module }}"
          - --directory
          - "/root/cowork-iac/storage/{{ cowork_storage_module }}"
        stdin: "{{ lookup('ansible.builtin.file', cowork_storage_settings_file) }}"
      no_log: true
      changed_when: true
