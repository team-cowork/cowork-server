---
- name: Manage The Module Database As An Independent Infrastructure Unit
  become: true
  vars:
    database_source: /root/cowork-iac/database-source
    database_catalog: "{{ lookup('ansible.builtin.file', cowork_repository ~ '/deploy/iac/databases/catalog.json') | from_json }}"
    database_slot: "{{ lookup('ansible.builtin.file', cowork_repository ~ '/deploy/prod/slots/' ~ cowork_database_module ~ '.json') | from_json }}"
    database_network: "{{ lookup('ansible.builtin.file', cowork_repository ~ '/deploy/prod/network/host-network.json') | from_json }}"
    database_monitoring: "{{ lookup('ansible.builtin.file', cowork_repository ~ '/deploy/prod/slots/monitoring.json') | from_json }}"
  block:
    - name: Create The Administrator Source Directories
      ansible.builtin.file:
        path: "{{ database_source }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - deploy/iac/databases
        - deploy/prod/slots
        - deploy/prod/network
    - name: Install The Reviewed Database Implementation
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/iac/databases/"
        dest: "{{ database_source }}/deploy/iac/databases/"
        owner: root
        group: root
        mode: '0600'
        directory_mode: '0700'
    - name: Install The Database Network And Slot Inputs
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/prod/{{ item }}"
        dest: "{{ database_source }}/deploy/prod/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - slots.py
        - "slots/{{ cowork_database_module }}.json"
        - slots/monitoring.json
        - network/host-network.json
    - name: Install The Persistent Database Firewall
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/iac/databases/{{ item.source }}"
        dest: "{{ item.destination }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - source: firewall.py
          destination: /usr/local/libexec/cowork-module-database-firewall.py
        - source: firewall.service
          destination: /etc/systemd/system/cowork-module-database-firewall.service
      when: database_catalog[cowork_database_module].engine != 'sqlite'
    - name: Restrict Database Traffic To The Local Bridge And Metrics To Monitoring
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, /usr/local/libexec/cowork-module-database-firewall.py, apply]
        stdin: "{{ {'network': database_network.name, 'bind_ip': database_slot.container.advertise_address, 'monitoring_ip': database_monitoring.runtime.MONITORING_BIND_IP, 'database_port': database_slot.runtime.DB_PORT | int, 'exporter_port': database_catalog[cowork_database_module].exporter.port, 'local_ports': [9200, 9300] if 'search' in database_catalog[cowork_database_module] else []} | to_json }}"
      changed_when: true
      when: database_catalog[cowork_database_module].engine != 'sqlite'
    - name: Enable Database Firewall Restoration Before Docker
      ansible.builtin.systemd_service:
        name: cowork-module-database-firewall.service
        daemon_reload: true
        enabled: true
        state: started
      when: database_catalog[cowork_database_module].engine != 'sqlite'
    - name: Reconcile The Database Volume And Accounts Without Resetting Data
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ database_source }}/deploy/iac/databases/runtime.py"
          - apply
          - "{{ cowork_database_module }}"
          - --directory
          - "/root/cowork-iac/databases/{{ cowork_database_module }}"
        stdin: "{{ lookup('ansible.builtin.file', cowork_database_settings_file) }}"
      no_log: true
      changed_when: true
      when: cowork_database_settings_file is defined
    - name: Reconcile The Module Search Service Independently
      when: cowork_search_settings_file is defined
      block:
        - name: Install The Reviewed Search Image Build Context
          ansible.builtin.copy:
            src: "{{ cowork_repository }}/deploy/images/elasticsearch/"
            dest: "{{ database_source }}/deploy/images/elasticsearch/"
            owner: root
            group: root
            mode: '0600'
            directory_mode: '0700'
        - name: Persist The Elasticsearch Virtual Memory Requirement
          ansible.builtin.copy:
            content: "vm.max_map_count = 1048576\n"
            dest: /etc/sysctl.d/60-cowork-search.conf
            owner: root
            group: root
            mode: '0644'
        - name: Read The Current Virtual Memory Limit
          ansible.builtin.command:
            argv: [/usr/sbin/sysctl, -n, vm.max_map_count]
          register: cowork_search_map_count
          changed_when: false
        - name: Apply The Elasticsearch Virtual Memory Requirement
          ansible.builtin.command:
            argv: [/usr/sbin/sysctl, -p, /etc/sysctl.d/60-cowork-search.conf]
          when: cowork_search_map_count.stdout | int != 1048576
          changed_when: true
        - name: Reconcile Search Storage And The Application Index Role
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - "{{ database_source }}/deploy/iac/databases/search.py"
              - apply
              - "{{ cowork_database_module }}"
              - --directory
              - "/root/cowork-iac/search/{{ cowork_database_module }}"
            stdin: "{{ lookup('ansible.builtin.file', cowork_search_settings_file) }}"
          no_log: true
          changed_when: true
