---
- name: Manage The Dedicated Shared Service Independently Of Applications
  become: true
  vars:
    shared_source: /root/cowork-iac/shared-source
  block:
    - name: Create The Administrator Source Directories
      ansible.builtin.file:
        path: "{{ shared_source }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - deploy/iac/shared
        - deploy/prod/slots
        - deploy/prod/network
        - deploy/compose
    - name: Install The Reviewed Shared Service Implementation
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/iac/shared/"
        dest: "{{ shared_source }}/deploy/iac/shared/"
        owner: root
        group: root
        mode: '0600'
        directory_mode: '0700'
    - name: Install The Service Network And Topic Sources
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/{{ item }}"
        dest: "{{ shared_source }}/deploy/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop:
        - prod/network/host-network.json
        - prod/slots/voice.json
        - prod/slots/monitoring.json
        - compose/stack.yaml
    - name: Create The Administrator Helper Directory
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Install The Persistent Shared Service Firewall
      ansible.builtin.copy:
        src: "{{ cowork_repository }}/deploy/iac/shared/{{ item.source }}"
        dest: "{{ item.destination }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - source: firewall.py
          destination: /usr/local/libexec/cowork-shared-firewall.py
        - source: firewall.service
          destination: /etc/systemd/system/cowork-shared-firewall.service
    - name: Resolve The Dedicated Service Ingress
      ansible.builtin.command:
        argv: [/usr/bin/python3, "{{ shared_source }}/deploy/iac/shared/runtime.py", policy, "{{ cowork_shared_service }}"]
      register: cowork_shared_policy
      changed_when: false
    - name: Apply The Dedicated Service Ingress
      ansible.builtin.command:
        argv: [/usr/bin/python3, -I, /usr/local/libexec/cowork-shared-firewall.py, apply]
        stdin: "{{ cowork_shared_policy.stdout }}"
      changed_when: true
    - name: Restore Shared Service Ingress Before Docker
      ansible.builtin.systemd_service:
        name: cowork-shared-firewall.service
        daemon_reload: true
        enabled: true
        state: started
    - name: Reconcile The Shared Service Without Resetting Data
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - "{{ shared_source }}/deploy/iac/shared/runtime.py"
          - apply
          - "{{ cowork_shared_service }}"
          - --directory
          - "/root/cowork-iac/shared/{{ cowork_shared_service }}"
        stdin: "{{ lookup('ansible.builtin.file', cowork_shared_settings_file) }}"
      no_log: true
      changed_when: true
