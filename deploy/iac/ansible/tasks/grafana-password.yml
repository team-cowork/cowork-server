---
- name: Reconcile The Persisted Grafana Administrator Account
  vars:
    grafana_settings: "{{ lookup('ansible.builtin.file', cowork_monitoring_unit.settings_file) | from_json }}"
    grafana_slot: "{{ lookup('ansible.builtin.file', cowork_repository ~ '/deploy/prod/slots/monitoring.json') | from_json }}"
    grafana_project: "{{ (grafana_slot.runtime | combine(grafana_settings.variables | default({}))).MONITORING_COMPOSE_PROJECT }}"
  block:
    - name: Check The Desired Administrator Credential
      ansible.builtin.uri:
        url: http://127.0.0.1:3001/api/user
        url_username: admin
        url_password: "{{ grafana_settings.runtime.GRAFANA_ADMIN_PASSWORD }}"
        force_basic_auth: true
        follow_redirects: none
        use_proxy: false
        return_content: true
        status_code: [200, 401]
      register: cowork_grafana_current_identity
      until: (cowork_grafana_current_identity.status | default(-1)) in [200, 401]
      retries: 5
      delay: 2
      no_log: true
    - name: Require The Authenticated Account To Be An Administrator
      ansible.builtin.assert:
        that:
          - cowork_grafana_current_identity.json.isGrafanaAdmin | default(false) | bool
      when: cowork_grafana_current_identity.status == 200
      no_log: true
    - name: Locate The Running Grafana Container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --quiet
          - --filter
          - "label=com.docker.compose.project={{ grafana_project }}"
          - --filter
          - label=com.docker.compose.service=grafana
      register: cowork_grafana_container
      changed_when: false
      when: cowork_grafana_current_identity.status == 401
    - name: Require One Running Grafana Container
      ansible.builtin.assert:
        that:
          - cowork_grafana_container.stdout_lines | length == 1
          - cowork_grafana_container.stdout is match('^[0-9a-f]{12,64}$')
      when: cowork_grafana_current_identity.status == 401
    - name: Set The Administrator Password In The Existing Grafana Database
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - "{{ cowork_grafana_container.stdout }}"
          - grafana
          - cli
          - --homepath
          - /usr/share/grafana
          - --config
          - /etc/grafana/grafana.ini
          - --configOverrides
          - cfg:default.paths.data=/var/lib/grafana
          - admin
          - reset-admin-password
          - --password-from-stdin
        stdin: "{{ grafana_settings.runtime.GRAFANA_ADMIN_PASSWORD }}"
      no_log: true
      changed_when: true
      when: cowork_grafana_current_identity.status == 401
    - name: Verify The New Administrator Credential
      ansible.builtin.uri:
        url: http://127.0.0.1:3001/api/user
        url_username: admin
        url_password: "{{ grafana_settings.runtime.GRAFANA_ADMIN_PASSWORD }}"
        force_basic_auth: true
        follow_redirects: none
        use_proxy: false
        return_content: true
        status_code: 200
      register: cowork_grafana_identity
      until: cowork_grafana_identity.status == 200 and cowork_grafana_identity.json.isGrafanaAdmin | default(false) | bool
      retries: 5
      delay: 2
      no_log: true
      when: cowork_grafana_current_identity.status == 401
