---
- name: Load the reviewed container CLI version and checksum
  ansible.builtin.include_vars:
    file: "{{ cowork_repository }}/deploy/iac/policy/container-tools.json"
    name: cowork_container_tools
- name: Validate the pinned Compose platform and release source
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'x86_64'
      - cowork_container_tools.schema_version == 1
      - cowork_container_tools.compose.platform == 'linux-x86_64'
      - cowork_container_tools.compose.version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - cowork_container_tools.compose.sha256 is match('^[0-9a-f]{64}$')
      - cowork_container_tools.compose.url == 'https://github.com/docker/compose/releases/download/v' ~ cowork_container_tools.compose.version ~ '/docker-compose-linux-x86_64'
      - cowork_container_tools.compose.checksum_url == cowork_container_tools.compose.url ~ '.sha256'
    fail_msg: The reviewed Compose release supports only Linux x86_64 and must retain its official URL and checksum.
- name: Install the same reviewed Compose plugin on every VM
  become: true
  block:
    - name: Create the administrator-owned Docker CLI plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Inspect the managed plugin path without following links
      ansible.builtin.stat:
        path: /usr/local/lib/docker/cli-plugins/docker-compose
        follow: false
      register: cowork_compose_plugin
    - name: Refuse to replace a plugin symlink or non-file
      ansible.builtin.assert:
        that:
          - not cowork_compose_plugin.stat.exists or (cowork_compose_plugin.stat.isreg and not cowork_compose_plugin.stat.islnk)
        fail_msg: The managed Compose plugin path must be absent or a regular file; inspect existing links before applying.
    # get_url compares the existing SHA-256 and atomically replaces a different
    # version. An existing binary is not accepted merely because it is present.
    - name: Download and verify the pinned official Compose binary
      ansible.builtin.get_url:
        url: "{{ cowork_container_tools.compose.url }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        checksum: "sha256:{{ cowork_container_tools.compose.sha256 }}"
        owner: root
        group: root
        mode: '0755'
        timeout: 60
        validate_certs: true
        use_netrc: false
        unredirected_headers: [Authorization]
- name: Read the Compose version selected by the deployment user
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: cowork_compose_version
  changed_when: false
- name: Reject a different user-local or configured Compose plugin
  ansible.builtin.assert:
    that:
      - cowork_compose_version.stdout | trim == cowork_container_tools.compose.version
    fail_msg: The deployment user selects another Compose version. Inspect user-local plugins and Docker CLI configuration; this playbook does not delete them.
