# Local development stack. The root docker-compose.yml includes local.yaml build settings.
services:
  mysql:
    image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
    container_name: cowork-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/config/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: cowork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/config/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.3.11@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    container_name: cowork-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: cowork-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Keep both broker records and KRaft metadata on the mounted data volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Topics are provisioned explicitly by kafka-init so cold starts do not
      # depend on broker auto-creation timing. This also matches production
      # clusters where automatic topic creation is normally disabled.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Projection checkpoints store numeric offsets. Reusing a topic name for a
      # newly-created topic can make an old checkpoint appear valid, so state
      # topics are immutable and Kafka storage resets must reset projections too.
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    ports:
      - "${KAFKA_EXTERNAL_HOST_PORT:-9094}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: cowork-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-1}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TOPICS: >-
        user.data.sync
        user.identity.command
        user.identity.command-result
        user.identity.command-result-dlt
        user.profile.event.v2
        user.presence.event
        team.lifecycle
        team.lifecycle-dlt
        team.member.event
        team.member.event-dlt
        channel.dm-participant.state.v1
        channel.event.v2
        project.event.v2
        project.github-repo.event
        chat.message.v2
        github.issue.create
        github.issue.result
        github.pr.approve
        github.pr.approve.result
        github.pr.merge
        github.pr.merge.result
        github.repo.event
        team.github.connected
        team.github.disconnected
        team.github.connected-dlt
        team.github.disconnected-dlt
        notification.trigger
        voice.event
        preference.status.changed
        preference.channel-notification.changed
        preference.team-role.state.v2
        preference.team-role.command.v2
        preference.team-role.result.v2
        preference.team-role.result.v2-dlt
        preference.channel-role-policy.state.v2
        preference.channel-role-policy.command.v2
        preference.channel-role-policy.result.v2
        preference.channel-role-policy.result.v2-dlt
        preference.github-repo.setting.command
        preference.github-repo.setting.state
        preference.github-repo.setting.result
        preference.project-access.state.v1
        preference.account-setting.state.v1
        preference.team-setting.state.v1
        preference.text-channel-setting.state.v1
        preference.webhook.state.v2
        channel.webhook-legacy.state.v1
        preference.voice-channel-setting.state.v1
        preference.github-repo.setting.result-dlt
        project.chat-github-issue.command
        project.chat-github-issue.command-dlt
        project.chat-github-issue.result
        github.issue-write.command.v1
        github.issue-write.result.v1
        github.issue-write.result.v1-dlt
        github.repo.state.v1
        github.issue.state.v1
        github.pull-request.state.v1
        github.label.state.v1
        github.issue-comment.state.v1
        github.sync.command.v1
      KAFKA_COMPACTED_TOPICS: >-
        user.profile.event.v2
        user.presence.event
        team.lifecycle
        team.member.event
        channel.dm-participant.state.v1
        channel.event.v2
        project.event.v2
        project.github-repo.event
        preference.channel-notification.changed
        preference.team-role.state.v2
        preference.channel-role-policy.state.v2
        preference.github-repo.setting.state
        preference.project-access.state.v1
        preference.account-setting.state.v1
        preference.team-setting.state.v1
        preference.text-channel-setting.state.v1
        preference.webhook.state.v2
        channel.webhook-legacy.state.v1
        preference.voice-channel-setting.state.v1
        github.repo.state.v1
        github.issue.state.v1
        github.pull-request.state.v1
        github.label.state.v1
        github.issue-comment.state.v1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for topic in $${KAFKA_TOPICS}; do
          partitions="$${KAFKA_TOPIC_PARTITIONS}"
          # GitHub state topics stay single-partition so each sync-completed marker is consumed after its records.
          case "$${topic}" in github.*.state.v1) partitions=1 ;; esac
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions "$${partitions}" \
            --replication-factor "$${KAFKA_TOPIC_REPLICATION_FACTOR}"
        done
        /opt/kafka/bin/kafka-configs.sh \
          --bootstrap-server kafka:9092 \
          --alter --entity-type topics --entity-name chat.message.v2 \
          --add-config 'cleanup.policy=delete,retention.ms=604800000'
        # Compaction only ever touches closed segments, so the default week-long segment roll
        # leaves these low-volume topics uncompacted and their consumers replaying every record.
        for topic in $${KAFKA_COMPACTED_TOPICS}; do
          /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafka:9092 \
            --alter \
            --entity-type topics \
            --entity-name "$${topic}" \
            --add-config cleanup.policy=compact,segment.ms=3600000
        done

  kafka-ui:
    # The project does not publish immutable release tags consistently; pin the
    # verified multi-architecture image digest instead of following latest.
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    container_name: cowork-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: cowork-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_HOST_PORT:-8091}:8080"

  vault:
    image: hashicorp/vault:2.1.0@sha256:5520cc26271c024e6ffa45cdf95255bd26b70d71ba4b7e0bc18925bef4128adb
    container_name: cowork-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      SKIP_SETCAP: "true"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
      - SETFCAP
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: cowork-seaweedfs
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET:-cowork-bucket}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfsadmin}
      S3_TEAM_ACCESS_KEY: ${S3_TEAM_ACCESS_KEY:-local-team}
      S3_TEAM_SECRET_KEY: ${S3_TEAM_SECRET_KEY:-local-team-secret}
      S3_USER_ACCESS_KEY: ${S3_USER_ACCESS_KEY:-local-user}
      S3_USER_SECRET_KEY: ${S3_USER_SECRET_KEY:-local-user-secret}
      S3_CHAT_ACCESS_KEY: ${S3_CHAT_ACCESS_KEY:-local-chat}
      S3_CHAT_SECRET_KEY: ${S3_CHAT_SECRET_KEY:-local-chat-secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9002:9333"
    volumes:
      - seaweedfs_data:/data
      - ./deploy/config/seaweedfs:/storage-config:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mkdir -p /etc/seaweedfs
        sh /storage-config/render-s3-config.sh /storage-config/s3-config.json.template /etc/seaweedfs/s3-config.json
        exec weed server -dir=/data -s3 \
          -s3.port=9000 \
          -s3.config=/etc/seaweedfs/s3-config.json \
          -master.port=9333 \
          -volume.port=8080 \
          -filer.port=8888
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs-init:
    image: amazon/aws-cli:2.36.46@sha256:eedfdcb56e9a1b02fabcf656977ca226f40860c6672aca41d435e036bc95a075
    container_name: cowork-seaweedfs-init
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-seaweedfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-seaweedfsadmin}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      S3_INTERNAL_ENDPOINT: http://seaweedfs:9000
      PUBLIC_WEB_ORIGINS: ${PUBLIC_WEB_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
      S3_BUCKET: ${S3_BUCKET:-cowork-bucket}
    volumes:
      - ./deploy/config/seaweedfs:/storage-config:ro
    entrypoint: ["/bin/sh", "/storage-config/configure-bucket.sh"]

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: cowork-seaweedfs-admin
    restart: unless-stopped
    # Share loopback with the storage process; the admin API has no external listener.
    network_mode: "service:seaweedfs"
    depends_on:
      seaweedfs:
        condition: service_healthy
    command: ["admin", "-master=localhost:9333", "-ip=127.0.0.1", "-dataDir=/data"]
    volumes:
      - seaweedfs_admin_data:/data

  seaweedfs-lifecycle:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: cowork-seaweedfs-lifecycle
    restart: unless-stopped
    network_mode: "service:seaweedfs"
    depends_on:
      seaweedfs-admin:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
    command: ["worker", "-admin=localhost:23646", "-jobType=s3_lifecycle", "-workingDir=/data", "-metricsPort=9327", "-metricsIp=127.0.0.1"]
    volumes:
      - seaweedfs_lifecycle_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9327/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  elasticsearch:
    build:
      context: ./deploy/images/elasticsearch
      dockerfile: Dockerfile
    container_name: cowork-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: cowork-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: cowork-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP:-false}
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./deploy/config/livekit/${LIVEKIT_CONFIG_FILE:-livekit.yaml}:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:7880 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5


  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    container_name: cowork-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/config/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      # prod의 prepare-configs.sh처럼 ruler의 단일 테넌트("fake") 디렉터리에 규칙을 둔다.
      - ./deploy/config/monitoring/loki/rules:/etc/loki/rules/fake:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      # The official Loki image is distroless and does not contain /bin/sh or wget.
      # Container liveness is provided by Docker; validate the loaded config without
      # depending on utilities that are absent from the production image.
      test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/local-config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    container_name: cowork-alloy
    restart: unless-stopped
    # prod log-agent와 같이 서비스별 UID가 쓴 로그를 모두 읽는다.
    user: "0:0"
    environment:
      ENV: ${APP_CONFIG_PROFILE:-local}
    volumes:
      - ./deploy/config/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - cowork_logs:/var/log/cowork:ro
      - alloy_data:/var/lib/alloy
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy

  # 로그 수집 경로 생존 신호. 1분마다 남기는 이 로그가 끊기면 Loki 규칙 coworkLogCollectionStopped가 알린다.
  # ponytail: 회전 없이 하루 약 170KB씩 늘어난다. 로컬 볼륨을 오래 유지해 문제가 되면 크기 기준 회전을 넣는다.
  log-heartbeat:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    restart: unless-stopped
    # PID 1인 sh는 SIGTERM을 무시하므로 init이 신호를 전달해 바로 종료되게 한다.
    init: true
    user: "10001:10001"
    network_mode: none
    depends_on:
      logs-init:
        condition: service_completed_successfully
    volumes:
      - cowork_logs:/var/log/cowork
    command:
      - sh
      - -ec
      - mkdir -p /var/log/cowork/log-agent; while :; do date -u +'{"@timestamp":"%Y-%m-%dT%H:%M:%SZ","level":"INFO","service":"cowork-log-agent","module":"heartbeat","message":"heartbeat"}' >> /var/log/cowork/log-agent/app.log; sleep 60; done

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: cowork-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./deploy/config/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: cowork-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/config/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager-config-init:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: cowork-alertmanager-config-init
    restart: "no"
    environment:
      DISCORD_MONITORING_ALERT_WEBHOOK: ${DISCORD_MONITORING_ALERT_WEBHOOK:-}
      APP_CONFIG_PROFILE: ${APP_CONFIG_PROFILE:-local}
    volumes:
      - ./deploy/config/monitoring/alertmanager/alertmanager.yml:/source/alertmanager.yml:ro
      - ./deploy/config/monitoring/alertmanager/alertmanager-noop.yml:/source/alertmanager-noop.yml:ro
      - alertmanager_config:/generated
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        rm -f /generated/alertmanager.yml /generated/discord-webhook-url

        if [ -n "$${DISCORD_MONITORING_ALERT_WEBHOOK}" ]; then
          cp /source/alertmanager.yml /generated/alertmanager.yml
          printf '%s' "$${DISCORD_MONITORING_ALERT_WEBHOOK}" > /generated/discord-webhook-url
          chown 65534:65534 /generated/discord-webhook-url
          chmod 0400 /generated/discord-webhook-url
        elif [ "$${APP_CONFIG_PROFILE}" = "local" ]; then
          cp /source/alertmanager-noop.yml /generated/alertmanager.yml
        else
          echo "DISCORD_MONITORING_ALERT_WEBHOOK is required outside the local profile" >&2
          exit 1
        fi

        chmod 0444 /generated/alertmanager.yml

  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: cowork-alertmanager
    restart: unless-stopped
    depends_on:
      alertmanager-config-init:
        condition: service_completed_successfully
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager/generated:ro
    command:
      - '--config.file=/etc/alertmanager/generated/alertmanager.yml'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: cowork-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/config/monitoring/grafana/dashboards:/etc/grafana/managed/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:v1.10.2@sha256:3ac34ce007accad95afed72149e0d2b927b7e42fd1c866149b945b84737c62c3
    container_name: cowork-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|overlay|squashfs|tmpfs|devtmpfs|nsfs|fuse\\..*)$$
    ports:
      - "9100:9100"
    volumes:
      # No ":rslave" here: Docker Desktop's VM doesn't mark its own root as a shared/slave mount, so
      # the recursive propagation prod uses to pick up newly mounted filesystems fails locally with
      # "path / is mounted on / but it is not a shared or slave mount" (confirmed on this machine).
      - /:/host:ro
