# Local development stack. The root docker-compose.yml includes local.yaml build settings.
services:
  mysql:
    image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
    container_name: cowork-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/config/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    container_name: cowork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/config/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.3.11@sha256:5d7043a4ffe02b9ed1b6e0bab057546981af5ca0a79107e9c461e49bc44c0a7b
    container_name: cowork-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: cowork-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Topics are provisioned explicitly by kafka-init so cold starts do not
      # depend on broker auto-creation timing. This also matches production
      # clusters where automatic topic creation is normally disabled.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Projection checkpoints store numeric offsets. Reusing a topic name for a
      # newly-created topic can make an old checkpoint appear valid, so state
      # topics are immutable and Kafka storage resets must reset projections too.
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    ports:
      - "${KAFKA_EXTERNAL_HOST_PORT:-9094}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    container_name: cowork-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_TOPIC_PARTITIONS: ${KAFKA_TOPIC_PARTITIONS:-1}
      KAFKA_TOPIC_REPLICATION_FACTOR: ${KAFKA_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_TOPICS: >-
        springCloudBus
        user.data.sync
        user.identity.command
        user.identity.command-result
        user.identity.command-result-dlt
        user.profile.event
        user.presence.event
        team.lifecycle
        team.lifecycle-dlt
        team.member.event
        team.member.event-dlt
        channel.member.event.v2
        channel.event.v2
        project.event.v2
        project.member.event.v2
        project.github-repo.event
        chat.message
        github.issue.create
        github.issue.result
        github.repo.event
        team.github.connected
        team.github.disconnected
        team.github.connected-dlt
        team.github.disconnected-dlt
        notification.trigger
        voice.event
        preference.status.changed
        preference.team.setting.changed
        preference.channel-notification.changed
        preference.team-role.changed
        preference.team-role.changed-dlt
        preference.team-role.command
        preference.team-role.command-result
        preference.team-role.command-result-dlt
        preference.channel-role-policy.command
        preference.channel-role-policy.changed
        preference.channel-role-policy.command-result
        preference.channel-role-policy.command-result-dlt
        preference.github-repo.setting.command
        preference.github-repo.setting.state
        preference.github-repo.setting.result
        preference.github-repo.setting.result-dlt
      KAFKA_COMPACTED_TOPICS: >-
        user.profile.event
        user.presence.event
        team.lifecycle
        team.member.event
        channel.member.event.v2
        channel.event.v2
        project.event.v2
        project.member.event.v2
        project.github-repo.event
        preference.channel-notification.changed
        preference.team-role.changed
        preference.channel-role-policy.changed
        preference.github-repo.setting.state
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for topic in $${KAFKA_TOPICS}; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:9092 \
            --create \
            --if-not-exists \
            --topic "$${topic}" \
            --partitions "$${KAFKA_TOPIC_PARTITIONS}" \
            --replication-factor "$${KAFKA_TOPIC_REPLICATION_FACTOR}"
        done
        for topic in $${KAFKA_COMPACTED_TOPICS}; do
          /opt/kafka/bin/kafka-configs.sh \
            --bootstrap-server kafka:9092 \
            --alter \
            --entity-type topics \
            --entity-name "$${topic}" \
            --add-config cleanup.policy=compact
        done

  kafka-ui:
    # The project does not publish immutable release tags consistently; pin the
    # verified multi-architecture image digest instead of following latest.
    image: provectuslabs/kafka-ui:v0.7.2@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    container_name: cowork-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: cowork-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"

  vault:
    image: hashicorp/vault:2.1.0@sha256:5520cc26271c024e6ffa45cdf95255bd26b70d71ba4b7e0bc18925bef4128adb
    container_name: cowork-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      SKIP_SETCAP: "true"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
      - SETFCAP
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:2.1.0@sha256:5520cc26271c024e6ffa45cdf95255bd26b70d71ba4b7e0bc18925bef4128adb
    container_name: cowork-vault-init
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://cowork-vault:8200
      VAULT_TOKEN: dev-root-token
      JWT_SECRET: ${JWT_SECRET}
      DATAGSM_CLIENT_ID: ${DATAGSM_CLIENT_ID}
      DATAGSM_WEBHOOK_SECRET: ${DATAGSM_WEBHOOK_SECRET:-}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfsadmin}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ACCOUNT_CREDENTIAL_ENCRYPTION_KEY: ${ACCOUNT_CREDENTIAL_ENCRYPTION_KEY}
      ACCOUNT_SHARE_OAUTH_STATE_SECRET: ${ACCOUNT_SHARE_OAUTH_STATE_SECRET}
      GITHUB_ACCOUNT_SHARE_CLIENT_ID: ${GITHUB_ACCOUNT_SHARE_CLIENT_ID:-}
      GITHUB_ACCOUNT_SHARE_CLIENT_SECRET: ${GITHUB_ACCOUNT_SHARE_CLIENT_SECRET:-}
      NOTION_ACCOUNT_SHARE_CLIENT_ID: ${NOTION_ACCOUNT_SHARE_CLIENT_ID:-}
      NOTION_ACCOUNT_SHARE_CLIENT_SECRET: ${NOTION_ACCOUNT_SHARE_CLIENT_SECRET:-}
      JIRA_ACCOUNT_SHARE_CLIENT_ID: ${JIRA_ACCOUNT_SHARE_CLIENT_ID:-}
      JIRA_ACCOUNT_SHARE_CLIENT_SECRET: ${JIRA_ACCOUNT_SHARE_CLIENT_SECRET:-}
      GOOGLE_ACCOUNT_SHARE_CLIENT_ID: ${GOOGLE_ACCOUNT_SHARE_CLIENT_ID:-}
      GOOGLE_ACCOUNT_SHARE_CLIENT_SECRET: ${GOOGLE_ACCOUNT_SHARE_CLIENT_SECRET:-}
      FACEBOOK_ACCOUNT_SHARE_CLIENT_ID: ${FACEBOOK_ACCOUNT_SHARE_CLIENT_ID:-}
      FACEBOOK_ACCOUNT_SHARE_CLIENT_SECRET: ${FACEBOOK_ACCOUNT_SHARE_CLIENT_SECRET:-}
      GITHUB_APP_INTERNAL_API_KEY: ${GITHUB_APP_INTERNAL_API_KEY:-}
      TEAM_GITHUB_STATE_SECRET: ${TEAM_GITHUB_STATE_SECRET}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG}
    volumes:
      - ./deploy/config/vault/seed-secrets.sh:/scripts/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/vault-init.sh"]

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: cowork-seaweedfs
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-seaweedfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-seaweedfsadmin}
    ports:
      - "9000:9000"
      - "9002:9333"
    volumes:
      - seaweedfs_data:/data
      - ./deploy/config/seaweedfs/s3-config.json.template:/etc/seaweedfs/s3-config.json.template:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        escape_sed() { printf '%s' "$$1" | sed -e 's/[\/&|]/\\&/g'; }
        sed -e "s|\$${S3_ACCESS_KEY}|$$(escape_sed "$$S3_ACCESS_KEY")|g" \
            -e "s|\$${S3_SECRET_KEY}|$$(escape_sed "$$S3_SECRET_KEY")|g" \
            /etc/seaweedfs/s3-config.json.template > /etc/seaweedfs/s3-config.json
        exec weed server -dir=/data -s3 \
          -s3.port=9000 \
          -s3.config=/etc/seaweedfs/s3-config.json \
          -master.port=9333 \
          -volume.port=8080 \
          -filer.port=8888
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs-init:
    image: amazon/aws-cli:2.36.46@sha256:eedfdcb56e9a1b02fabcf656977ca226f40860c6672aca41d435e036bc95a075
    container_name: cowork-seaweedfs-init
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-seaweedfsadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-seaweedfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-cowork-bucket}
    volumes:
      - ./deploy/config/seaweedfs/cors.json:/cors.json:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        aws --endpoint-url http://seaweedfs:9000 s3 mb "s3://$${S3_BUCKET}" || true
        aws --endpoint-url http://seaweedfs:9000 s3api put-bucket-cors \
          --bucket "$${S3_BUCKET}" --cors-configuration file:///cors.json

  elasticsearch:
    build:
      context: ./deploy/images/elasticsearch
      dockerfile: Dockerfile
    container_name: cowork-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: cowork-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    container_name: cowork-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret}
      LIVEKIT_USE_EXTERNAL_IP: ${LIVEKIT_USE_EXTERNAL_IP:-false}
    ports:
      - "7880:7880"
      - "7881:7881"
    volumes:
      - ./deploy/config/livekit/${LIVEKIT_CONFIG_FILE:-livekit.yaml}:/etc/livekit.yaml:ro
    command: --config /etc/livekit.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:7880 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5


  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    container_name: cowork-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./deploy/config/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      # The official Loki image is distroless and does not contain /bin/sh or wget.
      # Container liveness is provided by Docker; validate the loaded config without
      # depending on utilities that are absent from the production image.
      test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/local-config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    container_name: cowork-alloy
    restart: unless-stopped
    environment:
      ENV: ${SPRING_PROFILES_ACTIVE:-local}
    volumes:
      - ./deploy/config/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - cowork_logs:/var/log/cowork:ro
      - alloy_data:/var/lib/alloy
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: cowork-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./deploy/config/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: cowork-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/config/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/config/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./deploy/config/monitoring/prometheus/sd:/etc/prometheus/sd:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager-config-init:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    container_name: cowork-alertmanager-config-init
    restart: "no"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    volumes:
      - ./deploy/config/monitoring/alertmanager/alertmanager.yml:/source/alertmanager.yml:ro
      - ./deploy/config/monitoring/alertmanager/alertmanager-noop.yml:/source/alertmanager-noop.yml:ro
      - alertmanager_config:/generated
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        rm -f /generated/alertmanager.yml /generated/discord-webhook-url

        if [ -n "$${DISCORD_WEBHOOK_URL}" ]; then
          cp /source/alertmanager.yml /generated/alertmanager.yml
          printf '%s' "$${DISCORD_WEBHOOK_URL}" > /generated/discord-webhook-url
          chown 65534:65534 /generated/discord-webhook-url
          chmod 0400 /generated/discord-webhook-url
        elif [ "$${SPRING_PROFILES_ACTIVE}" = "local" ]; then
          cp /source/alertmanager-noop.yml /generated/alertmanager.yml
        else
          echo "DISCORD_WEBHOOK_URL is required outside the local profile" >&2
          exit 1
        fi

        chmod 0444 /generated/alertmanager.yml

  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    container_name: cowork-alertmanager
    restart: unless-stopped
    depends_on:
      alertmanager-config-init:
        condition: service_completed_successfully
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_config:/etc/alertmanager/generated:ro
    command:
      - '--config.file=/etc/alertmanager/generated/alertmanager.yml'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    container_name: cowork-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/config/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.20.0@sha256:abed8dac117b4ae5b70757f988e44795935b9a72c3b58d720c67ba688f8cb79e
    container_name: cowork-mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command:
      - "--mysqld.address=mysql:3306"
      - "--mysqld.username=root"
    depends_on:
      mysql:
        condition: service_healthy

  redis_exporter:
    image: oliver006/redis_exporter:v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    container_name: cowork-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  kafka_exporter:
    image: danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
    container_name: cowork-kafka-exporter
    restart: unless-stopped
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: cowork-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  mongodb_exporter:
