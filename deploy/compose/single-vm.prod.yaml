# Optional single-VM installation; NOT the multi-VM production CD entry point.
# Run through deploy/compose.sh single-vm-prod, never merge with the root local entry point.
# This model assumes all app/data services share one Docker network. External Vault is required.
services:
  # Production traffic enters through the Gateway (and LiveKit's dedicated
  # host-network listeners). Databases, brokers, caches, and ops UIs stay on
  # the private Compose network.
  mysql:
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

  postgres:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres

  mongodb:
    ports: !reset []
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}

  kafka:
    ports: !reset []

  kafka-ui:
    ports: !reset []

  seaweedfs:
    ports: !reset []
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}

  seaweedfs-init:
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}

  elasticsearch:
    ports: !reset []

  redis:
    ports: !reset []

  loki:
    ports: !reset []

  blackbox_exporter:
    ports: !reset []

  prometheus:
    ports: !reset []

  alertmanager:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}

  mysqld_exporter:
    ports: !reset []

  redis_exporter:
    ports: !reset []

  kafka_exporter:
    ports: !reset []

  postgres_exporter:
    ports: !reset []

  mongodb_exporter:
    ports: !reset []

  cowork-config:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-config:${IMAGE_TAG:?IMAGE_TAG is required}
    depends_on: !override
      logs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      VAULT_HOST: ${VAULT_HOST:?VAULT_HOST is required}
      VAULT_PORT: ${VAULT_PORT:-8200}
      VAULT_SCHEME: https
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://seaweedfs:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:?PUBLIC_WEB_ORIGIN is required}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
      GITHUB_APP_SERVICE_URL: ${GITHUB_APP_SERVICE_URL:?GITHUB_APP_SERVICE_URL is required}
      LIVEKIT_URL: ${LIVEKIT_URL:-http://cowork-livekit:7880}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:?LIVEKIT_WS_URL is required}
    ports: !reset []

  vault:
    profiles: [local-vault]
    ports: !reset []

  vault-init:
    profiles: [local-vault]

  cowork-gateway:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-gateway:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod

  cowork-authorization:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-authorization:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_PROFILE: prod
      EUREKA_USE_RUNTIME_HOSTNAME: "true"
    ports: !reset []

  cowork-preference:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-preference:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_USE_RUNTIME_HOSTNAME: "true"
    ports: !reset []

  cowork-user:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-user:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_PROFILE: prod
      EUREKA_USE_RUNTIME_HOSTNAME: "true"
    ports: !reset []

  cowork-team:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-team:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports: !reset []

  cowork-channel:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-channel:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports: !reset []

  cowork-notification:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-notification:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_PROFILE: prod
      EUREKA_USE_RUNTIME_HOSTNAME: "true"
    ports: !reset []

  cowork-chat:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-chat:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_PROFILE: prod
      EUREKA_USE_RUNTIME_HOSTNAME: "true"
    ports: !reset []

  cowork-voice:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-voice:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      APP_PROFILE: prod
      EUREKA_USE_RUNTIME_HOSTNAME: "true"
      # Host-networked LiveKit is not attached to the Compose network. Keep the
      # server-to-server API on the host gateway and return the public WSS URL
      # to clients.
      LIVEKIT_URL: ${LIVEKIT_URL:-http://host.docker.internal:7880}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:?LIVEKIT_WS_URL is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: !reset []

  cowork-project:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-project:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports: !reset []

  cowork-roadmap:
    container_name: !reset null
    build: !reset null
    image: ${REGISTRY:?REGISTRY is required}/cowork-roadmap:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports: !reset []

  alertmanager-config-init:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL is required}

  livekit:
    # LiveKit recommends host networking for production Docker deployments.
    # It avoids allocating a docker-proxy/NAT rule for every RTC UDP port.
    network_mode: host
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      LIVEKIT_USE_EXTERNAL_IP: "true"
    volumes:
      # Service-level environment variables cannot change Compose host-path
      # interpolation, so replace the common volume explicitly by mount target.
      - ./deploy/config/livekit/livekit-cloud.yaml:/etc/livekit.yaml:ro
    # Host networking exposes LiveKit's listeners directly. Remove the common
    # Compose port mappings and open 7880/tcp, 7881/tcp, 50000-60000/udp in
    # the host/cloud firewall instead.
    ports: !reset []
