name: ${STORAGE_PROJECT:?STORAGE_PROJECT is required}

x-seaweed: &seaweed
  image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
  user: "10001:10001"
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "5"}

services:
  seaweedfs:
    <<: *seaweed
    container_name: ${STORAGE_PROJECT}
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -master.port=9333
      - -master.telemetry=false
      - -master.volumeSizeLimitMB=1024
      - -volume.port=8080
      - -volume.max=8
      - -volume.minFreeSpace=2GiB
      - -filer.port=8888
      - -s3
      - -s3.port=9000
      - -s3.ip.bind=0.0.0.0
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -s3.config=/etc/seaweedfs/s3-config.json
      - -s3.iam=false
      - -s3.allowedOrigins=${PUBLIC_WEB_ORIGINS:?PUBLIC_WEB_ORIGINS is required}
      - -s3.autoCreateBucket=false
    ports:
      - "${STORAGE_BIND_IP:?STORAGE_BIND_IP is required}:9000:9000"
    networks: [runtime]
    mem_limit: ${STORAGE_MEMORY:?STORAGE_MEMORY is required}
    cpus: ${STORAGE_CPUS:?STORAGE_CPUS is required}
    pids_limit: 256
    labels:
      cowork.iam-digest: ${STORAGE_IAM_DIGEST:?STORAGE_IAM_DIGEST is required}
    volumes:
      - ./data:/data
      - ./config/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -qO- http://127.0.0.1:9000/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  seaweedfs-init:
    image: amazon/aws-cli:2.36.46@sha256:eedfdcb56e9a1b02fabcf656977ca226f40860c6672aca41d435e036bc95a075
    user: "10001:10001"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    network_mode: service:seaweedfs
    env_file: [./config/admin.env]
    environment:
      AWS_DEFAULT_REGION: ${S3_REGION:?S3_REGION is required}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      HOME: /tmp
      APP_CONFIG_PROFILE: prod
      S3_INTERNAL_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_BUCKET_POLICY_FILE: /storage-config/bucket-policy.json
      S3_BUCKET_LIFECYCLE_FILE: /storage-config/bucket-lifecycle.json
      PUBLIC_WEB_ORIGINS: ${PUBLIC_WEB_ORIGINS:?PUBLIC_WEB_ORIGINS is required}
    volumes:
      - ./scripts:/storage-config:ro
    entrypoint: [/bin/sh, /storage-config/configure-bucket.sh]

  seaweedfs-admin:
    <<: *seaweed
    container_name: ${STORAGE_PROJECT}-admin
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    network_mode: service:seaweedfs
    command: [admin, -master=127.0.0.1:9333, -ip=127.0.0.1, -dataDir=/data]
    volumes:
      - ./admin-data:/data

  seaweedfs-lifecycle:
    <<: *seaweed
    container_name: ${STORAGE_PROJECT}-lifecycle
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    network_mode: service:seaweedfs
    command: [worker, -admin=127.0.0.1:23646, -jobType=s3_lifecycle, -workingDir=/data, -metricsPort=9327, -metricsIp=127.0.0.1]
    volumes:
      - ./lifecycle-data:/data
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:9327/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  runtime:
    external: true
    name: ${STORAGE_RUNTIME_NETWORK:?STORAGE_RUNTIME_NETWORK is required}
