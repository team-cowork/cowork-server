# Run once on EACH application VM, regardless of where Loki is hosted.
# 호스트 지표도 VM마다 수집해야 하므로 같은 단위로 묶는다.
services:
  alloy:
    image: grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
    restart: unless-stopped
    user: "0:0"
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL:?Set a Loki URL reachable from this VM}
      LOG_HOST: ${LOG_HOST:?Set a stable VM identifier}
    volumes:
      - ./deploy/prod/log-agent/config.alloy:/etc/alloy/config.alloy:ro
      - ${DOCKER_CONTAINER_LOG_DIR:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - positions:/var/lib/alloy
    command: run --storage.path=/var/lib/alloy /etc/alloy/config.alloy
  node_exporter:
    image: prom/node-exporter:v1.10.2@sha256:3ac34ce007accad95afed72149e0d2b927b7e42fd1c866149b945b84737c62c3
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      # 컨테이너 레이어와 임시 파일시스템은 호스트 여유 공간이 아니므로 제외한다.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|overlay|squashfs|tmpfs|devtmpfs|nsfs|fuse\\..*)$$
    ports:
      # monitoring VM의 Prometheus가 사설망으로 수집한다.
      - ${NODE_EXPORTER_BIND_IP:?Set the private IPv4 address this VM advertises}:9100:9100
    volumes:
      - /:/host:ro,rslave
volumes:
  positions:
