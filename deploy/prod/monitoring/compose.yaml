# Independent monitoring VM. Infrastructure endpoints may be on different VMs.
services:
  monitoring-config-init:
    image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    user: '0:0'
    restart: 'no'
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL is required}
    volumes:
      - ./deploy/prod/monitoring/prepare-configs.sh:/prepare-configs.sh:ro
      - ./deploy/config/monitoring:/source:ro
      - ${MONITORING_PROMETHEUS_CONFIG:?MONITORING_PROMETHEUS_CONFIG is required}:/source-prometheus.json:ro
      - ${MONITORING_PROMETHEUS_CONFIG:?MONITORING_PROMETHEUS_CONFIG is required}.rules.json:/source-expected-rules.json:ro
      - loki_config:/generated/loki
      - blackbox_config:/generated/blackbox
      - prometheus_config:/generated/prometheus
      - alertmanager_config:/generated/alertmanager
    entrypoint: [/bin/sh, /prepare-configs.sh]
  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    ports:
      - ${MONITORING_BIND_IP:?MONITORING_BIND_IP is required}:3100:3100
    volumes:
      - loki_config:/etc/loki:ro
      - loki_data:/loki
    depends_on:
      monitoring-config-init:
        condition: service_completed_successfully
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test:
        - CMD
        - /usr/bin/loki
        - -verify-config
        - -config.file=/etc/loki/local-config.yaml
      interval: 10s
      timeout: 5s
      retries: 5
  blackbox_exporter:
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    volumes:
      - blackbox_config:/etc/blackbox_exporter:ro
    depends_on:
      monitoring-config-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    ports:
      - ${MONITORING_ADMIN_BIND_IP:-127.0.0.1}:9090:9090
    volumes:
      - prometheus_config:/etc/prometheus:ro
      - prometheus_data:/prometheus
    depends_on:
      monitoring-config-init:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9090/-/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
  alertmanager:
    image: prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    depends_on:
      monitoring-config-init:
        condition: service_completed_successfully
    ports:
      - ${MONITORING_ADMIN_BIND_IP:-127.0.0.1}:9093:9093
    volumes:
      - alertmanager_config:/etc/alertmanager/generated:ro
    command:
      - --config.file=/etc/alertmanager/generated/alertmanager.yml
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9093/-/ready || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    ports:
      - ${MONITORING_ADMIN_BIND_IP:-127.0.0.1}:3001:3000
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    depends_on:
      monitoring-config-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
  mysqld_exporter:
    image: prom/mysqld-exporter:v0.20.0@sha256:abed8dac117b4ae5b70757f988e44795935b9a72c3b58d720c67ba688f8cb79e
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?MYSQL_EXPORTER_PASSWORD is required}
    command:
      - --mysqld.address=${MYSQL_HOST:?MYSQL_HOST is required}:${MYSQL_PORT:-3306}
      - --mysqld.username=${MYSQL_EXPORTER_USER:?MYSQL_EXPORTER_USER is required}
  redis_exporter:
    image: oliver006/redis_exporter:v1.91.1@sha256:c67a432dba6b4ae30f471e3c77cf14a289133bbeeb89abb0bb03e6092efb2836
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    environment:
      REDIS_ADDR: redis://${REDIS_HOST:?REDIS_HOST is required}:${REDIS_PORT:-6379}
      REDIS_USER: ${REDIS_EXPORTER_USER:-}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:-}
  kafka_exporter:
    image: danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    command:
      - --kafka.server=${KAFKA_EXPORTER_SERVER:?Set one reachable broker host:port}
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    environment:
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?POSTGRES_EXPORTER_DSN is required}
  mongodb_exporter:
    image: percona/mongodb_exporter:0.53.0@sha256:0214e482b2cd4b1849f9f4dcef90d328a99ba3727dd1103e7da48b42060bcec1
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    environment:
      MONGODB_URI: ${MONGO_EXPORTER_URI:?MONGO_EXPORTER_URI is required}
    command: [--compatible-mode]
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:?Compose project name is required}-mtu1400
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: '1400'
      com.docker.network.bridge.name: br-cowork-mon
volumes:
  prometheus_data:
    external: true
    name: ${MONITORING_VOLUME_PREFIX:?Set the pre-created monitoring volume prefix}_prometheus_data
  grafana_data:
    external: true
    name: ${MONITORING_VOLUME_PREFIX:?Set the pre-created monitoring volume prefix}_grafana_data
  loki_data:
    external: true
    name: ${MONITORING_VOLUME_PREFIX:?Set the pre-created monitoring volume prefix}_loki_data
  alertmanager_config: {}
  loki_config: {}
  blackbox_config: {}
  prometheus_config: {}
