name: cowork-datastores

x-engine: &engine
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: 20m, max-file: "5"}

services:
  redis:
    <<: *engine
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    container_name: cowork-redis
    hostname: redis
    ports: ["${DATASTORE_BIND_IP:?DATASTORE_BIND_IP is required}:6379:6379"]
    networks: {datastores: {aliases: [redis]}}
    volumes:
      - {type: volume, source: redis_data, target: /data, volume: {nocopy: true}}
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch:
    <<: *engine
    image: ${ELASTICSEARCH_IMAGE:?ELASTICSEARCH_IMAGE is required}
    container_name: cowork-elasticsearch
    hostname: elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["${DATASTORE_BIND_IP:?DATASTORE_BIND_IP is required}:9200:9200"]
    networks: {datastores: {aliases: [elasticsearch]}}
    volumes:
      - {type: volume, source: elasticsearch_data, target: /usr/share/elasticsearch/data, volume: {nocopy: true}}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 30s

  kafka:
    <<: *engine
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    container_name: cowork-kafka
    hostname: kafka
    env_file: [{path: ./kafka.env, format: raw}]
    ports: ["${DATASTORE_BIND_IP:?DATASTORE_BIND_IP is required}:9094:9094"]
    networks: {datastores: {aliases: [kafka]}}
    volumes:
      - {type: volume, source: kafka_data, target: /var/lib/kafka/data, volume: {nocopy: true}}
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  redis_data: {external: true, name: cowork-prod-redis-data}
  elasticsearch_data: {external: true, name: cowork-prod-elasticsearch-data}
  kafka_data: {external: true, name: cowork-kafka-data-20261013-fresh}

networks:
  datastores: {external: true, name: cowork-server_default}
