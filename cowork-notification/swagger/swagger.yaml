basePath: /api/notification
definitions:
  github_com_cowork_cowork-notification_internal_apidoc.Error:
    properties:
      code:
        type: integer
      message:
        type: string
      status:
        type: string
    required:
    - code
    - message
    - status
    type: object
  internal_domain_installation.registerInstallationRequest:
    properties:
      fid:
        example: cXk9Y2Rl-ZWZnaGlqa2xt_
        type: string
      platform:
        enum:
        - IOS
        - ANDROID
        - WEB
        type: string
    type: object
info:
  contact: {}
  description: Firebase 설치를 계정에 연결하고 실시간 알림을 제공합니다.
  title: cowork Notification API
  version: "20261106.0"
paths:
  /notifications/installations:
    post:
      consumes:
      - application/json
      description: Firebase 설치 ID(FID)를 현재 계정에 등록합니다. 다른 계정에 등록된 FID는 현재 계정으로 이전합니다.
      parameters:
      - description: 설치 등록 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_installation.registerInstallationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 응답 본문 없음
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
        "500":
          description: 내부 서버 오류
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
      security:
      - BearerAuth: []
      summary: Firebase 설치 등록
      tags:
      - installations
  /notifications/installations/{fid}:
    delete:
      description: 로그아웃, 계정 전환 또는 FID 변경 시 현재 계정과 FID의 연결을 해제합니다.
      parameters:
      - description: Firebase installation ID
        in: path
        name: fid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 응답 본문 없음
        "400":
          description: 잘못된 요청
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
        "404":
          description: 설치 없음
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
        "500":
          description: 내부 서버 오류
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
      security:
      - BearerAuth: []
      summary: Firebase 설치 해제
      tags:
      - installations
  /notifications/stream:
    get:
      description: 연결되면 connected 이벤트를 보내고 이후 알림을 전송합니다. 연결을 유지하기 위해 30초마다 ping 주석을
        보냅니다. 같은 알림을 다시 받을 수 있으므로 eventId로 중복을 확인합니다.
      produces:
      - text/event-stream
      - application/json
      responses:
        "200":
          description: 'data: {eventId, type, title, body, channelId, teamId}'
          schema:
            type: string
        "401":
          description: 인증 실패
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
        "500":
          description: 서버에서 SSE를 지원하지 않음
          schema:
            $ref: '#/definitions/github_com_cowork_cowork-notification_internal_apidoc.Error'
      security:
      - BearerAuth: []
      summary: SSE 알림 스트림 구독
      tags:
      - notifications
securityDefinitions:
  BearerAuth:
    description: '"Bearer {access_token}" 형식으로 입력합니다.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
