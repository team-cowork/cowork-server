basePath: /api/notification
definitions:
  internal_domain_installation.registerInstallationRequest:
    properties:
      fid:
        example: cXk9Y2Rl-ZWZnaGlqa2xt_
        type: string
      platform:
        enum:
        - IOS
        - ANDROID
        - WEB
        type: string
    type: object
info:
  contact: {}
  description: Firebase 설치(FID) 관리 및 푸시 알림 서비스
  title: cowork Notification API
  version: "20261029.0"
paths:
  /notifications/installations:
    post:
      consumes:
      - application/json
      description: Firebase installation ID(FID)를 현재 계정에 등록합니다. 다른 계정이 소유한 FID면 현재
        계정으로 원자적으로 이전합니다
      parameters:
      - description: 사용자 ID (Gateway 주입)
        format: int64
        in: header
        name: X-User-Id
        required: true
        type: integer
      - description: 설치 등록 요청
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_domain_installation.registerInstallationRequest'
      responses:
        "201":
          description: Created
        "400":
          description: 잘못된 요청
          schema:
            type: string
        "401":
          description: 인증 실패
          schema:
            type: string
        "500":
          description: 내부 서버 오류
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Firebase 설치 등록
      tags:
      - installations
  /notifications/installations/{fid}:
    delete:
      description: 로그아웃, 계정 전환 또는 FID 변경 시 현재 계정과 FID의 연결을 해제합니다
      parameters:
      - description: 사용자 ID (Gateway 주입)
        format: int64
        in: header
        name: X-User-Id
        required: true
        type: integer
      - description: Firebase installation ID
        in: path
        name: fid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: 잘못된 요청
          schema:
            type: string
        "401":
          description: 인증 실패
          schema:
            type: string
        "404":
          description: 설치 없음
          schema:
            type: string
        "500":
          description: 내부 서버 오류
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Firebase 설치 해제
      tags:
      - installations
  /notifications/stream:
    get:
      description: 인증된 사용자의 실시간 알림 이벤트를 Server-Sent Events(SSE)로 스트리밍합니다. 30초마다 keepalive
        ping을 전송합니다. 같은 알림이 다시 전달될 수 있으므로(at-least-once) 클라이언트는 eventId로 중복을 제거합니다.
      parameters:
      - description: 사용자 ID (Gateway 주입)
        format: int64
        in: header
        name: X-User-Id
        required: true
        type: integer
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'data: {eventId, type, title, body, channelId, teamId}'
          schema:
            type: string
        "401":
          description: 인증 실패
          schema:
            type: string
        "500":
          description: SSE not supported
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: SSE 알림 스트림 구독
      tags:
      - notifications
securityDefinitions:
  BearerAuth:
    description: '"Bearer {access_token}" 형식으로 Gateway에 전달하세요.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
