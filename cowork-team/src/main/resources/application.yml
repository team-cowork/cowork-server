spring:
  reactor:
    context-propagation: auto
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
    admin:
      properties:
        # The broker has a fixed address; keep reconnecting without rebootstrap loops.
        metadata.recovery.strategy: none
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 30000
      retry.backoff.ms: 1000
      retry.backoff.max.ms: 10000
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_SSL_CA_LOCATION:}
  profiles:
    active: ${APP_CONFIG_PROFILE:prod}
  application:
    name: cowork-team
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:cowork}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness
  metrics:
    tags:
      application: ${spring.application.name}
kafka:
  outbox:
    relay-initial-delay-ms: 1000
    relay-delay-ms: 1000
    batch-size: 100
    claim-lease-ms: 30000
    send-timeout-ms: 10000
    max-attempts: 8
    backoff-initial-ms: 5000
    backoff-max-ms: 600000
sdk:
  logging:
    not-logging-urls:
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    enabled: true
  response:
    not-wrapping-urls:
    - /actuator/**
    - /v3/api-docs/**
    - /v3/api-docs
    - /swagger-ui/**
  swagger:
    enabled: true
    group: team
    paths-to-match:
    - /teams/**
server:
  port: 8085
team-github:
  state-secret: ${TEAM_GITHUB_STATE_SECRET}
  app-slug: ${COWORK_GITHUB_APP_SLUG}
projection:
  readiness:
    poll-interval-ms: 1000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
spring.cloud.aws:
  region:
    static: ${S3_REGION:ap-northeast-2}
  credentials:
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  s3:
    endpoint: ${S3_INTERNAL_ENDPOINT:http://localhost:9000}
    path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:true}
object-storage:
  bucket: ${S3_BUCKET:cowork-bucket}
  public-api-base-url: ${PUBLIC_API_BASE_URL}
  presigned-put-expiry-minutes: 10
  max-file-size-bytes: 1048576
  allowed-content-types:
  - image/jpeg
  - image/png
  - image/webp
