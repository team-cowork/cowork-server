spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
    admin:
      properties:
        # The broker has a fixed address; keep reconnecting without rebootstrap loops.
        metadata.recovery.strategy: none
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 30000
      retry.backoff.ms: 1000
      retry.backoff.max.ms: 10000
      security.protocol: ${KAFKA_SECURITY_PROTOCOL}
  profiles:
    active: ${APP_CONFIG_PROFILE}
  application:
    name: cowork-team
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness
  metrics:
    tags:
      application: ${spring.application.name}
kafka:
  outbox:
    relay-initial-delay-ms: 1000
    relay-delay-ms: 1000
    batch-size: 100
    claim-lease-ms: 30000
    send-timeout-ms: 10000
    max-attempts: 8
    backoff-initial-ms: 5000
    backoff-max-ms: 600000
sdk:
  logging:
    not-logging-urls:
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    enabled: true
  response:
    enabled: false
  swagger:
    enabled: true
    group: team
    paths-to-match:
    - /teams/**
  exception:
    enabled: false
server:
  port: 8085
team-github:
  state-secret: ${TEAM_GITHUB_STATE_SECRET}
  app-slug: ${COWORK_GITHUB_APP_SLUG}
projection:
  readiness:
    poll-interval-ms: 1000
springdoc:
  api-docs:
    # TODO: Set version to openapi_3_2 and update the OpenAPI version to 3.2.1 when springdoc-openapi supports it.
    #  springdoc 3.2.0 offers only openapi_3_0 and openapi_3_1, because swagger-core models only OpenAPI 3.0 and 3.1
    #  (https://github.com/swagger-api/swagger-core/issues/5181).
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
spring.cloud.aws:
  region:
    static: ${S3_REGION}
  credentials:
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
  s3:
    endpoint: ${S3_INTERNAL_ENDPOINT}
    path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:true}
object-storage:
  bucket: ${S3_BUCKET}
  public-api-base-url: ${PUBLIC_API_BASE_URL}
  presigned-put-expiry-minutes: 10
  max-file-size-bytes: 1048576
  allowed-content-types:
  - image/jpeg
  - image/png
  - image/webp
