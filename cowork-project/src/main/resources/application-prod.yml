server:
  port: ${PORT:8084}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cowork_project}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:${MYSQL_USER:cowork}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness

projection:
  readiness:
    poll-interval-ms: 1000
