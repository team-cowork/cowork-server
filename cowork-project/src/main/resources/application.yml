server:
  port: 8084

spring:
  profiles:
    active: ${APP_CONFIG_PROFILE:local}
  cloud:
    config:
      username: ${CONFIG_CLIENT_USERNAME}
      password: ${CONFIG_CLIENT_PASSWORD}
    openfeign:
      client:
        config:
          cowork-github:
            connect-timeout: 3000
            read-timeout: 10000
  application:
    name: cowork-project
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8761}"
  jackson:
    mapper:
      accept-case-insensitive-enums: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cowork_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:cowork}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      auto-offset-reset: earliest

github:
  internal-api-key: ${COWORK_GITHUB_INTERNAL_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    metadata-map:
      prometheus.scrape: "true"
      prometheus.path: /actuator/prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

sdk:
  logging:
    enabled: true
    not-logging-urls:
      - "/actuator/**"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
  response:
    enabled: false
  swagger:
    enabled: true
    group: "project"
    paths-to-match:
      - "/projects/**"
      - "/teams/**"
  exception:
    enabled: false
