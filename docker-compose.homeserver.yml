# 홈서버(맥 미니) 단독 배포용 오버라이드.
# cowork-project만 독립 환경으로 띄울 때 사용한다.
# 사용: docker compose -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.homeserver.yml up -d --build cowork-project
#
# 이 서버에는 다른 프로젝트들이 이미 mysql(3306), redis(6379), minio(9000-9001) 등을
# 호스트 포트로 점유하고 있다. mysql은 docker-compose.yml에서 MYSQL_HOST_PORT
# 환경변수로 포트를 뺄 수 있게 해뒀으니 .env에 MYSQL_HOST_PORT=3307 처럼 지정한다
# (docker compose가 ports 목록을 파일 간에 병합(추가)하는 방식이라, 여기서 포트를
# 다시 매핑하면 base 설정이 사라지는 게 아니라 두 매핑이 겹쳐 충돌한다).
# kafka의 EXTERNAL 리스너 호스트 포트(9094)도 같은 이유로 KAFKA_EXTERNAL_HOST_PORT
# 환경변수로 뺐다 — 이 홈서버에서는 9094가 lsof/docker 어디에도 안 잡히는데도
# Docker Desktop 내부적으로 계속 "address already in use"가 나서(재현되는 좀비
# 포트) .env에서 다른 값(예: 19094)으로 지정한다. 우리 배포에서는 project/config가
# kafka와 내부 네트워크(kafka:9092)로만 통신하므로 EXTERNAL 리스너를 호스트에 열
# 필요 자체가 없다.
# 그 외 외부에 노출할 필요가 없는 포트는 127.0.0.1에만 바인딩한다. 공개 진입점은
# nginx가 cowork-project 포트(8089)만 리버스 프록시한다.
#
# 참고: 같은 이유로 base docker-compose.yml의 vault 포트(0.0.0.0:8200)도 이
# 오버라이드로는 제거할 수 없다. 홈서버가 라우터 NAT 뒤에 있고 80/443만
# 포워딩되어 있어 LAN 밖에서는 접근 불가하지만, 완전히 막고 싶다면 base 파일의
# vault ports를 직접 수정해야 한다.
services:
  kafka:
    environment:
      # 단일 노드 KRaft(broker+controller 겸용)라 controller quorum voter는
      # 결국 자기 자신이다. 서비스명(kafka)으로 자기 자신을 가리키면 컨테이너가
      # 네트워크에 완전히 붙기 전에 자기 자신을 DNS로 조회하다 UnknownHostException으로
      # 죽었다 재시작하는 루프에 빠졌다(이 홈서버에서 재시작 57회 관측). localhost로
      # 바꿔 자기 자신에 대한 DNS 의존을 없앴다.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    healthcheck:
      interval: 20s
      timeout: 30s
      start_period: 120s
      retries: 10

  cowork-config:
    ports:
      - "127.0.0.1:8761:8761"

  cowork-project:
    ports:
      - "127.0.0.1:8089:8084"
