spring:
  application:
    name: cowork-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cowork?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:cowork}
    password: ${DB_PASSWORD:cowork}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

cowork:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-key-must-be-at-least-32-bytes}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
  datagsm:
    client-id: ${DATAGSM_CLIENT_ID:}
    token-url: ${DATAGSM_TOKEN_URL:}
    user-info-url: ${DATAGSM_USERINFO_URL:}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}
    region: ${STORAGE_REGION:ap-northeast-2}
    bucket: ${STORAGE_BUCKET:cowork}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
  preference:
    status-expiry-interval: PT1M
  firebase:
    credentials-path: ${FCM_CREDENTIALS_PATH:}
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:local-development-livekit-secret-32bytes}
