name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(add|update|fix|refactor|docs|test|ci/cd)\((global|authorization|user|team|project|channel|chat|preference|notification|voice|ci/cd)\): .+'
          if ! echo "$TITLE" | grep -Eq "$pattern"; then
            echo "PR 제목은 'type(scope): 설명' 형식이어야 합니다: $TITLE"
            exit 1
          fi
