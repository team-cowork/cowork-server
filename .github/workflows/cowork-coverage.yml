name: cowork PR Coverage Workflow

on:
  workflow_call:

jobs:
  coverage-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout PR Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Define Coverage Inventory and Runner
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-tools"
          cat > "$RUNNER_TEMP/coverage-tools/modules.json" <<'COVERAGE_MODULES_JSON_0'
          {
            "modules": [
              {"module": "cowork-gateway", "runner": "gradle", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-config", "runner": "gradle", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-channel", "runner": "gradle", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-team", "runner": "gradle", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-roadmap", "runner": "gradle", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-project", "runner": "maven", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-preference", "runner": "amper", "metric": "line", "format": "jacoco", "report": "report.xml"},
              {"module": "cowork-authorization", "runner": "go", "metric": "statement", "format": "go", "report": "report.out"},
              {"module": "cowork-notification", "runner": "go", "metric": "statement", "format": "go", "report": "report.out"},
              {"module": "cowork-voice", "runner": "go", "metric": "statement", "format": "go", "report": "report.out"},
              {"module": "cowork-chat", "runner": "jest", "metric": "line", "format": "istanbul", "report": "report.json"},
              {"module": "cowork-user", "runner": "elixir", "metric": "line", "format": "counts", "report": "report.json"},
              {"module": "cowork-promotion", "runner": "node", "metric": "line", "format": "istanbul", "report": "report.json"}
            ],
            "excluded": [
              {"module": "cowork-monitoring", "reason": "설정 전용 모듈 — 실행 코드 없음"}
            ]
          }
          COVERAGE_MODULES_JSON_0
          cat > "$RUNNER_TEMP/coverage-tools/run.py" <<'COVERAGE_RUN_PY_1'
          #!/usr/bin/env python3
          """Run identical coverage tooling against either source checkout."""

          import argparse
          import json
          import subprocess
          import sys
          from pathlib import Path

          TOOLS = Path(__file__).resolve().parent


          def build_matrix(manifest, source):
              registered = [entry["module"] for entry in manifest["modules"] + manifest["excluded"]]
              if len(set(registered)) != len(registered):
                  raise ValueError("Duplicate coverage module registration")
              discovered = {path.name for path in source.glob("cowork-*") if path.is_dir()}
              unknown = discovered - set(registered)
              if unknown:
                  raise ValueError(f"Register coverage for new modules in .github/workflows/cowork-coverage.yml: {', '.join(sorted(unknown))}")
              return {"include": [
                  {"module": entry["module"], "runner": entry["runner"], "snapshot": snapshot}
                  for entry in manifest["modules"]
                  for snapshot in ("base", "pr")
              ]}


          def measure(entry, snapshot, source, output):
              if not source.is_dir():
                  raise ValueError(f"Source checkout does not exist: {source}")
              output.mkdir(parents=True, exist_ok=True)
              report = output / entry["report"]
              result = output / "result.json"
              # Never reuse a previous measurement, even when a local output directory is reused.
              report.unlink(missing_ok=True)
              result.unlink(missing_ok=True)
              collect = [
                  sys.executable, str(TOOLS / "report.py"), "collect",
                  "--module", entry["module"], "--snapshot", snapshot,
                  "--format", entry["format"], "--metric", entry["metric"],
                  "--input", str(report), "--output", str(result),
              ]
              if not (source / entry["module"]).is_dir():
                  return subprocess.run(collect + ["--absent"], check=False).returncode

              adapter = "run-jvm.sh" if entry["runner"] in {"gradle", "maven", "amper"} else "run-native.sh"
              completed = subprocess.run([
                  "bash", str(TOOLS / adapter), entry["runner"], entry["module"], str(source), str(output),
              ], check=False)
              exit_code = completed.returncode if completed.returncode >= 0 else 128 - completed.returncode
              normalized = subprocess.run(collect + ["--exit-code", str(exit_code)], check=False)
              return exit_code or normalized.returncode


          def main():
              parser = argparse.ArgumentParser(description=__doc__)
              commands = parser.add_subparsers(dest="command", required=True)
              matrix = commands.add_parser("matrix")
              matrix.add_argument("--source", type=Path, required=True)
              run = commands.add_parser("measure")
              run.add_argument("--module", required=True)
              run.add_argument("--snapshot", choices=["base", "pr"], required=True)
              run.add_argument("--source", type=Path, required=True)
              run.add_argument("--output", type=Path, required=True)
              args = parser.parse_args()
              manifest = json.loads((TOOLS / "modules.json").read_text())
              if args.command == "matrix":
                  print(json.dumps(build_matrix(manifest, args.source.resolve()), separators=(",", ":")))
                  return 0
              entries = {entry["module"]: entry for entry in manifest["modules"]}
              if args.module not in entries:
                  parser.error(f"Unregistered module: {args.module}")
              return measure(entries[args.module], args.snapshot, args.source.resolve(), args.output.resolve())


          if __name__ == "__main__":
              sys.exit(main())
          COVERAGE_RUN_PY_1
      - name: Define JVM Measurement
        run: |
          cat > "$RUNNER_TEMP/coverage-tools/jacoco.init.gradle" <<'COVERAGE_JACOCO_INIT_GRADLE_0'
          import org.gradle.api.tasks.testing.Test
          import org.gradle.testing.jacoco.plugins.JacocoPluginExtension
          import org.gradle.testing.jacoco.plugins.JacocoTaskExtension
          import org.gradle.testing.jacoco.tasks.JacocoReport

          // Kept outside the measured checkout so base and PR use identical instrumentation.
          def coverageModule = gradle.startParameter.projectProperties['coverageModule']
          def coverageOutput = gradle.startParameter.projectProperties['coverageOutput']
          if (!coverageModule || !coverageOutput) {
              throw new GradleException('coverageModule and coverageOutput are required')
          }

          gradle.beforeProject { project ->
              if (project.path != ":${coverageModule}") {
                  return
              }
              // Maven and Amper wrapper projects have only the base plugin and must stay untouched.
              project.pluginManager.withPlugin('java') {
                  project.pluginManager.apply('jacoco')
                  project.extensions.configure(JacocoPluginExtension) { jacoco ->
                      jacoco.toolVersion = '0.8.14'
                  }
                  def executionFile = new File(coverageOutput, 'jacoco.exec')
                  def testTask = project.tasks.named('test', Test) { test ->
                      test.ignoreFailures = false
                      test.outputs.upToDateWhen { false }
                      test.outputs.cacheIf { false }
                      test.extensions.configure(JacocoTaskExtension) { jacoco ->
                          jacoco.destinationFile = executionFile
                      }
                  }
                  project.tasks.register('coworkCoverageReport', JacocoReport) { report ->
                      report.dependsOn(testTask)
                      report.executionData(executionFile)
                      report.sourceSets(project.extensions.getByName('sourceSets').main)
                      report.reports.xml.required = true
                      report.reports.xml.outputLocation = new File(coverageOutput, 'report.xml')
                      report.reports.html.required = false
                      report.reports.csv.required = false
                  }
              }
          }
          COVERAGE_JACOCO_INIT_GRADLE_0
          cat > "$RUNNER_TEMP/coverage-tools/run-jvm.sh" <<'COVERAGE_RUN_JVM_SH_1'
          #!/usr/bin/env bash
          set -euo pipefail

          if [[ $# -ne 4 ]]; then
            echo 'Usage: run-jvm.sh <gradle|maven|amper> <module> <absolute-source-root> <absolute-output-dir>' >&2
            exit 2
          fi

          runner=$1
          module=$2
          [[ $3 = /* && $4 = /* ]] || { echo 'Source and output paths must be absolute.' >&2; exit 2; }
          source_root=$(cd "$3" && pwd -P)
          output=$(cd "$4" && pwd -P)
          script_dir=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd -P)

          case "$runner:$module" in
            gradle:cowork-gateway|gradle:cowork-config|gradle:cowork-channel|gradle:cowork-team|gradle:cowork-roadmap) ;;
            maven:cowork-project|amper:cowork-preference) ;;
            *) echo "Unsupported JVM runner/module: $runner/$module" >&2; exit 2 ;;
          esac

          module_dir="$source_root/$module"
          [[ -d "$module_dir" ]] || { echo "Module is absent: $module" >&2; exit 1; }
          case "$output/" in
            "$module_dir/build/"*|"$module_dir/target/"*)
              echo 'Coverage output must be outside the cleaned build/target directory.' >&2
              exit 2
              ;;
          esac

          # Clear prior data, then allow the agent to append coverage from every test JVM.
          # A previous report must never turn a failed or skipped measurement into a success.
          rm -f "$output/report.xml" "$output/jacoco.exec"

          validate_tests() {
            python3 - "$1" <<'PY'
          import sys
          from pathlib import Path
          from xml.etree import ElementTree as ET

          directory = Path(sys.argv[1])
          reports = list(directory.glob('TEST-*.xml'))
          if not reports:
              raise SystemExit(f'No fresh JUnit reports found in {directory}')
          tests = failures = errors = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              if root.tag != 'testsuite':
                  raise SystemExit(f'Unexpected JUnit report format: {report}')
              tests += int(root.get('tests', '0'))
              failures += int(root.get('failures', '0'))
              errors += int(root.get('errors', '0'))
              skipped += int(root.get('skipped', '0'))
          if failures or errors or tests <= skipped:
              raise SystemExit(f'Incomplete test run: {tests} tests, {failures} failures, {errors} errors, {skipped} skipped')
          print(f'Validated {tests} tests ({skipped} skipped), no failures or errors.')
          PY
          }

          # Pin both version and SHA-256; the shared cache lives outside either source checkout.
          download_jacoco() {
            local artifact=$1 classifier=$2 checksum=$3 destination=$4
            if [[ -f "$destination" ]] && verify_sha256 "$destination" "$checksum"; then
              return
            fi
            local temporary
            temporary=$(mktemp "${destination}.XXXXXX")
            if ! curl --fail --silent --show-error --location --retry 3 \
              "https://repo.maven.apache.org/maven2/org/jacoco/$artifact/0.8.14/$artifact-0.8.14-$classifier.jar" \
              --output "$temporary"; then
              rm -f "$temporary"
              return 1
            fi
            if ! verify_sha256 "$temporary" "$checksum"; then
              echo "JaCoCo checksum mismatch: $artifact" >&2
              rm -f "$temporary"
              return 1
            fi
            mv "$temporary" "$destination"
          }

          verify_sha256() {
            python3 - "$1" "$2" <<'PY'
          import hashlib
          import sys
          from pathlib import Path
          sys.exit(0 if hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest() == sys.argv[2] else 1)
          PY
          }

          case "$runner" in
            gradle)
              cd "$source_root"
              gradle_args=(--no-daemon --console=plain --no-build-cache --no-configuration-cache
                --init-script "$script_dir/jacoco.init.gradle"
                "-PcoverageModule=$module" "-PcoverageOutput=$output"
                ":$module:clean" ":$module:coworkCoverageReport")
              if [[ "$module" == cowork-roadmap ]]; then
                # compileJava depends on a formatter that writes source files; coverage must not.
                gradle_args+=(-x :cowork-roadmap:spotlessApply)
              fi
              bash ./gradlew "${gradle_args[@]}"
              validate_tests "$module_dir/build/test-results/test"
              ;;
            maven)
              cd "$module_dir"
              bash ./mvnw --batch-mode --no-transfer-progress \
                -Dmaven.test.skip=false -DskipTests=false -Dmaven.test.failure.ignore=false -DfailIfNoTests=true \
                "-Djacoco.destFile=$output/jacoco.exec" "-Djacoco.dataFile=$output/jacoco.exec" \
                -Djacoco.append=true \
                clean org.jacoco:jacoco-maven-plugin:0.8.14:prepare-agent \
                test org.jacoco:jacoco-maven-plugin:0.8.14:report
              validate_tests "$module_dir/target/surefire-reports"
              cp "$module_dir/target/site/jacoco/jacoco.xml" "$output/report.xml"
              ;;
            amper)
              kotlin_cli=${KOTLIN_CLI:-kotlin}
              if ! "$kotlin_cli" --version | grep -Eq 'version 0\.11\.0([[:space:]]|$)'; then
                echo 'Coverage requires Kotlin Toolchain (Amper) 0.11.0.' >&2
                exit 1
              fi
              tools_dir=${COVERAGE_TOOLS_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/cowork-coverage}/jacoco-0.8.14
              mkdir -p "$tools_dir"
              tools_dir=$(cd "$tools_dir" && pwd -P)
              agent="$tools_dir/jacocoagent.jar"
              cli="$tools_dir/jacococli.jar"
              download_jacoco org.jacoco.agent runtime \
                3fb76eea65f81bd9415202bab34b6571728841dff1ab8e6bbe81adc2e299face "$agent"
              download_jacoco org.jacoco.cli nodeps \
                811c7f8c6b358c5d68a8973cfa867f6892be7a671b697a4b13c4b447e6daf75c "$cli"
              cd "$module_dir"
              "$kotlin_cli" clean
              "$kotlin_cli" test --jvm-args="\"-javaagent:$agent=destfile=$output/jacoco.exec,append=true\""
              validate_tests "$module_dir/build/reports/$module/jvm"
              classes="$module_dir/build/artifacts/CompiledJvmArtifact/${module}jvm"
              # Amper 0.11.0 separates main and test artifacts. Never scan the test artifact.
              python3 - "$classes/kotlin-output" <<'PY'
          import sys
          from pathlib import Path
          if not any(Path(sys.argv[1]).rglob('*.class')):
              raise SystemExit(f'Amper production classes not found at {sys.argv[1]}')
          PY
              class_args=(--classfiles "$classes/kotlin-output")
              if [[ -d "$classes/java-output" ]]; then
                class_args+=(--classfiles "$classes/java-output")
              fi
              java -jar "$cli" report "$output/jacoco.exec" \
                "${class_args[@]}" --sourcefiles "$module_dir/src/main/kotlin" \
                --name "$module" --xml "$output/report.xml"
              ;;
          esac

          [[ -s "$output/jacoco.exec" && -s "$output/report.xml" ]] || {
            echo 'JaCoCo execution data or XML report is missing.' >&2
            exit 1
          }
          COVERAGE_RUN_JVM_SH_1
      - name: Define Native Measurement
        run: |
          cat > "$RUNNER_TEMP/coverage-tools/export-elixir.exs" <<'COVERAGE_EXPORT_ELIXIR_EXS_0'
          # Read Mix's exported OTP coverage without loading or starting the application.
          [input_path, output_path] = System.argv()
          {:ok, _pid} = :cover.start()
          :ok = :cover.import(String.to_charlist(input_path))
          # An import-only process has no locally cover-compiled modules. Pass the import
          # list explicitly instead of relying on analyse/2's implicit module selection.
          {:result, results, failures} = :cover.analyse(:cover.imported_modules(), :coverage, :line)

          if failures != [] do
            raise "Unable to analyse every exported module: #{inspect(failures)}"
          end

          # Match Mix's line-counting rules: line 0 is generated code, repeated entries
          # for a module/line count once, and any covered entry makes that line covered.
          lines =
            Enum.reduce(results, %{}, fn
              {{_module, 0}, _coverage}, acc ->
                acc

              {{module, line}, {covered, missed}}, acc
              when is_integer(line) and line > 0 and is_integer(covered) and covered >= 0 and
                     is_integer(missed) and missed >= 0 ->
                Map.update(acc, {module, line}, covered > 0, &(&1 or covered > 0))

              entry, _acc ->
                raise "Unexpected OTP coverage entry: #{inspect(entry)}"
            end)

          covered = Enum.count(lines, fn {_line, was_covered} -> was_covered end)
          total = map_size(lines)

          if total == 0 do
            raise "The export contains no executable application lines"
          end

          # No JSON dependency is required for these validated integer counts.
          File.write!(output_path, "{\"covered\":#{covered},\"total\":#{total}}\n")
          :ok = :cover.stop()
          COVERAGE_EXPORT_ELIXIR_EXS_0
          cat > "$RUNNER_TEMP/coverage-tools/run-native.sh" <<'COVERAGE_RUN_NATIVE_SH_1'
          #!/usr/bin/env bash
          # Native reports share the PR's measurement settings across both source revisions.
          set -euo pipefail

          if [[ $# -ne 4 ]]; then
            echo "Usage: $0 <go|jest|node|elixir> <module> <absolute-source-root> <absolute-output-dir>" >&2
            exit 2
          fi

          runner=$1
          module=$2
          source_root=$3
          output_dir=$4
          tool_dir=$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)

          case "$source_root:$output_dir" in
            /*:/*) ;;
            *) echo "Source and output directories must be absolute paths." >&2; exit 2 ;;
          esac
          case "$runner:$module" in
            go:cowork-authorization|go:cowork-notification|go:cowork-voice|jest:cowork-chat|node:cowork-promotion|elixir:cowork-user) ;;
            *) echo "Unsupported coverage runner/module: $runner/$module" >&2; exit 2 ;;
          esac

          mkdir -p "$output_dir"
          rm -f "$output_dir/report.json" "$output_dir/report.out" \
            "$output_dir/raw-go.out" "$output_dir/coverage-summary.json" \
            "$output_dir/coverage.coverdata"
          cd "$source_root/$module"

          case "$runner" in
            go)
              go test -coverpkg=./... -covermode=atomic -coverprofile="$output_dir/raw-go.out" ./...
              # Swagger's generated registration code is not application code. Keep the
              # unfiltered profile as evidence; the canonical profile excludes only it.
              awk 'NR == 1 || $1 !~ /\/docs\/docs\.go:/' \
                "$output_dir/raw-go.out" > "$output_dir/report.out"
              ;;
            jest)
              npm ci --no-audit --no-fund
              npm run test:cov -- --runInBand \
                --rootDir="$source_root/$module/src" \
                --coverageDirectory="$output_dir" \
                --coverageReporters=json-summary --coverageReporters=text-summary \
                --coverageThreshold='{}' \
                --collectCoverageFrom='**/*.{ts,js}' \
                --collectCoverageFrom='!**/*.{spec,test}.{ts,js}' \
                --collectCoverageFrom='!**/*.d.ts' \
                --collectCoverageFrom='!**/__tests__/**' \
                --collectCoverageFrom='!**/node_modules/**' \
                --collectCoverageFrom='!**/generated/**'
              cp "$output_dir/coverage-summary.json" "$output_dir/report.json"
              ;;
            node)
              npm ci --no-audit --no-fund
              coverage_temp=$(mktemp -d "${TMPDIR:-/tmp}/cowork-c8.XXXXXX")
              trap 'rm -rf "$coverage_temp"' EXIT
              # An explicit configuration prevents either checkout's local c8/nyc config
              # from changing the measurement. --all includes files never loaded by tests.
              printf '{}\n' > "$coverage_temp/config.json"
              npm exec --yes --package=c8@12.0.0 -- c8 \
                --config="$coverage_temp/config.json" \
                --all --src=src --src=scripts \
                --include='src/**/*.{js,mjs,cjs,ts}' --include='scripts/**/*.{js,mjs,cjs,ts}' \
                --exclude='**/*.{spec,test}.{js,mjs,cjs,ts}' \
                --exclude='**/*.d.ts' --exclude='**/node_modules/**' \
                --exclude='**/generated/**' --exclude='**/__tests__/**' \
                --check-coverage=false \
                --reporter=json-summary --reporter=text-summary \
                --reports-dir="$output_dir" --temp-directory="$coverage_temp/v8" \
                npm test
              cp "$output_dir/coverage-summary.json" "$output_dir/report.json"
              ;;
            elixir)
              export MIX_ENV=test
              mix local.hex --force
              mix local.rebar --force
              mix deps.get
              # Exporting skips Mix's default 90% summary threshold. --no-start preserves
              # the existing test suite's isolation from databases, Kafka, and services.
              rm -f cover/coverage.coverdata
              test_status=0
              mix test --no-start --cover --export-coverage coverage || test_status=$?
              if [[ -f cover/coverage.coverdata ]]; then
                cp cover/coverage.coverdata "$output_dir/coverage.coverdata"
              fi
              if [[ "$test_status" -ne 0 ]]; then
                exit "$test_status"
              fi
              elixir "$tool_dir/export-elixir.exs" \
                "$output_dir/coverage.coverdata" "$output_dir/report.json"
              ;;
          esac
          COVERAGE_RUN_NATIVE_SH_1
      - name: Define Coverage Parsers
        run: |
          cat > "$RUNNER_TEMP/coverage-tools/report.py" <<'COVERAGE_REPORT_PY_0'
          #!/usr/bin/env python3
          """Normalize native coverage reports and render the PR coverage comment.

          Only Python's standard library is required. Coverage results deliberately retain
          integer counts; percentages and percentage-point changes are rounded at display
          time, after aggregation and subtraction.
          """

          from __future__ import annotations

          import argparse
          from dataclasses import dataclass
          from decimal import Decimal, ROUND_HALF_UP, localcontext
          import html
          import json
          from pathlib import Path
          import re
          from typing import Any
          from urllib.parse import urlencode
          import xml.etree.ElementTree as ET


          MARKER = "<!-- coverage-report-bot -->"
          STATUSES = {"ok", "failed", "missing", "absent"}
          METRICS = {"line", "statement"}
          SNAPSHOTS = {"base", "pr"}


          class CoverageError(ValueError):
              """A report cannot be interpreted without inventing coverage counts."""


          def integer(value: Any, name: str) -> int:
              if isinstance(value, str) and re.fullmatch(r"[0-9]+", value):
                  return int(value)
              if type(value) is int and value >= 0:
                  return value
              raise CoverageError(f"{name} must be a non-negative integer")


          def counts(covered: Any, total: Any) -> tuple[int, int]:
              if type(covered) is not int or type(total) is not int:
                  raise CoverageError("covered and total must be JSON integers")
              covered = integer(covered, "covered")
              total = integer(total, "total")
              if covered > total:
                  raise CoverageError("covered exceeds total")
              return covered, total


          def read_json(path: Path) -> Any:
              def unique_object(pairs: list[tuple[str, Any]]) -> dict[str, Any]:
                  result: dict[str, Any] = {}
                  for key, value in pairs:
                      if key in result:
                          raise CoverageError(f"duplicate JSON key: {key}")
                      result[key] = value
                  return result

              return json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)


          def parse_jacoco(path: Path) -> tuple[int, int]:
              root = ET.parse(path).getroot()
              if root.tag != "report":
                  raise CoverageError("JaCoCo document root must be report")
              # Package/class/method counters repeat the same lines. Only the direct
              # report-level counter is the aggregate for the entire module.
              counters = [counter for counter in root.findall("counter") if counter.get("type") == "LINE"]
              if len(counters) != 1:
                  raise CoverageError("JaCoCo must contain exactly one report-level LINE counter")
              covered = integer(counters[0].get("covered"), "covered")
              missed = integer(counters[0].get("missed"), "missed")
              return covered, covered + missed


          def parse_go(path: Path) -> tuple[int, int]:
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0].strip() not in {"mode: set", "mode: count", "mode: atomic"}:
                  raise CoverageError("Go profile has no valid mode header")
              blocks: dict[tuple[str, tuple[int, int], tuple[int, int]], tuple[int, bool]] = {}
              pattern = re.compile(r"(.+):([0-9]+)\.([0-9]+),([0-9]+)\.([0-9]+)\s+([0-9]+)\s+([0-9]+)")
              for index, line in enumerate(lines[1:], 2):
                  if not line.strip():
                      continue
                  match = pattern.fullmatch(line.strip())
                  if match is None:
                      raise CoverageError(f"invalid Go coverage block at line {index}")
                  filename = match[1]
                  start = (int(match[2]), int(match[3]))
                  end = (int(match[4]), int(match[5]))
                  statements, executions = int(match[6]), int(match[7])
                  if min(*start, *end) <= 0 or start > end or (start == end and statements != 0):
                      raise CoverageError(f"invalid Go source range at line {index}")
                  key = (filename, start, end)
                  if key in blocks:
                      old_statements, old_covered = blocks[key]
                      if old_statements != statements:
                          raise CoverageError("repeated Go block has inconsistent statement counts")
                      blocks[key] = (statements, old_covered or executions > 0)
                  else:
                      blocks[key] = (statements, executions > 0)

              covered = total = 0
              # -coverpkg can emit the same source block from several test binaries.
              # Match Go's profile parser: merge identical locations, then sum NumStmt
              # for distinct blocks even when their displayed source ranges overlap.
              for statements, hit in blocks.values():
                  total += statements
                  if hit:
                      covered += statements
              return covered, total


          def parse_istanbul(path: Path, metric: str = "line") -> tuple[int, int]:
              report = read_json(path)
              key = "lines" if metric == "line" else "statements"
              try:
                  summary = report["total"][key]
                  return counts(summary["covered"], summary["total"])
              except (KeyError, TypeError) as error:
                  raise CoverageError(f"Istanbul JSON summary has no total.{key} counts") from error


          def parse_lcov(path: Path) -> tuple[int, int]:
              sources: dict[str, dict[int, bool]] = {}
              filename: str | None = None
              source_lines: dict[int, bool] = {}
              summary: dict[str, int] = {}
              records = 0
              for index, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("SF:"):
                      if filename is not None or not line[3:]:
                          raise CoverageError(f"invalid LCOV source record at line {index}")
                      filename, source_lines, summary = line[3:], {}, {}
                  elif line.startswith("DA:"):
                      if filename is None:
                          raise CoverageError("LCOV DA outside a source record")
                      values = line[3:].split(",")
                      if len(values) not in {2, 3}:
                          raise CoverageError(f"invalid LCOV DA at line {index}")
                      number = integer(values[0], "line number")
                      executions = integer(values[1], "execution count")
                      if number == 0:
                          raise CoverageError("LCOV line numbers must be positive")
                      source_lines[number] = source_lines.get(number, False) or executions > 0
                  elif line.startswith(("LF:", "LH:")):
                      key = line[:2]
                      if filename is None or key in summary:
                          raise CoverageError(f"invalid LCOV {key} at line {index}")
                      summary[key] = integer(line[3:], key)
                  elif line == "end_of_record":
                      if filename is None:
                          raise CoverageError("LCOV end_of_record without SF")
                      measured = {"LF": len(source_lines), "LH": sum(source_lines.values())}
                      for key, value in summary.items():
                          if measured[key] != value:
                              raise CoverageError(f"LCOV {key} does not match its DA records")
                      combined = sources.setdefault(filename, {})
                      for number, hit in source_lines.items():
                          combined[number] = combined.get(number, False) or hit
                      filename, source_lines, summary = None, {}, {}
                      records += 1
                  elif ":" not in line:
                      raise CoverageError(f"invalid LCOV entry at line {index}")
                  # Function and branch records do not contribute to line coverage.
              if filename is not None:
                  raise CoverageError("LCOV source record is missing end_of_record")
              if records == 0:
                  raise CoverageError("LCOV contains no source records")
              return sum(sum(lines.values()) for lines in sources.values()), sum(map(len, sources.values()))


          def parse_counts(path: Path) -> tuple[int, int]:
              report = read_json(path)
              try:
                  return counts(report["covered"], report["total"])
              except (KeyError, TypeError) as error:
                  raise CoverageError("counts JSON requires covered and total") from error


          def collect(args: argparse.Namespace) -> dict[str, Any]:
              metric = args.metric or ("statement" if args.format == "go" else "line")
              result: dict[str, Any] = {
                  "module": args.module,
                  "snapshot": args.snapshot,
                  "metric": metric,
                  "status": "ok",
                  "covered": None,
                  "total": None,
              }
              if args.absent:
                  result.update(status="absent", reason="Module does not exist at this revision")
              elif args.exit_code != 0:
                  result.update(status="failed", reason=f"Test or coverage collection failed (exit code {args.exit_code})")
              elif args.input is None or not args.input.is_file():
                  result.update(status="missing", reason="Coverage report was not generated")
              else:
                  try:
                      if args.format == "istanbul":
                          measured = parse_istanbul(args.input, metric)
                      else:
                          if args.format == "go" and metric != "statement":
                              raise CoverageError("Go cover profiles measure statements, not lines")
                          if args.format in {"jacoco", "lcov"} and metric != "line":
                              raise CoverageError(f"{args.format} collector measures lines")
                          measured = {
                              "jacoco": parse_jacoco,
                              "go": parse_go,
                              "lcov": parse_lcov,
                              "counts": parse_counts,
                          }[args.format](args.input)
                      result["covered"], result["total"] = measured
                  except (CoverageError, OSError, UnicodeError, ET.ParseError, json.JSONDecodeError) as error:
                      result.update(status="failed", reason=f"Invalid coverage report: {error}")
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              return result
          COVERAGE_REPORT_PY_0
      - name: Define Coverage Renderer
        run: |
          cat >> "$RUNNER_TEMP/coverage-tools/report.py" <<'COVERAGE_REPORT_PY_0'
          @dataclass(frozen=True)
          class Result:
              module: str
              snapshot: str
              metric: str
              status: str
              covered: int | None = None
              total: int | None = None
              reason: str = ""

              @property
              def percent(self) -> Decimal | None:
                  if self.status != "ok" or not self.total:
                      return None
                  with localcontext() as context:
                      context.prec = 50
                      return Decimal(self.covered) * 100 / Decimal(self.total)


          def normalize_result(raw: Any, module: str, snapshot: str, metric: str) -> Result:
              if not isinstance(raw, dict):
                  raise CoverageError("result must be a JSON object")
              if raw.get("module") != module or raw.get("snapshot") != snapshot:
                  raise CoverageError("result identity does not match the expected module and snapshot")
              if raw.get("metric") != metric:
                  raise CoverageError("result metric does not match the module manifest")
              status = raw.get("status")
              if not isinstance(status, str) or status not in STATUSES:
                  raise CoverageError("unknown coverage status")
              reason = raw.get("reason", "")
              if not isinstance(reason, str):
                  raise CoverageError("coverage reason must be text")
              if status == "ok":
                  covered, total = counts(raw.get("covered"), raw.get("total"))
              else:
                  if raw.get("covered") is not None or raw.get("total") is not None:
                      raise CoverageError("unavailable coverage must not contain numeric counts")
                  covered = total = None
              return Result(module, snapshot, metric, status, covered, total, reason)


          def load_results(artifacts: Path, modules: list[dict[str, Any]]) -> tuple[dict[tuple[str, str], Result], list[str]]:
              expected = {module["module"]: module["metric"] for module in modules}
              candidates: dict[tuple[str, str], list[Any]] = {}
              diagnostics = []
              for path in sorted(artifacts.rglob("result.json")):
                  try:
                      raw = read_json(path)
                      if not isinstance(raw, dict):
                          raise CoverageError("result must be a JSON object")
                      module, snapshot = raw.get("module"), raw.get("snapshot")
                      if not isinstance(module, str) or not isinstance(snapshot, str):
                          raise CoverageError("result is missing module or snapshot")
                      if module not in expected or snapshot not in SNAPSHOTS:
                          raise CoverageError("result has an unknown module or snapshot")
                      candidates.setdefault((module, snapshot), []).append(raw)
                  except (CoverageError, OSError, UnicodeError, json.JSONDecodeError) as error:
                      diagnostics.append(f"{path.relative_to(artifacts)}: {error}")

              results = {}
              for module, metric in expected.items():
                  for snapshot in ("base", "pr"):
                      key = (module, snapshot)
                      values = candidates.get(key, [])
                      if not values:
                          results[key] = Result(module, snapshot, metric, "missing", reason="Coverage artifact is missing")
                      elif len(values) != 1:
                          results[key] = Result(module, snapshot, metric, "failed", reason="Duplicate coverage artifacts")
                      else:
                          try:
                              results[key] = normalize_result(values[0], module, snapshot, metric)
                          except CoverageError as error:
                              results[key] = Result(module, snapshot, metric, "failed", reason=f"Invalid coverage artifact: {error}")
              return results, diagnostics


          def round_one(value: Decimal) -> Decimal:
              rounded = value.quantize(Decimal("0.1"), rounding=ROUND_HALF_UP)
              return Decimal("0.0") if rounded == 0 else rounded


          def percentage(value: Decimal | None) -> str:
              return "N/A" if value is None else f"{round_one(value):.1f}%"


          def delta(base: Result, pr: Result) -> Decimal | None:
              if base.percent is None or pr.percent is None:
                  return None
              with localcontext() as context:
                  context.prec = 50
                  return round_one(pr.percent - base.percent)


          def delta_text(value: Decimal | None) -> str:
              if value is None:
                  return "N/A"
              value = round_one(value)
              return f"{'+' if value > 0 else ''}{value:.1f}%p"


          def aggregate(results: list[Result], snapshot: str) -> Result:
              if any(result.status not in {"ok", "absent"} for result in results):
                  return Result("전체", snapshot, "mixed", "missing", reason="Incomplete coverage")
              return Result(
                  "전체", snapshot, "mixed", "ok",
                  sum(result.covered or 0 for result in results),
                  sum(result.total or 0 for result in results),
              )


          def text(value: Any) -> str:
              """Keep metadata and native error text inside one Markdown table cell."""
              return html.escape(" ".join(str(value).split()), quote=False).replace("|", "&#124;").replace("`", "&#96;")


          def measurement(result: Result) -> str:
              if result.percent is None:
                  return "N/A"
              return f"{percentage(result.percent)} ({result.covered:,}/{result.total:,})"


          def row_status(base: Result, pr: Result) -> str:
              problems = []
              for result in (base, pr):
                  if result.status in {"failed", "missing"}:
                      label = "실패" if result.status == "failed" else "누락"
                      problems.append(f"{result.snapshot}: {label} — {text(result.reason[:500])}")
                  elif result.status == "ok" and result.total == 0:
                      problems.append(f"{result.snapshot}: 측정 항목 없음")
              if problems:
                  return "; ".join(problems)
              if base.status == "absent" and pr.status == "absent":
                  return "양쪽 리비전에 모듈 없음"
              if base.status == "absent":
                  return "모듈 추가 (base 없음)"
              if pr.status == "absent":
                  return "모듈 삭제 (PR 없음)"
              return "완료"


          def donut_url(covered: int, total: int) -> str:
              center_label = percentage(Result("", "pr", "mixed", "ok", covered, total).percent)
              chart = {
                  "type": "doughnut",
                  "data": {
                      "labels": ["Covered", "Missed"],
                      "datasets": [{"data": [covered, total - covered], "backgroundColor": ["#2da44e", "#cf222e"], "borderWidth": 0}],
                  },
                  "options": {
                      "cutoutPercentage": 70,
                      "legend": {"position": "bottom"},
                      "plugins": {
                          "datalabels": {"display": False},
                          "doughnutlabel": {"labels": [{"text": center_label, "font": {"size": 28}, "color": "#24292f"}]},
                      },
                  },
              }
              return "https://quickchart.io/chart?" + urlencode({
                  "version": "2", "width": 360, "height": 220, "backgroundColor": "white",
                  "c": json.dumps(chart, separators=(",", ":")),
              })


          def read_manifest(path: Path) -> tuple[list[dict[str, Any]], list[dict[str, Any]]]:
              manifest = read_json(path)
              if not isinstance(manifest, dict) or not isinstance(manifest.get("modules"), list) or not manifest["modules"]:
                  raise CoverageError("manifest requires a nonempty modules array")
              modules = manifest["modules"]
              seen = set()
              for module in modules:
                  if not isinstance(module, dict) or not isinstance(module.get("module"), str) or not module["module"]:
                      raise CoverageError("manifest module requires a nonempty module name")
                  if module["module"] in seen or not isinstance(module.get("metric"), str) or module["metric"] not in METRICS:
                      raise CoverageError("manifest contains a duplicate module or invalid metric")
                  seen.add(module["module"])
              excluded = manifest.get("excluded", [])
              if not isinstance(excluded, list):
                  raise CoverageError("manifest excluded must be an array")
              for module in excluded:
                  if not isinstance(module, dict) or not isinstance(module.get("module"), str) or not isinstance(module.get("reason"), str):
                      raise CoverageError("excluded module requires module and reason strings")
                  if module["module"] in seen:
                      raise CoverageError("manifest contains a duplicate excluded module")
                  seen.add(module["module"])
              return modules, excluded


          def render(args: argparse.Namespace) -> str:
              modules, excluded = read_manifest(args.manifest)
              results, diagnostics = load_results(args.artifacts, modules)
              base = aggregate([results[(module["module"], "base")] for module in modules], "base")
              pr = aggregate([results[(module["module"], "pr")] for module in modules], "pr")
              complete = base.status == pr.status == "ok" and not diagnostics
              lines = [MARKER, "## 테스트 커버리지", ""]
              if complete:
                  lines += [f"**전체 (라인/구문 가중 합산): {percentage(base.percent)} → {percentage(pr.percent)} · {delta_text(delta(base, pr))}**", ""]
                  lines += [f"Base: {base.covered:,}/{base.total:,} · PR: {pr.covered:,}/{pr.total:,} (covered/total)", ""]
                  if pr.total:
                      lines += [f"![PR 전체 커버리지 {percentage(pr.percent)} — covered {pr.covered}, total {pr.total}]({donut_url(pr.covered, pr.total)})", ""]
              else:
                  lines += ["**전체: N/A · 증감: N/A**", "", "일부 측정이 실패하거나 누락되어 전체 수치·증감·도넛 차트를 표시하지 않았습니다.", ""]

              lines += ["| 모듈 | 단위 | Base | PR | 증감 | 상태 |", "| --- | --- | ---: | ---: | ---: | --- |"]
              changes: list[tuple[str, Decimal | None]] = [("전체", delta(base, pr) if complete else None)]
              for module in modules:
                  name = module["module"]
                  previous, current = results[(name, "base")], results[(name, "pr")]
                  change = delta(previous, current)
                  metric = "라인" if module["metric"] == "line" else "구문"
                  lines.append(f"| {text(name)} | {metric} | {measurement(previous)} | {measurement(current)} | {delta_text(change)} | {row_status(previous, current)} |")
                  changes.append((name, change))
              for module in excluded:
                  lines.append(f"| {text(module['module'])} | — | N/A | N/A | N/A | {text(module['reason'])} |")

              lines += ["", "```diff"]
              for name, change in changes:
                  prefix = "-" if change is not None and change < 0 else "+" if change is not None and change > 0 else " "
                  lines.append(f"{prefix} {text(name)}: {delta_text(change)}")
              lines += ["```", "", "증감은 PR − Base의 퍼센트포인트(%p)이며, 반올림 전 수치로 계산한 뒤 소수점 첫째 자리까지 표시합니다. 표시값이 0.0%p인 경우 부호와 색을 붙이지 않습니다.", ""]
              lines += ["전체는 모듈별 퍼센트의 단순 평균이 아니라 covered/total 합산값입니다. JVM·JavaScript·Elixir의 라인과 Go의 구문을 합친 혼합 지표입니다. 분모가 0이면 N/A로 표시하며, 한쪽 리비전에 없는 모듈은 해당 리비전 합산에서 제외합니다.", ""]
              if any(result.status == "absent" for result in results.values()):
                  lines += ["모듈 추가·삭제로 두 리비전의 측정 범위가 달라질 수 있습니다. 해당 모듈의 개별 증감은 N/A입니다.", ""]
              if diagnostics:
                  lines += ["보고서 검증 오류:", ""] + [f"- {text(message[:500])}" for message in diagnostics] + [""]
              # Workflow metadata is display-only; escape syntax before embedding it.
              lines += [f"Base: `{text(args.base_sha)}` · PR 병합: `{text(args.pr_sha)}` · PR head: `{text(args.head_sha)}`", ""]
              run_url = args.run_url.replace("(", "%28").replace(")", "%29").replace("\n", "").replace("\r", "")
              lines += [f"[CI 실행 및 원본 보고서]({run_url}) · 커버리지 하락과 최소 수치는 CI 실패 조건으로 사용하지 않습니다.", ""]
              body = "\n".join(lines)
              args.output.parent.mkdir(parents=True, exist_ok=True)
              args.output.write_text(body, encoding="utf-8")
              return body


          def main() -> int:
              parser = argparse.ArgumentParser(description=__doc__)
              commands = parser.add_subparsers(dest="command", required=True)
              collector = commands.add_parser("collect", help="normalize a native coverage report")
              collector.add_argument("--module", required=True)
              collector.add_argument("--snapshot", choices=sorted(SNAPSHOTS), required=True)
              collector.add_argument("--format", choices=["jacoco", "go", "istanbul", "lcov", "counts"], required=True)
              collector.add_argument("--metric", choices=sorted(METRICS))
              collector.add_argument("--input", type=Path)
              collector.add_argument("--output", type=Path, required=True)
              collector.add_argument("--exit-code", type=int, default=0)
              collector.add_argument("--absent", action="store_true", help="module source is absent at this revision")
              collector.set_defaults(handler=collect)
              renderer = commands.add_parser("render", help="render all module results as a Markdown comment")
              renderer.add_argument("--artifacts", type=Path, required=True)
              renderer.add_argument("--manifest", type=Path, required=True)
              renderer.add_argument("--base-sha", required=True)
              renderer.add_argument("--pr-sha", required=True)
              renderer.add_argument("--head-sha", required=True)
              renderer.add_argument("--run-url", required=True)
              renderer.add_argument("--output", type=Path, required=True)
              renderer.set_defaults(handler=render)
              args = parser.parse_args()
              try:
                  result = args.handler(args)
                  if args.command == "collect" and result["status"] in {"failed", "missing"}:
                      return 1
                  return 0
              except (CoverageError, OSError, UnicodeError, json.JSONDecodeError) as error:
                  parser.exit(1, f"coverage: {error}\n")


          if __name__ == "__main__":
              raise SystemExit(main())
          COVERAGE_REPORT_PY_0
      - name: Define Comment Publisher
        run: |
          cat > "$RUNNER_TEMP/coverage-tools/comment.cjs" <<'COVERAGE_COMMENT_CJS_0'
          'use strict';

          const MARKER = '<!-- coverage-report-bot -->';

          /** Update this bot's coverage comment only while the event's PR is current. */
          module.exports = async function publishCoverageComment({ github, context, core, body }) {
            const pullRequest = context.payload.pull_request;
            if (!pullRequest?.head?.sha || !pullRequest?.base?.sha) {
              core.warning('Coverage comment skipped: the event has no PR head/base SHA.');
              return { status: 'skipped' };
            }
            if (typeof body !== 'string' || !body.trim()) {
              throw new Error('Coverage comment body must not be empty.');
            }
            const { owner, repo } = context.repo;
            const number = pullRequest.number ?? context.issue.number;
            const parameters = { owner, repo };
            const markedBody = body.includes(MARKER) ? body : `${MARKER}\n${body}`;

            async function isCurrent() {
              const { data } = await github.rest.pulls.get({ ...parameters, pull_number: number });
              if (data.head.sha !== pullRequest.head.sha || data.base.sha !== pullRequest.base.sha) {
                core.info('Coverage comment skipped: the PR head or base changed after this run started.');
                return false;
              }
              return true;
            }

            try {
              if (!(await isCurrent())) return { status: 'stale' };
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...parameters,
                issue_number: number,
                per_page: 100,
              });
              const existing = comments.filter(comment =>
                comment.user?.type === 'Bot' &&
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' && comment.body.includes(MARKER),
              ).sort((left, right) => left.id - right.id);

              // Pagination can take time. Check again immediately before writing.
              if (!(await isCurrent())) return { status: 'stale' };
              let response;
              let status;
              if (existing.length) {
                response = await github.rest.issues.updateComment({
                  ...parameters, comment_id: existing[0].id, body: markedBody,
                });
                status = 'updated';
              } else {
                response = await github.rest.issues.createComment({
                  ...parameters, issue_number: number, body: markedBody,
                });
                status = 'created';
              }
              for (const duplicate of existing.slice(1)) {
                try {
                  await github.rest.issues.deleteComment({ ...parameters, comment_id: duplicate.id });
                } catch (error) {
                  if (error.status !== 403) throw error;
                  core.warning('Coverage comment was published, but duplicate cleanup was denied (403).');
                  break;
                }
              }
              return { status, id: response.data.id };
            } catch (error) {
              if (error.status !== 403) throw error;
              core.warning('Coverage comment could not be published (403). Fork PR tokens may be read-only; see the job summary and coverage artifacts.');
              return { status: 'forbidden' };
            }
          };

          module.exports.MARKER = MARKER;
          COVERAGE_COMMENT_CJS_0
      - name: Upload Coverage Toolkit
        uses: actions/upload-artifact@v7
        with:
          name: coverage-toolkit
          path: ${{ runner.temp }}/coverage-tools/
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - name: Validate Coverage Toolkit
        run: |
          python3 -m py_compile "$RUNNER_TEMP/coverage-tools/report.py" "$RUNNER_TEMP/coverage-tools/run.py"
          bash -n "$RUNNER_TEMP/coverage-tools/run-jvm.sh" "$RUNNER_TEMP/coverage-tools/run-native.sh"
          node --check "$RUNNER_TEMP/coverage-tools/comment.cjs"
      - name: Plan All Module Measurements
        id: matrix
        run: |
          matrix=$(python3 "$RUNNER_TEMP/coverage-tools/run.py" matrix --source "$GITHUB_WORKSPACE")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  coverage:
    name: coverage (${{ matrix.module }}, ${{ matrix.snapshot }})
    needs: coverage-plan
    if: needs.coverage-plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    steps:
      - name: Initialize Coverage Result
        env:
          COVERAGE_MODULE: ${{ matrix.module }}
          COVERAGE_SNAPSHOT: ${{ matrix.snapshot }}
          COVERAGE_RUNNER: ${{ matrix.runner }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'coverage-output'
          output.mkdir()
          result = {
              'module': os.environ['COVERAGE_MODULE'],
              'snapshot': os.environ['COVERAGE_SNAPSHOT'],
              'metric': 'statement' if os.environ['COVERAGE_RUNNER'] == 'go' else 'line',
              'status': 'missing', 'covered': None, 'total': None,
              'reason': 'Measurement did not finish; check runner setup and test logs',
          }
          (output / 'result.json').write_text(json.dumps(result))
          PY
      - name: Mark Measurement Pending
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.snapshot }}
          path: ${{ runner.temp }}/coverage-output/result.json
          overwrite: true
          retention-days: 7
      - name: Download Coverage Toolkit
        uses: actions/download-artifact@v8
        with:
          name: coverage-toolkit
          path: ${{ runner.temp }}/coverage-tools
      - name: Checkout Measurement Source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.snapshot == 'base' && github.event.pull_request.base.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Check Module Presence
        id: module
        env:
          COVERAGE_MODULE: ${{ matrix.module }}
        run: |
          if [ -d "source/$COVERAGE_MODULE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup JDK
        if: steps.module.outputs.present == 'true' && contains(fromJSON('["gradle","maven","amper"]'), matrix.runner)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
      - name: Setup Gradle
        if: steps.module.outputs.present == 'true' && matrix.runner == 'gradle'
        uses: gradle/actions/setup-gradle@v6
      - name: Cache Maven Dependencies
        if: steps.module.outputs.present == 'true' && matrix.runner == 'maven'
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-coverage-maven-${{ hashFiles('source/cowork-project/pom.xml') }}
          restore-keys: ${{ runner.os }}-coverage-maven-
      - name: Setup Kotlin Toolchain
        if: steps.module.outputs.present == 'true' && matrix.runner == 'amper'
        env:
          KOTLIN_CLI_VERSION: '0.11.0'
          KOTLIN_CLI_WRAPPER_SHA256: f53d26ee0bb6ef3078c33bda3c180d19fbca665408c27b62b7dfce335551c3d7
        run: |
          mkdir -p "$RUNNER_TEMP/kotlin-bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotlin-bin/kotlin" \
            "https://packages.jetbrains.team/maven/p/amper/amper/org/jetbrains/kotlin/kotlin-cli/${KOTLIN_CLI_VERSION}/kotlin-cli-${KOTLIN_CLI_VERSION}-wrapper"
          echo "${KOTLIN_CLI_WRAPPER_SHA256}  $RUNNER_TEMP/kotlin-bin/kotlin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kotlin-bin/kotlin"
          echo "$RUNNER_TEMP/kotlin-bin" >> "$GITHUB_PATH"
      - name: Setup Go
        if: steps.module.outputs.present == 'true' && matrix.runner == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: source/${{ matrix.module }}/go.mod
          cache-dependency-path: source/${{ matrix.module }}/go.sum
      - name: Setup Node.js
        if: steps.module.outputs.present == 'true' && contains(fromJSON('["jest","node"]'), matrix.runner)
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/${{ matrix.module }}/package-lock.json
      - name: Setup Elixir
        if: steps.module.outputs.present == 'true' && matrix.runner == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.4'
          otp-version: '27.3.4'
      - name: Cache Elixir Dependencies
        if: steps.module.outputs.present == 'true' && matrix.runner == 'elixir'
        uses: actions/cache@v6
        with:
          path: |
            source/cowork-user/deps
            source/cowork-user/_build
          key: ${{ runner.os }}-coverage-elixir-1.18.4-27.3.4-${{ hashFiles('source/cowork-user/mix.lock') }}
          restore-keys: ${{ runner.os }}-coverage-elixir-1.18.4-27.3.4-
      - name: Measure Module Coverage
        env:
          COVERAGE_MODULE: ${{ matrix.module }}
          COVERAGE_SNAPSHOT: ${{ matrix.snapshot }}
          MIX_ENV: test
          SECRET_KEY_BASE: ci-test-secret-key-base-ci-test-secret-key-base-ci-test-secret-key-base
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: cowork_test
          DB_USERNAME: cowork
          DB_PASSWORD: cowork
        run: |
          python3 "$RUNNER_TEMP/coverage-tools/run.py" measure \
            --module "$COVERAGE_MODULE" --snapshot "$COVERAGE_SNAPSHOT" \
            --source "$GITHUB_WORKSPACE/source" --output "$RUNNER_TEMP/coverage-output"
      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.snapshot }}
          path: ${{ runner.temp }}/coverage-output/
          overwrite: true
          if-no-files-found: warn
          retention-days: 7

  coverage-comment:
    needs: [coverage-plan, coverage]
    if: always() && github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download Coverage Toolkit
        uses: actions/download-artifact@v8
        with:
          name: coverage-toolkit
          path: ${{ runner.temp }}/coverage-tools
      - name: Download Coverage Results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-cowork-*
          path: ${{ runner.temp }}/coverage-artifacts
      - name: Render Coverage Comment
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_PR_SHA: ${{ github.sha }}
          COVERAGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 "$RUNNER_TEMP/coverage-tools/report.py" render \
            --artifacts "$RUNNER_TEMP/coverage-artifacts" --manifest "$RUNNER_TEMP/coverage-tools/modules.json" \
            --base-sha "$COVERAGE_BASE_SHA" --pr-sha "$COVERAGE_PR_SHA" \
            --head-sha "$COVERAGE_HEAD_SHA" --run-url "$COVERAGE_RUN_URL" \
            --output "$RUNNER_TEMP/coverage-comment.md"
          cat "$RUNNER_TEMP/coverage-comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update Coverage Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const toolkit = path.join(process.env.RUNNER_TEMP, 'coverage-tools');
            const postCoverage = require(path.join(toolkit, 'comment.cjs'));
            await postCoverage({
              github, context, core,
              body: fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'coverage-comment.md'), 'utf8'),
            });
