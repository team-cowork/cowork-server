name: Cowork Stage CI Workflow

on:
  pull_request:
    branches-ignore:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/cowork-ci.yml
    with:
      environment-label: Stage
    secrets: inherit
