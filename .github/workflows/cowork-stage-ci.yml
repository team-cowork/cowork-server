name: cowork stage CI Workflow

on:
  pull_request:
    branches-ignore:
      - 'main'
  push:
    branches:
      - 'develop'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validate PR Title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const prNumber = context.payload.pull_request.number;
            const allowedScopes = [
              'global', 'gateway', 'authorization', 'user',
              'team', 'project', 'channel', 'roadmap', 'chat', 'dm', 'voice', 'promotion',
              'config', 'notification', 'preference', 'ci/cd', 'monitoring'
            ];

            const versionPattern = /^v\d{8}\.\d+$/;
            if (versionPattern.test(title)) {
              return;
            }

            const titlePattern = /^\[([^\]]+)\]\s+(.+)$/;
            const match = title.match(titlePattern);
            if (!match) {
              core.setFailed('Invalid title format. Use [scope] title or vYYYYMMDD.n format');
              return;
            }

            const scopesPart = match[1];
            const titlePart = match[2];

            if (titlePart.includes(':')) {
              core.setFailed('Colon (:) is not allowed in the title');
              return;
            }
            const scopes = scopesPart.split(',').map(s => s.trim());
            const invalidScopes = scopes.filter(scope => !allowedScopes.includes(scope));
            if (invalidScopes.length > 0) {
              core.setFailed(`Invalid scope(s): ${invalidScopes.join(', ')}`);
              return;
            }

  setup-pr-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Setup PR Metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          gh pr edit $PR_NUMBER --repo ${{ github.repository }} --add-label "waiting for review:검토 대기"
          gh pr edit $PR_NUMBER --repo ${{ github.repository }} --add-assignee "$PR_AUTHOR"
          gh pr edit $PR_NUMBER --repo ${{ github.repository }} --add-reviewer "team-cowork/cowork-server"

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Detect Changed Services
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cowork-gateway:
              - 'cowork-gateway/**'
            cowork-config:
              - 'cowork-config/**'
            cowork-user:
              - 'cowork-user/**'
            cowork-authorization:
              - 'cowork-authorization/**'
            cowork-voice:
              - 'cowork-voice/**'
            cowork-chat:
              - 'cowork-chat/**'
            cowork-notification:
              - 'cowork-notification/**'
            cowork-preference:
              - 'cowork-preference/**'
            cowork-promotion:
              - 'cowork-promotion/**'
              - 'docs/todo/**'
            cowork-channel:
              - 'cowork-channel/**'
            cowork-team:
              - 'cowork-team/**'
            cowork-project:
              - 'cowork-project/**'
            cowork-roadmap:
              - 'cowork-roadmap/**'
      - name: Build Service Matrix
        id: build-matrix
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            MATRIX='{"include":[
              {"service":"cowork-gateway","build":"gradle","working-directory":"."},
              {"service":"cowork-config","build":"gradle","working-directory":"."},
              {"service":"cowork-user","build":"elixir","working-directory":"cowork-user","elixir-version":"1.18.4","otp-version":"27.3.4"},
              {"service":"cowork-notification","build":"go","working-directory":"cowork-notification","go-version-file":"cowork-notification/go.mod","build-command":"go build ./cmd/server"},
              {"service":"cowork-preference","build":"amper","working-directory":"cowork-preference"},
              {"service":"cowork-project","build":"gradle","working-directory":"."},
              {"service":"cowork-channel","build":"gradle","working-directory":"."},
              {"service":"cowork-roadmap","build":"gradle","working-directory":"."},
              {"service":"cowork-authorization","build":"go","working-directory":"cowork-authorization","go-version-file":"cowork-authorization/go.mod","build-command":"go build ./..."},
              {"service":"cowork-voice","build":"go","working-directory":"cowork-voice","go-version-file":"cowork-voice/go.mod","build-command":"go build ./cmd/server"},
              {"service":"cowork-chat","build":"node","working-directory":"cowork-chat","node-version":"24"},
              {"service":"cowork-promotion","build":"node","working-directory":"cowork-promotion","node-version":"24"},
              {"service":"cowork-channel","build":"gradle","working-directory":"."},
              {"service":"cowork-team","build":"gradle","working-directory":"."}
            ]}'
            SERVICES="cowork-gateway, cowork-config, cowork-user, cowork-notification, cowork-preference, cowork-project, cowork-channel, cowork-roadmap, cowork-authorization, cowork-voice, cowork-chat, cowork-promotion"
          else
            MATRIX='{"include":[]}'
            SERVICES=""
            [ "${{ steps.filter.outputs.cowork-gateway }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-gateway","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-gateway"
            [ "${{ steps.filter.outputs.cowork-config }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-config","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-config"
            [ "${{ steps.filter.outputs.cowork-user }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-user","build":"elixir","working-directory":"cowork-user","elixir-version":"1.18.4","otp-version":"27.3.4"}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-user"
            [ "${{ steps.filter.outputs.cowork-notification }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-notification","build":"go","working-directory":"cowork-notification","go-version-file":"cowork-notification/go.mod","build-command":"go build ./cmd/server"}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-notification"
            [ "${{ steps.filter.outputs.cowork-preference }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-preference","build":"amper","working-directory":"cowork-preference"}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-preference"
            [ "${{ steps.filter.outputs.cowork-project }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-project","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-project"
            [ "${{ steps.filter.outputs.cowork-roadmap }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-roadmap","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-roadmap"
            [ "${{ steps.filter.outputs.cowork-channel }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-channel","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-channel"
            [ "${{ steps.filter.outputs.cowork-authorization }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-authorization","build":"go","working-directory":"cowork-authorization","go-version-file":"cowork-authorization/go.mod","build-command":"go build ./..."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-authorization"
            [ "${{ steps.filter.outputs.cowork-voice }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-voice","build":"go","working-directory":"cowork-voice","go-version-file":"cowork-voice/go.mod","build-command":"go build ./cmd/server"}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-voice"
            [ "${{ steps.filter.outputs.cowork-chat }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-chat","build":"node","working-directory":"cowork-chat","node-version":"24"}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-chat"
            [ "${{ steps.filter.outputs.cowork-promotion }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-promotion","build":"node","working-directory":"cowork-promotion","node-version":"24"}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-promotion"
            [ "${{ steps.filter.outputs.cowork-channel }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-channel","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-channel"
            [ "${{ steps.filter.outputs.cowork-team }}" == "true" ] && \
              MATRIX=$(echo "$MATRIX" | jq '.include += [{"service":"cowork-team","build":"gradle","working-directory":"."}]') && \
              SERVICES="${SERVICES:+$SERVICES, }cowork-team"
            if [ "$(echo "$MATRIX" | jq '.include | length')" == "0" ]; then
              MATRIX='{"include":[{"service":"no-changes","build":"skip"}]}'
              SERVICES="none"
            fi
          fi
          echo "matrix=$(echo "$MATRIX" | jq -c .)" >> $GITHUB_OUTPUT
          echo "services-list=${SERVICES}" >> $GITHUB_OUTPUT

  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-title, detect-changes]
    if: always() && (needs.validate-title.result == 'success' || needs.validate-title.result == 'skipped')
    name: build (${{ matrix.service }})

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: No Changed Services
        if: matrix.build == 'skip'
        run: echo "No changed services."
      - name: Checkout Code
        if: matrix.build != 'skip'
        uses: actions/checkout@v7
      - name: Setup JDK
        if: matrix.build == 'gradle'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        if: matrix.build == 'gradle'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: always
      - name: Build & Test (Gradle)
        if: matrix.build == 'gradle'
        working-directory: ${{ matrix.working-directory }}
        run: ./gradlew :${{ matrix.service }}:build --build-cache
      - name: Build & Test (Amper)
        if: matrix.build == 'amper'
        working-directory: ${{ matrix.working-directory }}
        env:
          KOTLIN_CLI_VERSION: '0.11.0'
          KOTLIN_CLI_WRAPPER_SHA256: f53d26ee0bb6ef3078c33bda3c180d19fbca665408c27b62b7dfce335551c3d7
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/kotlin" \
            "https://packages.jetbrains.team/maven/p/amper/amper/org/jetbrains/kotlin/kotlin-cli/${KOTLIN_CLI_VERSION}/kotlin-cli-${KOTLIN_CLI_VERSION}-wrapper"
          echo "${KOTLIN_CLI_WRAPPER_SHA256}  $HOME/.local/bin/kotlin" | sha256sum -c -
          chmod +x "$HOME/.local/bin/kotlin"
          export PATH="$HOME/.local/bin:$PATH"
          kotlin build
          kotlin test
      - name: Setup Go
        if: matrix.build == 'go'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.go-version-file }}
          cache-dependency-path: ${{ matrix.working-directory }}/go.sum
      - name: Lint (Go)
        if: matrix.build == 'go'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.working-directory }}
      - name: Setup Elixir
        if: matrix.build == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir-version }}
          otp-version: ${{ matrix.otp-version }}
      - name: Cache Elixir Dependencies
        if: matrix.build == 'elixir'
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.working-directory }}/deps
            ${{ matrix.working-directory }}/_build
          key: ${{ runner.os }}-elixir-${{ matrix.service }}-${{ hashFiles(format('{0}/mix.lock', matrix.working-directory)) }}
          restore-keys: |
            ${{ runner.os }}-elixir-${{ matrix.service }}-
      - name: Build & Test (Go)
        if: matrix.build == 'go'
        working-directory: ${{ matrix.working-directory }}
        run: |
          go vet ./...
          go test ./...
          ${{ matrix.build-command }}
      - name: Setup Node.js
        if: matrix.build == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.working-directory }}/package-lock.json
      - name: Build & Test (Node)
        if: matrix.build == 'node'
        working-directory: ${{ matrix.working-directory }}
        run: |
          npm ci
          npm test --if-present
          npm run build
      - name: Build & Test (Elixir)
        if: matrix.build == 'elixir'
        working-directory: ${{ matrix.working-directory }}
        env:
          MIX_ENV: test
          SECRET_KEY_BASE: ci-test-secret-key-base-ci-test-secret-key-base-ci-test-secret-key-base
          DB_HOST: localhost
          DB_PORT: '3306'
          DB_NAME: cowork_test
          DB_USERNAME: cowork
          DB_PASSWORD: cowork
        run: |
          mix deps.get
          mix deps.compile
          mix test --no-start

  notify:
    runs-on: ubuntu-latest
    needs: [validate-title, setup-pr-metadata, detect-changes, build-and-test]
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Determine Status
        id: status
        run: |
          if [[ "${{ needs.validate-title.result }}" == "failure" ]] || \
             [[ "${{ needs.build-and-test.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "color=0xFF4C4C" >> $GITHUB_OUTPUT
          elif [[ "${{ needs.build-and-test.result }}" == "success" ]] || \
               [[ "${{ needs.build-and-test.result }}" == "skipped" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "color=0x4CAF50" >> $GITHUB_OUTPUT
          else
            echo "status=cancelled" >> $GITHUB_OUTPUT
            echo "color=0xFFA500" >> $GITHUB_OUTPUT
          fi
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Stage CI"
          description: |
            `${{ github.ref_name }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Changed:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Validate Title:** ${{ needs.validate-title.result }}
            **Setup Metadata:** ${{ needs.setup-pr-metadata.result }}
            **Build & Test:** ${{ needs.build-and-test.result }}

  coverage-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-modules: ${{ steps.matrix.outputs.has-modules }}
    steps:
      - name: Checkout PR Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: source-pr
          persist-credentials: false
      - name: Checkout Base Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: source-base
          persist-credentials: false
      - name: Define Coverage Inventory and Runner
        run: |
          mkdir -p "$RUNNER_TEMP/coverage-tools"
          cat > "$RUNNER_TEMP/coverage-tools/run.py" <<'COVERAGE_RUN_PY_0'
          #!/usr/bin/env python3
          """Discover both source snapshots and measure supported modules without a registry."""

          import argparse
          import json
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          TOOLS = Path(__file__).resolve().parent
          JVM_TEST_EXTENSIONS = ('java', 'kt', 'kts', 'groovy', 'scala')
          JAVASCRIPT_TEST_EXTENSIONS = ('js', 'jsx', 'mjs', 'cjs', 'ts', 'tsx', 'mts', 'cts')
          JAVASCRIPT_TEST_STEMS = (
              '**/*.spec', '**/*.test', '**/*-test', '**/*_test', '**/test-*',
              'test/**/*', 'tests/**/*', '**/__tests__/**/*',
          )
          # Every adapter declares test-source conventions here. The planner handles
          # their absence through one runner-neutral state before installing toolchains.
          JVM_TEST_SOURCES = tuple(f'src/test/**/*.{extension}' for extension in JVM_TEST_EXTENSIONS)
          JAVASCRIPT_TEST_SOURCES = tuple(
              f'{stem}.{extension}' for stem in JAVASCRIPT_TEST_STEMS for extension in JAVASCRIPT_TEST_EXTENSIONS
          )
          RUNNERS = {
              'gradle': ('line', 'jacoco', 'report.xml', JVM_TEST_SOURCES),
              'maven': ('line', 'jacoco', 'report.xml', JVM_TEST_SOURCES),
              'amper': ('line', 'jacoco', 'report.xml', JVM_TEST_SOURCES),
              'go': ('statement', 'go', 'report.out', ('**/*_test.go',)),
              'elixir': ('line', 'counts', 'report.json', ('test/**/*_test.exs',)),
              'jest': ('line', 'istanbul', 'report.json', JAVASCRIPT_TEST_SOURCES),
              'node': ('line', 'istanbul', 'report.json', JAVASCRIPT_TEST_SOURCES),
          }
          IGNORED = {'.git', 'node_modules', 'build', 'target', '_build', 'deps', 'vendor', 'coverage', 'dist', '__pycache__', '.gradle', '.kotlin'}
          CONFIG_EXTENSIONS = {'.yml', '.yaml', '.json', '.md', '.txt', '.conf', '.ini', '.cfg', '.properties', '.xml', '.csv', '.svg', '.png', '.jpg', '.jpeg', '.ico', '.crt', '.pem', '.key', '.sql'}
          CONFIG_NAMES = {'.gitignore', '.gitkeep', '.dockerignore', '.env.example', 'LICENSE', 'Dockerfile'}
          OTHER_BUILDS = {'Cargo.toml', 'pyproject.toml', 'requirements.txt', 'setup.py', 'Gemfile', 'composer.json', 'CMakeLists.txt', 'Makefile', 'build.sbt', 'Package.swift', 'pubspec.yaml', 'build.zig'}


          def metadata(runner, reason=''):
              metric, report_format, filename, _test_sources = RUNNERS.get(runner, ('line', 'counts', 'report.json', ()))
              return dict(runner=runner, metric=metric, format=report_format, report=filename, reason=reason)


          def coverage_metadata(directory, runner):
              descriptor = RUNNERS.get(runner)
              if descriptor is None:
                  raise ValueError(f'Test-source discovery is not configured for runner: {runner}')
              patterns = descriptor[3]
              for pattern in patterns:
                  for path in directory.glob(pattern):
                      relative = path.relative_to(directory)
                      if path.is_file() and not any(part in IGNORED for part in relative.parts):
                          return metadata(runner)
              return metadata('untested', '테스트 소스 없음')


          def test_commands(scripts, name='test', seen=None):
              seen = set() if seen is None else seen
              if name in seen or not isinstance(scripts.get(name), str):
                  return ''
              seen.add(name)
              command = scripts[name]
              npm_flags = r'(?:(?:--silent|-s|--quiet|-q)\s+)*'
              nested = re.findall(r'\bnpm\s+' + npm_flags + r'(?:run|run-script)\s+' + npm_flags + r'([\w:.-]+)', command)
              return ' ; '.join([command] + [test_commands(scripts, child, seen) for child in nested])


          def classify(directory):
              if directory.is_symlink():
                  return metadata('unsupported', 'Module directories must not be symbolic links')
              if not directory.exists():
                  return metadata('absent', 'Module does not exist at this revision')
              # Owner build files take precedence over delegating Gradle wrappers.
              for filename, runner in [('module.yaml', 'amper'), ('pom.xml', 'maven'), ('go.mod', 'go'), ('mix.exs', 'elixir')]:
                  if (directory / filename).is_file():
                      return coverage_metadata(directory, runner)
              package_file = directory / 'package.json'
              if package_file.is_file():
                  try:
                      package = json.loads(package_file.read_text())
                      if not isinstance(package, dict):
                          raise ValueError('package.json must be an object')
                      scripts = package.get('scripts', {})
                      if not isinstance(scripts, dict):
                          raise ValueError('package.json scripts must be an object')
                      command = test_commands(scripts)
                      if re.search(r'(?:^|[\s;&|])jest(?:\s|$)', command):
                          return coverage_metadata(directory, 'jest')
                      if re.search(r'(?:^|[\s;&|])node\s+[^;&|]*--test(?:\s|=|$)', command):
                          return coverage_metadata(directory, 'node')
                      # A direct Jest dependency is sufficient when no test command is declared.
                      dependencies = {}
                      for key in ('dependencies', 'devDependencies'):
                          value = package.get(key, {})
                          if not isinstance(value, dict):
                              raise ValueError(f'package.json {key} must be an object')
                          dependencies.update(value)
                      if not command and 'jest' in dependencies:
                          return coverage_metadata(directory, 'jest')
                      return metadata('unsupported', 'package.json does not declare a supported Jest or node --test runner')
                  except (ValueError, OSError) as error:
                      return metadata('unsupported', f'Unable to classify package.json: {error}')
              if any((directory / filename).is_file() for filename in ('build.gradle.kts', 'build.gradle')):
                  return coverage_metadata(directory, 'gradle')
              for current, subdirectories, filenames in os.walk(directory):
                  subdirectories[:] = [name for name in subdirectories if name not in IGNORED]
                  for filename in filenames:
                      path = Path(current) / filename
                      if (filename in OTHER_BUILDS or path.suffix not in CONFIG_EXTENSIONS) and filename not in CONFIG_NAMES:
                          return metadata('unsupported', f'No supported build definition for {path.relative_to(directory)}')
              return metadata('excluded', '설정 전용 모듈 — 실행 코드 없음')


          def discover(base_source, pr_source):
              for source in (base_source, pr_source):
                  if not source.is_dir():
                      raise ValueError(f'Source checkout does not exist: {source}')
              names = sorted({path.name for source in (base_source, pr_source) for path in source.glob('cowork-*') if path.is_dir() or path.is_symlink()})
              modules, excluded = [], []
              for name in names:
                  snapshots = {snapshot: classify(source / name) for snapshot, source in [('base', base_source), ('pr', pr_source)]}
                  if all(info['runner'] in {'absent', 'excluded', 'untested'} for info in snapshots.values()):
                      reason = '테스트 소스 없음 — 커버리지 제외' if any(
                          info['runner'] == 'untested' for info in snapshots.values()
                      ) else '설정 전용 모듈 — 실행 코드 없음'
                      excluded.append(dict(module=name, reason=reason))
                      continue
                  preferred = next((snapshots[snapshot] for snapshot in ('pr', 'base') if snapshots[snapshot]['runner'] in RUNNERS), metadata('unsupported'))
                  for info in snapshots.values():
                      if info['runner'] not in RUNNERS:
                          info['metric'] = preferred['metric']
                  modules.append(dict(module=name, metric=preferred['metric'], snapshots=snapshots))
              return dict(modules=modules, excluded=excluded)


          def build_matrix(manifest):
              return {'include': [dict(module=entry['module'], snapshot=snapshot, **entry['snapshots'][snapshot])
                                  for entry in manifest['modules'] for snapshot in ('base', 'pr')]}


          def measure(entry, snapshot, source, output):
              if not source.is_dir():
                  raise ValueError(f'Source checkout does not exist: {source}')
              info = entry['snapshots'][snapshot]
