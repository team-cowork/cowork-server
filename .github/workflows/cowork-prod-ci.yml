name: cowork prod CI Workflow

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Push runs select images against the previous commit, so every push run must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validate PR Title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const allowedScopes = [
              'global', 'gateway', 'authorization', 'user',
              'team', 'project', 'channel', 'roadmap', 'chat', 'voice', 'promotion',
              'config', 'notification', 'preference', 'ci/cd', 'monitoring'
            ];

            const versionPattern = /^v\d{8}\.\d+$/;
            if (versionPattern.test(title)) {
              return;
            }

            const titlePattern = /^\[([^\]]+)\]\s+(.+)$/;
            const match = title.match(titlePattern);
            if (!match) {
              core.setFailed('Invalid title format. Use [scope] title or vYYYYMMDD.n format');
              return;
            }

            const scopesPart = match[1];
            const titlePart = match[2];

            if (titlePart.includes(':')) {
              core.setFailed('Colon (:) is not allowed in the title');
              return;
            }
            const scopes = scopesPart.split(',').map(s => s.trim());
            const invalidScopes = scopes.filter(scope => !allowedScopes.includes(scope));
            if (invalidScopes.length > 0) {
              core.setFailed(`Invalid scope(s): ${invalidScopes.join(', ')}`);
              return;
            }

  validate-version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate Version
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const versionPattern = /^v\d{8}\.\d+$/;
            if (!versionPattern.test(title)) {
              return;
            }
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'VERSION',
              ref: context.payload.pull_request.head.sha
            });
            const versionInFile = Buffer.from(file.content, 'base64').toString().trim();
            const versionInTitle = title.slice(1);
            if (versionInFile !== versionInTitle) {
              core.setFailed(`VERSION 파일(${versionInFile})이 PR 제목의 버전(${versionInTitle})과 다릅니다`);
            }

  setup-pr-metadata:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Setup PR Metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          if ! gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label "waiting for review:검토 대기"; then
            echo "::warning::PR label setup failed; continuing CI."
          fi
          if ! gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-assignee "$PR_AUTHOR"; then
            echo "::warning::PR assignee setup failed; continuing CI."
          fi
          if ! gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-reviewer "team-cowork/cowork-server"; then
            echo "::warning::PR reviewer setup failed; continuing CI."
          fi

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.verify.outputs.matrix }}
      services-list: ${{ steps.verify.outputs.services-list }}
      image-matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate deployment syntax and Compose paths
        run: python3 deploy/validate.py
      - name: Select image builds
        id: images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then args+=(--base "$BASE_SHA"); fi
          python3 deploy/images/build-matrix.py --environment prod "${args[@]}"
      - name: Select module verification
        id: verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then args+=(--base "$BASE_SHA"); fi
          python3 deploy/images/build-matrix.py --verify "${args[@]}"

  # Pull requests already verify the same source in coverage(pr).
  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-title, validate-version, detect-changes]
    if: >
      github.event_name != 'pull_request' && !cancelled() &&
      (needs.validate-title.result == 'success' || needs.validate-title.result == 'skipped') &&
      (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped') &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.matrix != '{"include":[]}'
    name: build (cowork-${{ matrix.service }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/verify-image
        with:
          module: cowork-${{ matrix.service }}
          output: ${{ runner.temp }}/verification
      - name: Upload unit verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.service }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 7

  image-build:
    name: Image (${{ matrix.service }}, ${{ matrix.environment }})
    needs: detect-changes
    if: needs.detect-changes.outputs.image-matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.detect-changes.outputs.image-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          environment: ${{ matrix.environment }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: cowork-${{ matrix.service }}:ci-${{ matrix.environment }}

  image-validation:
    name: Image validation
    needs: [detect-changes, image-build]
    # Superseded PR runs must stop when their image builds are cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected image builds
        env:
          PREPARE_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.image-build.result }}
          IMAGE_MATRIX: ${{ needs.detect-changes.outputs.image-matrix }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$IMAGE_MATRIX" = '{"include":[]}' ]; then
            test "$BUILD_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
          fi

  notify:
    runs-on: ubuntu-latest
    needs: [validate-title, validate-version, setup-pr-metadata, detect-changes, build-and-test, image-validation, coverage-plan, coverage]
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.validate-title.result }} ${{ needs.validate-version.result }} ${{ needs.setup-pr-metadata.result }} ${{ needs.detect-changes.result }} ${{ needs.build-and-test.result }} ${{ needs.image-validation.result }} ${{ needs.coverage-plan.result }} ${{ needs.coverage.result }}"
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Prod CI"
          description: |
            `${{ github.ref_name }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Changed:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Validate Title:** ${{ needs.validate-title.result }}
            **Validate Version:** ${{ needs.validate-version.result }}
            **Setup Metadata:** ${{ needs.setup-pr-metadata.result }}
            **Detect Changes:** ${{ needs.detect-changes.result }}
            **Build & Test:** ${{ needs.build-and-test.result }}
            **Images:** ${{ needs.image-validation.result }}
            **PR Verification & Coverage:** ${{ needs.coverage-plan.result }} / ${{ needs.coverage.result }}

  coverage-plan:
    needs: detect-changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: source-base
          persist-credentials: false
      - name: Plan both Dockerfile snapshots
        id: plan
        env:
          VERIFY_MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          matrix=$(python3 deploy/images/ci/run.py plan --base source-base --head . \
            --matrix "$VERIFY_MATRIX" --output "$RUNNER_TEMP/modules.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-manifest
          path: ${{ runner.temp }}/modules.json
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: coverage (${{ matrix.module }}, ${{ matrix.snapshot }})
    needs: coverage-plan
    if: github.event_name == 'pull_request' && needs.coverage-plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The current source is the PR verification gate; base failures only affect the comparison.
    continue-on-error: ${{ matrix.snapshot == 'base' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout measurement source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.snapshot == 'base' && github.event.pull_request.base.sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: ./.github/actions/verify-image
        with:
          module: ${{ matrix.module }}
          snapshot: ${{ matrix.snapshot }}
          source: source
          # Current modules must implement verify; old snapshots may predate the contract.
          contract: ${{ matrix.snapshot == 'pr' && matrix.present || matrix.contract }}
          output: ${{ runner.temp }}/coverage-output
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.snapshot }}
          path: ${{ runner.temp }}/coverage-output/
          if-no-files-found: error
          retention-days: 7

  coverage-comment:
    needs: [coverage-plan, coverage]
    if: always() && github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: coverage-manifest
          path: ${{ runner.temp }}/coverage-tools
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: coverage-cowork-*
          path: ${{ runner.temp }}/coverage-artifacts
      - name: Render coverage comment
        run: |
          python3 deploy/images/ci/run.py render \
            --artifacts "$RUNNER_TEMP/coverage-artifacts" --manifest "$RUNNER_TEMP/coverage-tools/modules.json" \
            --output "$RUNNER_TEMP/coverage-comment.md"
          cat "$RUNNER_TEMP/coverage-comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update coverage comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const publish = require(path.join(process.env.GITHUB_WORKSPACE, 'deploy/images/ci/comment.cjs'));
            const result = await publish({ github, context, core,
              body: fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'coverage-comment.md'), 'utf8') });
            core.info(`Coverage publication: ${result.status}`);

  contrib-delta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build and Post Contribution Delta Comment
        uses: actions/github-script@v9
        with:
          script: |
            const { execSync } = require('child_process');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const issue_number = pr.number;
            const baseRef = pr.base.ref;
            const marker = '<!-- contrib-delta-bot -->';
            const sh = (c) => execSync(c, { encoding: 'utf8', maxBuffer: 256 * 1024 * 1024 });

            const postComment = async (body) => {
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 });
              const bots = comments.filter(c => c.body && c.body.includes(marker));
              if (bots.length) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: bots[0].id, body });
                for (const extra of bots.slice(1)) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: extra.id });
                }
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            };

            const fs = require('fs');
            const modules = fs.readdirSync('.', { withFileTypes: true })
              .filter(d => d.isDirectory() && d.name.startsWith('cowork-'))
              .map(d => d.name).sort();
            const AI = new Set(['.harness', '.claude', '.agents', '.codex']);
            const classify = (p) => {
              const top = p.split('/')[0];
              if (modules.includes(top)) return top;
              if (AI.has(top)) return 'ai-harness';
              return 'etc';
            };

            sh(`git fetch --no-tags origin ${baseRef}`);
            const baseSha = sh(`git merge-base origin/${baseRef} HEAD`).trim();
            const S1 = '\x01', S2 = '\x02';
            const parseLog = (range) => {
              const out = sh(`git log --no-merges --pretty=format:"${S1}%H${S2}%ae${S2}%(trailers:key=Co-authored-by,valueonly,separator=%x03)" --numstat ${range}`);
              const commits = []; let cur = null;
              for (const line of out.split('\n')) {
                if (line.startsWith(S1)) {
                  if (cur) commits.push(cur);
                  const [sha, rawEmail, rawCoAuthors = ''] = line.slice(1).split(S2);
                  const email = rawEmail.toLowerCase();
                  const coAuthorEmails = [...rawCoAuthors.matchAll(/<([^<>\s]+@[^<>\s]+)>/g)]
                    .map(m => m[1].toLowerCase())
                    .filter((coAuthorEmail, i, emails) => coAuthorEmail !== email && emails.indexOf(coAuthorEmail) === i);
                  cur = { sha, email, coAuthorEmails, files: {} };
                } else if (line.trim() && cur) {
                  const parts = line.split('\t');
                  if (parts.length !== 3) continue;
                  let [add, del, path] = parts;
                  const ln = (add === '-' ? 0 : parseInt(add, 10)) + (del === '-' ? 0 : parseInt(del, 10));
                  if (path.includes('=>')) {
                    path = path.replace(/\{[^}]*=> ?([^}]*)\}/, '$1').split(' => ').pop().trim();
                  }
                  const cat = classify(path);
                  cur.files[cat] = (cur.files[cat] || 0) + ln;
                }
              }
              if (cur) commits.push(cur);
              return commits;
            };

            const baseCommits = parseLog(baseSha);
            const prCommits = parseLog(`${baseSha}..HEAD`);
            if (prCommits.length === 0) {
              await postComment(`${marker}\n## 이 PR이 병합되면 — 기여도 변화 미리보기\n\n집계할 신규 커밋이 없습니다 (머지 커밋 제외).`);
              return;
            }

            const all = baseCommits.concat(prCommits);
            const sampleSha = new Map();
            for (const c of all) if (!sampleSha.has(c.email)) sampleSha.set(c.email, c.sha);
            for (const c of all) {
              for (const email of c.coAuthorEmails) if (!sampleSha.has(email)) sampleSha.set(email, c.sha);
            }
            const coAuthorEmails = new Set(all.flatMap(c => c.coAuthorEmails));
            const FAKE_TLDS = new Set(['test', 'invalid', 'example', 'localhost', 'local', 'internal', 'fake', 'nowhere']);
            const isFake = (email) => FAKE_TLDS.has(email.split('.').pop());
            const emailAccountIds = new Map();
            const accountLogins = new Map();
            const noreplyAccounts = new Map();
            for (const [email, sha] of sampleSha) {
              if (isFake(email)) continue;
              try {
                let actor = null;
                const accountId = email.match(/^(\d+)\+[^@]+@users\.noreply\.github\.com$/)?.[1];
                if (accountId) {
                  // The account ID survives renames; the username in the email does not.
                  if (!noreplyAccounts.has(accountId)) {
                    const { data } = await github.request('GET /user/{account_id}', { account_id: accountId });
                    if (String(data.id) !== accountId) throw new Error('GitHub returned a different account ID');
                    noreplyAccounts.set(accountId, data);
                  }
                  actor = noreplyAccounts.get(accountId);
                } else if (coAuthorEmails.has(email)) {
                  const data = await github.graphql(`
                    query($owner: String!, $repo: String!, $oid: GitObjectID!) {
                      repository(owner: $owner, name: $repo) {
                        object(oid: $oid) {
                          ... on Commit {
                            authors(first: 100) { nodes { email user { login databaseId } } }
                          }
                        }
                      }
                    }
                  `, { owner, repo, oid: sha });
                  const authors = data.repository.object?.authors.nodes || [];
                  const user = authors.find(a => a.email.toLowerCase() === email)?.user;
                  if (user) actor = { id: user.databaseId, login: user.login };
                } else {
                  const { data } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
                  actor = data.author;
                }
                if (actor?.id && actor.login) {
                  const id = String(actor.id);
                  emailAccountIds.set(email, id);
                  accountLogins.set(id, actor.login);
                }
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`No GitHub account could be resolved for ${email}`);
                  continue;
                }
                // Keep the previous comment when lookup fails instead of publishing wrong attribution.
                throw new Error(`Unable to verify the contribution account for ${email}`, { cause: error });
              }
            }
            const emailLogin = new Map([...emailAccountIds].map(([email, id]) => [email, accountLogins.get(id)]));

            const fullCats = modules.concat(['ai-harness', 'etc']);
            const aggregate = (commits, metric) => {
              const contrib = {}, totals = {}, seen = {};
              for (const c of commits) {
                if (metric === 'commits') {
                  const logins = [emailLogin.get(c.email), ...c.coAuthorEmails.map(e => emailLogin.get(e))]
                    .filter(Boolean);
                  for (const login of new Set(logins)) {
                    contrib[login] = contrib[login] || {};
                    for (const cat of Object.keys(c.files)) contrib[login][cat] = (contrib[login][cat] || 0) + 1;
                    seen[login] = seen[login] || new Set();
                    if (!seen[login].has(c.sha)) { seen[login].add(c.sha); totals[login] = (totals[login] || 0) + 1; }
                  }
                } else {
                  const login = emailLogin.get(c.email);
                  if (!login) continue;
                  contrib[login] = contrib[login] || {};
                  for (const [cat, ln] of Object.entries(c.files)) {
                    contrib[login][cat] = (contrib[login][cat] || 0) + ln;
                    totals[login] = (totals[login] || 0) + ln;
                  }
                }
              }
              return { contrib, totals };
            };
            const A = {};
            for (const m of ['commits', 'lines']) {
              A[m] = { before: aggregate(baseCommits, m), after: aggregate(all, m) };
            }

            const fmt = (n) => n.toLocaleString('en-US');
            const signed = (n) => n > 0 ? `+${fmt(n)}` : `${fmt(n)}`;
            const ranks = (totals) => {
              const order = Object.keys(totals).sort((a, b) => totals[b] - totals[a]);
              const r = {}; order.forEach((a, i) => r[a] = i + 1); return r;
            };
            const projTotals = (contrib, cats) => {
              const t = {}; for (const cat of cats) t[cat] = 0;
              for (const a of Object.keys(contrib)) for (const cat of cats) t[cat] += (contrib[a][cat] || 0);
              return t;
            };

            const btC = A.commits.before.totals, atC = A.commits.after.totals;
            const btL = A.lines.before.totals, atL = A.lines.after.totals;

            const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
            const dCommits = prCommits.length;
            const dLines = sum(atL) - sum(btL);
            const nContrib = Object.keys(atC).filter(a => (atC[a] - (btC[a] || 0)) > 0).length;

            let out = [
              marker,
              '## 이 PR이 병합되면 — 기여도 변화 미리보기',
              '',
              `**커밋 ${signed(dCommits)}** · **라인 ${signed(dLines)}** · 기여자 ${nContrib}명 증가`,
              '',
            ];

            const rB = ranks(btC), rA = ranks(atC);
            const authors = Object.keys(atC).sort((a, b) => atC[b] - atC[a]);
            const lbRows = authors.map(a => {
              const bcc = btC[a] || 0, acc = atC[a] || 0;
              const bll = btL[a] || 0, aLines = atL[a] || 0;
              const rbV = rB[a], raV = rA[a];
              const move = rbV ? `${rbV} -> ${raV}` : `new -> ${raV}`;
              return {
                changed: (acc - bcc) > 0 || (aLines - bll) > 0,
                a,
                c: `${fmt(bcc)} -> ${fmt(acc)} (${signed(acc - bcc)})`,
                l: `${fmt(bll)} -> ${fmt(aLines)} (${signed(aLines - bll)})`,
                m: move,
              };
            });
            const pad = (s, w) => s.padEnd(w);
            const wa = Math.max('AUTHOR'.length, ...lbRows.map(r => r.a.length));
            const wc = Math.max('COMMITS'.length, ...lbRows.map(r => r.c.length));
            const wl = Math.max('LINES'.length, ...lbRows.map(r => r.l.length));
            out.push('### 전체 기여자 리더보드 (병합 후 기준)',
              '이번 PR로 기여가 증가한 사람은 초록색으로 강조됩니다.', '', '```diff',
              `  ${pad('AUTHOR', wa)}  ${pad('COMMITS', wc)}  ${pad('LINES', wl)}  RANK`);
            for (const r of lbRows) {
              out.push(`${r.changed ? '+' : ' '} ${pad(r.a, wa)}  ${pad(r.c, wc)}  ${pad(r.l, wl)}  ${r.m}`);
            }
            out.push('```', '');

            const bModC = projTotals(A.commits.before.contrib, fullCats);
            const aModC = projTotals(A.commits.after.contrib, fullCats);
            const bModL = projTotals(A.lines.before.contrib, fullCats);
            const aModL = projTotals(A.lines.after.contrib, fullCats);
            let worked = fullCats.map(c => [c, aModC[c] - bModC[c], aModL[c] - bModL[c]])
              .filter(w => w[1] > 0 || w[2] > 0)
              .sort((x, y) => (y[1] - x[1]) || (y[2] - x[2]));
            if (worked.length) {
              const labels = worked.map(w => w[0]);
              const data = worked.map(w => w[1]);
              const vmax = Math.max(...data, 1);
              const stops = [[68, 1, 84], [59, 82, 139], [33, 145, 140], [94, 201, 98], [253, 231, 37]];
              const colorFor = (v) => {
                const t = 0.12 + 0.72 * (v / vmax);
                const x = Math.min(0.999, Math.max(0, t)) * (stops.length - 1);
                const i = Math.floor(x), f = x - i, p = stops[i], q = stops[i + 1] || p;
                const c = (k) => Math.round(p[k] + (q[k] - p[k]) * f);
                return `rgb(${c(0)},${c(1)},${c(2)})`;
              };
              const cfg = {
                type: 'horizontalBar',
                data: { labels, datasets: [{ data, backgroundColor: data.map(colorFor) }] },
                options: {
                  legend: { display: false },
                  title: { display: true, fontSize: 16, text: 'Commits added by this PR (per module)' },
                  plugins: { datalabels: { anchor: 'end', align: 'right', color: '#444', formatter: '__FMT__' } },
                  scales: { xAxes: [{ ticks: { beginAtZero: true, suggestedMax: Math.ceil(vmax * 1.25) } }] },
                },
              };
              let cfgStr = JSON.stringify(cfg).replace('"__FMT__"', 'function(v){return "+"+v;}');
              const h = Math.max(180, 46 * labels.length + 90);
              const chartUrl = `https://quickchart.io/chart?bkg=white&w=820&h=${h}&c=${encodeURIComponent(cfgStr)}`;
              out.push('### 이 PR이 추가하는 모듈별 커밋', `![module delta](${chartUrl})`, '');
            }

            const mdRows = fullCats.map(c => {
              const dc = aModC[c] - bModC[c], dl = aModL[c] - bModL[c];
              const cell = (tot, d) => d ? `${fmt(tot)} (${signed(d)})` : `${fmt(tot)}`;
              return { changed: dc > 0 || dl > 0, name: c, dc, dl,
                cc: cell(aModC[c], dc), lc: cell(aModL[c], dl) };
            }).sort((x, y) => (y.dc - x.dc) || (y.dl - x.dl));
            const wm = Math.max('MODULE'.length, ...mdRows.map(r => r.name.length));
            const wcc = Math.max('COMMITS'.length, ...mdRows.map(r => r.cc.length));
            const wll = Math.max('LINES'.length, ...mdRows.map(r => r.lc.length));
            out.push('### 모듈별 변화 상세 (전체 모듈)',
              '이번 PR이 커밋을 추가한 모듈은 초록색으로 강조됩니다.', '', '```diff',
              `  ${pad('MODULE', wm)}  ${pad('COMMITS', wcc)}  ${pad('LINES', wll)}`);
            for (const r of mdRows) {
              out.push(`${r.changed ? '+' : ' '} ${pad(r.name, wm)}  ${pad(r.cc, wcc)}  ${pad(r.lc, wll)}`);
            }
            out.push('```', '');
            out.push(`<sub>base <code>${baseSha.slice(0, 8)}</code> 기준 · 머지 커밋 제외</sub>`);

            await postComment(out.join('\n'));
