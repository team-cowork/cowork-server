name: Cowork Prod CI Workflow

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  # Skipped version pushes must not replace pending validation runs.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
      github.event_name == 'push' &&
      github.actor == 'cowork-server-versioning-bot[bot]' &&
      '-version-writeback' || '' }}
  # Keep active push validation; later runs include changes since the last success.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/cowork-ci.yml
    with:
      environment-label: Prod
    secrets: inherit
