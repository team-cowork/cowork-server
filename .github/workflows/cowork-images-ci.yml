name: cowork Docker Image CI

on:
  # All PR bases, including another feature branch in a gh stack.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate local and production configuration
        run: python3 deploy/validate.py
      - name: Select both image environments
        id: images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [ -n "$BASE_SHA" ]; then args+=(--base "$BASE_SHA"); fi
          python3 deploy/images/build-matrix.py "${args[@]}"

  build:
    name: Image (${{ matrix.service }}, ${{ matrix.environment }})
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          environment: ${{ matrix.environment }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: cowork-${{ matrix.service }}:ci-${{ matrix.environment }}

  image-validation:
    name: Image validation
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected image builds
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          IMAGE_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$IMAGE_MATRIX" = '{"include":[]}' ]; then
            test "$BUILD_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
          fi
