name: "cowork CD (pilot: team, channel)"

on:
  workflow_run:
    workflows: ["cowork prod CI Workflow"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      team: ${{ steps.filter.outputs.team }}
      channel: ${{ steps.filter.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 20
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            team:
              - 'cowork-team/**'
            channel:
              - 'cowork-channel/**'

  deploy-team:
    needs: detect-changes
    if: needs.detect-changes.outputs.team == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy cowork-team
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.COWORK_SSH_HOST }}
          port: ${{ secrets.TEAM_SSH_PORT }}
          username: ${{ secrets.TEAM_SSH_USER }}
          key: ${{ secrets.TEAM_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: bash ~/deploy-team.sh

  deploy-channel:
    needs: detect-changes
    if: needs.detect-changes.outputs.channel == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy cowork-channel
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.COWORK_SSH_HOST }}
          port: ${{ secrets.CHANNEL_SSH_PORT }}
          username: ${{ secrets.CHANNEL_SSH_USER }}
          key: ${{ secrets.CHANNEL_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: bash ~/deploy-channel.sh
