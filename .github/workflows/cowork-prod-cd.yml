name: cowork prod CD Workflow

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  build-images:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cowork-config
            context: .
            dockerfile: ./cowork-config/prod.dockerfile
          - service: cowork-gateway
            context: .
            dockerfile: ./cowork-gateway/prod.dockerfile
          - service: cowork-authorization
            context: ./cowork-authorization
            dockerfile: ./cowork-authorization/prod.dockerfile
          - service: cowork-preference
            context: ./cowork-preference
            dockerfile: ./cowork-preference/prod.dockerfile
          - service: cowork-user
            context: ./cowork-user
            dockerfile: ./cowork-user/prod.dockerfile
          - service: cowork-team
            context: .
            dockerfile: ./cowork-team/prod.dockerfile
          - service: cowork-channel
            context: .
            dockerfile: ./cowork-channel/prod.dockerfile
          - service: cowork-notification
            context: ./cowork-notification
            dockerfile: ./cowork-notification/prod.dockerfile
          - service: cowork-chat
            context: ./cowork-chat
            dockerfile: ./cowork-chat/prod.dockerfile
          - service: cowork-voice
            context: ./cowork-voice
            dockerfile: ./cowork-voice/prod.dockerfile
          - service: cowork-project
            context: ./cowork-project
            dockerfile: ./cowork-project/prod.dockerfile
          - service: cowork-roadmap
            context: .
            dockerfile: ./cowork-roadmap/prod.dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:v${{ needs.prepare.outputs.version }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --generate-notes

  notify:
    needs:
      - prepare
      - build-images
      - release
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Resolve notification status
        id: result
        env:
          BUILD_RESULT: ${{ needs.build-images.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ "${PREPARE_RESULT}" = "failure" ] || [ "${BUILD_RESULT}" = "failure" ] || [ "${RELEASE_RESULT}" = "failure" ]; then
            status=failure
          elif [ "${PREPARE_RESULT}" = "cancelled" ] || [ "${BUILD_RESULT}" = "cancelled" ] || [ "${RELEASE_RESULT}" = "cancelled" ]; then
            status=cancelled
          else
            status=success
          fi

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            description="Release v${VERSION} · by ${{ github.actor }}"
          else
            description="Release skipped (v${VERSION} already exists) · by ${{ github.actor }}"
          fi

          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "description=${description}" >> "${GITHUB_OUTPUT}"

      - name: Notify Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.result.outputs.status }}
          title: "cowork Server Prod CD"
          description: ${{ steps.result.outputs.description }}
