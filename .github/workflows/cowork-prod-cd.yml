name: Cowork Prod CD Workflow

on:
  workflow_run:
    workflows: ["Cowork Prod CI Workflow"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: GitHub 설정을 반영하고 재배포할 대상
        required: true
        type: choice
        options: [config, gateway, authorization, user, team, channel, project, roadmap, notification, preference, chat, voice, github, applications, infrastructure, vault]
      sha:
        description: 사용할 기존 이미지의 커밋 SHA (비워 두면 현재 배포된 이미지 유지)
        type: string
      check_only:
        description: 설정만 검증 (Vault와 컨테이너는 변경하지 않음)
        default: false
        type: boolean
      vault_recovery:
        description: VAULT_BOOTSTRAP_JSON으로 Vault 복구 (대상이 vault인 경우만 사용)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cowork-production
  cancel-in-progress: false

jobs:
  manual-request:
    name: Validate Manual Request
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'team-cowork/cowork-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.request.outputs.matrix }}
      services-list: ${{ steps.request.outputs.services-list }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Validate Manual Request
        id: request
        env:
          SERVICE: ${{ inputs.service }}
          IMAGE_SHA: ${{ inputs.sha }}
          CHECK_ONLY: ${{ inputs.check_only }}
          VAULT_RECOVERY: ${{ inputs.vault_recovery }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          service = os.environ['SERVICE']
          units = json.loads(Path('deploy/prod/inventory.json').read_text())['targets']
          if os.environ['IMAGE_SHA'] and not re.fullmatch('[0-9a-f]{40}', os.environ['IMAGE_SHA']):
              raise SystemExit('Image SHA must identify an existing commit image')
          if os.environ['VAULT_RECOVERY'] == 'true' and service != 'vault':
              raise SystemExit('Vault recovery requires service=vault')
          if service == 'infrastructure':
              units = []
          elif service == 'applications':
              units = [unit for unit in units if unit['service'] not in {'config', 'vault'}]
          else:
              units = [unit for unit in units if unit['service'] == service]
              if not units:
                  raise SystemExit('Unknown deployment service')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': units}, separators=(',', ':')) + '\n')
              output.write('services-list=' + service + '\n')
          PYTHON

  detect-changes:
    name: Detect Deployment Changes
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      deployments: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Checkout Deployment Tracking Tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-tools
      - name: Compare Each Target With Its Last Successful Deployment
        id: build-matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .deployment-tools/deploy/prod/cd/build-matrix.py

  settings-plan:
    name: Plan GitHub Settings
    needs: [manual-request, detect-changes]
    if: >
      !cancelled() && (needs.manual-request.result == 'success' || needs.detect-changes.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
      id-token: write
    outputs:
      sync_matrix: ${{ steps.plan.outputs.sync_matrix }}
      attempt: ${{ steps.plan.outputs.attempt }}
    steps:
      - name: Checkout Deployment Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Authenticate Settings Reader
        if: ${{ !inputs.check_only && inputs.service != 'vault' }}
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: python3 deploy/prod/cd/vault-auth.py --role prod-settings-plan
      - name: Select Settings And Save Previous Images
        id: plan
        env:
          DEPLOY_MATRIX: ${{ needs.manual-request.outputs.matrix || needs.detect-changes.outputs.matrix }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          IMAGE_SHA: ${{ inputs.sha }}
          AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
          INFRASTRUCTURE: ${{ inputs.service == 'infrastructure' }}
          CHECK_ONLY: ${{ inputs.check_only || false }}
          GH_VARIABLES_JSON: ${{ toJSON(vars) }}
          GH_SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ github.token }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
        run: python3 deploy/prod/cd/rollout-settings.py initial --directory "$RUNNER_TEMP/settings-plan"
      - name: Preserve Rollout Metadata
        uses: actions/upload-artifact@v7
        with:
          name: settings-${{ github.run_attempt }}-plan
          path: ${{ runner.temp }}/settings-plan/*.json
          retention-days: 30

  sync-settings:
    name: Sync Settings (${{ matrix.target }})
    needs: settings-plan
    if: >
      !cancelled() && needs.settings-plan.result == 'success' &&
      needs.settings-plan.outputs.sync_matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    environment: Prod-CD(${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.settings-plan.outputs.sync_matrix) }}
    steps:
      - name: Checkout Deployment Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.settings-plan.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Authenticate Settings Writer
        env:
          TARGET: ${{ matrix.target }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: python3 deploy/prod/cd/vault-auth.py --role "prod-settings-$TARGET"
      - name: Publish Declared GitHub Inputs To Vault
        env:
          TARGET: ${{ matrix.target }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          GH_VARIABLES_JSON: ${{ toJSON(vars) }}
          GH_SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          python3 deploy/prod/cd/github-settings.py sync --target "$TARGET" \
            --journal "$RUNNER_TEMP/settings/journal-$TARGET.json" \
            --output "$RUNNER_TEMP/settings/summary-$TARGET.json"
      - name: Preserve Settings Versions For Recovery
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-${{ github.run_attempt }}-journal-${{ matrix.target }}
          path: ${{ runner.temp }}/settings/*.json
          if-no-files-found: ignore
          retention-days: 30

  finalize-settings:
    name: Finalize Settings And Deployment Scope
    needs: [settings-plan, sync-settings]
    if: >
      !cancelled() && needs.settings-plan.result == 'success' &&
      (needs.sync-settings.result == 'success' || needs.sync-settings.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      attempt: ${{ needs.settings-plan.outputs.attempt }}
      matrix: ${{ steps.plan.outputs.matrix }}
      image_matrix: ${{ steps.plan.outputs.image_matrix }}
      resources: ${{ steps.plan.outputs.resources }}
      reference_versions: ${{ steps.plan.outputs.reference_versions }}
      vault: ${{ steps.plan.outputs.vault }}
      config: ${{ steps.plan.outputs.config }}
      applications: ${{ steps.plan.outputs.applications }}
    steps:
      - name: Checkout Deployment Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.settings-plan.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Read Rollout Metadata
        uses: actions/download-artifact@v8
        with:
          pattern: settings-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/settings
      - name: Resolve Images And Required Infrastructure
        id: plan
        run: python3 deploy/prod/cd/rollout-settings.py finalize --directory "$RUNNER_TEMP/settings"

  prepare:
    name: Prepare Deployment
    needs: [finalize-settings]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.finalize-settings.result == 'success' }}
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      image-matrix: ${{ needs.finalize-settings.outputs.image_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve Release Version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] &&
             ! git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          fi

  build-images:
    name: Build And Push cowork-${{ matrix.service }}
    needs: prepare
    # Release tags and deployment images have separate lifecycles. A selected
    # deployment always gets sha-<sha>, even when VERSION did not change.
    # One source-selection job is intentionally skipped for each trigger.
    if: >
      !cancelled() && !inputs.check_only && needs.prepare.result == 'success' &&
      needs.prepare.outputs.image-matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.image-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.image_sha }}

      - name: Log In To GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push Image
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          environment: prod
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          push: 'true'
          # sha-<sha> 태그는 deploy job이 항상 pull해야 하므로 매번 push한다.
          # v<version> 태그는 should_release가 true일 때만 붙여서, 이미 릴리스된
          # 버전 태그가 뒤이은 커밋들로 조용히 재지정되지 않게 한다.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/cowork-${{ matrix.service }}:sha-${{ matrix.image_sha }}
            ${{ needs.prepare.outputs.should_release == 'true' && format('ghcr.io/{0}/cowork-{1}:v{2}', needs.prepare.outputs.owner, matrix.service, needs.prepare.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.image_sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}

  release:
    name: Create Release
    needs:
      - prepare
      - build-images
    if: >
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.should_release == 'true' &&
      (needs.build-images.result == 'success' ||
       (needs.prepare.outputs.image-matrix == '{"include":[]}' && needs.build-images.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create Release And Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  deployment-plan:
    name: Require All Selected Image Builds
    needs: [prepare, build-images, release, finalize-settings]
    if: >
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.build-images.result == 'success' ||
       (needs.build-images.result == 'skipped' &&
        (inputs.check_only || needs.prepare.outputs.image-matrix == '{"include":[]}'))) &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      attempt: ${{ needs.finalize-settings.outputs.attempt }}
      vault: ${{ needs.finalize-settings.outputs.vault }}
      config: ${{ needs.finalize-settings.outputs.config }}
      applications: ${{ needs.finalize-settings.outputs.applications }}
      reference_versions: ${{ needs.finalize-settings.outputs.reference_versions }}
    steps:
      - name: Confirm Deployment Inputs
        run: echo 'Selected images and settings are ready'

  deploy-vault:
    name: Deploy Vault
    needs: [deployment-plan]
    if: >
      always() && needs.deployment-plan.result == 'success' &&
      needs.deployment-plan.outputs.vault != '{"include":[]}'
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    environment: Prod-CD(${{ matrix.target }})
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deployment-plan.outputs.vault) }}
    steps:
      - name: Checkout Deployment Tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.deployment-plan.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Deploy Target
        uses: ./.github/actions/deploy-target
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          image_sha: ${{ matrix.image_sha }}
          reference_versions: ${{ needs.deployment-plan.outputs.reference_versions }}
          check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only || false }}
          vault_recovery: ${{ inputs.vault_recovery || false }}
          vault_addr: ${{ vars.VAULT_ADDR }}
          vault_kv_mount: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          vault_token: ${{ secrets.VAULT_DEPLOY_READ_TOKEN }}
          vault_bootstrap_json: ${{ inputs.vault_recovery && secrets.VAULT_BOOTSTRAP_JSON || '' }}

  apply-infrastructure:
    name: Apply Infrastructure
    needs: [deployment-plan, deploy-vault, finalize-settings]
    if: >
      !cancelled() && needs.deployment-plan.result == 'success' &&
      (needs.deploy-vault.result == 'success' || needs.deploy-vault.result == 'skipped') &&
      (github.event_name == 'workflow_run' || inputs.service == 'infrastructure' ||
       needs.finalize-settings.outputs.resources != '')
    permissions:
      contents: read
      deployments: write
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Prod-IaC
    steps:
      - name: Read The Selected Infrastructure Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.finalize-settings.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Pinned IaC Tools
        run: python -m pip install --disable-pip-version-check -r deploy/iac/requirements.txt
      - name: Validate Or Apply The Infrastructure Source
        id: full
        if: ${{ github.event_name == 'workflow_run' || inputs.service == 'infrastructure' }}
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CHECK_ONLY: ${{ inputs.check_only && 'true' || 'false' }}
          AUTOMATIC: ${{ github.event_name != 'workflow_dispatch' && 'true' || 'false' }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          VAULT_REFERENCE_VERSIONS: ${{ needs.finalize-settings.outputs.reference_versions }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          options=(--sha "$RELEASE_SHA"
            --work-directory "$RUNNER_TEMP/cowork-iac-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          [ "$CHECK_ONLY" != true ] || options+=(--check-only)
          [ "$AUTOMATIC" != true ] || options+=(--automatic)
          python deploy/iac/run.py "${options[@]}"
      - name: Validate Or Apply Changed Infrastructure Settings
        if: >
          needs.finalize-settings.outputs.resources != '' &&
          steps.full.outputs.result != 'applied' && steps.full.outputs.result != 'checked'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          CHECK_ONLY: ${{ inputs.check_only && 'true' || 'false' }}
          SETTINGS_TARGETS: ${{ needs.finalize-settings.outputs.resources }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          VAULT_REFERENCE_VERSIONS: ${{ needs.finalize-settings.outputs.reference_versions }}
        run: |
          set -euo pipefail
          # A full apply already includes these resources. Settings-only changes
          # still require reconciliation when the infrastructure Git diff is empty.
          options=(--sha "$RELEASE_SHA" --settings-targets "$SETTINGS_TARGETS"
            --work-directory "$RUNNER_TEMP/cowork-settings-iac-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          [ "$CHECK_ONLY" != true ] || options+=(--check-only)
          python deploy/iac/run.py "${options[@]}"
      - name: Remove Any Remaining Plaintext Inputs
        if: always()
        env:
          PRIVATE_DIRECTORY: ${{ runner.temp }}/cowork-iac-${{ github.run_id }}-${{ github.run_attempt }}
          SETTINGS_DIRECTORY: ${{ runner.temp }}/cowork-settings-iac-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PYTHON'
          import os, shutil
          from pathlib import Path
          parent = Path(os.environ['RUNNER_TEMP']).resolve()
          for key, prefix in (('PRIVATE_DIRECTORY', 'cowork-iac-'), ('SETTINGS_DIRECTORY', 'cowork-settings-iac-')):
              directory = Path(os.environ[key])
              if directory.is_symlink() or directory.parent.resolve() != parent or not directory.name.startswith(prefix):
                  raise SystemExit('Invalid IaC cleanup path')
              if directory.exists():
                  shutil.rmtree(directory)
          PYTHON
  deploy-config:
    name: Deploy Config Server
    needs: [deployment-plan, deploy-vault, apply-infrastructure]
    if: >
      !cancelled() && needs.deployment-plan.result == 'success' &&
      needs.deployment-plan.outputs.config != '{"include":[]}' &&
      (needs.apply-infrastructure.result == 'success' || needs.apply-infrastructure.result == 'skipped') &&
      (needs.deploy-vault.result == 'success' || needs.deploy-vault.result == 'skipped')
    permissions:
      contents: read
      deployments: write
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    environment: Prod-CD(${{ matrix.target }})
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deployment-plan.outputs.config) }}
    steps:
      - name: Checkout Deployment Tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.deployment-plan.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Deploy Target
        uses: ./.github/actions/deploy-target
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          image_sha: ${{ matrix.image_sha }}
          reference_versions: ${{ needs.deployment-plan.outputs.reference_versions }}
          check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only || false }}
          vault_recovery: ${{ inputs.vault_recovery || false }}
          vault_addr: ${{ vars.VAULT_ADDR }}
          vault_kv_mount: ${{ vars.VAULT_KV_MOUNT || 'secret' }}

  deploy:
    name: Deploy (${{ matrix.target }})
    needs: [deployment-plan, deploy-vault, apply-infrastructure, deploy-config]
    if: >
      !cancelled() && needs.deployment-plan.result == 'success' &&
      needs.deployment-plan.outputs.applications != '{"include":[]}' &&
      (needs.apply-infrastructure.result == 'success' || needs.apply-infrastructure.result == 'skipped') &&
      (needs.deploy-vault.result == 'success' || needs.deploy-vault.result == 'skipped') &&
      (needs.deploy-config.result == 'success' || needs.deploy-config.result == 'skipped')
    permissions:
      contents: read
      deployments: write
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    environment: Prod-CD(${{ matrix.target }})
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # Empty projections can require peers to publish snapshots before readiness.
      # Let all selected application jobs start; do not cap this matrix's parallelism.
      matrix: ${{ fromJSON(needs.deployment-plan.outputs.applications) }}
    steps:
      - name: Checkout Deployment Tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.deployment-plan.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Deploy Target
        uses: ./.github/actions/deploy-target
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          image_sha: ${{ matrix.image_sha }}
          reference_versions: ${{ needs.deployment-plan.outputs.reference_versions }}
          check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only || false }}
          vault_recovery: ${{ inputs.vault_recovery || false }}
          vault_addr: ${{ vars.VAULT_ADDR }}
          vault_kv_mount: ${{ vars.VAULT_KV_MOUNT || 'secret' }}

  restore-settings:
    name: Restore Settings After Failure
    needs: [settings-plan, sync-settings, finalize-settings, prepare, build-images, release, deployment-plan, deploy-vault, apply-infrastructure, deploy-config, deploy]
    if: >
      always() && !inputs.check_only && needs.settings-plan.result == 'success' &&
      needs.sync-settings.result != 'skipped' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: Prod-IaC
    permissions:
      contents: read
      packages: read
      id-token: write
    outputs:
      attempt: ${{ needs.settings-plan.outputs.attempt }}
      config: ${{ steps.plan.outputs.config }}
      applications: ${{ steps.plan.outputs.applications }}
      reference_versions: ${{ steps.restore.outputs.reference_versions }}
      restoration: ${{ steps.restore.outcome }}
    steps:
      - name: Checkout Deployment Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.settings-plan.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Read Recovery Metadata
        uses: actions/download-artifact@v8
        with:
          pattern: settings-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/settings
      - name: Inspect Recovery Metadata
        id: scope
        run: python3 deploy/prod/cd/rollout-settings.py recovery-scope --directory "$RUNNER_TEMP/settings"
      - name: Authenticate Settings Recovery
        if: ${{ steps.scope.outputs.has_journals == 'true' }}
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
        run: python3 deploy/prod/cd/vault-auth.py --role prod-settings-recovery
      - name: Restore Previous Vault Versions
        if: ${{ steps.scope.outputs.has_journals == 'true' }}
        id: restore
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
        run: |
          chmod 600 "$RUNNER_TEMP/settings/"*.json
          python3 deploy/prod/cd/github-settings.py rollback --journal "$RUNNER_TEMP/settings" \
            --output "$RUNNER_TEMP/restored-settings.json"
      - name: Set Up Python For Infrastructure Recovery
        if: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.resource_targets != '[]' && needs.apply-infrastructure.result != 'skipped' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Infrastructure Recovery Dependencies
        if: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.resource_targets != '[]' && needs.apply-infrastructure.result != 'skipped' }}
        run: python3 -m pip install --disable-pip-version-check -r deploy/iac/requirements.txt
      - name: Reapply Previous Infrastructure Credentials
        if: ${{ steps.restore.outcome == 'success' && steps.restore.outputs.resource_targets != '[]' && needs.apply-infrastructure.result != 'skipped' }}
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          VAULT_REFERENCE_VERSIONS: ${{ steps.restore.outputs.reference_versions }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RESOURCE_TARGETS: ${{ steps.restore.outputs.resource_targets }}
        run: |
          set -euo pipefail
          targets="$(python3 -c 'import json,os; print(",".join(json.loads(os.environ["RESOURCE_TARGETS"])))')"
          # run.py authenticates a separate prod-iac token before reading inventory.
          python3 deploy/iac/run.py --sha "$RELEASE_SHA" \
            --work-directory "$RUNNER_TEMP/cowork-restore-iac-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --settings-targets "$targets"
      - name: Select Previous Images
        id: plan
        run: python3 deploy/prod/cd/rollout-settings.py recovery --directory "$RUNNER_TEMP/settings"
      - name: Preserve Recovery Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-${{ github.run_attempt }}-recovery
          path: |
            ${{ runner.temp }}/settings/*.json
            ${{ runner.temp }}/restored-settings.json
          retention-days: 30
      - name: Remove Remaining Infrastructure Recovery Inputs
        if: always()
        env:
          PRIVATE_DIRECTORY: ${{ runner.temp }}/cowork-restore-iac-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PYTHON'
          import os, shutil
          from pathlib import Path
          directory = Path(os.environ['PRIVATE_DIRECTORY'])
          parent = Path(os.environ['RUNNER_TEMP']).resolve()
          if directory.is_symlink() or directory.parent.resolve() != parent or not directory.name.startswith('cowork-restore-iac-'):
              raise SystemExit('Invalid infrastructure recovery cleanup path')
          if directory.exists():
              shutil.rmtree(directory)
          PYTHON

  restore-config:
    name: Restore Previous Config Server
    needs: [restore-settings]
    if: >
      always() && needs.restore-settings.result == 'success' &&
      needs.restore-settings.outputs.config != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: read
      id-token: write
    environment: Prod-CD(${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.restore-settings.outputs.config) }}
    steps:
      - name: Checkout Deployment Tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.restore-settings.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Recreate With Previous Image And Restored Settings
        uses: ./.github/actions/deploy-target
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          sha: ${{ matrix.source_sha }}
          image_sha: ${{ matrix.image_sha }}
          reference_versions: ${{ needs.restore-settings.outputs.reference_versions }}
          vault_addr: ${{ vars.VAULT_ADDR }}
          vault_kv_mount: ${{ vars.VAULT_KV_MOUNT || 'secret' }}

  restore-applications:
    name: Restore Previous Application
    needs: [restore-settings, restore-config]
    if: >
      always() && needs.restore-settings.result == 'success' &&
      needs.restore-settings.outputs.applications != '{"include":[]}' && (needs.restore-config.result == 'success' || needs.restore-config.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      packages: read
      id-token: write
    environment: Prod-CD(${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.restore-settings.outputs.applications) }}
    steps:
      - name: Checkout Deployment Tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require This Attempt's Settings Plan
        env:
          SETTINGS_ATTEMPT: ${{ needs.restore-settings.outputs.attempt }}
        run: python3 deploy/prod/cd/rollout-settings.py check-attempt
      - name: Recreate With Previous Image And Restored Settings
        uses: ./.github/actions/deploy-target
        with:
          service: ${{ matrix.service }}
          target: ${{ matrix.target }}
          sha: ${{ matrix.source_sha }}
          image_sha: ${{ matrix.image_sha }}
          reference_versions: ${{ needs.restore-settings.outputs.reference_versions }}
          vault_addr: ${{ vars.VAULT_ADDR }}
          vault_kv_mount: ${{ vars.VAULT_KV_MOUNT || 'secret' }}

  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    env:
      RESULT_LABELS: '{"success":"성공","failure":"실패","cancelled":"취소됨","skipped":"건너뜀","neutral":"중립","timed_out":"시간 초과","action_required":"조치 필요","stale":"만료됨"}'
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
      - deployment-plan
      - deploy-vault
      - apply-infrastructure
      - deploy-config
      - deploy
      - manual-request
      - settings-plan
      - sync-settings
      - finalize-settings
      - restore-settings
      - restore-config
      - restore-applications
    if: >
      always() && github.repository == 'team-cowork/cowork-server' && (
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )

    steps:
      - name: Get Short SHA
        id: sha
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "short=${RELEASE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.prepare.result }} ${{ needs.build-images.result }} ${{ needs.release.result }} ${{ needs.detect-changes.result }} ${{ needs.deployment-plan.result }} ${{ needs.deploy-vault.result }} ${{ needs.apply-infrastructure.result }} ${{ needs.deploy-config.result }} ${{ needs.deploy.result }} ${{ needs.manual-request.result }} ${{ needs.sync-settings.result }} ${{ needs.finalize-settings.result }} ${{ needs.settings-plan.result }} ${{ needs.restore-settings.result }} ${{ needs.restore-config.result }} ${{ needs.restore-applications.result }}"
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status="success"
          color="0x4CAF50"
          ran="false"
          for res in ${RESULTS}; do
            [ "$res" = "skipped" ] || ran="true"
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          # 상위 CI 실패 등으로 job이 하나도 실행되지 않으면 배포 성공으로 알리지 않는다.
          run_desc="실행됨"
          if [ "${ran}" = "false" ]; then
            status="cancelled"
            color="0xFFA500"
            run_desc="실행되지 않음"
          fi

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            release_desc="v${VERSION} (생성 완료)"
          elif [ -n "${VERSION}" ]; then
            release_desc="v${VERSION} (기존 릴리스 유지)"
          else
            release_desc="해당 없음"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "release_desc=${release_desc}" >> "$GITHUB_OUTPUT"
          echo "run_desc=${run_desc}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          title: "[${{ fromJSON(env.RESULT_LABELS)[steps.status.outputs.status] || '확인 불가' }}] cowork 운영 배포"
          description: |
            **저장소:** ${{ github.repository }}
            `${{ github.event.workflow_run.head_branch || github.ref_name }}` · `${{ steps.sha.outputs.short }}` · 실행자 **${{ github.actor }}**
            **릴리스:** ${{ steps.status.outputs.release_desc }}
            **작업:** ${{ github.event_name == 'workflow_dispatch' && '설정 반영 및 재배포' || '릴리스 배포' }}
            **선행 CI:** ${{ github.event_name == 'workflow_dispatch' && '해당 없음 (수동 실행)' || fromJSON(env.RESULT_LABELS)[github.event.workflow_run.conclusion] || '확인 불가' }} · **실행 여부:** ${{ steps.status.outputs.run_desc }}
            **대상:** ${{ needs.manual-request.outputs.services-list || needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **배포 준비:** ${{ fromJSON(env.RESULT_LABELS)[needs.prepare.result] || '확인 불가' }}
            **이미지 빌드:** ${{ fromJSON(env.RESULT_LABELS)[needs.build-images.result] || '확인 불가' }}
            **릴리스:** ${{ fromJSON(env.RESULT_LABELS)[needs.release.result] || '확인 불가' }}
            **변경 사항 확인:** ${{ fromJSON(env.RESULT_LABELS)[needs.detect-changes.result] || '확인 불가' }}
            **배포 계획:** ${{ fromJSON(env.RESULT_LABELS)[needs.deployment-plan.result] || '확인 불가' }}
            **Vault:** ${{ fromJSON(env.RESULT_LABELS)[needs.deploy-vault.result] || '확인 불가' }}
            **인프라:** ${{ fromJSON(env.RESULT_LABELS)[needs.apply-infrastructure.result] || '확인 불가' }}
            **설정 서버:** ${{ fromJSON(env.RESULT_LABELS)[needs.deploy-config.result] || '확인 불가' }}
            **배포:** ${{ fromJSON(env.RESULT_LABELS)[needs.deploy.result] || '확인 불가' }}
            **수동 실행 요청:** ${{ fromJSON(env.RESULT_LABELS)[needs.manual-request.result] || '확인 불가' }}
            **설정 동기화:** ${{ fromJSON(env.RESULT_LABELS)[needs.sync-settings.result] || '확인 불가' }}
            **설정 복구:** ${{ fromJSON(env.RESULT_LABELS)[needs.restore-settings.outputs.restoration || needs.restore-settings.result] || '확인 불가' }}
            **설정 서버 복구:** ${{ fromJSON(env.RESULT_LABELS)[needs.restore-config.result] || '확인 불가' }}
            **애플리케이션 복구:** ${{ fromJSON(env.RESULT_LABELS)[needs.restore-applications.result] || '확인 불가' }}
