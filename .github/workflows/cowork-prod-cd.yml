name: cowork prod CD Workflow

on:
  workflow_run:
    workflows: ["cowork prod CI Workflow"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      operation:
        description: Manual operation (automatic CI completion keeps the normal release flow)
        required: true
        type: choice
        options: [redeploy, update-config]
      target:
        description: Vault deployment target or application service name (application for shared properties)
        required: true
        type: string
      service:
        description: Deployment unit (redeploy only)
        type: choice
        options: [config, gateway, authorization, user, team, channel, project, roadmap, notification, preference, chat, voice, monitoring, vault, log-agent]
      sha:
        description: Full main commit SHA with an existing image (redeploy only)
        type: string
      configuration_version:
        description: Vault deployment version (0 selects latest; redeploy only)
        default: '0'
        type: string
      check_only:
        description: Validate settings without starting containers (redeploy only)
        default: true
        type: boolean
      vault_recovery:
        description: Use VAULT_BOOTSTRAP_JSON for Vault recovery (redeploy only)
        default: false
        type: boolean
      scope:
        description: Vault document type (update-config only)
        default: deployment
        type: choice
        options: [deployment, application]
      profile:
        description: Application profile path (update-config only; deployment uses base)
        default: base
        type: choice
        options: [base, local, prod]
      expected_version:
        description: Current KV version; 0 creates a new path (update-config only)
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-request:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.request.outputs.matrix }}
      services-list: ${{ steps.request.outputs.services-list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.operation == 'redeploy' && inputs.sha || github.sha }}
          fetch-depth: 0
      - name: Validate manual request
        id: request
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET: ${{ inputs.target }}
          SERVICE: ${{ inputs.service }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$TARGET" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
          case "$OPERATION" in
            redeploy)
              [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
              test -f "deploy/prod/services/$SERVICE.sh"
              test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
              git merge-base --is-ancestor "$RELEASE_SHA" origin/main
              ;;
            update-config) ;;
            *) echo 'Unknown manual operation' >&2; exit 1 ;;
          esac
          python3 - <<'PYTHON'
          import json, os
          target, service = os.environ["TARGET"], os.environ["SERVICE"]
          deploy = os.environ["OPERATION"] == "redeploy"
          matrix = {"include": [{"service": service, "target": target}] if deploy else []}
          summary = f"{service} ({target})" if deploy else f"Vault configuration ({target})"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write("services-list=" + summary + "\n")
          PYTHON

  prepare:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      image-matrix: ${{ steps.images.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve production image inputs
        id: images
        run: python3 deploy/images/build-matrix.py --environment prod

  build-images:
    name: Build and push cowork-${{ matrix.service }}
    needs: prepare
    # should_release는 "v<version> 태그/릴리스를 새로 만들지"만 결정해야 한다 — sha-<sha>
    # 이미지는 release job과 무관하게 매 성공한 커밋마다 항상 push돼야 deploy job이
    # 기대하는 이미지를 항상 찾을 수 있다. 예전엔 이 job 자체가 should_release로
    # 걸려 있어서, VERSION을 안 올린 커밋은 이미지가 아예 안 만들어지고 deploy만
    # 그대로 실행돼 docker pull이 실패했다(리뷰 지적).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.image-matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          environment: prod
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          push: 'true'
          # sha-<sha> 태그는 deploy job이 항상 pull해야 하므로 매번 push한다.
          # v<version> 태그는 should_release가 true일 때만 붙여서, 이미 릴리스된
          # 버전 태그가 뒤이은 커밋들로 조용히 재지정되지 않게 한다.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/cowork-${{ matrix.service }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ needs.prepare.outputs.should_release == 'true' && format('ghcr.io/{0}/cowork-{1}:v{2}', needs.prepare.outputs.owner, matrix.service, needs.prepare.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}

  release:
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  detect-changes:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      deployments: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Checkout deployment tracking tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .deployment-tools
      - name: Compare each target with its last successful deployment
        id: build-matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .deployment-tools/deploy/prod/build-matrix.py

  deployment-plan:
    needs: [prepare, build-images, release, detect-changes, manual-request]
    if: >
      always() && (
        (github.event_name == 'workflow_run' &&
         needs.detect-changes.result == 'success' &&
         needs.prepare.result == 'success' &&
         needs.build-images.result == 'success' &&
         (needs.release.result == 'success' || needs.release.result == 'skipped')) ||
        (github.event_name == 'workflow_dispatch' && inputs.operation == 'redeploy' &&
         needs.manual-request.result == 'success')
      )
    runs-on: ubuntu-latest
    outputs:
      vault: ${{ steps.waves.outputs.vault }}
      config: ${{ steps.waves.outputs.config }}
      applications: ${{ steps.waves.outputs.applications }}
    steps:
      - name: Order Vault, Config Server and remaining services
        id: waves
        env:
          DEPLOY_MATRIX: ${{ needs.manual-request.outputs.matrix || needs.detect-changes.outputs.matrix }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          units = json.loads(os.environ['DEPLOY_MATRIX'])['include']
          waves = {'vault': [], 'config': [], 'applications': []}
          for unit in units:
              wave = unit['service'] if unit['service'] in {'vault', 'config'} else 'applications'
              waves[wave].append(unit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for wave, units in waves.items():
                  output.write(wave + '=' + json.dumps({'include': units}, separators=(',', ':')) + '\n')
          PYTHON

  deploy-vault:
    needs: [deployment-plan]
    if: >
      always() && needs.deployment-plan.result == 'success' &&
      needs.deployment-plan.outputs.vault != '{"include":[]}'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/cowork-deploy-wave.yml
    secrets: inherit
    with:
      matrix: ${{ needs.deployment-plan.outputs.vault }}
      sha: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      tools_ref: ${{ github.workflow_sha }}
      check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only || false }}
      configuration_version: ${{ inputs.configuration_version || '0' }}
      vault_recovery: ${{ inputs.vault_recovery || false }}

  deploy-config:
    needs: [deployment-plan, deploy-vault]
    if: >
      always() && needs.deployment-plan.result == 'success' &&
      needs.deployment-plan.outputs.config != '{"include":[]}' &&
      (needs.deploy-vault.result == 'success' || needs.deploy-vault.result == 'skipped')
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/cowork-deploy-wave.yml
    secrets: inherit
    with:
      matrix: ${{ needs.deployment-plan.outputs.config }}
      sha: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      tools_ref: ${{ github.workflow_sha }}
      check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only || false }}
      configuration_version: ${{ inputs.configuration_version || '0' }}
      vault_recovery: ${{ inputs.vault_recovery || false }}

  deploy:
    needs: [deployment-plan, deploy-vault, deploy-config]
    if: >
      always() && needs.deployment-plan.result == 'success' &&
      needs.deployment-plan.outputs.applications != '{"include":[]}' &&
      (needs.deploy-vault.result == 'success' || needs.deploy-vault.result == 'skipped') &&
      (needs.deploy-config.result == 'success' || needs.deploy-config.result == 'skipped')
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/cowork-deploy-wave.yml
    secrets: inherit
    with:
      matrix: ${{ needs.deployment-plan.outputs.applications }}
      sha: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      tools_ref: ${{ github.workflow_sha }}
      check_only: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only || false }}
      configuration_version: ${{ inputs.configuration_version || '0' }}
      vault_recovery: ${{ inputs.vault_recovery || false }}

  update-config:
    needs: manual-request
    if: inputs.operation == 'update-config'
    runs-on: ubuntu-latest
    environment: Config-Update(${{ inputs.target }})
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Replace Vault document with CAS protection
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          VAULT_TOKEN: ${{ secrets.VAULT_CONFIG_WRITE_TOKEN }}
          VAULT_UPDATE_JSON: ${{ secrets.VAULT_UPDATE_JSON }}
          TARGET: ${{ inputs.target }}
          SCOPE: ${{ inputs.scope }}
          PROFILE: ${{ inputs.profile }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          python3 deploy/prod/vault-settings.py update --target "$TARGET" --scope "$SCOPE" \
            --profile "$PROFILE" --expected-version "$EXPECTED_VERSION"

  notify:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
      - deployment-plan
      - deploy-vault
      - deploy-config
      - deploy
      - manual-request
      - update-config
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || (inputs.operation == 'redeploy' && inputs.sha) || github.sha }}
        run: echo "short=${RELEASE_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.prepare.result }} ${{ needs.build-images.result }} ${{ needs.release.result }} ${{ needs.detect-changes.result }} ${{ needs.deployment-plan.result }} ${{ needs.deploy-vault.result }} ${{ needs.deploy-config.result }} ${{ needs.deploy.result }} ${{ needs.manual-request.result }} ${{ needs.update-config.result }}"
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            release_desc="v${VERSION} (created)"
          elif [ -n "${VERSION}" ]; then
            release_desc="v${VERSION} (skipped - already exists)"
          else
            release_desc="N/A"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "release_desc=${release_desc}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Prod CD"
          description: |
            `${{ github.event.workflow_run.head_branch || 'main' }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Release:** ${{ steps.status.outputs.release_desc }}
            **Operation:** ${{ inputs.operation || 'release' }}
            **Target:** ${{ needs.manual-request.outputs.services-list || needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Prepare:** ${{ needs.prepare.result }}
            **Build Images:** ${{ needs.build-images.result }}
            **Release:** ${{ needs.release.result }}
            **Detect Changes:** ${{ needs.detect-changes.result }}
            **Deployment Plan:** ${{ needs.deployment-plan.result }}
            **Vault:** ${{ needs.deploy-vault.result }}
            **Config Server:** ${{ needs.deploy-config.result }}
            **Deploy:** ${{ needs.deploy.result }}
            **Manual Request:** ${{ needs.manual-request.result }}
            **Update Config:** ${{ needs.update-config.result }}
