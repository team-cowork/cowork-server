name: cowork prod CD Workflow

on:
  workflow_run:
    workflows: ["cowork prod CI Workflow"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  build-images:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    # should_release는 "v<version> 태그/릴리스를 새로 만들지"만 결정해야 한다 — sha-<sha>
    # 이미지는 release job과 무관하게 매 성공한 커밋마다 항상 push돼야 deploy job이
    # 기대하는 이미지를 항상 찾을 수 있다. 예전엔 이 job 자체가 should_release로
    # 걸려 있어서, VERSION을 안 올린 커밋은 이미지가 아예 안 만들어지고 deploy만
    # 그대로 실행돼 docker pull이 실패했다(리뷰 지적).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cowork-config
            context: .
            dockerfile: ./cowork-config/prod.dockerfile
          - service: cowork-gateway
            context: .
            dockerfile: ./cowork-gateway/prod.dockerfile
          - service: cowork-authorization
            context: ./cowork-authorization
            dockerfile: ./cowork-authorization/prod.dockerfile
          - service: cowork-preference
            context: ./cowork-preference
            dockerfile: ./cowork-preference/prod.dockerfile
          - service: cowork-user
            context: ./cowork-user
            dockerfile: ./cowork-user/prod.dockerfile
          - service: cowork-team
            context: .
            dockerfile: ./cowork-team/prod.dockerfile
          - service: cowork-channel
            context: .
            dockerfile: ./cowork-channel/prod.dockerfile
          - service: cowork-notification
            context: ./cowork-notification
            dockerfile: ./cowork-notification/prod.dockerfile
          - service: cowork-chat
            context: ./cowork-chat
            dockerfile: ./cowork-chat/prod.dockerfile
          - service: cowork-voice
            context: ./cowork-voice
            dockerfile: ./cowork-voice/prod.dockerfile
          - service: cowork-project
            context: ./cowork-project
            dockerfile: ./cowork-project/prod.dockerfile
          - service: cowork-roadmap
            context: .
            dockerfile: ./cowork-roadmap/prod.dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          # sha-<sha> 태그는 deploy job이 항상 pull해야 하므로 매번 push한다.
          # v<version> 태그는 should_release가 true일 때만 붙여서, 이미 릴리스된
          # 버전 태그가 뒤이은 커밋들로 조용히 재지정되지 않게 한다.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ needs.prepare.outputs.should_release == 'true' && format('ghcr.io/{0}/{1}:v{2}', needs.prepare.outputs.owner, matrix.service, needs.prepare.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 20
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            team:
              - 'cowork-team/**'
            channel:
              - 'cowork-channel/**'
            authorization:
              - 'cowork-authorization/**'
            user:
              - 'cowork-user/**'
            project:
              - 'cowork-project/**'
            preference:
              - 'cowork-preference/**'
            chat:
              - 'cowork-chat/**'
            voice:
              - 'cowork-voice/**'
            notification:
              - 'cowork-notification/**'
            gateway:
              - 'cowork-gateway/**'
              - 'scripts/run/prod/gateway.sh'
            config:
              - 'cowork-config/**'
              - 'scripts/run/prod/config.sh'
            roadmap:
              - 'cowork-roadmap/**'
              - 'scripts/run/prod/roadmap.sh'
            monitoring:
              - 'cowork-monitoring/**'
              - 'scripts/run/prod/monitoring.sh'
              # monitoring.sh가 이제 docker compose -f docker-compose.yml -f
              # docker-compose.prod.yml을 명시적으로 호출하므로(리뷰 지적), 그
              # 파일들만 바뀐 커밋도 배포를 일으켜야 서버가 저장소보다 뒤처지지 않는다.
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
      - name: Build deploy matrix
        id: build-matrix
        run: |
          INCLUDE="[]"
          SERVICES=""
          add() {
            local name=$1 port=$2 changed=$3
            if [ "$changed" == "true" ]; then
              INCLUDE=$(echo "$INCLUDE" | jq -c --arg n "$name" --arg p "$port" '. += [{"service":$n,"port":$p}]')
              SERVICES="${SERVICES:+$SERVICES, }$name"
            fi
          }
          add team           21108 "${{ steps.filter.outputs.team }}"
          add channel        24118 "${{ steps.filter.outputs.channel }}"
          add authorization  24125 "${{ steps.filter.outputs.authorization }}"
          add user           21133 "${{ steps.filter.outputs.user }}"
          add project        24134 "${{ steps.filter.outputs.project }}"
          add preference     24153 "${{ steps.filter.outputs.preference }}"
          add chat           27108 "${{ steps.filter.outputs.chat }}"
          add voice          27109 "${{ steps.filter.outputs.voice }}"
          add notification   27110 "${{ steps.filter.outputs.notification }}"
          add gateway        21108 "${{ steps.filter.outputs.gateway }}"
          add config         21108 "${{ steps.filter.outputs.config }}"
          add monitoring     21108 "${{ steps.filter.outputs.monitoring }}"
          add roadmap        27112 "${{ steps.filter.outputs.roadmap }}"
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "services-list=${SERVICES:-none}" >> "$GITHUB_OUTPUT"
          echo "Deploy matrix: $INCLUDE"

  deploy:
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
    if: >
      always() &&
      needs.detect-changes.outputs.matrix != '{"include":[]}' &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Deploy cowork-${{ matrix.service }}
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_IMAGE_OWNER: ${{ needs.prepare.outputs.owner }}
          DEPLOY_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          # MySQL을 실제로 쓰는 서비스에만 비밀번호를 실어 보낸다(리뷰 지적: 예전엔
          # roadmap 하나만 쓰는데 매트릭스의 전 서비스 SSH 세션에 실렸다).
          COWORK_MYSQL_PASSWORD: ${{ contains(fromJSON('["team","channel","authorization","user","project","notification","roadmap"]'), matrix.service) && secrets.COWORK_MYSQL_PASSWORD || '' }}
        with:
          host: ${{ secrets.COWORK_SSH_HOST }}
          port: ${{ matrix.port }}
          username: ubuntu
          key: ${{ secrets.CD_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_IMAGE_OWNER,DEPLOY_IMAGE_TAG,COWORK_MYSQL_PASSWORD
          script: |
            set -euo pipefail

            # 같은 VM에 여러 서비스가 동시에 배포될 수 있어(예: 21108의 team/gateway/
            # config/monitoring), 공유 클론의 git 작업만 VM 단위로 직렬화한다. 실제
            # docker run/헬스체크는 잠금을 풀고 병렬로 진행한다(리뷰 지적).
            exec 9>/tmp/cowork-cd-git.lock
            flock -w 120 9

            if [ ! -d ~/cowork-server/.git ]; then
              echo "cloning cowork-server (first deploy on this VM)"
              git clone https://github.com/team-cowork/cowork-server.git ~/cowork-server
            fi
            cd ~/cowork-server
            git fetch origin --quiet

            CHECKOUT_ERR="$(mktemp)"
            if git checkout "${DEPLOY_SHA}" -- "scripts/run/prod/${{ matrix.service }}.sh" 2>"${CHECKOUT_ERR}"; then
              flock -u 9
              bash ~/cowork-server/scripts/run/prod/${{ matrix.service }}.sh
            elif grep -q "did not match any file" "${CHECKOUT_ERR}"; then
              # 이 서비스는 아직 scripts/run/prod/로 안 옮겨졌다는 뜻 — 기존 서버-로컬
              # 스크립트로 폴백하는 건 정상 동작이다.
              flock -u 9
              bash -e ~/deploy-${{ matrix.service }}.sh
            else
              # 그 외 실패(클론 손상, DEPLOY_SHA를 못 찾음 등)는 예전엔 `|| true`로
              # 삼켜서 조용히 낡은 스크립트가 돌고 CD는 성공으로 보고했다(리뷰 지적).
              # 이제는 명확히 실패시킨다.
              echo "git checkout failed unexpectedly:" >&2
              cat "${CHECKOUT_ERR}" >&2
              exit 1
            fi

  notify:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
      - deploy
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.prepare.result }} ${{ needs.build-images.result }} ${{ needs.release.result }} ${{ needs.detect-changes.result }} ${{ needs.deploy.result }}"
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            release_desc="v${VERSION} (created)"
          elif [ -n "${VERSION}" ]; then
            release_desc="v${VERSION} (skipped - already exists)"
          else
            release_desc="N/A"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "release_desc=${release_desc}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Prod CD"
          description: |
            `${{ github.event.workflow_run.head_branch || 'main' }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Release:** ${{ steps.status.outputs.release_desc }}
            **Deploy:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Prepare:** ${{ needs.prepare.result }}
            **Build Images:** ${{ needs.build-images.result }}
            **Release:** ${{ needs.release.result }}
            **Detect Changes:** ${{ needs.detect-changes.result }}
            **Deploy:** ${{ needs.deploy.result }}
