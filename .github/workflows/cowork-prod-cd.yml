name: Cowork Prod CD Workflow

on:
  workflow_run:
    workflows: ["Cowork Prod CI Workflow"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: 전체 클러스터 배포 또는 현재 Git 선언 상태 확인
        required: true
        type: choice
        default: apply
        options: [apply, release, plan]

permissions:
  contents: read

concurrency:
  # Bot writebacks must not displace queued production deployments.
  group: >-
    ${{ github.event_name == 'workflow_run' &&
        github.event.workflow_run.actor.login == 'cowork-server-versioning-bot[bot]' &&
        'cowork-version-writeback' || 'cowork-production' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Select Whole Cluster Release
    if: >-
      github.repository == 'team-cowork/cowork-server' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.actor.login != 'cowork-server-versioning-bot[bot]' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      matrix: ${{ steps.release.outputs.matrix }}
      sync_matrix: ${{ steps.release.outputs.sync_matrix }}
      owner: ${{ steps.release.outputs.owner }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Reserve Version And Select Image Inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_MODE: ${{ github.event_name == 'workflow_run' && 'release' || inputs.operation }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: python3 deploy/production/release.py prepare --output "$RUNNER_TEMP/release-plan.json"
      - name: Save Release Plan
        if: steps.release.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-input-plan
          overwrite: true
          path: ${{ runner.temp }}/release-plan.json
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Build cowork-${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.mode == 'release' && needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - name: Stamp Application Version
        if: matrix.application
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 deploy/production/release.py stamp --service "$SERVICE"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse Immutable Image On Retry
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 deploy/production/release.py reuse-image --service "$SERVICE"
      - name: Build And Verify Application Image
        if: matrix.application && steps.image.outputs.reuse != 'true'
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          environment: prod
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          push: 'true'
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/cowork-${{ matrix.service }}:sha-${{ env.RELEASE_SHA }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/cowork-${{ matrix.service }}:v${{ env.RELEASE_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=v${{ env.RELEASE_VERSION }}
      - name: Build Infrastructure Image
        if: ${{ !matrix.application && steps.image.outputs.reuse != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ needs.prepare.outputs.owner }}/cowork-${{ matrix.service }}:sha-${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
      - name: Record Registry Digest
        env:
          SERVICE: ${{ matrix.service }}
        run: python3 deploy/production/release.py record-image --service "$SERVICE" --output "$RUNNER_TEMP/image-$SERVICE.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-input-image-${{ matrix.service }}
          overwrite: true
          path: ${{ runner.temp }}/image-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 7

  sync-secrets:
    name: Pin Runtime Settings For ${{ matrix.service }}
    needs: [prepare, build-images]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'release' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: [self-hosted, linux, x64, cowork-deploy]
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.sync_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Read The Declared Python Version
        id: python-version
        run: |
          version=$(jq -er '.python.version' deploy/production/versions.json)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - name: Install Pinned Deployment Dependencies
        run: python3 -m pip install -r deploy/production/requirements.txt
      - name: Publish Declared Settings To Vault
        env:
          SERVICE: ${{ matrix.service }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          GH_VARIABLE_COWORK_GITHUB_ACCOUNT_SHARE_CLIENT_ID: ${{ contains(matrix.variable_names, 'COWORK_GITHUB_ACCOUNT_SHARE_CLIENT_ID') && vars.COWORK_GITHUB_ACCOUNT_SHARE_CLIENT_ID || '' }}
          GH_VARIABLE_COWORK_GITHUB_APP_ID: ${{ contains(matrix.variable_names, 'COWORK_GITHUB_APP_ID') && vars.COWORK_GITHUB_APP_ID || '' }}
          GH_VARIABLE_COWORK_GITHUB_APP_SLUG: ${{ contains(matrix.variable_names, 'COWORK_GITHUB_APP_SLUG') && vars.COWORK_GITHUB_APP_SLUG || '' }}
          GH_VARIABLE_DATAGSM_CLIENT_ID: ${{ contains(matrix.variable_names, 'DATAGSM_CLIENT_ID') && vars.DATAGSM_CLIENT_ID || '' }}
          GH_VARIABLE_DB_NAME: ${{ contains(matrix.variable_names, 'DB_NAME') && vars.DB_NAME || '' }}
          GH_VARIABLE_DB_USERNAME: ${{ contains(matrix.variable_names, 'DB_USERNAME') && vars.DB_USERNAME || '' }}
          GH_VARIABLE_FACEBOOK_ACCOUNT_SHARE_CLIENT_ID: ${{ contains(matrix.variable_names, 'FACEBOOK_ACCOUNT_SHARE_CLIENT_ID') && vars.FACEBOOK_ACCOUNT_SHARE_CLIENT_ID || '' }}
          GH_VARIABLE_FCM_DATA_ONLY: ${{ contains(matrix.variable_names, 'FCM_DATA_ONLY') && vars.FCM_DATA_ONLY || '' }}
          GH_VARIABLE_GOOGLE_ACCOUNT_SHARE_CLIENT_ID: ${{ contains(matrix.variable_names, 'GOOGLE_ACCOUNT_SHARE_CLIENT_ID') && vars.GOOGLE_ACCOUNT_SHARE_CLIENT_ID || '' }}
          GH_VARIABLE_GRAFANA_ROOT_URL: ${{ contains(matrix.variable_names, 'GRAFANA_ROOT_URL') && vars.GRAFANA_ROOT_URL || '' }}
          GH_VARIABLE_JIRA_ACCOUNT_SHARE_CLIENT_ID: ${{ contains(matrix.variable_names, 'JIRA_ACCOUNT_SHARE_CLIENT_ID') && vars.JIRA_ACCOUNT_SHARE_CLIENT_ID || '' }}
          GH_VARIABLE_JWT_ACCESS_EXPIRE: ${{ contains(matrix.variable_names, 'JWT_ACCESS_EXPIRE') && vars.JWT_ACCESS_EXPIRE || '' }}
          GH_VARIABLE_JWT_REFRESH_EXPIRE: ${{ contains(matrix.variable_names, 'JWT_REFRESH_EXPIRE') && vars.JWT_REFRESH_EXPIRE || '' }}
          GH_VARIABLE_LIVEKIT_WS_URL: ${{ contains(matrix.variable_names, 'LIVEKIT_WS_URL') && vars.LIVEKIT_WS_URL || '' }}
          GH_VARIABLE_NOTION_ACCOUNT_SHARE_CLIENT_ID: ${{ contains(matrix.variable_names, 'NOTION_ACCOUNT_SHARE_CLIENT_ID') && vars.NOTION_ACCOUNT_SHARE_CLIENT_ID || '' }}
          GH_VARIABLE_PUBLIC_API_BASE_URL: ${{ contains(matrix.variable_names, 'PUBLIC_API_BASE_URL') && vars.PUBLIC_API_BASE_URL || '' }}
          GH_VARIABLE_PUBLIC_WEB_ORIGINS: ${{ contains(matrix.variable_names, 'PUBLIC_WEB_ORIGINS') && vars.PUBLIC_WEB_ORIGINS || '' }}
          GH_VARIABLE_S3_BUCKET: ${{ contains(matrix.variable_names, 'S3_BUCKET') && vars.S3_BUCKET || '' }}
          GH_VARIABLE_S3_REGION: ${{ contains(matrix.variable_names, 'S3_REGION') && vars.S3_REGION || '' }}
          GH_SECRET_ACCOUNT_CREDENTIAL_ENCRYPTION_KEY: ${{ contains(matrix.secret_names, 'ACCOUNT_CREDENTIAL_ENCRYPTION_KEY') && secrets.ACCOUNT_CREDENTIAL_ENCRYPTION_KEY || '' }}
          GH_SECRET_ACCOUNT_SHARE_OAUTH_STATE_SECRET: ${{ contains(matrix.secret_names, 'ACCOUNT_SHARE_OAUTH_STATE_SECRET') && secrets.ACCOUNT_SHARE_OAUTH_STATE_SECRET || '' }}
          GH_SECRET_COWORK_GITHUB_ACCOUNT_SHARE_CLIENT_SECRET: ${{ contains(matrix.secret_names, 'COWORK_GITHUB_ACCOUNT_SHARE_CLIENT_SECRET') && secrets.COWORK_GITHUB_ACCOUNT_SHARE_CLIENT_SECRET || '' }}
          GH_SECRET_COWORK_GITHUB_INTERNAL_API_KEY: ${{ contains(matrix.secret_names, 'COWORK_GITHUB_INTERNAL_API_KEY') && secrets.COWORK_GITHUB_INTERNAL_API_KEY || '' }}
          GH_SECRET_COWORK_GITHUB_PRIVATE_KEY: ${{ contains(matrix.secret_names, 'COWORK_GITHUB_PRIVATE_KEY') && secrets.COWORK_GITHUB_PRIVATE_KEY || '' }}
          GH_SECRET_COWORK_GITHUB_WEBHOOK_SECRET: ${{ contains(matrix.secret_names, 'COWORK_GITHUB_WEBHOOK_SECRET') && secrets.COWORK_GITHUB_WEBHOOK_SECRET || '' }}
          GH_SECRET_DATAGSM_WEBHOOK_SECRET: ${{ contains(matrix.secret_names, 'DATAGSM_WEBHOOK_SECRET') && secrets.DATAGSM_WEBHOOK_SECRET || '' }}
          GH_SECRET_DB_ADMIN_PASSWORD: ${{ contains(matrix.secret_names, 'DB_ADMIN_PASSWORD') && secrets.DB_ADMIN_PASSWORD || '' }}
          GH_SECRET_DB_MONITORING_PASSWORD: ${{ contains(matrix.secret_names, 'DB_MONITORING_PASSWORD') && secrets.DB_MONITORING_PASSWORD || '' }}
          GH_SECRET_DB_PASSWORD: ${{ contains(matrix.secret_names, 'DB_PASSWORD') && secrets.DB_PASSWORD || '' }}
          GH_SECRET_DEV_ORIGIN_CREDENTIAL: ${{ contains(matrix.secret_names, 'DEV_ORIGIN_CREDENTIAL') && secrets.DEV_ORIGIN_CREDENTIAL || '' }}
          GH_SECRET_DISCORD_MONITORING_ALERT_WEBHOOK_URL: ${{ contains(matrix.secret_names, 'DISCORD_MONITORING_ALERT_WEBHOOK_URL') && secrets.DISCORD_MONITORING_ALERT_WEBHOOK_URL || '' }}
          GH_SECRET_DISCORD_CHAT_ERROR_WEBHOOK_URL: ${{ contains(matrix.secret_names, 'DISCORD_CHAT_ERROR_WEBHOOK_URL') && secrets.DISCORD_CHAT_ERROR_WEBHOOK_URL || '' }}
          GH_SECRET_ELASTICSEARCH_ADMIN_PASSWORD: ${{ contains(matrix.secret_names, 'ELASTICSEARCH_ADMIN_PASSWORD') && secrets.ELASTICSEARCH_ADMIN_PASSWORD || '' }}
          GH_SECRET_ELASTICSEARCH_URL: ${{ contains(matrix.secret_names, 'ELASTICSEARCH_URL') && secrets.ELASTICSEARCH_URL || '' }}
          GH_SECRET_FACEBOOK_ACCOUNT_SHARE_CLIENT_SECRET: ${{ contains(matrix.secret_names, 'FACEBOOK_ACCOUNT_SHARE_CLIENT_SECRET') && secrets.FACEBOOK_ACCOUNT_SHARE_CLIENT_SECRET || '' }}
          GH_SECRET_FCM_CREDENTIALS_JSON: ${{ contains(matrix.secret_names, 'FCM_CREDENTIALS_JSON') && secrets.FCM_CREDENTIALS_JSON || '' }}
          GH_SECRET_GOOGLE_ACCOUNT_SHARE_CLIENT_SECRET: ${{ contains(matrix.secret_names, 'GOOGLE_ACCOUNT_SHARE_CLIENT_SECRET') && secrets.GOOGLE_ACCOUNT_SHARE_CLIENT_SECRET || '' }}
          GH_SECRET_GRAFANA_ADMIN_PASSWORD: ${{ contains(matrix.secret_names, 'GRAFANA_ADMIN_PASSWORD') && secrets.GRAFANA_ADMIN_PASSWORD || '' }}
          GH_SECRET_JIRA_ACCOUNT_SHARE_CLIENT_SECRET: ${{ contains(matrix.secret_names, 'JIRA_ACCOUNT_SHARE_CLIENT_SECRET') && secrets.JIRA_ACCOUNT_SHARE_CLIENT_SECRET || '' }}
          GH_SECRET_JWT_SECRET: ${{ contains(matrix.secret_names, 'JWT_SECRET') && secrets.JWT_SECRET || '' }}
          GH_SECRET_KAFKA_CLUSTER_ID: ${{ contains(matrix.secret_names, 'KAFKA_CLUSTER_ID') && secrets.KAFKA_CLUSTER_ID || '' }}
          GH_SECRET_KAFKA_CREDENTIALS_JSON: ${{ contains(matrix.secret_names, 'KAFKA_CREDENTIALS_JSON') && secrets.KAFKA_CREDENTIALS_JSON || '' }}
          GH_SECRET_LIVEKIT_API_KEY: ${{ contains(matrix.secret_names, 'LIVEKIT_API_KEY') && secrets.LIVEKIT_API_KEY || '' }}
          GH_SECRET_LIVEKIT_API_SECRET: ${{ contains(matrix.secret_names, 'LIVEKIT_API_SECRET') && secrets.LIVEKIT_API_SECRET || '' }}
          GH_SECRET_NOTION_ACCOUNT_SHARE_CLIENT_SECRET: ${{ contains(matrix.secret_names, 'NOTION_ACCOUNT_SHARE_CLIENT_SECRET') && secrets.NOTION_ACCOUNT_SHARE_CLIENT_SECRET || '' }}
          GH_SECRET_S3_ACCESS_KEY: ${{ contains(matrix.secret_names, 'S3_ACCESS_KEY') && secrets.S3_ACCESS_KEY || '' }}
          GH_SECRET_S3_ADMIN_ACCESS_KEY: ${{ contains(matrix.secret_names, 'S3_ADMIN_ACCESS_KEY') && secrets.S3_ADMIN_ACCESS_KEY || '' }}
          GH_SECRET_S3_ADMIN_SECRET_KEY: ${{ contains(matrix.secret_names, 'S3_ADMIN_SECRET_KEY') && secrets.S3_ADMIN_SECRET_KEY || '' }}
          GH_SECRET_S3_SECRET_KEY: ${{ contains(matrix.secret_names, 'S3_SECRET_KEY') && secrets.S3_SECRET_KEY || '' }}
          GH_SECRET_TEAM_GITHUB_STATE_SECRET: ${{ contains(matrix.secret_names, 'TEAM_GITHUB_STATE_SECRET') && secrets.TEAM_GITHUB_STATE_SECRET || '' }}
          GH_SECRET_WEBHOOK_SECRET_ENCRYPTION_KEY: ${{ contains(matrix.secret_names, 'WEBHOOK_SECRET_ENCRYPTION_KEY') && secrets.WEBHOOK_SECRET_ENCRYPTION_KEY || '' }}
          GH_SECRET_WEBHOOK_URL_SIGNING_KEY: ${{ contains(matrix.secret_names, 'WEBHOOK_URL_SIGNING_KEY') && secrets.WEBHOOK_URL_SIGNING_KEY || '' }}
        run: python3 deploy/production/secrets.py --service "$SERVICE" --output "$RUNNER_TEMP/secrets-$SERVICE.json"
      - name: Save Version References
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-input-secrets-${{ matrix.service }}
          overwrite: true
          path: ${{ runner.temp }}/secrets-${{ matrix.service }}.json
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Commit Desired Deployment
    needs: [prepare, build-images, sync-secrets]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'release' &&
      needs.sync-secrets.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-input-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-inputs
      - name: Assemble Complete Manifest
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python3 deploy/production/release.py assemble --plan "$RUNNER_TEMP/release-inputs/release-plan.json" --artifacts "$RUNNER_TEMP/release-inputs"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit Versions And Immutable References Before Applying
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RELEASE_PUSH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: python3 deploy/production/release.py commit-manifest

  apply:
    name: Apply All Production VMs
    needs: [prepare, manifest]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.manifest.result == 'success' || needs.prepare.outputs.mode != 'release')
    runs-on: [self-hosted, linux, x64, cowork-deploy]
    timeout-minutes: 90
    permissions:
      contents: read
      deployments: write
      id-token: write
    environment: Prod-IaC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.manifest.outputs.sha || github.sha }}
      - name: Read The Declared Python Version
        id: python-version
        run: |
          version=$(jq -er '.python.version' deploy/production/versions.json)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.python-version.outputs.version }}
      - name: Install Pinned Deployment Dependencies
        run: |
          python3 -m pip install -r deploy/production/requirements.txt
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Create Cluster Deployment Record
        if: needs.prepare.outputs.mode != 'plan'
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          payload = {"ref": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                     "environment": "production", "auto_merge": False, "required_contexts": [],
                     "description": "Nomad whole-cluster release", "production_environment": True}
          result = subprocess.check_output(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/deployments",
                                            "--method", "POST", "--input", "-"], input=json.dumps(payload), text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"id={json.loads(result)['id']}\n")
          PYTHON
      - name: Apply Or Plan Committed State
        id: apply
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_MODE: ${{ needs.prepare.outputs.mode }}
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
        run: |
          if [ "$DEPLOY_MODE" = plan ]; then
            flock "$COWORK_PLATFORM_STATE_DIR/deploy.lock" bash deploy/production/apply.sh deploy/production/releases.json --check
          else
            flock "$COWORK_PLATFORM_STATE_DIR/deploy.lock" bash deploy/production/apply.sh deploy/production/releases.json
          fi
      - name: Record Whole Cluster Result
        if: ${{ always() && steps.deployment.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_STATE: ${{ steps.apply.outcome == 'success' && 'success' || 'failure' }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          payload = {"state": os.environ['DEPLOYMENT_STATE'], "log_url": os.environ['LOG_URL'], "auto_inactive": False}
          subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/deployments/{os.environ['DEPLOYMENT_ID']}/statuses",
                          "--method", "POST", "--input", "-"], input=json.dumps(payload), text=True, check=True)
          PYTHON

  publish:
    name: Publish Committed Release
    needs: [prepare, manifest]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.mode != 'plan' && needs.prepare.outputs.version != '' &&
      (needs.manifest.result == 'success' || needs.prepare.outputs.mode == 'apply')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.manifest.outputs.sha || github.sha }}
          fetch-depth: 0
      - name: Publish Committed Source Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: python3 deploy/production/release.py publish
