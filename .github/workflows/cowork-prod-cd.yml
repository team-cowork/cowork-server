name: cowork prod CD Workflow

on:
  workflow_run:
    workflows: ["cowork prod CI Workflow"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  build-images:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    # should_release는 "v<version> 태그/릴리스를 새로 만들지"만 결정해야 한다 — sha-<sha>
    # 이미지는 release job과 무관하게 매 성공한 커밋마다 항상 push돼야 deploy job이
    # 기대하는 이미지를 항상 찾을 수 있다. 예전엔 이 job 자체가 should_release로
    # 걸려 있어서, VERSION을 안 올린 커밋은 이미지가 아예 안 만들어지고 deploy만
    # 그대로 실행돼 docker pull이 실패했다(리뷰 지적).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cowork-config
            context: .
            dockerfile: ./cowork-config/Dockerfile.prod
          - service: cowork-gateway
            context: .
            dockerfile: ./cowork-gateway/Dockerfile.prod
          - service: cowork-authorization
            context: ./cowork-authorization
            dockerfile: ./cowork-authorization/Dockerfile.prod
          - service: cowork-preference
            context: ./cowork-preference
            dockerfile: ./cowork-preference/Dockerfile.prod
          - service: cowork-user
            context: ./cowork-user
            dockerfile: ./cowork-user/Dockerfile.prod
          - service: cowork-team
            context: .
            dockerfile: ./cowork-team/Dockerfile.prod
          - service: cowork-channel
            context: .
            dockerfile: ./cowork-channel/Dockerfile.prod
          - service: cowork-notification
            context: ./cowork-notification
            dockerfile: ./cowork-notification/Dockerfile.prod
          - service: cowork-chat
            context: ./cowork-chat
            dockerfile: ./cowork-chat/Dockerfile.prod
          - service: cowork-voice
            context: ./cowork-voice
            dockerfile: ./cowork-voice/Dockerfile.prod
          - service: cowork-project
            context: ./cowork-project
            dockerfile: ./cowork-project/Dockerfile.prod
          - service: cowork-roadmap
            context: .
            dockerfile: ./cowork-roadmap/Dockerfile.prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          # sha-<sha> 태그는 deploy job이 항상 pull해야 하므로 매번 push한다.
          # v<version> 태그는 should_release가 true일 때만 붙여서, 이미 릴리스된
          # 버전 태그가 뒤이은 커밋들로 조용히 재지정되지 않게 한다.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ needs.prepare.outputs.should_release == 'true' && format('ghcr.io/{0}/{1}:v{2}', needs.prepare.outputs.owner, matrix.service, needs.prepare.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 20
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            team:
              - 'cowork-team/**'
              - 'deploy/prod/services/team.sh'
            channel:
              - 'cowork-channel/**'
              - 'deploy/prod/services/channel.sh'
            authorization:
              - 'cowork-authorization/**'
              - 'deploy/prod/services/authorization.sh'
            user:
              - 'cowork-user/**'
              - 'deploy/prod/services/user.sh'
            project:
              - 'cowork-project/**'
              - 'deploy/prod/services/project.sh'
            preference:
              - 'cowork-preference/**'
              - 'deploy/prod/services/preference.sh'
            chat:
              - 'cowork-chat/**'
              - 'deploy/prod/services/chat.sh'
            voice:
              - 'cowork-voice/**'
              - 'deploy/prod/services/voice.sh'
            notification:
              - 'cowork-notification/**'
              - 'deploy/prod/services/notification.sh'
            gateway:
              - 'cowork-gateway/**'
              - 'deploy/prod/services/gateway.sh'
            config:
              - 'cowork-config/**'
              - 'deploy/prod/services/config.sh'
            roadmap:
              - 'cowork-roadmap/**'
              - 'deploy/prod/services/roadmap.sh'
            monitoring:
              - 'deploy/config/monitoring/**'
              - 'deploy/prod/services/monitoring.sh'
              - 'deploy/prod/monitoring/**'
            log-agent:
              - 'deploy/prod/log-agent/**'
              - 'deploy/prod/services/log-agent.sh'
            vault:
              - 'deploy/prod/vault/**'
              - 'deploy/config/vault/server.hcl'
              - 'deploy/prod/services/vault.sh'
            shared:
              - 'deploy/prod/lib/**'
              - 'deploy/prod/deploy.sh'
              - 'deploy/prod/defaults.sh'
              - 'deploy/prod/*settings.py'
              - '.github/workflows/cowork-deploy.yml'
              - 'deploy/prod/inventory.json'
              - 'deploy/prod/build-matrix.py'
              - '.github/workflows/cowork-prod-cd.yml'
            application_shared:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
      - name: Build deploy matrix
        id: build-matrix
        env:
          FILTER_RESULTS: ${{ toJSON(steps.filter.outputs) }}
        run: python3 deploy/prod/build-matrix.py

  deploy:
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.matrix != '{"include":[]}' &&
      needs.prepare.result == 'success' &&
      needs.build-images.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/cowork-deploy.yml
    with:
      service: ${{ matrix.service }}
      target: ${{ matrix.target }}
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  notify:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
      - deploy
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.prepare.result }} ${{ needs.build-images.result }} ${{ needs.release.result }} ${{ needs.detect-changes.result }} ${{ needs.deploy.result }}"
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            release_desc="v${VERSION} (created)"
          elif [ -n "${VERSION}" ]; then
            release_desc="v${VERSION} (skipped - already exists)"
          else
            release_desc="N/A"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "release_desc=${release_desc}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Prod CD"
          description: |
            `${{ github.event.workflow_run.head_branch || 'main' }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Release:** ${{ steps.status.outputs.release_desc }}
            **Deploy:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Prepare:** ${{ needs.prepare.result }}
            **Build Images:** ${{ needs.build-images.result }}
            **Release:** ${{ needs.release.result }}
            **Detect Changes:** ${{ needs.detect-changes.result }}
            **Deploy:** ${{ needs.deploy.result }}
