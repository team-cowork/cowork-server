name: cowork prod CD Workflow

on:
  workflow_run:
    workflows: ["cowork prod CI Workflow"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  build-images:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cowork-config
            context: .
            dockerfile: ./cowork-config/prod.dockerfile
          - service: cowork-gateway
            context: .
            dockerfile: ./cowork-gateway/prod.dockerfile
          - service: cowork-authorization
            context: ./cowork-authorization
            dockerfile: ./cowork-authorization/prod.dockerfile
          - service: cowork-preference
            context: ./cowork-preference
            dockerfile: ./cowork-preference/prod.dockerfile
          - service: cowork-user
            context: ./cowork-user
            dockerfile: ./cowork-user/prod.dockerfile
          - service: cowork-team
            context: .
            dockerfile: ./cowork-team/prod.dockerfile
          - service: cowork-channel
            context: .
            dockerfile: ./cowork-channel/prod.dockerfile
          - service: cowork-notification
            context: ./cowork-notification
            dockerfile: ./cowork-notification/prod.dockerfile
          - service: cowork-chat
            context: ./cowork-chat
            dockerfile: ./cowork-chat/prod.dockerfile
          - service: cowork-voice
            context: ./cowork-voice
            dockerfile: ./cowork-voice/prod.dockerfile
          - service: cowork-project
            context: ./cowork-project
            dockerfile: ./cowork-project/prod.dockerfile
          - service: cowork-roadmap
            context: .
            dockerfile: ./cowork-roadmap/prod.dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:v${{ needs.prepare.outputs.version }}
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 20
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            team:
              - 'cowork-team/**'
              - 'scripts/run/prod/team.sh'
            channel:
              - 'cowork-channel/**'
              - 'scripts/run/prod/channel.sh'
            authorization:
              - 'cowork-authorization/**'
              - 'scripts/run/prod/authorization.sh'
            user:
              - 'cowork-user/**'
              - 'scripts/run/prod/user.sh'
            project:
              - 'cowork-project/**'
              - 'scripts/run/prod/project.sh'
            preference:
              - 'cowork-preference/**'
              - 'scripts/run/prod/preference.sh'
            chat:
              - 'cowork-chat/**'
              - 'scripts/run/prod/chat.sh'
            voice:
              - 'cowork-voice/**'
              - 'scripts/run/prod/voice.sh'
            notification:
              - 'cowork-notification/**'
              - 'scripts/run/prod/notification.sh'
            gateway:
              - 'cowork-gateway/**'
              - 'scripts/run/prod/gateway.sh'
            config:
              - 'cowork-config/**'
              - 'scripts/run/prod/config.sh'
            roadmap:
              - 'cowork-roadmap/**'
              - 'scripts/run/prod/roadmap.sh'
            monitoring:
              - 'cowork-monitoring/**'
              - 'scripts/run/prod/monitoring.sh'
            vault:
              - 'docker/vault/**'
              - 'scripts/run/prod/vault.sh'
              - 'cowork-config/src/main/resources/vault/vault-init.sh'
      - name: Build deploy matrix
        id: build-matrix
        run: |
          INCLUDE="[]"
          SERVICES=""
          add() {
            local name=$1 port=$2 changed=$3
            if [ "$changed" == "true" ]; then
              INCLUDE=$(echo "$INCLUDE" | jq -c --arg n "$name" --arg p "$port" '. += [{"service":$n,"port":$p}]')
              SERVICES="${SERVICES:+$SERVICES, }$name"
            fi
          }
          add team           21108 "${{ steps.filter.outputs.team }}"
          add channel        24118 "${{ steps.filter.outputs.channel }}"
          add authorization  24125 "${{ steps.filter.outputs.authorization }}"
          add user           21133 "${{ steps.filter.outputs.user }}"
          add project        24134 "${{ steps.filter.outputs.project }}"
          add preference     24153 "${{ steps.filter.outputs.preference }}"
          add chat           27108 "${{ steps.filter.outputs.chat }}"
          add voice          27109 "${{ steps.filter.outputs.voice }}"
          add notification   27110 "${{ steps.filter.outputs.notification }}"
          add gateway        21108 "${{ steps.filter.outputs.gateway }}"
          add config         21108 "${{ steps.filter.outputs.config }}"
          add monitoring     21108 "${{ steps.filter.outputs.monitoring }}"
          add roadmap        27112 "${{ steps.filter.outputs.roadmap }}"
          add vault          21108 "${{ steps.filter.outputs.vault }}"
          echo "matrix={\"include\":$INCLUDE}" >> "$GITHUB_OUTPUT"
          echo "services-list=${SERVICES:-none}" >> "$GITHUB_OUTPUT"
          echo "Deploy matrix: $INCLUDE"

  deploy:
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
    if: >
      always() &&
      needs.detect-changes.outputs.matrix != '{"include":[]}' &&
      (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    # 서비스별로 GitHub Environment를 분리해서, 각 매트릭스 항목이 자기 서비스의
    # environment secret만 읽을 수 있게 한다(예: voice 배포 단계가 preference의 DB
    # 비밀번호를 읽을 수 없음). environment 값에 matrix 컨텍스트를 그대로 쓸 수 있다.
    # 여러 서비스가 공유하는 secret(COWORK_SSH_HOST, CD_DEPLOY_SSH_KEY, COWORK_MYSQL_PASSWORD 등)은
    # 특정 environment에 넣지 않고 repository secret으로 남겨둔다 — environment secret이 없으면
    # GitHub Actions가 자동으로 repository secret로 폴백하므로 매 environment에 중복 등록할 필요가 없다.
    environment: Prod-CD(${{ matrix.service }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Deploy cowork-${{ matrix.service }}
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_IMAGE_OWNER: ${{ needs.prepare.outputs.owner }}
          DEPLOY_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          COWORK_MYSQL_PASSWORD: ${{ secrets.COWORK_MYSQL_PASSWORD }}
          VAULT_EXTERNAL_HOST: ${{ secrets.VAULT_EXTERNAL_HOST }}
          VAULT_UNSEAL_KEY: ${{ secrets.VAULT_UNSEAL_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          COWORK_POSTGRES_PASSWORD: ${{ secrets.COWORK_POSTGRES_PASSWORD }}
          COWORK_MONGO_PASSWORD: ${{ secrets.COWORK_MONGO_PASSWORD }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COWORK_GITHUB_APP_INTERNAL_API_KEY: ${{ secrets.COWORK_GITHUB_APP_INTERNAL_API_KEY }}
        with:
          host: ${{ secrets.COWORK_SSH_HOST }}
          port: ${{ matrix.port }}
          username: ubuntu
          key: ${{ secrets.CD_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_SHA,DEPLOY_IMAGE_OWNER,DEPLOY_IMAGE_TAG,COWORK_MYSQL_PASSWORD,VAULT_EXTERNAL_HOST,VAULT_UNSEAL_KEY,VAULT_TOKEN,COWORK_POSTGRES_PASSWORD,COWORK_MONGO_PASSWORD,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,JWT_SECRET,COWORK_GITHUB_APP_INTERNAL_API_KEY
          script: |
            cd ~/cowork-server 2>/dev/null && git fetch origin --quiet || true
            if [ -d ~/cowork-server/.git ]; then
              cd ~/cowork-server
              git checkout "${DEPLOY_SHA}" -- "scripts/run/prod/${{ matrix.service }}.sh" 2>/dev/null || true
            fi
            if [ -f ~/cowork-server/scripts/run/prod/${{ matrix.service }}.sh ]; then
              bash ~/cowork-server/scripts/run/prod/${{ matrix.service }}.sh
            else
              bash -e ~/deploy-${{ matrix.service }}.sh
            fi

  notify:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
      - deploy
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.prepare.result }} ${{ needs.build-images.result }} ${{ needs.release.result }} ${{ needs.detect-changes.result }} ${{ needs.deploy.result }}"
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            release_desc="v${VERSION} (created)"
          elif [ -n "${VERSION}" ]; then
            release_desc="v${VERSION} (skipped - already exists)"
          else
            release_desc="N/A"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "release_desc=${release_desc}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Prod CD"
          description: |
            `${{ github.event.workflow_run.head_branch || 'main' }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Release:** ${{ steps.status.outputs.release_desc }}
            **Deploy:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Prepare:** ${{ needs.prepare.result }}
            **Build Images:** ${{ needs.build-images.result }}
            **Release:** ${{ needs.release.result }}
            **Detect Changes:** ${{ needs.detect-changes.result }}
            **Deploy:** ${{ needs.deploy.result }}
