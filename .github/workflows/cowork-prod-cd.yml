name: cowork prod CD Workflow

on:
  workflow_run:
    workflows: ["cowork prod CI Workflow"]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "VERSION must contain a numeric dotted version, got '${version}'" >&2
            exit 1
          fi

          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if git rev-parse --quiet --verify "refs/tags/v${version}" >/dev/null; then
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  build-images:
    name: Build and push ${{ matrix.service }}
    needs: prepare
    # should_release는 "v<version> 태그/릴리스를 새로 만들지"만 결정해야 한다 — sha-<sha>
    # 이미지는 release job과 무관하게 매 성공한 커밋마다 항상 push돼야 deploy job이
    # 기대하는 이미지를 항상 찾을 수 있다. 예전엔 이 job 자체가 should_release로
    # 걸려 있어서, VERSION을 안 올린 커밋은 이미지가 아예 안 만들어지고 deploy만
    # 그대로 실행돼 docker pull이 실패했다(리뷰 지적).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: cowork-config
            context: .
            dockerfile: ./cowork-config/Dockerfile.prod
          - service: cowork-gateway
            context: .
            dockerfile: ./cowork-gateway/Dockerfile.prod
          - service: cowork-authorization
            context: ./cowork-authorization
            dockerfile: ./cowork-authorization/Dockerfile.prod
          - service: cowork-preference
            context: ./cowork-preference
            dockerfile: ./cowork-preference/Dockerfile.prod
          - service: cowork-user
            context: ./cowork-user
            dockerfile: ./cowork-user/Dockerfile.prod
          - service: cowork-team
            context: .
            dockerfile: ./cowork-team/Dockerfile.prod
          - service: cowork-channel
            context: .
            dockerfile: ./cowork-channel/Dockerfile.prod
          - service: cowork-notification
            context: ./cowork-notification
            dockerfile: ./cowork-notification/Dockerfile.prod
          - service: cowork-chat
            context: ./cowork-chat
            dockerfile: ./cowork-chat/Dockerfile.prod
          - service: cowork-voice
            context: ./cowork-voice
            dockerfile: ./cowork-voice/Dockerfile.prod
          - service: cowork-project
            context: ./cowork-project
            dockerfile: ./cowork-project/Dockerfile.prod
          - service: cowork-roadmap
            context: .
            dockerfile: ./cowork-roadmap/Dockerfile.prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          # sha-<sha> 태그는 deploy job이 항상 pull해야 하므로 매번 push한다.
          # v<version> 태그는 should_release가 true일 때만 붙여서, 이미 릴리스된
          # 버전 태그가 뒤이은 커밋들로 조용히 재지정되지 않게 한다.
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner }}/${{ matrix.service }}:sha-${{ github.event.workflow_run.head_sha }}
            ${{ needs.prepare.outputs.should_release == 'true' && format('ghcr.io/{0}/{1}:v{2}', needs.prepare.outputs.owner, matrix.service, needs.prepare.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=v${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  release:
    needs:
      - prepare
      - build-images
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "v${VERSION}" \
            --generate-notes

  detect-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      services-list: ${{ steps.build-matrix.outputs.services-list }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 20
      - name: Resolve base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD~1)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            team:
              - 'cowork-team/**'
              - 'deploy/prod/services/team.sh'
            channel:
              - 'cowork-channel/**'
              - 'deploy/prod/services/channel.sh'
            authorization:
              - 'cowork-authorization/**'
              - 'deploy/prod/services/authorization.sh'
            user:
              - 'cowork-user/**'
              - 'deploy/prod/services/user.sh'
            project:
              - 'cowork-project/**'
              - 'deploy/prod/services/project.sh'
            preference:
              - 'cowork-preference/**'
              - 'deploy/prod/services/preference.sh'
            chat:
              - 'cowork-chat/**'
              - 'deploy/prod/services/chat.sh'
            voice:
              - 'cowork-voice/**'
              - 'deploy/prod/services/voice.sh'
            notification:
              - 'cowork-notification/**'
              - 'deploy/prod/services/notification.sh'
            gateway:
              - 'cowork-gateway/**'
              - 'deploy/prod/services/gateway.sh'
            config:
              - 'cowork-config/**'
              - 'deploy/prod/services/config.sh'
            roadmap:
              - 'cowork-roadmap/**'
              - 'deploy/prod/services/roadmap.sh'
            monitoring:
              - 'deploy/config/monitoring/**'
              - 'deploy/prod/services/monitoring.sh'
              - 'deploy/prod/monitoring/**'
            vault:
              - 'deploy/prod/vault/**'
              - 'deploy/config/vault/server.hcl'
              - 'deploy/prod/services/vault.sh'
            shared:
              - 'deploy/prod/lib/**'
              - 'deploy/prod/deploy.sh'
              - 'deploy/prod/runtime.env'
              - 'deploy/prod/inventory.json'
              - 'deploy/prod/build-matrix.py'
              - '.github/workflows/cowork-prod-cd.yml'
            application_shared:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
      - name: Build deploy matrix
        id: build-matrix
        env:
          FILTER_RESULTS: ${{ toJSON(steps.filter.outputs) }}
        run: python3 deploy/prod/build-matrix.py

  deploy:
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.matrix != '{"include":[]}' &&
      needs.prepare.result == 'success' &&
      needs.build-images.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    # 서비스별로 GitHub Environment를 분리해서, 각 매트릭스 항목이 자기 서비스의
    # environment secret만 읽을 수 있게 한다(예: voice 배포 단계가 preference의 DB
    # 비밀번호를 읽을 수 없음). environment 값에 matrix 컨텍스트를 그대로 쓸 수 있다.
    # 여러 서비스가 공유하는 secret(COWORK_SSH_HOST, CD_DEPLOY_SSH_KEY, COWORK_MYSQL_PASSWORD 등)은
    # 특정 environment에 넣지 않고 repository secret으로 남겨둔다 — environment secret이 없으면
    # GitHub Actions가 자동으로 repository secret로 폴백하므로 매 environment에 중복 등록할 필요가 없다.
    environment: Prod-CD(${{ matrix.service }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Deploy cowork-${{ matrix.service }}
        uses: appleboy/ssh-action@v1
        env:
          APP_CONFIG_PROFILE: ${{ matrix.config_profile }}
          DEPLOY_ROOT: ${{ vars.COWORK_DEPLOY_ROOT }}
          DEPLOY_CONFIG_DIR: ${{ vars.COWORK_DEPLOY_CONFIG_DIR }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_IMAGE_OWNER: ${{ needs.prepare.outputs.owner }}
          DEPLOY_IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          # MySQL을 실제로 쓰는 서비스에만 비밀번호를 실어 보낸다(리뷰 지적: 예전엔
          # roadmap 하나만 쓰는데 매트릭스의 전 서비스 SSH 세션에 실렸다).
          COWORK_MYSQL_PASSWORD: ${{ contains(fromJSON('["team","channel","authorization","user","project","notification","roadmap"]'), matrix.service) && secrets.COWORK_MYSQL_PASSWORD || '' }}
          VAULT_EXTERNAL_HOST: ${{ secrets.VAULT_EXTERNAL_HOST }}
          VAULT_UNSEAL_KEY: ${{ secrets.VAULT_UNSEAL_KEY }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          COWORK_POSTGRES_PASSWORD: ${{ secrets.COWORK_POSTGRES_PASSWORD }}
          COWORK_MONGO_PASSWORD: ${{ secrets.COWORK_MONGO_PASSWORD }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COWORK_GITHUB_APP_INTERNAL_API_KEY: ${{ secrets.COWORK_GITHUB_APP_INTERNAL_API_KEY }}
        with:
          host: ${{ secrets.COWORK_SSH_HOST }}
          port: ${{ vars.COWORK_SSH_PORT || matrix.port }}
          username: ${{ vars.COWORK_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.CD_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: APP_CONFIG_PROFILE,DEPLOY_ROOT,DEPLOY_CONFIG_DIR,GHCR_READ_TOKEN,DEPLOY_SHA,DEPLOY_IMAGE_OWNER,DEPLOY_IMAGE_TAG,COWORK_MYSQL_PASSWORD,VAULT_EXTERNAL_HOST,VAULT_UNSEAL_KEY,VAULT_TOKEN,COWORK_POSTGRES_PASSWORD,COWORK_MONGO_PASSWORD,LIVEKIT_API_KEY,LIVEKIT_API_SECRET,JWT_SECRET,COWORK_GITHUB_APP_INTERNAL_API_KEY
          script: |
            set -euo pipefail
            [[ "${DEPLOY_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid release SHA' >&2; exit 1; }
            DEPLOY_ROOT="${DEPLOY_ROOT:-${HOME}/.local/share/cowork}"
            cache="${DEPLOY_ROOT}/repository.git"
            release="${DEPLOY_ROOT}/releases/${DEPLOY_SHA}"
            mkdir -p "${DEPLOY_ROOT}/releases"
            exec 9>"${DEPLOY_ROOT}/source.lock"
            flock -w 120 9
            if [ ! -d "${cache}" ]; then
              git clone --mirror https://github.com/team-cowork/cowork-server.git "${cache}"
            fi
            git --git-dir="${cache}" fetch origin "${DEPLOY_SHA}" --quiet
            if [ ! -d "${release}" ]; then
              staging="$(mktemp -d "${DEPLOY_ROOT}/releases/.staging.XXXXXX")"
              trap 'rm -rf "${staging}"' EXIT
              git --git-dir="${cache}" archive "${DEPLOY_SHA}" | tar -x -C "${staging}"
              printf '%s\n' "${DEPLOY_SHA}" > "${staging}/.source-sha"
              mv "${staging}" "${release}"
              trap - EXIT
            fi
            [ "$(cat "${release}/.source-sha")" = "${DEPLOY_SHA}" ] || { echo 'Invalid release directory' >&2; exit 1; }
            flock -u 9
            # All scripts, helpers, Compose files and mount sources come from this exact SHA.
            # No shared working-tree checkout and no fallback to unversioned VM scripts.
            bash "${release}/deploy/prod/deploy.sh" "${{ matrix.service }}"

  notify:
    runs-on: ubuntu-latest
    environment: Production
    needs:
      - prepare
      - build-images
      - release
      - detect-changes
      - deploy
    if: always()

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.prepare.result }} ${{ needs.build-images.result }} ${{ needs.release.result }} ${{ needs.detect-changes.result }} ${{ needs.deploy.result }}"
          SHOULD_RELEASE: ${{ needs.prepare.outputs.should_release }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          if [ "${SHOULD_RELEASE}" = "true" ]; then
            release_desc="v${VERSION} (created)"
          elif [ -n "${VERSION}" ]; then
            release_desc="v${VERSION} (skipped - already exists)"
          else
            release_desc="N/A"
          fi

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"
          echo "release_desc=${release_desc}" >> "$GITHUB_OUTPUT"

      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_INFORMATION_ALERT_CHANNEL_WEBHOOK }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          title: "cowork Server Prod CD"
          description: |
            `${{ github.event.workflow_run.head_branch || 'main' }}` · `${{ steps.sha.outputs.short }}` · by **${{ github.actor }}**
            **Release:** ${{ steps.status.outputs.release_desc }}
            **Deploy:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **Prepare:** ${{ needs.prepare.result }}
            **Build Images:** ${{ needs.build-images.result }}
            **Release:** ${{ needs.release.result }}
            **Detect Changes:** ${{ needs.detect-changes.result }}
            **Deploy:** ${{ needs.deploy.result }}
