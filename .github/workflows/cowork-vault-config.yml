name: Update Vault configuration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target, application service name, or application for shared properties
        required: true
        type: string
      scope:
        description: Deployment snapshot or Config Server application properties (full document replacement)
        required: true
        type: choice
        options: [deployment, application]
      profile:
        description: Application profile path; deployment snapshots must use base
        default: base
        type: choice
        options: [base, local, prod]
      expected_version:
        description: Current KV version; 0 creates a new path only
        required: true
        type: string

concurrency:
  group: vault-update-${{ inputs.scope }}-${{ inputs.target }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Config-Update(${{ inputs.target }})
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Replace Vault document with CAS protection
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR }}
          VAULT_KV_MOUNT: ${{ vars.VAULT_KV_MOUNT || 'secret' }}
          VAULT_TOKEN: ${{ secrets.VAULT_CONFIG_WRITE_TOKEN }}
          VAULT_UPDATE_JSON: ${{ secrets.VAULT_UPDATE_JSON }}
          TARGET: ${{ inputs.target }}
          SCOPE: ${{ inputs.scope }}
          PROFILE: ${{ inputs.profile }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          python3 deploy/prod/vault-settings.py update --target "$TARGET" --scope "$SCOPE" \
            --profile "$PROFILE" --expected-version "$EXPECTED_VERSION"
