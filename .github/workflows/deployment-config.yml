name: Deployment configuration
on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'cowork-*/Dockerfile.*'
      - '.github/workflows/deployment-config.yml'
      - '.github/workflows/cowork-prod-cd.yml'
  push:
    branches: [main, develop]
    paths:
      - 'deploy/**'
      - 'docker-compose.yml'
      - 'cowork-*/Dockerfile.*'
      - '.github/workflows/deployment-config.yml'
      - '.github/workflows/cowork-prod-cd.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment syntax and Compose paths
        run: python3 deploy/validate.py
