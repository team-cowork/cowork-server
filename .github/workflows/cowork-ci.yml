name: Cowork Shared CI

on:
  workflow_call:
    inputs:
      environment-label:
        required: true
        type: string

jobs:
  validate-title:
    name: Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Validate PR Title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const allowedScopes = [
              'global', 'gateway', 'authorization', 'user',
              'team', 'project', 'channel', 'roadmap', 'chat', 'voice', 'promotion', 'github',
              'notification', 'preference', 'ci/cd'
            ];
            if (context.payload.pull_request.base.ref !== 'main') {
              allowedScopes.push('dm', 'monitoring');
            }

            const versionPattern = /^v\d{8}\.\d+$/;
            if (versionPattern.test(title)) {
              return;
            }

            const titlePattern = /^\[([^\]]+)\]\s+(.+)$/;
            const match = title.match(titlePattern);
            if (!match) {
              core.setFailed('Invalid title format. Use [scope] title or vYYYYMMDD.n format');
              return;
            }

            const scopesPart = match[1];
            const titlePart = match[2];

            if (titlePart.includes(':')) {
              core.setFailed('Colon (:) is not allowed in the title');
              return;
            }
            const scopes = scopesPart.split(',').map(s => s.trim());
            const invalidScopes = scopes.filter(scope => !allowedScopes.includes(scope));
            if (invalidScopes.length > 0) {
              core.setFailed(`Invalid scope(s): ${invalidScopes.join(', ')}`);
              return;
            }

  setup-pr-metadata:
    name: Set Up PR Metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Set Up PR Metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          if ! gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label "waiting for review:검토 대기"; then
            echo "::warning::PR label setup failed; continuing CI."
          fi
          if ! gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-assignee "$PR_AUTHOR"; then
            echo "::warning::PR assignee setup failed; continuing CI."
          fi
          if ! gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-reviewer "team-cowork/cowork-server"; then
            echo "::warning::PR reviewer setup failed; continuing CI."
          fi

  detect-changes:
    name: Select CI Targets
    if: >
      github.event_name != 'push' || github.actor != 'cowork-server-versioning-bot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.verify.outputs.matrix }}
      services-list: ${{ steps.verify.outputs.services-list }}
      image-matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install The Pinned Nomad Validator
        run: |
          python3 -m deploy.production.bootstrap.install_tools --directory "$RUNNER_TEMP/cowork-tools" --tools nomad
          echo "$RUNNER_TEMP/cowork-tools" >> "$GITHUB_PATH"
      - name: Validate Deployment Syntax
        run: python3 -m deploy.validate
      - name: Select The Last Successful Push Baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -m deploy.ci.select_base
      - name: Select Image Builds
        id: images
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base }}
        run: |
          args=()
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then args+=(--base "$BASE_SHA"); fi
          python3 -m deploy.ci.build_matrix "${args[@]}"
      - name: Select Module Verification
        id: verify
        env:
          BASE_SHA: ${{ steps.baseline.outputs.base }}
        run: |
          args=()
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then args+=(--base "$BASE_SHA"); fi
          python3 -m deploy.ci.build_matrix --verify "${args[@]}"

  # Pull requests already verify the same source in coverage(pr).
  build-and-test:
    runs-on: ubuntu-latest
    needs: [validate-title, detect-changes]
    if: >
      github.event_name != 'pull_request' && !cancelled() &&
      (needs.validate-title.result == 'success' || needs.validate-title.result == 'skipped') &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.matrix != '{"include":[]}'
    name: Build (cowork-${{ matrix.service }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Verify Module And Export Coverage
        uses: ./.github/actions/verify-image
        with:
          module: cowork-${{ matrix.service }}
          output: ${{ runner.temp }}/verification
      - name: Upload Unit Verification Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ matrix.service }}
          path: ${{ runner.temp }}/verification/
          if-no-files-found: error
          retention-days: 7

  image-build:
    name: Image (${{ matrix.service }})
    needs: detect-changes
    if: needs.detect-changes.outputs.image-matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.detect-changes.outputs.image-matrix) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Build Image
        uses: ./.github/actions/build-image
        with:
          service: ${{ matrix.service }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          tags: cowork-${{ matrix.service }}:ci

  image-validation:
    name: Image Validation
    needs: [detect-changes, image-build]
    # Superseded PR runs must stop when their image builds are cancelled.
    if: >
      !cancelled() &&
      (github.event_name != 'push' || github.actor != 'cowork-server-versioning-bot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Require All Selected Image Builds
        env:
          PREPARE_RESULT: ${{ needs.detect-changes.result }}
          BUILD_RESULT: ${{ needs.image-build.result }}
          IMAGE_MATRIX: ${{ needs.detect-changes.outputs.image-matrix }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ "$IMAGE_MATRIX" = '{"include":[]}' ]; then
            test "$BUILD_RESULT" = skipped
          else
            test "$BUILD_RESULT" = success
          fi

  notify:
    name: Send CI Notification
    runs-on: ubuntu-latest
    env:
      RESULT_LABELS: '{"success":"성공","failure":"실패","cancelled":"취소됨","skipped":"건너뜀","neutral":"중립","timed_out":"시간 초과","action_required":"조치 필요","stale":"만료됨"}'
    needs: [validate-title, setup-pr-metadata, detect-changes, build-and-test, image-validation, coverage-plan, coverage]
    if: >
      always() &&
      (github.event_name != 'push' || github.actor != 'cowork-server-versioning-bot[bot]')

    steps:
      - name: Get Short SHA
        id: sha
        run: echo "short=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Determine Status
        id: status
        env:
          RESULTS: "${{ needs.validate-title.result }} ${{ needs.setup-pr-metadata.result }} ${{ needs.detect-changes.result }} ${{ needs.build-and-test.result }} ${{ needs.image-validation.result }} ${{ needs.coverage-plan.result }} ${{ needs.coverage.result }}"
        run: |
          status="success"
          color="0x4CAF50"
          for res in ${RESULTS}; do
            if [ "$res" = "failure" ]; then
              status="failure"
              color="0xFF4C4C"
              break
            elif [ "$res" = "cancelled" ] && [ "$status" != "failure" ]; then
              status="cancelled"
              color="0xFFA500"
            fi
          done

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "color=${color}" >> "$GITHUB_OUTPUT"

      - name: Send CI Status to Discord
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_CICD_STATUS_WEBHOOK_URL }}
          status: ${{ steps.status.outputs.status }}
          color: ${{ steps.status.outputs.color }}
          nodetail: true
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          title: "[${{ fromJSON(env.RESULT_LABELS)[steps.status.outputs.status] || '확인 불가' }}] cowork ${{ inputs.environment-label }} CI"
          description: |
            **저장소:** ${{ github.repository }}
            `${{ github.ref_name }}` · `${{ steps.sha.outputs.short }}` · 실행자 **${{ github.actor }}**
            **변경 대상:** ${{ needs.detect-changes.outputs.services-list }}
            ─────────────────────────────
            **PR 제목 검사:** ${{ fromJSON(env.RESULT_LABELS)[needs.validate-title.result] || '확인 불가' }}
            **PR 정보 설정:** ${{ fromJSON(env.RESULT_LABELS)[needs.setup-pr-metadata.result] || '확인 불가' }}
            **변경 사항 확인:** ${{ fromJSON(env.RESULT_LABELS)[needs.detect-changes.result] || '확인 불가' }}
            **빌드 및 테스트:** ${{ fromJSON(env.RESULT_LABELS)[needs.build-and-test.result] || '확인 불가' }}
            **이미지 검증:** ${{ fromJSON(env.RESULT_LABELS)[needs.image-validation.result] || '확인 불가' }}
            **PR 검증 및 커버리지:** ${{ fromJSON(env.RESULT_LABELS)[needs.coverage-plan.result] || '확인 불가' }} / ${{ fromJSON(env.RESULT_LABELS)[needs.coverage.result] || '확인 불가' }}

  coverage-plan:
    name: Plan Coverage
    needs: detect-changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout Coverage Tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout Base Source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: source-base
          persist-credentials: false
      - name: Plan Both Dockerfile Snapshots
        id: plan
        env:
          VERIFY_MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          matrix=$(python3 -m deploy.ci.coverage plan --base source-base --head . \
            --matrix "$VERIFY_MATRIX" --output "$RUNNER_TEMP/modules.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Upload Coverage Manifest
        uses: actions/upload-artifact@v7
        with:
          name: coverage-manifest
          path: ${{ runner.temp }}/modules.json
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Coverage (${{ matrix.module }}, ${{ matrix.snapshot }})
    needs: coverage-plan
    if: github.event_name == 'pull_request' && needs.coverage-plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The current source is the PR verification gate; base failures only affect the comparison.
    continue-on-error: ${{ matrix.snapshot == 'base' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.coverage-plan.outputs.matrix) }}
    steps:
      - name: Checkout Coverage Tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout Measurement Source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.snapshot == 'base' && github.event.pull_request.base.sha || github.sha }}
          path: source
          persist-credentials: false
      - name: Verify Module And Export Coverage
        uses: ./.github/actions/verify-image
        with:
          module: ${{ matrix.module }}
          snapshot: ${{ matrix.snapshot }}
          source: source
          # Current modules must implement verify; old snapshots may predate the contract.
          contract: ${{ matrix.snapshot == 'pr' && matrix.present || matrix.contract }}
          output: ${{ runner.temp }}/coverage-output
      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.module }}-${{ matrix.snapshot }}
          path: ${{ runner.temp }}/coverage-output/
          if-no-files-found: error
          retention-days: 7

  coverage-comment:
    name: Update Coverage Comment
    needs: [coverage-plan, coverage]
    if: always() && github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Coverage Manifest
        uses: actions/download-artifact@v8
        with:
          name: coverage-manifest
          path: ${{ runner.temp }}/coverage-tools
      - name: Download Coverage Results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: coverage-cowork-*
          path: ${{ runner.temp }}/coverage-artifacts
      - name: Render Coverage Comment
        run: |
          python3 -m deploy.ci.coverage render \
            --artifacts "$RUNNER_TEMP/coverage-artifacts" --manifest "$RUNNER_TEMP/coverage-tools/modules.json" \
            --output "$RUNNER_TEMP/coverage-comment.md"
          cat "$RUNNER_TEMP/coverage-comment.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Update Coverage Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const publish = require(path.join(process.env.GITHUB_WORKSPACE, 'deploy/ci/comments/coverage.cjs'));
            const result = await publish({ github, context, core,
              body: fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'coverage-comment.md'), 'utf8') });
            core.info(`Coverage publication: ${result.status}`);

  contrib-delta:
    name: Update Contribution Delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build And Post Contribution Delta Comment
        uses: actions/github-script@v9
        with:
          script: |
            const publish = require('./deploy/ci/comments/contribution.cjs');
            await publish({ github, context, core });
