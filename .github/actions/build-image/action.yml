name: Build A Cowork Image
description: Build an image and inspect its slot contract without starting the application
inputs:
  service:
    required: true
    description: Service name without the cowork prefix
  environment:
    required: true
    description: local or prod
  context:
    required: true
    description: Docker build context
  dockerfile:
    required: true
    description: Dockerfile path relative to the repository
  push:
    default: 'false'
    description: Publish the built image
  tags:
    required: true
    description: Image tags, one per line
  labels:
    default: ''
    description: OCI image labels
runs:
  using: composite
  steps:
    - name: Set Up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      id: builder
    - name: Restore Dependency Cache Mounts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: cache
      with:
        path: ${{ runner.temp }}/cowork-image-cache
        key: ${{ runner.os }}-image-mounts-v1-${{ inputs.service }}-${{ inputs.environment }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-image-mounts-v1-${{ inputs.service }}-${{ inputs.environment }}-
    # Register after actions/cache: its post step extracts before the cache is saved.
    - name: Inject And Extract BuildKit Cache Mounts
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.builder.outputs.name }}
        dockerfile: ${{ inputs.dockerfile }}
        cache-dir: ${{ runner.temp }}/cowork-image-cache
        scratch-dir: ${{ runner.temp }}/cowork-cache-dance
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}
        utility-image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    - name: Build Image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: false
        load: true
        # The Docker exporter used by hosted runners cannot load attestations.
        # Publish them separately after the slot contract inspection passes.
        provenance: false
        sbom: false
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha,scope=cowork-${{ inputs.service }}-${{ inputs.environment }}
        cache-to: type=gha,mode=max,scope=cowork-${{ inputs.service }}-${{ inputs.environment }}
    - name: Inspect Image Slot Contract
      shell: bash
      env:
        IMAGE_TAGS: ${{ inputs.tags }}
        SERVICE: ${{ inputs.service }}
      run: |
        image="${IMAGE_TAGS%%$'\n'*}"
        python3 deploy/images/inspect-image.py "$SERVICE" "$image"
    - name: Publish Verified Image With Provenance And SBOM
      if: ${{ inputs.push == 'true' }}
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: linux/amd64
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
