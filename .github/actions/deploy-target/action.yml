name: Deploy A Cowork Target
description: Apply an immutable release with Vault settings and record successful runtime deployment
inputs:
  service:
    description: Service name in the deployment inventory
    required: true
  target:
    description: Deployment target in the inventory
    required: true
  sha:
    description: Full immutable deployment source commit SHA
    required: true
  image_sha:
    description: Existing image commit SHA to reuse; defaults to the source SHA
    default: ''
  check_only:
    description: Validate configuration without applying the release
    default: 'false'
  configuration_version:
    description: Pinned Vault configuration version or zero for latest
    default: '0'
  reference_versions:
    description: JSON map of exact Vault document versions selected by settings synchronization
    default: '{}'
  vault_recovery:
    description: Bootstrap the Vault target from recovery settings
    default: 'false'
  vault_addr:
    description: Vault address from the target environment
    required: true
  vault_kv_mount:
    description: Vault KV mount
    default: 'secret'
  vault_bootstrap_json:
    description: Vault recovery settings, otherwise compared with Vault to detect drift
    default: ''
runs:
  using: composite
  steps:
    - name: Checkout Release Source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        ref: ${{ inputs.sha }}
        fetch-depth: 0
        path: release-source
    - name: Validate Release And Target
      working-directory: release-source
      env:
        RELEASE_SHA: ${{ inputs.sha }}
        IMAGE_SHA: ${{ inputs.image_sha || inputs.sha }}
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$TARGET" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
        [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
        python3 deploy/prod/slots.py validate "$TARGET"
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
    - name: Load Vault Deployment Snapshot
      id: settings
      env:
        VAULT_ADDR: ${{ inputs.vault_addr }}
        VAULT_KV_MOUNT: ${{ inputs.vault_kv_mount }}
        VAULT_BOOTSTRAP_JSON: ${{ inputs.vault_bootstrap_json }}
        RECOVERY: ${{ inputs.vault_recovery }}
        CHECK_ONLY: ${{ inputs.check_only }}
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ inputs.target }}
        CONFIG_VERSION: ${{ inputs.configuration_version || '0' }}
        REFERENCE_VERSIONS: ${{ inputs.reference_versions }}
      shell: bash
      run: |
        set -euo pipefail
        mode=read
        if [ "$RECOVERY" = true ]; then
          test "$SERVICE" = vault
          test "$TARGET" = vault
          mode=bootstrap
        fi
        check=()
        if [ "$CHECK_ONLY" = true ]; then check=(--check); fi
        python3 deploy/prod/cd/vault-settings.py "$mode" --target "$TARGET" --version "$CONFIG_VERSION" \
          --slot-directory release-source/deploy/prod/slots --reference-versions "$REFERENCE_VERSIONS" "${check[@]}"
    - name: Apply Immutable Release And Vault Settings
      shell: bash
      env:
        SSH_HOST: ${{ steps.settings.outputs.ssh_host }}
        SSH_PORT: ${{ steps.settings.outputs.ssh_port }}
        SSH_USER: ${{ steps.settings.outputs.ssh_user }}
        SSH_KEY: ${{ steps.settings.outputs.ssh_key }}
        SSH_FINGERPRINT: ${{ steps.settings.outputs.ssh_fingerprint }}
        DEPLOY_PAYLOAD: ${{ steps.settings.outputs.payload }}
        DEPLOY_SHA: ${{ inputs.sha }}
        DEPLOY_IMAGE_SHA: ${{ inputs.image_sha || inputs.sha }}
        DEPLOY_TOOLS_SHA: ${{ github.workflow_sha }}
        DEPLOY_SERVICE: ${{ inputs.service }}
        DEPLOY_TARGET: ${{ inputs.target }}
        DEPLOY_OWNER: ${{ github.repository_owner }}
        DEPLOY_ACTION: ${{ inputs.check_only == 'true' && 'check' || 'deploy' }}
        DEPLOY_GHCR_USER: ${{ github.actor }}
        DEPLOY_GHCR_TOKEN: >-
          ${{ inputs.check_only != 'true' && inputs.service != 'vault' &&
              inputs.service != 'monitoring' &&
              inputs.service != 'log-agent' && inputs.service != 'node-agent' && github.token || '' }}
      run: python3 deploy/prod/cd/ssh-deploy.py
    - name: Record Successful Runtime Deployment
      if: ${{ inputs.check_only != 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ inputs.target }}
        RELEASE_SHA: ${{ inputs.sha }}
        IMAGE_SHA: ${{ inputs.image_sha || inputs.sha }}
      shell: bash
      run: python3 deploy/prod/cd/deployment_state.py "$SERVICE" "$TARGET" "$IMAGE_SHA" --source-sha "$RELEASE_SHA"
    - name: Retire Superseded AppRole Secret IDs
      # A failed deployment may still have reached the VM, so its secret ID waits for the next success.
      if: ${{ inputs.check_only != 'true' && steps.settings.outputs.approle_accessor != '' }}
      env:
        VAULT_ADDR: ${{ inputs.vault_addr }}
        TARGET: ${{ inputs.target }}
        ACCESSOR: ${{ steps.settings.outputs.approle_accessor }}
      shell: bash
      run: |
        python3 deploy/prod/cd/vault-settings.py retire-approle --target "$TARGET" --keep "$ACCESSOR" \
          --slot-directory release-source/deploy/prod/slots
