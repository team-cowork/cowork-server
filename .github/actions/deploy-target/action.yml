name: Deploy A Cowork Target
description: Apply an immutable release with Vault settings and record successful runtime deployment
inputs:
  service:
    description: Service name in the deployment inventory
    required: true
  target:
    description: Deployment target in the inventory
    required: true
  sha:
    description: Full immutable release commit SHA
    required: true
  check_only:
    description: Validate configuration without applying the release
    default: 'false'
  configuration_version:
    description: Pinned Vault configuration version or zero for latest
    default: '0'
  vault_recovery:
    description: Bootstrap the Vault target from recovery settings
    default: 'false'
  vault_addr:
    description: Vault address from the target environment
    required: true
  vault_kv_mount:
    description: Vault KV mount
    default: 'secret'
  vault_token:
    description: Vault deployment read token
    required: true
  vault_bootstrap_json:
    description: Bootstrap settings used only for Vault recovery
    default: ''
runs:
  using: composite
  steps:
    - name: Checkout Release Source
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sha }}
        fetch-depth: 0
        path: release-source
    - name: Validate Release And Target
      working-directory: release-source
      env:
        RELEASE_SHA: ${{ inputs.sha }}
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ inputs.target }}
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
        [[ "$TARGET" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
        [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{0,63}$ ]]
        if [ -f "deploy/prod/slots/$TARGET.json" ]; then
          python3 deploy/prod/slots.py validate "$TARGET"
        else
          test -f "deploy/prod/services/$SERVICE.sh"
        fi
        test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
    - name: Load Vault Deployment Snapshot
      id: settings
      env:
        VAULT_ADDR: ${{ inputs.vault_addr }}
        VAULT_KV_MOUNT: ${{ inputs.vault_kv_mount }}
        VAULT_TOKEN: ${{ inputs.vault_token }}
        VAULT_BOOTSTRAP_JSON: ${{ inputs.vault_recovery == 'true' && inputs.vault_bootstrap_json || '' }}
        RECOVERY: ${{ inputs.vault_recovery }}
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ inputs.target }}
        CONFIG_VERSION: ${{ inputs.configuration_version || '0' }}
      shell: bash
      run: |
        set -euo pipefail
        mode=read
        if [ "$RECOVERY" = true ]; then
          test "$SERVICE" = vault
          test "$TARGET" = vault
          mode=bootstrap
        fi
        python3 deploy/prod/cd/vault-settings.py "$mode" --target "$TARGET" --version "$CONFIG_VERSION" \
          --slot-directory release-source/deploy/prod/slots
    - name: Apply Immutable Release And Vault Settings
      uses: appleboy/ssh-action@v1
      env:
        DEPLOY_PAYLOAD: ${{ steps.settings.outputs.payload }}
        DEPLOY_SHA: ${{ inputs.sha }}
        DEPLOY_TOOLS_SHA: ${{ github.workflow_sha }}
        DEPLOY_SERVICE: ${{ inputs.service }}
        DEPLOY_TARGET: ${{ inputs.target }}
        DEPLOY_OWNER: ${{ github.repository_owner }}
        DEPLOY_ACTION: ${{ inputs.check_only == 'true' && 'check' || 'deploy' }}
        DEPLOY_GHCR_USER: ${{ github.actor }}
        DEPLOY_GHCR_TOKEN: >-
          ${{ inputs.check_only != 'true' && inputs.service != 'vault' &&
              inputs.service != 'monitoring' && inputs.service != 'datastores' &&
              inputs.service != 'storage' && inputs.service != 'log-agent' &&
              inputs.service != 'node-agent' && github.token || '' }}
      with:
        host: ${{ steps.settings.outputs.ssh_host }}
        port: ${{ steps.settings.outputs.ssh_port }}
        username: ${{ steps.settings.outputs.ssh_user }}
        key: ${{ steps.settings.outputs.ssh_key }}
        fingerprint: ${{ steps.settings.outputs.ssh_fingerprint }}
        # 서버의 deploy.sh는 후보 readiness 대기와 롤백 복구 대기를 각각 HEALTH_TIMEOUT_SECONDS까지 수행한다.
        # 이 값이 더 짧으면 SSH만 끊기고 VM의 스크립트가 배포 락을 쥔 채 계속 실행된다.
        command_timeout: 45m
        envs: DEPLOY_PAYLOAD,DEPLOY_SHA,DEPLOY_TOOLS_SHA,DEPLOY_SERVICE,DEPLOY_TARGET,DEPLOY_OWNER,DEPLOY_ACTION,DEPLOY_GHCR_USER,DEPLOY_GHCR_TOKEN
        script: |
          set -euo pipefail
          umask 077
          export -n DEPLOY_GHCR_TOKEN
          staging=
          docker_config=
          cleanup() {
            local status=$?
            trap - EXIT HUP INT TERM
            if [ -n "$staging" ]; then rm -rf -- "$staging" || status=1; fi
            if [ -n "$docker_config" ]; then rm -rf -- "$docker_config" || status=1; fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_TOOLS_SHA" =~ ^[0-9a-f]{40}$ ]]
          root="$HOME/.local/share/cowork"
          cache="$root/repository.git"
          release="$root/releases/$DEPLOY_SHA"
          tools_release="$root/releases/$DEPLOY_TOOLS_SHA"
          mkdir -p "$root/releases"
          exec 9>"$root/source.lock"
          flock -w 120 9
          if [ ! -d "$cache" ]; then
            git clone --mirror https://github.com/team-cowork/cowork-server.git "$cache"
          fi
          archive_release() {
            local sha="$1" destination="$root/releases/$1"
            test ! -L "$destination"
            git --git-dir="$cache" fetch origin "$sha" --quiet
            if [ ! -d "$destination" ]; then
              staging="$(mktemp -d "$root/releases/.staging.XXXXXX")"
              git --git-dir="$cache" archive "$sha" | tar -x -C "$staging"
              printf '%s\n' "$sha" > "$staging/.source-sha"
              mv "$staging" "$destination"
              staging=
            fi
            test ! -L "$destination/.source-sha"
            test "$(cat "$destination/.source-sha")" = "$sha"
          }
          archive_release "$DEPLOY_SHA"
          if [ "$DEPLOY_TOOLS_SHA" != "$DEPLOY_SHA" ]; then
            archive_release "$DEPLOY_TOOLS_SHA"
          fi
          flock -u 9
          # Never reuse or modify the VM's persistent Docker authentication.
          docker_config="$(mktemp -d "$root/.docker-auth.XXXXXX")"
          chmod 700 "$docker_config"
          export DOCKER_CONFIG="$docker_config"
          unset DOCKER_AUTH_CONFIG
          # An explicit auth entry prevents automatic use of a host credential store.
          printf '%s\n' '{"auths":{"ghcr.io":{}}}' > "$DOCKER_CONFIG/config.json"
          chmod 600 "$DOCKER_CONFIG/config.json"
          if [ "$DEPLOY_ACTION" = deploy ] && [ -n "${DEPLOY_GHCR_TOKEN:-}" ]; then
            printf '%s' "$DEPLOY_GHCR_TOKEN" | docker login ghcr.io \
              --username "$DEPLOY_GHCR_USER" --password-stdin
          fi
          unset DEPLOY_GHCR_TOKEN DEPLOY_GHCR_USER
          printf '%s' "$DEPLOY_PAYLOAD" | python3 "$tools_release/deploy/prod/cd/apply-settings.py" \
            "$DEPLOY_SERVICE" "$DEPLOY_TARGET" "$DEPLOY_SHA" "${DEPLOY_OWNER,,}" "$DEPLOY_ACTION" \
            --release-directory "$release"
    - name: Record Successful Runtime Deployment
      if: ${{ inputs.check_only != 'true' }}
      env:
        GH_TOKEN: ${{ github.token }}
        SERVICE: ${{ inputs.service }}
        TARGET: ${{ inputs.target }}
        RELEASE_SHA: ${{ inputs.sha }}
      shell: bash
      run: python3 deploy/prod/cd/deployment_state.py "$SERVICE" "$TARGET" "$RELEASE_SHA"
