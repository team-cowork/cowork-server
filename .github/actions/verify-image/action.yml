name: Verify a cowork module
description: Run the module-owned verify target and validate its coverage export
inputs:
  module:
    required: true
    description: Module directory, including the cowork prefix
  source:
    default: '.'
    description: Source checkout path
  snapshot:
    default: pr
    description: Coverage snapshot name
  contract:
    default: 'true'
    description: Whether this historical revision declares the verify target
  output:
    required: true
    description: Absolute coverage output directory
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
      if: inputs.contract == 'true'
      id: builder
    - name: Restore verification dependency caches
      if: inputs.contract == 'true'
      uses: actions/cache@v6
      id: cache
      with:
        path: ${{ runner.temp }}/verify-cache-${{ inputs.module }}-${{ inputs.snapshot }}
        key: ${{ runner.os }}-verify-mounts-v1-${{ inputs.module }}-${{ inputs.snapshot }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-verify-mounts-v1-${{ inputs.module }}-${{ inputs.snapshot }}-
    - name: Inject and extract verification cache mounts
      if: inputs.contract == 'true'
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.builder.outputs.name }}
        dockerfile: ${{ inputs.source }}/${{ inputs.module }}/Dockerfile.prod
        cache-dir: ${{ runner.temp }}/verify-cache-${{ inputs.module }}-${{ inputs.snapshot }}
        scratch-dir: ${{ runner.temp }}/verify-cache-dance-${{ inputs.module }}-${{ inputs.snapshot }}
        skip-extraction: ${{ steps.cache.outputs.cache-hit }}
        utility-image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    - name: Verify source and export coverage
      if: inputs.contract == 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.source }}
        file: ${{ inputs.source }}/${{ inputs.module }}/Dockerfile.prod
        target: verify
        platforms: linux/amd64
        outputs: type=local,dest=${{ inputs.output }}/export
        provenance: false
        sbom: false
        cache-from: type=gha,scope=verify-${{ inputs.module }}-${{ inputs.snapshot }}
        cache-to: type=gha,mode=max,scope=verify-${{ inputs.module }}-${{ inputs.snapshot }}
    - name: Validate verification result
      if: always()
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        SNAPSHOT: ${{ inputs.snapshot }}
        SOURCE: ${{ inputs.source }}
        OUTPUT: ${{ inputs.output }}
      run: |
        python3 deploy/images/ci/run.py collect --module "$MODULE" --snapshot "$SNAPSHOT" \
          --source "$SOURCE" --artifact "$OUTPUT/export" --output "$OUTPUT/result.json"
