name: Verify A Cowork Module
description: Run the module-owned verify target and validate its coverage export
inputs:
  module:
    required: true
    description: Module directory, including the cowork prefix
  environment:
    required: true
    description: Dockerfile environment, local or prod
  source:
    default: '.'
    description: Source checkout path
  snapshot:
    default: pr
    description: Coverage snapshot name
  contract:
    default: 'true'
    description: Whether this historical revision declares the verify target
  output:
    required: true
    description: Absolute coverage output directory
runs:
  using: composite
  steps:
    - name: Read Source Revision
      if: inputs.contract == 'true'
      id: source
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: echo "sha=$(git -C "$SOURCE" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set Up Docker Buildx
      uses: docker/setup-buildx-action@v4
      if: inputs.contract == 'true'
      id: builder
    # Historical base measurements do not restore, extract or save external caches.
    - name: Read Verification Cache Key And Policy
      if: inputs.contract == 'true' && inputs.snapshot != 'base'
      id: cache-policy
      shell: bash
      env:
        CACHE_FALLBACK: ${{ runner.os }}-dependency-mounts-v3-${{ inputs.module }}-${{ inputs.environment }}-
        # Hash the measurement checkout, which can differ from the action checkout.
        CACHE_PREFIX: ${{ runner.os }}-dependency-mounts-v3-${{ inputs.module }}-${{ inputs.environment }}-${{ hashFiles(format('{0}/{1}/Dockerfile.{2}', inputs.source, inputs.module, inputs.environment)) }}-
        CACHE_WRITE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') }}
      run: |
        # Dependency changes are resolved by the build tool; refresh the cache weekly.
        echo "key=${CACHE_PREFIX}$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
        echo "prefix=$CACHE_PREFIX" >> "$GITHUB_OUTPUT"
        echo "fallback=$CACHE_FALLBACK" >> "$GITHUB_OUTPUT"
        echo "write=$CACHE_WRITE" >> "$GITHUB_OUTPUT"
    # Branch push CI populates the sole dependency cache, which image builds also
    # restore; PRs only restore it.
    - name: Restore And Save Verification Dependency Caches
      if: steps.cache-policy.outputs.write == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: cache
      with:
        # build-image restores from this exact path; the cache version includes it.
        path: ${{ runner.temp }}/dependency-mounts-${{ inputs.module }}-${{ inputs.environment }}
        key: ${{ steps.cache-policy.outputs.key }}
        restore-keys: |
          ${{ steps.cache-policy.outputs.prefix }}
          ${{ steps.cache-policy.outputs.fallback }}
    - name: Restore Verification Dependency Caches Without Saving
      if: inputs.contract == 'true' && inputs.snapshot != 'base' && steps.cache-policy.outputs.write != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: restore-cache
      with:
        path: ${{ runner.temp }}/dependency-mounts-${{ inputs.module }}-${{ inputs.environment }}
        key: ${{ steps.cache-policy.outputs.key }}
        restore-keys: |
          ${{ steps.cache-policy.outputs.prefix }}
          ${{ steps.cache-policy.outputs.fallback }}
    - name: Inject And Extract Verification Cache Mounts
      if: steps.cache-policy.outputs.write == 'true' || steps.restore-cache.outputs.cache-matched-key != ''
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.builder.outputs.name }}
        dockerfile: ${{ inputs.source }}/${{ inputs.module }}/Dockerfile.${{ inputs.environment }}
        cache-dir: ${{ runner.temp }}/dependency-mounts-${{ inputs.module }}-${{ inputs.environment }}
        scratch-dir: ${{ runner.temp }}/verify-cache-dance-${{ inputs.module }}-${{ inputs.environment }}-${{ inputs.snapshot }}
        skip-extraction: ${{ steps.cache-policy.outputs.write != 'true' || steps.cache.outputs.cache-hit == 'true' }}
        utility-image: alpine:3.24.1@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
    - name: Verify Source And Export Coverage
      if: inputs.contract == 'true'
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.source }}
        file: ${{ inputs.source }}/${{ inputs.module }}/Dockerfile.${{ inputs.environment }}
        target: verify
        build-args: SOURCE_REVISION=${{ steps.source.outputs.sha }}
        platforms: linux/amd64
        outputs: type=local,dest=${{ inputs.output }}/export
        provenance: false
        sbom: false
    - name: Validate Verification Result
      if: always()
      shell: bash
      env:
        MODULE: ${{ inputs.module }}
        SNAPSHOT: ${{ inputs.snapshot }}
        SOURCE: ${{ inputs.source }}
        OUTPUT: ${{ inputs.output }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        python3 deploy/images/ci/run.py collect --module "$MODULE" --snapshot "$SNAPSHOT" \
          --source "$SOURCE" --artifact "$OUTPUT/export" --output "$OUTPUT/result.json" --environment "$ENVIRONMENT"
