server:
  port: ${PORT:8088}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cowork_roadmap}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:${MYSQL_USER:cowork}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

KAFKA_TOPIC_TEAM_MEMBER: team.member.event
KAFKA_GROUP_ID_TEAM_MEMBER: cowork-roadmap.team-member
