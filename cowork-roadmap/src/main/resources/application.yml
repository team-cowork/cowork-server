server:
  port: 8088

spring:
  profiles:
    active: ${APP_CONFIG_PROFILE:local}
  cloud:
    config:
      username: ${CONFIG_CLIENT_USERNAME}
      password: ${CONFIG_CLIENT_PASSWORD}
  application:
    name: cowork-roadmap
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8761}"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cowork_roadmap?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${MYSQL_USER:cowork}
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-timeout: 10000
      data-source-properties:
        # Keep existing DATETIME values when the JVM and server time zones differ.
        preserveInstants: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

eureka:
  client:
    jersey:
      enabled: false
    webclient:
      enabled: false
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    initial-status: starting
    prefer-ip-address: true
    metadata-map:
      prometheus.scrape: "true"
      prometheus.path: /actuator/prometheus

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh, busrefresh, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,teamMemberProjectionReadiness
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
