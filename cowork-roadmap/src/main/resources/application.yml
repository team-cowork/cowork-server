spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    admin:
      properties:
        # The broker has a fixed address; keep reconnecting without rebootstrap loops.
        metadata.recovery.strategy: none
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 30000
      retry.backoff.ms: 1000
      retry.backoff.max.ms: 10000
      security.protocol: ${KAFKA_SECURITY_PROTOCOL}
  profiles:
    active: ${APP_CONFIG_PROFILE}
  application:
    name: cowork-roadmap
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
      # 투영 준비 상태와 역할 조회가 서비스 트랜잭션 안에서도 요청 시점의 최신 커밋을 읽게 한다.
      transaction-isolation: TRANSACTION_READ_COMMITTED
      data-source-properties:
        preserveInstants: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,teamMemberProjectionReadiness
  metrics:
    tags:
      application: ${spring.application.name}
sdk:
  logging:
    enabled: true
    not-logging-urls:
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
  # 요청 로깅만 the-sdk에 맡긴다. 응답 형식, 예외 처리, API 문서는 이 모듈의 구성을 그대로 쓴다.
  response:
    enabled: false
  exception:
    enabled: false
  swagger:
    enabled: false
server:
  port: 8088
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
