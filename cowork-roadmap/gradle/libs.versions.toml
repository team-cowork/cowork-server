[versions]
java = "26"
spring-boot = "4.1.1"
spring-cloud = "2025.1.3"
springdoc-webmvc = "3.1.1"
# Written at 2026-11-08 19:32 KST: the-sdk 2.0 is expected between 2026-11-09 and 2026-11-10 KST.
# 2.0 moves support from Spring Boot 3.x to 4.x, which resolves the dependency tree problems.
# 2.0 also corrects the Swagger examples: `status` shows the real "200 OK" form, `status`, `code`,
# and `message` follow each response's HTTP status, 201 and 202 responses with a body are covered,
# and the `data` field of CommonApiResponse<T> is no longer missing. 204 and bodyless responses stay unchanged.
# TODO: Change this version to 2.0 after the release is confirmed.
the-sdk = "1.5"
logstash-logback = "9.0"
lombok = "1.18.48"

[libraries]
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-webmvc" }
the-sdk = { module = "com.github.themoment-team:the-sdk", version.ref = "the-sdk" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
