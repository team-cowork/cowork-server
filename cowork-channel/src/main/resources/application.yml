spring:
  reactor:
    context-propagation: auto
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      auto-offset-reset: earliest
    admin:
      properties:
        # The broker has a fixed address; keep reconnecting without rebootstrap loops.
        metadata.recovery.strategy: none
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 30000
      retry.backoff.ms: 1000
      retry.backoff.max.ms: 10000
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      ssl.truststore.type: PEM
      ssl.truststore.location: ${KAFKA_SSL_CA_LOCATION:}
  profiles:
    active: ${APP_CONFIG_PROFILE:local}
  application:
    name: cowork-channel
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:cowork}
    password: ${MYSQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness
  metrics:
    tags:
      application: ${spring.application.name}
kafka:
  outbox:
    relay-initial-delay-ms: 1000
    relay-delay-ms: 1000
    batch-size: 100
    claim-lease-ms: 30000
    send-timeout-ms: 10000
    max-attempts: 8
    backoff-initial-ms: 5000
    backoff-max-ms: 600000
sdk:
  logging:
    not-logging-urls:
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    enabled: true
  response:
    enabled: false
  swagger:
    enabled: true
    group: channel
    paths-to-match:
    - /teams/**
    - /channels/**
    - /projects/**
    - /search/**
    - /dms
  exception:
    enabled: false
server:
  port: 8083
projection:
  readiness:
    poll-interval-ms: 1000
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
