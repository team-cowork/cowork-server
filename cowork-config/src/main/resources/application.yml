server:
  port: 8761

spring:
  application:
    name: cowork-config
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
    group:
      local: composite
      prod: composite

  cloud:
    bus:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh, busrefresh, monitor, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      server:
        overrides:
          S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:http://seaweedfs:9000}
          S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:http://localhost:9000}
          S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:http://localhost:9000/cowork-bucket}
        composite:
          - type: vault
            host: ${VAULT_HOST:localhost}
            port: ${VAULT_PORT:8200}
            scheme: ${VAULT_SCHEME:http}
            authentication: TOKEN
            token: ${VAULT_TOKEN:dev-root-token}
            kv-version: 2
            backend: secret
            profile-separator: "/"
            default-context: application
          - type: native
            search-locations: classpath:/configs/

---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    config:
      server:
        overrides:
          S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:http://seaweedfs:9000}
          S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
          S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
          PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
          PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
          GITHUB_APP_SERVICE_URL: ${GITHUB_APP_SERVICE_URL}
          LIVEKIT_URL: ${LIVEKIT_URL:http://cowork-livekit:7880}
          LIVEKIT_WS_URL: ${LIVEKIT_WS_URL}
        composite:
          - type: vault
            host: ${VAULT_HOST}
            port: ${VAULT_PORT:8200}
            scheme: https
            authentication: TOKEN
            token: ${VAULT_TOKEN}
            kv-version: 2
            backend: secret
            profile-separator: "/"
            default-context: application
          - type: native
            search-locations: classpath:/configs/
