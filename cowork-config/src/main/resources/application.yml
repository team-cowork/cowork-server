server:
  port: ${PORT:8761}

spring:
  application:
    name: cowork-config
  profiles:
    active: ${APP_CONFIG_PROFILE:local}
    group:
      local: composite
      prod: composite

  cloud:
    config:
      server:
        health:
          enabled: false
    bus:
      enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# HTTP debug/trace logging can include AppRole credentials and Vault responses.
logging:
  level:
    org.springframework.vault: INFO
    org.springframework.web: INFO
    org.apache.hc.client5.http: WARN
    org.apache.hc.core5.http: WARN

---
spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      server:
        overrides:
          S3_BUCKET: ${S3_BUCKET:cowork-bucket}
          S3_REGION: ${S3_REGION:us-east-1}
          S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:http://seaweedfs:9000}
          PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:http://localhost:8080}
          PUBLIC_WEB_ORIGINS: ${PUBLIC_WEB_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
          LIVEKIT_URL: ${LIVEKIT_URL:http://cowork-livekit:7880}
          LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:ws://localhost:7880}
        composite:
          - type: vault
            host: ${VAULT_EXTERNAL_HOST:${VAULT_HOST:localhost}}
            port: ${VAULT_PORT:8200}
            scheme: ${VAULT_SCHEME:http}
            authentication: ${VAULT_AUTHENTICATION:TOKEN}
            token: ${VAULT_TOKEN:dev-root-token}
            app-role:
              app-role-path: ${VAULT_APP_ROLE_PATH:approle}
              role-id: ${VAULT_ROLE_ID:}
              secret-id: ${VAULT_SECRET_ID:}
            kv-version: 2
            backend: ${VAULT_BACKEND:secret}
            profile-separator: "/"
            default-key: ""
          - type: native
            search-locations: classpath:/configs/

---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    config:
      server:
        overrides:
          S3_BUCKET: ${S3_BUCKET:cowork-bucket}
          S3_REGION: ${S3_REGION:us-east-1}
          PUBLIC_WEB_ORIGINS: ${PUBLIC_WEB_ORIGINS}
          PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL}
          LIVEKIT_URL: ${LIVEKIT_URL:http://cowork-livekit:7880}
          LIVEKIT_WS_URL: ${LIVEKIT_WS_URL}
        # Spring Vault 4 builds each composite VaultTemplate on this context-level
        # request factory; only the composite login uses the composite ssl below.
        vault:
          ssl:
            trust-store: classpath:vault-tls-ca.p12
            trust-store-password: cowork-vault-tls-ca
        composite:
          - type: vault
            # The private listener presents a certificate from the cowork Vault CA.
            host: ${VAULT_HOST}
            port: ${VAULT_PORT}
            scheme: https
            ssl:
              trust-store: classpath:vault-tls-ca.p12
              # The store holds only the public CA certificate.
              trust-store-password: cowork-vault-tls-ca
            authentication: APPROLE
            app-role:
              app-role-path: ${VAULT_APP_ROLE_PATH:approle}
              role-id: ${VAULT_ROLE_ID}
              secret-id: ${VAULT_SECRET_ID}
            kv-version: 2
            backend: ${VAULT_BACKEND:secret}
            profile-separator: "/"
            default-key: ""
          - type: native
            search-locations: classpath:/configs/
