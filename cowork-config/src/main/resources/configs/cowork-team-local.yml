server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/cowork_team?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  kafka:
    bootstrap-servers: kafka:9092
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        endpoint: ${S3_INTERNAL_ENDPOINT}
        path-style-access-enabled: true

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://cowork-config:8761/eureka/
  instance:
    initial-status: STARTING

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness

projection:
  readiness:
    poll-interval-ms: 1000

team-github:
  state-secret: ${TEAM_GITHUB_STATE_SECRET}
  app-slug: ${GITHUB_APP_SLUG}

KAFKA_GROUP_ID_TEAM_ROLE_PREFERENCE: cowork-team.team-role-projection
KAFKA_GROUP_ID_TEAM_ROLE_COMMAND_RESULT: cowork-team.team-role-command-result

object-storage:
  public-endpoint: ${S3_PUBLIC_ENDPOINT}
  public-base-url: ${S3_PUBLIC_BASE_URL}
