server:
  port: ${PORT:8084}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cowork_project}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:${MYSQL_USER}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://cowork-config:8761/eureka/}
  instance:
    hostname: ${APP_ADVERTISE_ADDRESS:${spring.cloud.client.hostname}}
    ip-address: ${APP_ADVERTISE_ADDRESS:${spring.cloud.client.ip-address}}
    non-secure-port: ${APP_ADVERTISE_PORT:${server.port}}
    prefer-ip-address: true
    initial-status: STARTING

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness

projection:
  readiness:
    poll-interval-ms: 1000

github-app:
  service-url: ${COWORK_GITHUB_APP_SERVICE_URL}
