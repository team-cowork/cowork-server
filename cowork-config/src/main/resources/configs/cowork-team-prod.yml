server:
  port: 8085

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/cowork_team?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  cloud:
    aws:
      region:
        static: ${S3_REGION:us-east-1}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        endpoint: ${S3_INTERNAL_ENDPOINT}
        path-style-access-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://cowork-config:8761/eureka/}

team-github:
  state-secret: ${TEAM_GITHUB_STATE_SECRET}
  app-slug: ${GITHUB_APP_SLUG}

object-storage:
  public-endpoint: ${S3_PUBLIC_ENDPOINT}
  public-base-url: ${S3_PUBLIC_BASE_URL}
