server:
  port: ${PORT:8085}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cowork_team}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:${MYSQL_USER}}
    password: ${DB_PASSWORD:${MYSQL_PASSWORD}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  cloud:
    aws:
      region:
        static: ${S3_REGION:us-east-1}
      credentials:
        access-key: ${S3_ACCESS_KEY}
        secret-key: ${S3_SECRET_KEY}
      s3:
        endpoint: ${S3_INTERNAL_ENDPOINT}
        path-style-access-enabled: true

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://cowork-config:8761/eureka/}
  instance:
    hostname: ${APP_ADVERTISE_ADDRESS:${spring.cloud.client.hostname}}
    ip-address: ${APP_ADVERTISE_ADDRESS:${spring.cloud.client.ip-address}}
    non-secure-port: ${APP_ADVERTISE_PORT:${server.port}}
    prefer-ip-address: true
    initial-status: STARTING

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness

projection:
  readiness:
    poll-interval-ms: 1000

team-github:
  state-secret: ${TEAM_GITHUB_STATE_SECRET}
  app-slug: ${GITHUB_APP_SLUG}

KAFKA_GROUP_ID_TEAM_ROLE_PREFERENCE: cowork-team.team-role-projection
KAFKA_GROUP_ID_TEAM_ROLE_COMMAND_RESULT: cowork-team.team-role-command-result

object-storage:
  bucket: ${S3_BUCKET:cowork-bucket}
  public-api-base-url: ${PUBLIC_API_BASE_URL}
