server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/cowork_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    healthcheck:
      enabled: true
    service-url:
      defaultZone: http://cowork-config:8761/eureka/
  instance:
    initial-status: STARTING

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,projectionReadiness

projection:
  readiness:
    poll-interval-ms: 1000

github-app:
  service-url: http://host.docker.internal:3000

# cowork-team과 동일한 값이 배포돼야 서로 발급한 state를 검증할 수 있다.
team-github:
  state-secret: ${TEAM_GITHUB_STATE_SECRET}
