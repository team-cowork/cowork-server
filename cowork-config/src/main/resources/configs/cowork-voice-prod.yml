# MONGODB_URI, LIVEKIT_API_KEY, LIVEKIT_API_SECRET은 Vault secret/cowork-voice 에서 주입됨
# Go 런타임은 원격 문자열의 ${ENV}를 해석하지 않는다.
# LIVEKIT_URL, LIVEKIT_WS_URL은 Config Server overrides가 같은 키 이름으로 덮어쓴다.
PORT: 8089
MONGODB_DB: cowork_voice
REDIS_ADDR: redis:6379
REDIS_DB: 0
LIVEKIT_TOKEN_TTL_SECS: 3600
KAFKA_BROKERS: kafka:9092
KAFKA_TOPIC_VOICE_EVENT: voice.event
KAFKA_TOPIC_CHANNEL_MEMBER_EVENT: channel.member.event
KAFKA_GROUP_ID_CHANNEL_MEMBER: cowork-voice.channel-member
KAFKA_MESSAGE_TIMEOUT_MS: 5000
EUREKA_ENABLED: true
EUREKA_SERVER_URL: http://cowork-config:8761/eureka
EUREKA_APP_NAME: cowork-voice
EUREKA_INSTANCE_HOST: cowork-voice
EUREKA_INSTANCE_PORT: 8089
EUREKA_HEARTBEAT_INTERVAL_SECS: 10
