# GITHUB_APP_ID, GITHUB_PRIVATE_KEY, INTERNAL_API_KEY, GITHUB_WEBHOOK_SECRET은 Vault secret/cowork-github에서 주입됨
# NestJS 런타임은 원격 문자열의 ${ENV}를 해석하지 않는다.
# KAFKA_GROUP_ID는 기존 cowork-github-app의 커밋 오프셋을 이어받도록 유지한다.
PORT: 8090
NODE_ENV: production
KAFKA_BOOTSTRAP_SERVERS: kafka:9092
KAFKA_GROUP_ID: cowork-github-group
REDIS_HOST: redis
REDIS_PORT: 6379
EUREKA_ENABLED: true
EUREKA_SERVER_URL: http://cowork-config:8761/eureka
EUREKA_APP_NAME: cowork-github
APP_ADVERTISE_ADDRESS: cowork-github
EUREKA_LEASE_RENEWAL_SECONDS: 30
