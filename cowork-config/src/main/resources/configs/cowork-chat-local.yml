# MONGODB_URI, JWT_SECRET은 Vault secret/cowork-chat 에서 주입됨
# DISCORD_WEBHOOK_URL은 운영에서만 Vault secret/cowork-chat 에 설정 (비어있으면 알림 비활성화)
PORT: 8087
NODE_ENV: production
DISCORD_WEBHOOK_URL: ""
JWT_SECRET: ${JWT_SECRET}
ELASTICSEARCH_URL: http://elasticsearch:9200
MONGODB_DIRECT_CONNECTION: false
MONGODB_SERVER_SELECTION_TIMEOUT_MS: 5000
MONGODB_CONNECT_TIMEOUT_MS: 5000
KAFKA_BOOTSTRAP_SERVERS: kafka:9092
PROJECT_SERVICE_URL: http://cowork-project:8084
CHANNEL_SERVICE_URL: http://cowork-channel:8083
USER_SERVICE_URL: http://cowork-user:8082
REDIS_HOST: redis
REDIS_PORT: 6379
EUREKA_ENABLED: true
EUREKA_SERVER_URL: http://cowork-config:8761/eureka
EUREKA_APP_NAME: cowork-chat
EUREKA_INSTANCE_HOST: cowork-chat
EUREKA_LEASE_RENEWAL_SECONDS: 30
MINIO_INTERNAL_ENDPOINT: http://minio:9000
MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000/cowork-bucket}
MINIO_BUCKET: cowork-bucket
MINIO_CHAT_MAX_FILE_SIZE_BYTES: 104857600
MINIO_CHAT_ALLOWED_CONTENT_TYPES: video/mp4,video/quicktime,video/x-msvideo,audio/mpeg,audio/ogg,audio/wav,audio/mp4,image/jpeg,image/png,image/gif,image/webp,application/pdf,text/plain
MINIO_CHAT_UPLOAD_RATE_LIMIT_WINDOW_MS: 60000
MINIO_CHAT_UPLOAD_RATE_LIMIT_MAX_REQUESTS: 20
