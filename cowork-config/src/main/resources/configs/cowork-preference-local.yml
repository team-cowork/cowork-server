server:
  port: 9001

preference:
  db:
    host: ${POSTGRES_HOST:postgres}
    port: ${POSTGRES_PORT:5432}
    database: cowork_preference
    schema: preference
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    pool-size: 5
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    team-member-consumer-group-id: ${KAFKA_GROUP_ID_TEAM_MEMBER_PROJECTION:cowork-preference-team-member-projection}
    team-member-topic: ${KAFKA_TOPIC_TEAM_MEMBER_EVENT:team.member.event}
    team-role-command-consumer-group-id: ${KAFKA_GROUP_ID_TEAM_ROLE_COMMAND:cowork-preference-team-role-command}
    github-repo-setting-command-consumer-group-id: ${KAFKA_GROUP_ID_GITHUB_REPO_SETTING_COMMAND:cowork-preference-github-repo-setting-command}
    channel-role-policy-command-consumer-group-id: ${KAFKA_GROUP_ID_CHANNEL_ROLE_POLICY_COMMAND:cowork-preference-channel-role-policy-command}

eureka:
  url: ${EUREKA_SERVER_URL:http://cowork-config:8761/eureka/}
  app-name: ${EUREKA_APP_NAME:cowork-preference}
  instance:
    host: ${EUREKA_INSTANCE_HOST:cowork-preference}
