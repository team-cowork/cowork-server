server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://cowork-config:8761/eureka/}
  instance:
    hostname: ${APP_ADVERTISE_ADDRESS:${spring.cloud.client.hostname}}
    ip-address: ${APP_ADVERTISE_ADDRESS:${spring.cloud.client.ip-address}}
    non-secure-port: ${APP_ADVERTISE_PORT:${server.port}}
    prefer-ip-address: true

gateway:
  response-wrapper:
    max-wrappable-size: 1MB

cowork:
  swagger-ui:
    primary-name: user
    urls:
      - name: authorization
        url: /v3/api-docs/authorization
      - name: user
        url: /v3/api-docs/user
      - name: team
        url: /v3/api-docs/team
      - name: channel
        url: /v3/api-docs/channel
      - name: project
        url: /v3/api-docs/project
      - name: roadmap
        url: /v3/api-docs/roadmap
      - name: chat
        url: /v3/api-docs/chat
      - name: voice
        url: /v3/api-docs/voice
      - name: notification
        url: /v3/api-docs/notification
      - name: preference
        url: /v3/api-docs/preference

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway.server.webflux:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "${PUBLIC_WEB_ORIGINS}"
            allowedMethods: GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS
            allowedHeaders: "*"
            exposedHeaders: Content-Length, Content-Range, Accept-Ranges, ETag, Retry-After
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: webhook-management
          order: -2
          uri: lb://cowork-preference
          predicates:
            - Path=/api/channel/channels/*/webhooks, /api/channel/channels/*/webhooks/**
            - Method=GET,POST,PATCH,PUT,DELETE
          filters:
            - StripPrefix=2
            - SetResponseHeader=Cache-Control, no-store
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: webhook-ingress
          order: -2
          uri: lb://cowork-chat
          predicates:
            - Path=/api/chat/chat/webhooks/{executionId}/messages
            - Method=POST
          filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@webhookKeyResolver}"
            - StripPrefix=2
            - SetResponseHeader=Cache-Control, no-store

        - id: team-object-storage
          uri: ${S3_TEAM_INTERNAL_ENDPOINT:${S3_INTERNAL_ENDPOINT:http://seaweedfs:9000}}
          predicates:
            - Path=/api/storage/${S3_BUCKET}/team-icons/**,/api/storage/${S3_BUCKET}/team-icon-uploads/**
            - Method=GET,HEAD,PUT
          filters:
            - StorageRelay
            - StripPrefix=2

        - id: user-object-storage
          uri: ${S3_USER_INTERNAL_ENDPOINT:${S3_INTERNAL_ENDPOINT:http://seaweedfs:9000}}
          predicates:
            - Path=/api/storage/${S3_BUCKET}/profiles/**,/api/storage/${S3_BUCKET}/profile-uploads/**
            - Method=GET,HEAD,PUT
          filters:
            - StorageRelay
            - StripPrefix=2

        - id: chat-object-storage
          uri: ${S3_CHAT_INTERNAL_ENDPOINT:${S3_INTERNAL_ENDPOINT:http://seaweedfs:9000}}
          predicates:
            - Path=/api/storage/${S3_BUCKET}/chat-files/**,/api/storage/${S3_BUCKET}/chat-uploads/**
            - Method=GET,HEAD,PUT
          filters:
            - StorageRelay
            - StripPrefix=2

        - id: chat-service
          uri: lb://cowork-chat
          predicates:
            - Path=/api/chat/chat/**, /api/chat/health, /api/chat/graphql, /api/chat/asyncapi.json
          filters:
            - StripPrefix=2

        - id: channel-service
          uri: lb://cowork-channel
          predicates:
            - Path=/api/channel/channels/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: authorization-service
          uri: lb://cowork-authorization
          predicates:
            - Path=/api/authorization/auth/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: authorization-webhook
          uri: lb://cowork-authorization
          predicates:
            - Path=/api/authorization/events/datagsm
          filters:
            - StripPrefix=2

        - id: user-service
          uri: lb://cowork-user
          predicates:
            - Path=/api/user/users/**
            - Method=GET,POST,PATCH,DELETE
          filters:
            - StripPrefix=2
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: project-team-service
          uri: lb://cowork-project
          predicates:
            - Path=/api/project/teams/*/projects/**
          filters:
            - StripPrefix=2

        - id: team-channel-service
          uri: lb://cowork-channel
          predicates:
            - Path=/api/channel/teams/*/channels, /api/channel/teams/*/channels/**
          filters:
            - StripPrefix=2

        - id: team-service
          uri: lb://cowork-team
          predicates:
            - Path=/api/team/teams/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: channel-service-search
          uri: lb://cowork-channel
          predicates:
            - Path=/api/channel/search/channels
            - Method=GET
          filters:
            - StripPrefix=2

        - id: project-channel-service
          uri: lb://cowork-channel
          predicates:
            - Path=/api/channel/projects/*/channels, /api/channel/projects/*/channels/**
          filters:
            - StripPrefix=2

        - id: project-service
          uri: lb://cowork-project
          predicates:
            - Path=/api/project/projects/**
          filters:
            - StripPrefix=2

        - id: roadmap-service
          uri: lb://cowork-roadmap
          predicates:
            - Path=/api/roadmap/roadmaps/**
          filters:
            - StripPrefix=2

        - id: chat-service-ws
          uri: lb:ws://cowork-chat
          predicates:
            - Path=/ws/chat/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        # DM 채널 열기(멱등 생성)는 channel 서비스가 담당
        - id: dm-open
          uri: lb://cowork-channel
          predicates:
            - Path=/api/channel/dms
            - Method=POST
          filters:
            - StripPrefix=2

        - id: preference-service
          uri: lb://cowork-preference
          predicates:
            - Path=/api/preference/preferences/**
          filters:
            - StripPrefix=2

        - id: live-service
          uri: lb://cowork-voice
          predicates:
            - Path=/api/voice/live/**
          filters:
            - StripPrefix=2

        - id: github-service-webhook
          order: -1
          uri: lb://cowork-github
          predicates:
            - Path=/api/github/github/webhooks
            - Method=POST
          filters:
            - StripPrefix=2

        - id: github-service-setup
          order: -1
          uri: lb://cowork-github
          predicates:
            - Path=/api/github/github/setup
            - Method=GET
          filters:
            - StripPrefix=2
            # 인증 없이 GitHub App API를 호출하는 콜백이므로 반복 호출로 App 한도가 소진되지 않게 제한한다
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: voice-service-webhook
          order: -1
          uri: lb://cowork-voice
          predicates:
            - Path=/api/voice/voice/webhook
            - Method=POST
          filters:
            - StripPrefix=2

        - id: voice-service
          uri: lb://cowork-voice
          predicates:
            - Path=/api/voice/voice/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: authorization-service-docs
          uri: lb://cowork-authorization
          predicates:
            - Path=/v3/api-docs/authorization
          filters:
            - RewritePath=/v3/api-docs/authorization, /swagger/doc.json

        - id: user-service-docs
          uri: lb://cowork-user
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs

        - id: voice-service-docs
          uri: lb://cowork-voice
          predicates:
            - Path=/v3/api-docs/voice
          filters:
            - RewritePath=/v3/api-docs/voice, /swagger/doc.json

        - id: chat-service-docs
          uri: lb://cowork-chat
          predicates:
            - Path=/v3/api-docs/chat
          filters:
            - RewritePath=/v3/api-docs/chat, /api-json

        - id: preference-service-docs
          uri: lb://cowork-preference
          predicates:
            - Path=/v3/api-docs/preference
          filters:
            - RewritePath=/v3/api-docs/preference, /swagger/doc.json

        - id: team-service-docs
          uri: lb://cowork-team
          predicates:
            - Path=/v3/api-docs/team
          filters:
            - RewritePath=/v3/api-docs/team, /v3/api-docs

        - id: channel-service-docs
          uri: lb://cowork-channel
          predicates:
            - Path=/v3/api-docs/channel
          filters:
            - RewritePath=/v3/api-docs/channel, /v3/api-docs

        - id: project-service-docs
          uri: lb://cowork-project
          predicates:
            - Path=/v3/api-docs/project
          filters:
            - RewritePath=/v3/api-docs/project, /v3/api-docs

        - id: roadmap-service-docs
          uri: lb://cowork-roadmap
          predicates:
            - Path=/v3/api-docs/roadmap
          filters:
            - RewritePath=/v3/api-docs/roadmap, /v3/api-docs

        - id: notification-service-sse
          order: -1
          uri: lb://cowork-notification
          predicates:
            - Path=/api/notification/notifications/stream
          filters:
            - StripPrefix=2
          metadata:
            response-timeout: -1  # SSE는 타임아웃 없음

        - id: notification-service
          uri: lb://cowork-notification
          predicates:
            - Path=/api/notification/notifications/**
          filters:
            - StripPrefix=2

        - id: notification-service-docs
          uri: lb://cowork-notification
          predicates:
            - Path=/v3/api-docs/notification
          filters:
            - RewritePath=/v3/api-docs/notification, /swagger/doc.json

# jwt.secret은 Vault secret/cowork-gateway 에서 주입됨 (여기서 정의하지 않음)

app:
  dev-origin:
    credential: ${DEV_ORIGIN_CREDENTIAL:local-dev-credential}
  ws:
    allowed-origins:
      - "http://localhost:3000"

resilience4j:
  circuitbreaker:
    instances:
      defaultCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
