server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/cowork_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://cowork-config:8761/eureka/

github-app:
  service-url: http://host.docker.internal:3000
