# db.dsn은 Vault secret/cowork-notification 에서 주입됨
# Go 런타임은 원격 문자열의 ${ENV}를 해석하지 않으며, 중첩 키는 Config Server overrides로도
# 덮어쓸 수 없으므로 리터럴 값만 사용한다.

server:
  port: 8086

kafka:
  brokers: kafka:9092
  topic: notification.trigger
  group-id: cowork-notification
  projection-group-id: cowork-notification-projections
  topics:
    channel-notification: preference.channel-notification.changed
    user-profile: user.profile.event
    team-lifecycle: team.lifecycle

fcm:
  credentials-file: /run/secrets/firebase-credentials.json

eureka:
  server-url: http://cowork-config:8761/eureka
  app-name: cowork-notification
  instance:
    host: cowork-notification
    port: 8086
