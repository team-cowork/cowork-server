play.http.secret.key = ${?APPLET_SECRET_KEY}
play.server.http.port = 8091

# Gateway wraps only JSON and plain-text failures; Play's default HTML error pages would pass through unwrapped.
play.http.errorHandler = com.cowork.applet.global.error.ApiErrorHandler

play.modules.enabled += "com.cowork.applet.global.metrics.MetricsModule"
play.modules.enabled += "com.cowork.applet.global.surreal.SurrealModule"
play.modules.enabled += "com.cowork.applet.global.crypto.CryptoModule"

db {
  host = "127.0.0.1"
  host = ${?DB_HOST}
  port = 8000
  port = ${?DB_PORT}
  name = "cowork_applet"
  name = ${?DB_NAME}
  username = "cowork_applet"
  username = ${?DB_USERNAME}
  password = ${?DB_PASSWORD}
}

applet {
  # Base64-encoded 32-byte AES key for applet secrets. Changing it makes every stored secret unreadable.
  secret-encryption-key = ${?APPLET_SECRET_ENCRYPTION_KEY}
}

# Gateway handles browser traffic and Consul Connect authenticates callers, so Play's
# allowed-hosts, CSRF, and security-header defaults would only reject proxied requests.
play.filters.enabled = ["com.cowork.applet.global.metrics.HttpMetricsFilter"]
