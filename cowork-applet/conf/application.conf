play.http.secret.key = ${?APPLET_SECRET_KEY}
play.server.http.port = 8091

# Gateway wraps only JSON and plain-text failures; Play's default HTML error pages would pass through unwrapped.
play.http.errorHandler = play.api.http.JsonHttpErrorHandler

 port = 8000
  port = ${?DB_PORT}
  name = "cowork_applet"
  name = ${?DB_NAME}
  username = "cowork_applet"
  username = ${?DB_USERNAME}
  password = ${?DB_PASSWORD}
}

# Gateway handles browser traffic and Consul Connect authenticates callers, so Play's
# allowed-hosts, CSRF, and security-header defaults would only reject proxied requests.
play.filters.enabled = []
