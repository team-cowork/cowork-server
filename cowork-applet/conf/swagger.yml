openapi: 3.0.3
info:
  title: cowork Applet API
  description: 사용자가 서비스 안에서 만드는 앱을 관리합니다. Gateway는 일반 JSON 응답을 SDK의 status, code, message로 감싸고 성공 결과를 data에 담습니다. 본문이 없는 성공 응답은 그대로 전달합니다. 압축되었거나 1 MiB를 초과하는 응답은 원래 형식으로 전달할 수 있습니다.
  version: "0.1.0"
servers:
  - url: /api/applet
    description: Gateway
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cowork 액세스 토큰
