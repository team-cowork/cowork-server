openapi: 3.0.3
info:
  title: cowork Applet API
  description: 사용자가 서비스 안에서 만드는 앱을 관리합니다.
  version: "20261111.1"
servers:
  - url: /api/applet
    description: Gateway
tags:
  - name: applet
    description: 앱에서 사용할 임의 값을 생성합니다.
security:
  - BearerAuth: []
components:
  schemas:
    ApiError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          example: 401 UNAUTHORIZED
        code:
          type: integer
          example: 401
        message:
          type: string
          example: Unauthorized
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: cowork 액세스 토큰
