services:
  mysql:
    image: mysql:8.0
    container_name: cowork-mysql
    environment:
      MYSQL_DATABASE: cowork
      MYSQL_USER: ${DB_USERNAME:-cowork}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cowork}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  mysql-data:
