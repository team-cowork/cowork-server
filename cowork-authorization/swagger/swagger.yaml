basePath: /api/authorization
definitions:
  github_com_cowork_authorization_internal_apidoc.Error:
    properties:
      code:
        type: integer
      message:
        type: string
      status:
        type: string
    required:
    - code
    - message
    - status
    type: object
  github_com_cowork_authorization_internal_apidoc.Success-github_com_cowork_authorization_internal_service_TokenPair:
    properties:
      code:
        enum:
        - 200
        type: integer
      data:
        $ref: '#/definitions/github_com_cowork_authorization_internal_service.TokenPair'
      message:
        example: OK
        type: string
      status:
        enum:
        - 200 OK
        type: string
    required:
    - code
    - data
    - message
    - status
    type: object
  github_com_cowork_authorization_internal_apidoc.Success-internal_handler_WebhookReceipt:
    properties:
      code:
        enum:
        - 200
        type: integer
      data:
        $ref: '#/definitions/internal_handler.WebhookReceipt'
      message:
        example: OK
        type: string
      status:
        enum:
        - 200 OK
        type: string
    required:
    - code
    - data
    - message
    - status
    type: object
  github_com_cowork_authorization_internal_service.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  internal_handler.WebhookReceipt:
    properties:
      status:
        enum:
        - accepted
        - duplicate
        - ignored
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  description: DataGSM 계정으로 로그인하고 Cowork 토큰을 발급하거나 갱신합니다.
  title: cowork Authorization API
  version: "20261109.0"
paths:
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 리프레시 토큰을 교환해 새 액세스 토큰과 새 리프레시 토큰을 받습니다.
      parameters:
      - description: 리프레시 토큰
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 새 토큰 쌍
          headers:
            Set-Cookie:
              description: WebSocket 인증 쿠키(cowork_ws_token, Path=/ws)
              type: string
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Success-github_com_cowork_authorization_internal_service_TokenPair'
        "400":
          description: 필수 요청 값이 없거나 형식이 잘못됨
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "401":
          description: 유효하지 않거나 만료된 리프레시 토큰
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "429":
          description: 요청 한도 초과
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "503":
          description: 인증 서비스를 일시적으로 사용할 수 없음
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
      summary: 액세스 토큰 갱신
      tags:
      - auth
  /auth/signout:
    post:
      consumes:
      - application/json
      description: 리프레시 토큰을 무효화하고 WebSocket 인증 쿠키를 삭제합니다.
      parameters:
      - description: 리프레시 토큰
        in: body
        name: body
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: 로그아웃 완료. 응답 본문은 없습니다.
        "400":
          description: 필수 요청 값이 없거나 형식이 잘못됨
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "401":
          description: 인증 실패 또는 유효하지 않은 리프레시 토큰
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "429":
          description: 요청 한도 초과
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "503":
          description: 인증 서비스를 일시적으로 사용할 수 없음
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
      security:
      - BearerAuth: []
      summary: 로그아웃
      tags:
      - auth
  /auth/token:
    post:
      consumes:
      - application/json
      description: DataGSM 인가 코드와 PKCE 검증 값으로 액세스 토큰과 리프레시 토큰을 발급합니다.
      parameters:
      - description: 코드 교환 요청
        in: body
        name: body
        required: true
        schema:
          properties:
            code:
              type: string
            code_verifier:
              type: string
            redirect_uri:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 새 토큰 쌍
          headers:
            Set-Cookie:
              description: WebSocket 인증 쿠키(cowork_ws_token, Path=/ws)
              type: string
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Success-github_com_cowork_authorization_internal_service_TokenPair'
        "400":
          description: 필수 요청 값이 없거나 형식이 잘못됨
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "401":
          description: 인가 코드 검증 실패
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "429":
          description: 요청 한도 초과
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "503":
          description: 인증 서비스를 일시적으로 사용할 수 없음
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
      summary: 인가 코드로 토큰 발급
      tags:
      - auth
  /events/datagsm:
    post:
      consumes:
      - application/json
      description: 서명한 이벤트 본문을 전송합니다(최대 1 MiB). 200은 접수를 뜻하며 학생 정보는 나중에 반영됩니다. 같은
        ID와 내용은 중복으로 처리하고 내용이 다르면 충돌로 처리합니다. 발생한 지 30일 이상 지났거나 현재보다 5분을 초과해 앞선 이벤트는
        처리하지 않습니다.
      parameters:
      - description: sha256=<HMAC-SHA256(secret, body)>
        in: header
        name: X-DataGSM-Signature
        required: true
        type: string
      - description: 이벤트 ID, 종류, RFC 3339 발생 시각 및 데이터. student.updated는 data.new에
          변경 항목을 담습니다.
        in: body
        name: body
        required: true
        schema:
          properties:
            data:
              type: object
            event:
              type: string
            id:
              type: string
            timestamp:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: '접수 상태: accepted, duplicate 또는 ignored'
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Success-internal_handler_WebhookReceipt'
        "400":
          description: 잘못된 이벤트 형식 또는 발생 시각
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "401":
          description: 웹훅 서명 검증 실패
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "409":
          description: 같은 이벤트 ID의 내용 불일치
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "413":
          description: 본문 크기 제한 초과
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
        "503":
          description: 웹훅 접수 서비스 사용 불가
          schema:
            $ref: '#/definitions/github_com_cowork_authorization_internal_apidoc.Error'
      summary: DataGSM 웹훅 접수
      tags:
      - events
securityDefinitions:
  BearerAuth:
    description: '"Bearer {access_token}" 형식으로 입력합니다.'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
