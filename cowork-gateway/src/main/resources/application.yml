spring:
  autoconfigure:
    exclude: team.themoment.sdk.autoconfigure.SdkAutoConfiguration
  reactor:
    context-propagation: auto
  profiles:
    active: ${APP_CONFIG_PROFILE}
  application:
    name: cowork-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: 8080
springdoc:
  api-docs:
    # TODO: Set version to openapi_3_2 and update the OpenAPI version to 3.2.1 when springdoc-openapi supports it.
    #  springdoc 3.2.0 offers only openapi_3_0 and openapi_3_1, because swagger-core models only OpenAPI 3.0 and 3.1
    #  (https://github.com/swagger-api/swagger-core/issues/5181).
    enabled: true
    path: /v3/api-docs/gateway
  paths-to-match:
    - /api/**
  swagger-ui:
    # SwaggerUiController serves the shared service selector.
    enabled: false
jwt:
  secret: ${JWT_SECRET}
