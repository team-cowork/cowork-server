spring:
  reactor:
    context-propagation: auto
  profiles:
    active: ${APP_CONFIG_PROFILE}
  application:
    name: cowork-gateway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: 8080
springdoc:
  api-docs:
    enabled: false
jwt:
  secret: ${JWT_SECRET}
