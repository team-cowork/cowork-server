spring:
  reactor:
    context-propagation: auto
  profiles:
    active: ${APP_CONFIG_PROFILE:prod}
  application:
    name: cowork-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
server:
  port: 8080
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
springdoc:
  api-docs:
    enabled: false
jwt:
  secret: ${JWT_SECRET}
