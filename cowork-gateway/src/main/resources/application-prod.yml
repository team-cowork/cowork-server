server:
  port: ${PORT:8080}

management:
  health:
    redis:
      enabled: false

gateway:
  response-wrapper:
    max-wrappable-size: 1MB
  deployment:
    destinations:
      cowork-authorization: ${COWORK_AUTHORIZATION_URL:http://cowork-authorization:8081}
      cowork-user: ${COWORK_USER_URL:http://cowork-user:8082}
      cowork-channel: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
      cowork-project: ${COWORK_PROJECT_URL:http://cowork-project:8084}
      cowork-team: ${COWORK_TEAM_URL:http://cowork-team:8085}
      cowork-notification: ${COWORK_NOTIFICATION_URL:http://cowork-notification:8086}
      cowork-chat: ${COWORK_CHAT_URL:http://cowork-chat:8087}
      cowork-roadmap: ${COWORK_ROADMAP_URL:http://cowork-roadmap:8088}
      cowork-voice: ${COWORK_VOICE_URL:http://cowork-voice:8089}
      cowork-github: ${COWORK_GITHUB_URL:http://cowork-github:8090}
      cowork-preference: ${COWORK_PREFERENCE_URL:http://cowork-preference:9001}

webhook:
  url-signing-key: ${WEBHOOK_URL_SIGNING_KEY:}
  datagsm-secret: ${DATAGSM_WEBHOOK_SECRET:}

cowork:
  swagger-ui:
    primary-name: user
    urls:
      - name: authorization
        url: /v3/api-docs/authorization
      - name: user
        url: /v3/api-docs/user
      - name: team
        url: /v3/api-docs/team
      - name: channel
        url: /v3/api-docs/channel
      - name: project
        url: /v3/api-docs/project
      - name: roadmap
        url: /v3/api-docs/roadmap
      - name: chat
        url: /v3/api-docs/chat
      - name: voice
        url: /v3/api-docs/voice
      - name: notification
        url: /v3/api-docs/notification
      - name: preference
        url: /v3/api-docs/preference

spring:
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway.server.webflux:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "${PUBLIC_WEB_ORIGINS}"
            allowedMethods: GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS
            allowedHeaders: "*"
            exposedHeaders: Content-Length, Content-Range, Accept-Ranges, ETag, Retry-After, X-RateLimit-Remaining, X-RateLimit-Burst-Capacity, X-RateLimit-Replenish-Rate, X-RateLimit-Requested-Tokens
            allowCredentials: true
            maxAge: 3600

      # 요청 제한(RequestRateLimiter)은 라우트별로 명시한 곳에만 적용한다. 공통 기본 제한은 두지 않는다.
      # - 키: userKeyResolver(인증 사용자 ID, 미인증은 연결 주소), webhookKeyResolver(웹훅 실행 ID)
      # - 입구 프록시가 실제 발신 IP를 넘기지 않아 미인증 요청의 연결 주소는 항상 프록시 주소다. 미인증 라우트의 한도는
      #   사용자별이 아니라 전체 상한이므로 downstream이 감당할 수 있는 전체 트래픽 기준으로 정한다.
      # - Redis 오류 시 RedisRateLimiter는 요청을 허용한다(fail-open). 이때 gateway_ratelimit_events_total{outcome="redis_error"}로 집계한다.
      # - 차단 시 429, CommonApiResponse 본문과 Retry-After를 반환한다.
      # 제한이 없는 라우트와 이유:
      # - chat-service(HTTP·GraphQL): Chat이 메시지 전송(chat:msgrate)과 슬로우 모드를 사용자·채널 단위로 직접 제한한다.
      # - chat-service-ws: 연결 요청만 Gateway가 제한하고, 연결 후 이벤트(입력 중 표시 등)는 Chat이 제한한다.
      # - webhook-ingress: Gateway는 웹훅별 30/60만 적용하고 수신 경로 전체 상한은 두지 않는다. 서명 검증으로 무작위 실행 ID를
      #   먼저 차단하며, Chat 웹훅 제한기가 Redis 오류 시 신규 메시지를 막는다(fail-closed).
      # - project, roadmap, preference, notification, 팀·프로젝트별 channel, DM, 검색: JWT 인증 요청이며 downstream이 권한을
      #   검사한다. 일괄 제한은 도입하지 않았으므로 필요해지면 해당 라우트에 명시적으로 추가한다.
      # - 스토리지 relay: StorageRelay가 허용 경로와 서명 여부를 검사하고 오브젝트 스토리지가 서명을 검증한다.
      # - DataGSM 웹훅은 Gateway가 서명 검증 후 Redis에 영속 접수한다. Redis 실패 시 Authorization의 DB 접수 경로로 전달한다.
      # - GitHub와 Voice 웹훅은 downstream 검증에 맡긴다.
      # - API 문서 라우트: 정적 문서 조회다.
      routes:
        - id: webhook-management
          order: -2
          uri: ${COWORK_PREFERENCE_URL:http://cowork-preference:9001}
          metadata:
            cowork-service: cowork-preference
            health-path: /health/ready
          predicates:
            - Path=/api/channel/channels/*/webhooks, /api/channel/channels/*/webhooks/**
            - Method=GET,POST,PATCH,PUT,DELETE
          filters:
            - StripPrefix=2
            - SetResponseHeader=Cache-Control, no-store
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: webhook-ingress
          order: -2
          uri: ${COWORK_CHAT_URL:http://cowork-chat:8087}
          metadata:
            cowork-service: cowork-chat
            health-path: /health/ready
          predicates:
            - Path=/api/chat/chat/webhooks/{executionId}/{signature}/messages
            - Method=POST
          filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - WebhookSignature
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@webhookKeyResolver}"
            - SetPath=/chat/webhooks/{executionId}/messages
            - SetResponseHeader=Cache-Control, no-store

        - id: team-object-storage
          uri: ${S3_TEAM_INTERNAL_ENDPOINT}
          predicates:
            - Path=/api/storage/${S3_BUCKET}/team-icons/**,/api/storage/${S3_BUCKET}/team-icon-uploads/**
            - Method=GET,HEAD,PUT
          filters:
            - StorageRelay
            - StripPrefix=2

        - id: user-object-storage
          uri: ${S3_USER_INTERNAL_ENDPOINT}
          predicates:
            - Path=/api/storage/${S3_BUCKET}/profiles/**,/api/storage/${S3_BUCKET}/profile-uploads/**
            - Method=GET,HEAD,PUT
          filters:
            - StorageRelay
            - StripPrefix=2

        - id: chat-object-storage
          uri: ${S3_CHAT_INTERNAL_ENDPOINT}
          predicates:
            - Path=/api/storage/${S3_BUCKET}/chat-files/**,/api/storage/${S3_BUCKET}/chat-uploads/**
            - Method=GET,HEAD,PUT
          filters:
            - StorageRelay
            - StripPrefix=2

        - id: authorization-service
          uri: ${COWORK_AUTHORIZATION_URL:http://cowork-authorization:8081}
          metadata:
            cowork-service: cowork-authorization
            health-path: /health
          predicates:
            - Path=/api/authorization/auth/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: authorizationCB
                fallbackUri: forward:/fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: authorization-webhook
          uri: ${COWORK_AUTHORIZATION_URL:http://cowork-authorization:8081}
          predicates:
            - Path=/api/authorization/events/datagsm
            - Method=POST
          filters:
            - StripPrefix=2

        - id: user-service
          uri: ${COWORK_USER_URL:http://cowork-user:8082}
          metadata:
            cowork-service: cowork-user
            health-path: /actuator/health/readiness
          predicates:
            - Path=/api/user/users/**
            - Method=GET,POST,PATCH,DELETE
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: userCB
                fallbackUri: forward:/fallback
            # Retry는 뒤 필터를 다시 실행하므로 외부 요청 한 건이 토큰을 한 번만 쓰도록 RequestRateLimiter를 앞에 둔다
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        - id: project-team-service
          uri: ${COWORK_PROJECT_URL:http://cowork-project:8084}
          metadata:
            cowork-service: cowork-project
            health-path: /actuator/health/readiness
          predicates:
            - Path=/api/project/teams/*/projects/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: projectCB
                fallbackUri: forward:/fallback

        - id: team-channel-service
          uri: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
          metadata:
            cowork-service: cowork-channel
            health-path: /actuator/health/readiness
          predicates:
            - Path=/api/channel/teams/*/channels, /api/channel/teams/*/channels/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: channelCB
                fallbackUri: forward:/fallback

        - id: team-service
          uri: ${COWORK_TEAM_URL:http://cowork-team:8085}
          metadata:
            cowork-service: cowork-team
            health-path: /actuator/health/readiness
          predicates:
            - Path=/api/team/teams/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: teamCB
                fallbackUri: forward:/fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: channel-service-search
          uri: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
          predicates:
            - Path=/api/channel/search/channels
            - Method=GET
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: channelCB
                fallbackUri: forward:/fallback

        - id: project-channel-service
          uri: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
          predicates:
            - Path=/api/channel/projects/*/channels, /api/channel/projects/*/channels/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: channelCB
                fallbackUri: forward:/fallback

        - id: project-service
          uri: ${COWORK_PROJECT_URL:http://cowork-project:8084}
          predicates:
            - Path=/api/project/projects/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: projectCB
                fallbackUri: forward:/fallback

        - id: roadmap-service
          uri: ${COWORK_ROADMAP_URL:http://cowork-roadmap:8088}
          metadata:
            cowork-service: cowork-roadmap
            health-path: /actuator/health/readiness
          predicates:
            - Path=/api/roadmap/roadmaps/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: roadmapCB
                fallbackUri: forward:/fallback

        - id: chat-service
          uri: ${COWORK_CHAT_URL:http://cowork-chat:8087}
          predicates:
            - Path=/api/chat/chat/**, /api/chat/health, /api/chat/graphql, /api/chat/asyncapi.json
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: chatCB
                fallbackUri: forward:/fallback

        - id: channel-service
          uri: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
          predicates:
            - Path=/api/channel/channels/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: channelCB
                fallbackUri: forward:/fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: chat-service-ws
          uri: ${COWORK_CHAT_WS_URL:ws://cowork-chat:8087}
          predicates:
            - Path=/ws/chat/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        # DM 채널 열기(멱등 생성)는 channel 서비스가 담당
        - id: dm-open
          uri: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
          predicates:
            - Path=/api/channel/dms
            - Method=POST
          filters:
            - StripPrefix=2

        - id: preference-service
          uri: ${COWORK_PREFERENCE_URL:http://cowork-preference:9001}
          predicates:
            - Path=/api/preference/preferences/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: preferenceCB
                fallbackUri: forward:/fallback

        - id: live-service
          uri: ${COWORK_VOICE_URL:http://cowork-voice:8089}
          metadata:
            cowork-service: cowork-voice
            health-path: /health/ready
          predicates:
            - Path=/api/voice/live/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: voiceCB
                fallbackUri: forward:/fallback

        - id: github-service-webhook
          order: -1
          uri: ${COWORK_GITHUB_URL:http://cowork-github:8090}
          metadata:
            cowork-service: cowork-github
            health-path: /health
          predicates:
            - Path=/api/github/github/webhooks
            - Method=POST
          filters:
            - StripPrefix=2

        - id: github-service-setup
          order: -1
          uri: ${COWORK_GITHUB_URL:http://cowork-github:8090}
          predicates:
            - Path=/api/github/github/setup
            - Method=GET
          filters:
            - StripPrefix=2
            # 인증 없이 GitHub App API를 호출하는 콜백이므로 반복 호출로 App 한도가 소진되지 않게 전체 상한을 둔다
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: voice-service-webhook
          order: -1
          uri: ${COWORK_VOICE_URL:http://cowork-voice:8089}
          predicates:
            - Path=/api/voice/voice/webhook
            - Method=POST
          filters:
            - StripPrefix=2

        - id: voice-service
          uri: ${COWORK_VOICE_URL:http://cowork-voice:8089}
          predicates:
            - Path=/api/voice/voice/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: voiceCB
                fallbackUri: forward:/fallback
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: authorization-service-docs
          uri: ${COWORK_AUTHORIZATION_URL:http://cowork-authorization:8081}
          predicates:
            - Path=/v3/api-docs/authorization
          filters:
            - RewritePath=/v3/api-docs/authorization, /swagger/doc.json

        - id: user-service-docs
          uri: ${COWORK_USER_URL:http://cowork-user:8082}
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user, /v3/api-docs

        - id: voice-service-docs
          uri: ${COWORK_VOICE_URL:http://cowork-voice:8089}
          predicates:
            - Path=/v3/api-docs/voice
          filters:
            - RewritePath=/v3/api-docs/voice, /swagger/doc.json

        - id: chat-service-docs
          uri: ${COWORK_CHAT_URL:http://cowork-chat:8087}
          predicates:
            - Path=/v3/api-docs/chat
          filters:
            - RewritePath=/v3/api-docs/chat, /api-json

        - id: preference-service-docs
          uri: ${COWORK_PREFERENCE_URL:http://cowork-preference:9001}
          predicates:
            - Path=/v3/api-docs/preference
          filters:
            - RewritePath=/v3/api-docs/preference, /swagger/doc.json

        - id: notification-service-sse
          order: -1
          uri: ${COWORK_NOTIFICATION_URL:http://cowork-notification:8086}
          predicates:
            - Path=/api/notification/notifications/stream
          filters:
            - StripPrefix=2
          metadata:
            cowork-service: cowork-notification
            health-path: /health/ready
            response-timeout: -1  # SSE는 타임아웃 없음

        - id: notification-service
          uri: ${COWORK_NOTIFICATION_URL:http://cowork-notification:8086}
          predicates:
            - Path=/api/notification/notifications/**
          filters:
            - StripPrefix=2
            - name: CircuitBreaker
              args:
                name: notificationCB
                fallbackUri: forward:/fallback

        - id: notification-service-docs
          uri: ${COWORK_NOTIFICATION_URL:http://cowork-notification:8086}
          predicates:
            - Path=/v3/api-docs/notification
          filters:
            - RewritePath=/v3/api-docs/notification, /swagger/doc.json

        - id: team-service-docs
          uri: ${COWORK_TEAM_URL:http://cowork-team:8085}
          predicates:
            - Path=/v3/api-docs/team
          filters:
            - RewritePath=/v3/api-docs/team, /v3/api-docs

        - id: channel-service-docs
          uri: ${COWORK_CHANNEL_URL:http://cowork-channel:8083}
          predicates:
            - Path=/v3/api-docs/channel
          filters:
            - RewritePath=/v3/api-docs/channel, /v3/api-docs

        - id: project-service-docs
          uri: ${COWORK_PROJECT_URL:http://cowork-project:8084}
          predicates:
            - Path=/v3/api-docs/project
          filters:
            - RewritePath=/v3/api-docs/project, /v3/api-docs

        - id: roadmap-service-docs
          uri: ${COWORK_ROADMAP_URL:http://cowork-roadmap:8088}
          predicates:
            - Path=/v3/api-docs/roadmap
          filters:
            - RewritePath=/v3/api-docs/roadmap, /v3/api-docs

# GitHub Secrets are injected through the deployment platform.

app:
  dev-origin:
    credential: ${DEV_ORIGIN_CREDENTIAL:}
  ws:
    allowed-origins: "${PUBLIC_WEB_ORIGINS}"

resilience4j:
  circuitbreaker:
    # 차단기는 이름별로 상태를 가지므로 대상 서비스마다 이름을 두고, 같은 서비스의 라우트는 상태를 공유한다.
    # instances에 없는 이름은 아래 default 설정을 쓴다. 로그인(authorizationCB)은 시간 제한이 달라 별도 인스턴스를 쓴다.
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      authorizationCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      # 로그인은 cowork-authorization이 사용자 신원 결과를 최대 5초(KAFKA_IDENTITY_COMMAND_TIMEOUT) 기다린다.
      authorizationCB:
        timeoutDuration: 6s
      authorizationWebhookCB:
        timeoutDuration: 8s
