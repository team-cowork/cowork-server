# Startup runs Flyway from the published db directory using the application's DB_* variables.
[environments.default]
url = "jdbc:mysql://${env.DB_HOST}:${env.DB_PORT}/${env.DB_NAME}?useSsl=true&trustServerCertificate=true"
user = "${env.DB_USERNAME}"
password = "${env.DB_PASSWORD}"
connectRetries = 5
connectRetriesInterval = 10

[flyway]
environment = "default"
locations = ["filesystem:migration"]
failOnMissingLocations = true
