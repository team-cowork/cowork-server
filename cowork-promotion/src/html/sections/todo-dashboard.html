<main
	id="main-content"
	class="todo-dashboard"
	data-todo-dashboard
	tabindex="-1"
>
	<header class="todo-dashboard__header">
		<h1 class="todo-dashboard__title">개발 진행 현황</h1>
		<form
			class="todo-search"
			action="/todo"
			method="get"
			role="search"
		>
			<label class="sr-only" for="todo-search-input">진행 중인 작업 검색</label>
			<span class="todo-search__icon" aria-hidden="true">
				<svg
					fill="none"
					height="20"
					viewBox="0 0 24 24"
					width="20"
				>
					<circle
						cx="11"
						cy="11"
						r="6.75"
						stroke="currentColor"
						stroke-width="1.5"
					></circle>
					<path
						d="m16 16 4 4"
						stroke="currentColor"
						stroke-linecap="round"
						stroke-width="1.5"
					></path>
				</svg>
			</span>
			<input
				id="todo-search-input"
				type="search"
				class="todo-search__input"
				autocomplete="off"
				data-todo-search
				disabled
				enterkeyhint="search"
				name="q"
				placeholder="진행 중인 작업 검색"
			>
		</form>
		<p
			class="todo-search__status"
			data-todo-search-status
			hidden
			role="status"
		></p>
		<noscript>
			<p class="todo-search__status">목록에서 문서를 선택해 내용을 확인하세요.</p>
		</noscript>
	</header>

	<section class="todo-section" aria-label="진행 중인 작업">
		<ol class="todo-list" data-todo-items>
			<!-- data:todo-items:start -->
			<!-- data:todo-items:end -->
		</ol>
		<p
			class="todo-list__empty"
			data-todo-empty
			hidden
			role="status"
		>
			검색 결과가 없습니다.
		</p>
		<div
			class="sr-only"
			aria-atomic="true"
			aria-live="polite"
			data-todo-live
		></div>
	</section>

	<section class="todo-history" aria-labelledby="todo-history-title">
		<h2 id="todo-history-title" class="todo-history__title">점검 기록</h2>
		<ol class="todo-list todo-list--history" data-todo-history>
			<!-- data:todo-history:start -->
			<!-- data:todo-history:end -->
		</ol>
	</section>
</main>
