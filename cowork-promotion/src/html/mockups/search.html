<div class="relative aspect-[4/3] rounded-3xl border border-white/10 bg-gradient-to-br from-white/[0.07] to-white/[0.02] p-4 sm:p-5">
	<div
		class="absolute inset-4 sm:inset-5 rounded-2xl bg-white text-gray-900 shadow-2xl overflow-hidden flex flex-col"
		data-mockup="search"
		data-result-filter="all:"
	>
		<div class="p-3 border-b border-gray-100">
			<div class="flex items-center gap-2 rounded-lg bg-gray-100 px-3 py-2">
				<svg
					fill="none"
					height="14"
					stroke="rgb(var(--ui-accent-rgb))"
					stroke-linecap="round"
					stroke-width="2.5"
					viewBox="0 0 24 24"
					width="14"
				>
					<circle
						cx="11"
						cy="11"
						r="7"
					>
					</circle>
					<line
						x1="21"
						x2="16.5"
						y1="21"
						y2="16.5"
					>
					</line>
				</svg>
				<span class="flex-1 min-w-0 truncate text-[11px] font-semibold text-gray-700"><span data-mock-query>로그인</span><span class="caret">|</span></span>
				<span class="text-[9px] font-semibold text-gray-400 shrink-0" data-mock-result-count>결과 3개</span>
			</div>
			<div class="flex items-center gap-1.5 mt-2">
				<button
					type="button"
					class="text-[9px] font-semibold px-2 py-0.5 rounded-full mock-active-chip"
					data-mock-action="filter-results"
					data-mock-filter="all:"
					tabindex="-1"
				>전체 채널</button>
				<button
					type="button"
					class="text-[9px] font-semibold px-2 py-0.5 rounded-full mock-muted-chip"
					data-mock-action="filter-results"
					data-mock-filter="author:Emma"
					tabindex="-1"
				>작성자</button>
				<button
					type="button"
					class="text-[9px] font-semibold px-2 py-0.5 rounded-full mock-muted-chip"
					data-mock-action="filter-results"
					data-mock-filter="kind:file"
					tabindex="-1"
				>파일</button>
				<button
					type="button"
					class="text-[9px] font-semibold px-2 py-0.5 rounded-full mock-muted-chip"
					data-mock-action="filter-results"
					data-mock-filter="attachment:true"
					tabindex="-1"
				>첨부 포함</button>
			</div>
			<div class="flex items-center gap-1.5 mt-2 mock-recent">
				<span class="mock-recent-label">최근 검색</span>
				<button
					type="button"
					class="mock-recent-query"
					data-mock-action="search-query"
					data-mock-query="로그인"
					tabindex="-1"
				>로그인</button>
				<button
					type="button"
					class="mock-recent-query"
					data-mock-action="search-query"
					data-mock-query="배포"
					tabindex="-1"
				>배포</button>
				<button
					type="button"
					class="mock-recent-query"
					data-mock-action="search-query"
					data-mock-query="회의록"
					tabindex="-1"
				>회의록</button>
			</div>
		</div>
		<div
			class="flex-1 p-3 space-y-1.5 mock-scroll mock-search-results"
			data-mock-results
			data-mock-scroll
		>
			<div
				class="flex items-center gap-2.5 rounded-lg p-2 hover:bg-gray-50 search-result mock-delay-0"
				data-attachment="true"
				data-author="Emma"
				data-kind="message"
				data-mock-result
			>
				<span class="text-[8px] font-bold px-1.5 py-0.5 rounded shrink-0 mock-accent-chip" data-mock-field="kind">메시지</span>
				<div class="min-w-0">
					<p class="text-[10px] font-semibold text-gray-800 truncate" data-mock-field="text"><mark class="mock-highlight">로그인</mark> 플로우 정리해서 공유드려요</p>
					<span class="text-[9px] text-gray-400" data-mock-field="meta">Emma · #general · 어제 · 첨부 1</span>
				</div>
			</div>
			<div
				class="flex items-center gap-2.5 rounded-lg p-2 hover:bg-gray-50 search-result mock-delay-0-2"
				data-attachment="true"
				data-author="Liam"
				data-kind="file"
				data-mock-result
			>
				<span class="text-[8px] font-bold px-1.5 py-0.5 rounded shrink-0 mock-accent-chip" data-mock-field="kind">파일</span>
				<div class="min-w-0">
					<p class="text-[10px] font-semibold text-gray-800 truncate" data-mock-field="text"><mark class="mock-highlight">로그인</mark>-API-명세.pdf</p>
					<span class="text-[9px] text-gray-400" data-mock-field="meta">Liam · #backend · 5시간 전</span>
				</div>
			</div>
			<div
				class="flex items-center gap-2.5 rounded-lg p-2 hover:bg-gray-50 search-result mock-delay-0-4"
				data-attachment="false"
				data-author="John"
				data-kind="message"
				data-mock-result
			>
				<span class="text-[8px] font-bold px-1.5 py-0.5 rounded shrink-0 mock-accent-chip" data-mock-field="kind">메시지</span>
				<div class="min-w-0">
					<p class="text-[10px] font-semibold text-gray-800 truncate" data-mock-field="text"><mark class="mock-highlight">로그인</mark> 버그 재현됨</p>
					<span class="text-[9px] text-gray-400" data-mock-field="meta">John · #frontend · 3시간 전</span>
				</div>
			</div>
		</div>
		<template data-mock-template="search-result">
			<div
				class="flex items-center gap-2.5 rounded-lg p-2 hover:bg-gray-50 search-result"
				data-attachment="false"
				data-author=""
				data-kind="message"
				data-mock-result
			>
				<span class="text-[8px] font-bold px-1.5 py-0.5 rounded shrink-0 mock-accent-chip" data-mock-field="kind">메시지</span>
				<div class="min-w-0">
					<p class="text-[10px] font-semibold text-gray-800 truncate" data-mock-field="text">검색 결과</p>
					<span class="text-[9px] text-gray-400" data-mock-field="meta">작성자 · 채널 · 시간</span>
				</div>
			</div>
		</template>
	</div>
</div>
