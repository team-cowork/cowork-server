positions:
  Server:
    color: "#8b5cf6"
    description: 도메인별 비즈니스 로직과 API, 실시간 기능을 구현합니다. Kafka 이벤트로 서비스 간 데이터를 연동합니다.
    technologies:
      - Kotlin
      - Java
      - TypeScript
      - Go
      - C#
      - Spring Boot
      - Spring Cloud Gateway
      - OpenFeign
      - Vert.x
      - Node.js
      - NestJS
      - Gin
      - Chi
      - ASP.NET Core
      - Socket.IO
      - GraphQL / Apollo
      - LiveKit
      - MySQL
      - PostgreSQL
      - MongoDB
      - Redis
      - Elasticsearch
      - SeaweedFS
      - Flyway
      - Apache Kafka
      - Firebase Cloud Messaging
      - Maven
      - Gradle
      - Kotlin Toolchain
  Web Client:
    color: "#eab308"
    description: Next.js 기반 협업 웹 클라이언트를 개발합니다. FSD(Feature-Sliced Design) 구조로 기능별 코드를 구성합니다.
    technologies:
      - TypeScript
      - React
      - Next.js
      - Tailwind CSS
      - TanStack Query
      - Axios
      - LiveKit
  Desktop App Client:
    color: "#0ea5e9"
    description: 데스크탑 환경에 최적화된 협업 클라이언트를 개발합니다. 네이티브에 가까운 성능과 경험을 제공합니다.
    technologies:
      - Kotlin
      - Kotlin Multiplatform
      - Compose Multiplatform
      - Ktor
  Mobile App Client:
    color: "#f43f5e"
    description: 모바일 환경의 협업 클라이언트를 개발합니다. iOS와 Android를 아우르는 크로스 플랫폼 앱을 구현합니다.
    technologies:
      - Dart
      - Flutter
      - Bloc
  Cloud:
    color: "#f97316"
    description: Nomad·Consul로 서비스 실행과 내부 연결을 관리하고, Ansible·OpenTofu·GitHub Actions로 배포를 자동화합니다. Vault로 비밀 값을 관리하고 메트릭·로그·알림을 수집합니다.
    technologies:
      - Python
      - Docker
      - Docker Compose
      - Nomad
      - Consul
      - Envoy
      - Ansible
      - OpenTofu
      - GitHub Actions
      - Vault
      - NGINX
      - Vercel
      - SeaweedFS
      - Grafana
      - Prometheus
      - Loki
      - Grafana Alloy
      - Alertmanager
  Design:
    color: "#14b8a6"
    description: cowork의 시각적 아이덴티티를 정의합니다. 사용자 중심의 UI/UX 디자인으로 직관적인 경험을 만듭니다.
    technologies:
      - Figma
