positions:
  Server:
    color: "#8b5cf6"
    description: 화면 뒤에서 cowork를 움직입니다. 메시지를 전달하고 업무 기록을 관리하며, 서비스의 핵심 기능을 만듭니다.
    technologies:
      - Kotlin
      - Java
      - TypeScript
      - Go
      - C#
      - Spring Boot
      - Spring Cloud Gateway
      - OpenFeign
      - Vert.x
      - Node.js
      - NestJS
      - Gin
      - Chi
      - ASP.NET Core
      - Socket.IO
      - GraphQL / Apollo
      - LiveKit
      - MySQL
      - PostgreSQL
      - MongoDB
      - Redis
      - Elasticsearch
      - SeaweedFS
      - Flyway
      - Apache Kafka
      - Firebase Cloud Messaging
      - Maven
      - Gradle
      - Kotlin Toolchain
  Web Client:
    color: "#eab308"
    description: 클릭과 결과 사이의 군더더기를 걷어냅니다. 웹에서 보고 누르는 화면을 만들어, 생각한 일을 곧바로 실행하게 합니다.
    technologies:
      - TypeScript
      - React
      - Next.js
      - Tailwind CSS
      - TanStack Query
      - Axios
      - LiveKit
  Desktop App Client:
    color: "#0ea5e9"
    description: 컴퓨터를 팀의 작업실로 바꿉니다. 넓은 화면과 키보드에 맞춘 앱을 만들어, 일의 흐름을 이어갑니다.
    technologies:
      - Kotlin
      - Kotlin Multiplatform
      - Compose Multiplatform
      - Ktor
  Mobile App Client:
    color: "#f43f5e"
    description: 협업을 손안으로 가져옵니다. 이동 중에도 팀의 소식을 확인하고 대화에 참여할 수 있는 휴대폰 앱을 만듭니다.
    technologies:
      - Dart
      - Flutter
      - Bloc
  Cloud:
    color: "#f97316"
    description: cowork가 멈추지 않도록 지켜냅니다. 서비스가 돌아갈 환경을 만들고, 문제를 감지하고 대응하며 안정적인 운영을 책임집니다.
    technologies:
      - Python
      - Docker
      - Docker Compose
      - Nomad
      - Consul
      - Envoy
      - Ansible
      - OpenTofu
      - GitHub Actions
      - Vault
      - NGINX
      - Vercel
      - SeaweedFS
      - Grafana
      - Prometheus
      - Loki
      - Grafana Alloy
      - Alertmanager
  Design:
    color: "#14b8a6"
    description: 복잡함을 덜어내고, cowork만의 인상을 새깁니다. 화면의 흐름부터 색과 글자까지, 쓰기 쉽고 기억에 남게 다듬습니다.
    technologies:
      - Figma
